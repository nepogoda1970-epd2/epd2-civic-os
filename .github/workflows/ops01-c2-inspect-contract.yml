name: OPS-01 C2 Contract Inspection

on:
  push:
    branches:
      - tmp/ops01-c2-build
    paths:
      - '.github/workflows/ops01-c2-inspect-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Extract exact C1 and inspect stage-owned state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile, pathlib, shutil, hashlib
          z=pathlib.Path('repo/handoff/OPS/incoming/EPD2_OPS01_OPERATIONAL_READINESS_INCIDENT_RECOVERY_AND_CHANGE_CONTROL_CANDIDATE_0.1_C1.zip')
          assert hashlib.sha256(z.read_bytes()).hexdigest()=='3031b99cab662f59a5b61120101b41e536a10313de6f0cdb6815b3929d390f5d'
          out=pathlib.Path('/tmp/c1'); shutil.rmtree(out,ignore_errors=True); out.mkdir()
          with zipfile.ZipFile(z) as f: f.extractall(out)
          PY
          cd /tmp/c1
          echo '=== ENTERING BASELINE ==='
          cat docs/ops/OPS-01/OPS01_ENTERING_BASELINE_IDENTITY.json
          echo '=== SELF STATE ==='
          cat OPS01_CANDIDATE_SELF_STATE.json
          echo '=== SEALER KEY CONTRACT ==='
          grep -n -C 5 -E 'CANDIDATE_NAME|build_manifest|candidate_metadata|entering_base|identity_path|archive_path' scripts/ops01/seal_candidate.py
          echo '=== FREEZE EXCLUSIONS ==='
          grep -n -C 8 -E 'CANDIDATE_NOT_ACCEPTED|OPS01_FREEZE_MANIFEST|OPS01_CANDIDATE_SELF_STATE|excluded|EXCLUDE|build_manifest' packages/python/epd2-ops/src/epd2_ops/freeze.py | head -400
          echo '=== VALIDATOR DECLARATION GATES ==='
          grep -n -C 8 -E 'def g0[1-9]|INFRA01_RECONCILIATION|KNOWN_LIMITATIONS|ENTERING_BASELINE|candidate_self' scripts/validation/validate_ops01.py | head -700
