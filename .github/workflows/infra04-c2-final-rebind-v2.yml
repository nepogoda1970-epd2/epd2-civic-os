name: INFRA-04 C2 Final Rebind V2
on:
  push:
    branches: ["diagnostic/infra04-c2-final-rebind-v2"]
permissions:
  contents: write
jobs:
  rebind:
    if: ${{ !contains(github.event.head_commit.message, '[rebind-persisted]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Reconstruct C2 on live canonical main
        shell: bash
        run: |
          set -euo pipefail
          cp -a handoff/INFRA/infra04-c2-transport "$RUNNER_TEMP/transport"
          cp -a handoff/INFRA/infra04-c2-overlay "$RUNNER_TEMP/overlay"
          git fetch --no-tags origin main handoff/infra
          LIVE_MAIN="$(git rev-parse origin/main)"
          echo "LIVE_MAIN=$LIVE_MAIN" >> "$GITHUB_ENV"
          git show origin/handoff/infra:handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip > "$RUNNER_TEMP/infra02.zip"
          test "$(sha256sum "$RUNNER_TEMP/infra02.zip" | awk '{print $1}')" = d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
          git reset --hard origin/main
          python3 "$RUNNER_TEMP/transport/apply.py" --root "$GITHUB_WORKSPACE" --predecessor "$RUNNER_TEMP/infra02.zip"
          cp -a "$RUNNER_TEMP/overlay/." "$GITHUB_WORKSPACE"/
          rm -f SHA256SUMS.txt ACCEPTANCE/FREEZE-INVENTORY.json
          rm -f .github/workflows/infra04-c2-final-rebind-v2.yml
      - name: Bind current-candidate authority evidence to live main
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          main=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          tree=subprocess.check_output(['git','show','-s','--format=%T','origin/main'],text=True).strip()
          modified=subprocess.check_output(['git','show','-s','--format=%cI','origin/main'],text=True).strip().replace('+00:00','Z')
          pcr=Path('docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md')
          pcr_sha=hashlib.sha256(pcr.read_bytes()).hexdigest()
          pcr_blob=subprocess.check_output(['git','rev-parse','origin/main:docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md'],text=True).strip()
          old={
            '81c2d0db987536718b30242eeb168aecc21877ca':main,
            '5460ccd9ec5929c2136926a4a2585f3fca52937e':tree,
            '21857ce3ef10ab8a5cdd6b176938e564dc614cad1518b36525336ca64b454b5e':pcr_sha,
            '663b583a58453744e193cf468b7d6f59ff009d87':pcr_blob,
            '2026-09-03T22:08:26Z':modified,
          }
          paths=[
            Path('docs/infra/INFRA-04/INFRA-04-KNOWN-LIMITATIONS.md'),
            Path('docs/infra/INFRA-04/INFRA-04-STAGE-CONTRACT.md'),
            Path('docs/infra/INFRA-04/INFRA04_DEVELOPER_REPORT.md'),
            Path('validation/infra04/verification-summary.json'),
            Path('validation/infra04/main-binding.json'),
            Path('validation/infra04/verification-transcript.txt'),
          ]
          for path in paths:
            if not path.exists():
              continue
            s=path.read_text()
            for a,b in old.items(): s=s.replace(a,b)
            path.write_text(s)
          rp=Path('docs/infra/INFRA-01/INFRA01_GOVERNANCE_RECONCILIATION.json')
          rec=json.loads(rp.read_text())
          rec['target_authority']={
            'main_commit':main,'main_tree':tree,'pcr_sha256':pcr_sha,'pcr_blob_sha':pcr_blob,
            'pcr_path':'docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md','pcr_modified_at':modified,
          }
          rec.setdefault('expected_state',{})['OPS-03']={'version':'0.1','status':'ACCEPTED','implementation':'CLOSED'}
          for region in rec.get('verification',{}).get('regions',[]):
            if region.get('id')=='ops03-not-accepted':
              region.clear(); region.update({'id':'ops03-accepted-closed','must_include':'OPS-03 ACCEPTED / CLOSED','must_exclude':'OPS-03 QUALIFICATION ELIGIBLE'})
          rp.write_text(json.dumps(rec,indent=2)+'\n')
          sp=Path('scripts/infra02/supply_chain_policy.json')
          policy=json.loads(sp.read_text())
          for name in ('ops03-c3-authoritative-build.yml','ops03-c3-final.yml','ops03-c3-v2.yml'):
            policy['workflow_classes'][name]='historical-stage'
          policy['workflow_classes']=dict(sorted(policy['workflow_classes'].items()))
          sp.write_text(json.dumps(policy,indent=2)+'\n')
          print('LIVE_MAIN',main); print('LIVE_TREE',tree); print('LIVE_PCR_SHA256',pcr_sha); print('LIVE_PCR_BLOB',pcr_blob)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with: {enable-cache: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "22"}
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-groups --frozen
          npm ci --no-audit --no-fund
      - name: Strict verification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$LIVE_MAIN"
          uv run ruff format --check .
          uv run ruff check .
          make typecheck
          npm run format:check
          uv run pytest -q tests/repository/test_infra01_units.py tests/repository/test_infra01_mutation_suite.py tests/repository/test_infra02_units.py tests/repository/test_infra02_mutation_suite.py tests/repository/test_infra03_units.py tests/repository/test_infra03_mutation_suite.py
          uv run python - <<'PY'
          from pathlib import Path
          from scripts.infra02.ci_policy import check_ci_policy
          findings=check_ci_policy(Path('.'))
          print('INFRA02_CI_POLICY_FINDINGS',len(findings))
          for f in findings: print(f)
          raise SystemExit(bool(findings))
          PY
          uv run python -m scripts.acceptance infra04.verify-reconciliation --reconciliation docs/infra/INFRA-01/INFRA01_GOVERNANCE_RECONCILIATION.json --pcr docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          uv run pytest -q tests/repository/test_infra04_units.py tests/repository/test_infra04_mutation_suite.py
          echo INFRA04_FINAL_REBIND_VERIFY:PASS
      - name: Reject stale authority residues
        shell: bash
        run: |
          set -euo pipefail
          FILES=(docs/infra/INFRA-01/INFRA01_GOVERNANCE_RECONCILIATION.json docs/infra/INFRA-04/INFRA-04-KNOWN-LIMITATIONS.md docs/infra/INFRA-04/INFRA-04-STAGE-CONTRACT.md docs/infra/INFRA-04/INFRA04_DEVELOPER_REPORT.md validation/infra04/verification-summary.json validation/infra04/main-binding.json validation/infra04/verification-transcript.txt)
          for stale in 81c2d0db987536718b30242eeb168aecc21877ca 5460ccd9ec5929c2136926a4a2585f3fca52937e 21857ce3ef10ab8a5cdd6b176938e564dc614cad1518b36525336ca64b454b5e 663b583a58453744e193cf468b7d6f59ff009d87; do
            grep -FIl "$stale" "${FILES[@]}" && exit 1 || true
          done
          grep -Fq 'OPS-03 ACCEPTED / CLOSED' docs/infra/INFRA-01/INFRA01_GOVERNANCE_RECONCILIATION.json
          echo INFRA04_STALE_AUTHORITY_SCAN:PASS
      - name: Persist exact verified rebind bytes
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/rebind"
          FILES=(docs/infra/INFRA-01/INFRA01_GOVERNANCE_RECONCILIATION.json docs/infra/INFRA-04/INFRA-04-KNOWN-LIMITATIONS.md docs/infra/INFRA-04/INFRA-04-STAGE-CONTRACT.md docs/infra/INFRA-04/INFRA04_DEVELOPER_REPORT.md validation/infra04/verification-summary.json validation/infra04/main-binding.json validation/infra04/verification-transcript.txt scripts/infra02/supply_chain_policy.json)
          for f in "${FILES[@]}"; do [ -f "$f" ] || continue; mkdir -p "$OUT/$(dirname "$f")"; cp "$f" "$OUT/$f"; done
          git reset --hard "$GITHUB_SHA"
          BASE=handoff/INFRA/infra04-c2-overlay
          for f in "${FILES[@]}"; do [ -f "$OUT/$f" ] || continue; mkdir -p "$BASE/$(dirname "$f")"; cp "$OUT/$f" "$BASE/$f"; done
          git config user.name 'EPD2 INFRA04 final rebind'
          git config user.email 'infra04-rebind@invalid.local'
          git add "$BASE"
          git commit -m 'fix(infra04): persist verified canonical rebind [rebind-persisted]'
          git push origin HEAD:diagnostic/infra04-c2-final-rebind-v2
