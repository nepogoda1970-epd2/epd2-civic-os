name: install-api02-c12-accept

on:
  push:
    branches:
      - tmp/api02-c12-canonical-accept
    paths:
      - '.github/workflows/install-api02-c12-accept.yml'

permissions:
  contents: write
  actions: read

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/api02-c12-canonical-accept
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: api02-candidate
          path: incoming
          run-id: '33413366989'
          github-token: ${{ github.token }}
      - name: Stage exact candidate-carried workflow bytes as ordinary governed handoff blob
        shell: bash
        run: |
          set -euo pipefail
          CAND='incoming/EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C12.zip'
          echo '94724dfd8825ea92107cddbc860a9fba2ecc93e1cbd25abe74970430654f5a6f  '"$CAND" | sha256sum -c -
          rm -rf /tmp/c12 && mkdir -p /tmp/c12
          unzip -q "$CAND" -d /tmp/c12
          SRC='/tmp/c12/EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C12/.github/workflows/api02-accept.yml'
          DST='handoff/API-02/C12_api02_accept_exact.yml'
          test -f "$SRC"
          cp "$SRC" "$DST"
          cmp -s "$SRC" "$DST"
          test "$(git hash-object "$DST")" = 'af6fafef6be01d550e759087a59a18e416d43cbf'
          git config user.name 'epd2-governed-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add "$DST"
          if git diff --cached --quiet; then
            echo 'exact C12 acceptance blob already staged'
            exit 0
          fi
          git commit -m 'Stage exact API-02 C12 acceptance workflow blob'
          git push origin HEAD:tmp/api02-c12-canonical-accept
