name: api01-c4-dispatch-bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/api01-c4-dispatch-bootstrap.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact API-01 C4 authoritative workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/api01-accept.yml/dispatches" \
            -f ref='tmp/api01-c4-authoritative-run-20260826' \
            -f 'inputs[candidate_sha256]=0e5a8310f80799778ddcc52b47b58c60afa55b945d9592b1ddd63fff6d067e72' \
            -f 'inputs[candidate_run_id]=' \
            -f 'inputs[anchors_run_id]='
          echo 'API-01 C4 workflow_dispatch submitted.'
