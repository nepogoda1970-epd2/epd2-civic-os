name: FRONT04 C2 Independent Review

on:
  push:
    branches: [handoff/front]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  independent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE: handoff/FRONT/incoming/EPD2_FRONT04_WS03_VOTING_CLIENT_CANDIDATE_0.1_C2.zip
      EXPECTED_SHA256: 1ac87914a30e589b4059e3b7c74e0a0fd940a78cecbe7f06de299421c8da55f8
      EXPECTED_SIZE: '21448756'
      EXPECTED_SOURCE_TREE: eee6bf1e80f9e5b5ce18618611513b871b195a163e98948d55d99f61276f2f2e
    steps:
      - uses: actions/checkout@v4

      - name: Exact candidate and detached identity
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CANDIDATE"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c '%s' "$CANDIDATE")" = "$EXPECTED_SIZE"
          SIDE="${CANDIDATE}.sha256"
          test -f "$SIDE"
          test "$(awk '{print $1}' "$SIDE")" = "$EXPECTED_SHA256"
          rm -rf /tmp/front04-c2 && mkdir -p /tmp/front04-c2
          unzip -q "$CANDIDATE" -d /tmp/front04-c2

      - name: Corrected report identity
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/front04-c2
          python3 - <<'PY'
          import json,re,os
          from pathlib import Path
          a=json.loads(Path('validation/front04/authoritative_candidate_result.json').read_text())
          assert a['binding']['source_tree_digest']==os.environ['EXPECTED_SOURCE_TREE']
          report=Path('FRONT04_C2_DEVELOPER_REPORT.md').read_text()
          assert 'c44f1304' not in report.lower()
          refs=set(re.findall(r'(?i)source_tree_digest[^\n]*?([0-9a-f]{8,64})',report))
          assert refs and refs <= {os.environ['EXPECTED_SOURCE_TREE'],os.environ['EXPECTED_SOURCE_TREE'][:8]}, refs
          print('REPORT_IDENTITY=PASS')
          PY

      - name: Reproduce validator 29 of 29
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/front04-c2
          python3 scripts/validate_front04.py | tee /tmp/front04-validator.log
          grep -q '"gates_passed": 29' /tmp/front04-validator.log
          grep -q '"status": "PASS"' /tmp/front04-validator.log

      - name: Reproduce mutations 32 of 32
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/front04-c2
          python3 scripts/run_front04_mutations.py --root . --output /tmp/front04-mutations.json | tee /tmp/front04-mutations.log
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/front04-mutations.json'))
          assert d.get('count')==32 and d.get('detected')==32 and d.get('status')=='PASS', d
          print('MUTATIONS=32/32 PASS')
          PY

      - name: Reject stale source evidence
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/front04-c2 /tmp/front04-stale
          cd /tmp/front04-stale
          printf '\nTHIS_IS_NOT_VALID_TYPESCRIPT !!!\n' >> frontend/voting-client/components/ReceiptSurface.tsx
          set +e
          python3 scripts/validate_front04.py >/tmp/front04-stale.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          echo 'STALE_SOURCE_REJECTION=PASS'

      - name: Archive hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from zipfile import ZipFile
          from pathlib import PurePosixPath
          import stat
          z='handoff/FRONT/incoming/EPD2_FRONT04_WS03_VOTING_CLIENT_CANDIDATE_0.1_C2.zip'
          with ZipFile(z) as f:
              names=f.namelist(); assert len(names)==len(set(names))
              for i in f.infolist():
                  p=PurePosixPath(i.filename); assert not p.is_absolute() and '..' not in p.parts
                  assert not stat.S_ISLNK((i.external_attr>>16)&0xffff)
                  low=i.filename.lower()
                  assert '__pycache__' not in low and not low.endswith(('.pyc','.pyo'))
                  assert '/node_modules/' not in '/'+low and '/.next/' not in '/'+low
          print('ARCHIVE_HYGIENE=PASS')
          PY

      - name: Final independent marker
        run: echo 'FRONT04_C2_INDEPENDENT_REVIEW_CORE=PASS'
