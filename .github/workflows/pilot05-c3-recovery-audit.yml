name: PILOT-05 C3 recovery audit

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/pilot05-c3-authoritative-20260825
    paths:
      - '.github/workflows/pilot05-c3-recovery-audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all remote refs
        run: |
          git fetch --all --tags --prune || true
      - name: Audit Actions artifacts, caches and releases
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['REPO']
          def gh(path):
              p=subprocess.run(['gh','api',path], text=True, capture_output=True)
              if p.returncode:
                  print('API_ERROR', path, p.stderr.strip())
                  return None
              return json.loads(p.stdout)
          print('=== ACTIONS ARTIFACTS ===')
          page=1
          while True:
              d=gh(f'/repos/{repo}/actions/artifacts?per_page=100&page={page}')
              if not d: break
              arr=d.get('artifacts',[])
              for a in arr:
                  wr=a.get('workflow_run') or {}
                  print('ARTIFACT', a.get('id'), json.dumps(a.get('name')), a.get('size_in_bytes'), a.get('expired'), a.get('created_at'), wr.get('id'), wr.get('head_branch'), wr.get('head_sha'))
              if len(arr)<100: break
              page+=1
          print('=== ACTIONS CACHES ===')
          page=1
          while True:
              d=gh(f'/repos/{repo}/actions/caches?per_page=100&page={page}')
              if not d: break
              arr=d.get('actions_caches',[])
              for a in arr:
                  print('CACHE', a.get('id'), json.dumps(a.get('key')), a.get('size_in_bytes'), a.get('ref'), a.get('created_at'), a.get('last_accessed_at'))
              if len(arr)<100: break
              page+=1
          print('=== RELEASE ASSETS ===')
          page=1
          while True:
              arr=gh(f'/repos/{repo}/releases?per_page=100&page={page}')
              if not arr: break
              for r in arr:
                  print('RELEASE', r.get('id'), json.dumps(r.get('tag_name')), json.dumps(r.get('name')), r.get('created_at'))
                  for a in r.get('assets',[]):
                      print('ASSET', a.get('id'), json.dumps(a.get('name')), a.get('size'), a.get('created_at'))
              if len(arr)<100: break
              page+=1
          PY
      - name: Audit all reachable Git objects
        shell: bash
        run: |
          set -euo pipefail
          echo '=== REACHABLE PATHS MATCHING PILOT05/C3/PART/REASSEMBLED ==='
          git rev-list --objects --all | grep -Ei 'PILOT.?05|C3|REASSEMBLED|\.part$|pilot05-c3|DELTA_REASSEMBLED' | tail -n 2000 || true
          echo '=== LARGE REACHABLE BLOBS >= 1 MiB ==='
          git rev-list --objects --all | git cat-file --batch-check='%(objecttype) %(objectname) %(objectsize) %(rest)' | awk '$1=="blob" && $3>=1048576 {print}' | sort -k3,3nr | head -n 500 || true
          echo '=== GIT LFS CONFIG ==='
          test -f .gitattributes && cat .gitattributes || true
          git lfs ls-files --all 2>/dev/null | grep -Ei 'PILOT.?05|C3|REASSEMBLED|\.zip|\.part' || true
