name: FIND-ST01-04 GitHub external review

on:
  push:
    branches: [review/find-st01-04-c1-github]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: api06
          POSTGRES_PASSWORD: api06-synthetic-ci-only
          POSTGRES_DB: epd2_api06
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U api06 -d epd2_api06"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EPD2_API06_DATABASE_URL: postgresql://api06:api06-synthetic-ci-only@127.0.0.1:5432/epd2_api06
      API06_API05_SHA: 38bab7663b54f9f81538666315ee16195b0aa086e5b5c50c2b87acc3f4f03a70

    steps:
      - name: Checkout independent review control
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reconstruct and verify exact correction overlay
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/findst-overlay.tgz"
          for f in .epd2-findst-review/overlay.part*.b64; do base64 -d "$f" >> "$RUNNER_TEMP/findst-overlay.tgz"; done
          echo '419aeefa246f29d2d78880accff394bb7fdf6c7262fbb3d467b4fa7ae12d4bfb  '"$RUNNER_TEMP/findst-overlay.tgz" | sha256sum -c -
          tar -tzf "$RUNNER_TEMP/findst-overlay.tgz" | sort > "$RUNNER_TEMP/overlay-files.txt"
          test "$(grep -vc '/$' "$RUNNER_TEMP/overlay-files.txt")" -eq 8
          cat "$RUNNER_TEMP/overlay-files.txt"

      - name: Download exact accepted API-06 C1 artifact
        uses: actions/download-artifact@v4
        with:
          name: api06-c1-candidate-v3
          path: incoming/api06
          run-id: 33628261946
          github-token: ${{ github.token }}

      - name: Verify and extract accepted API-06 C1
        id: base
        shell: bash
        run: |
          set -euo pipefail
          ZIP=$(find incoming/api06 -type f -name 'EPD2_API06_API_LAYER_COMPLETION_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1.zip' -print -quit)
          test -n "$ZIP"
          echo '3432b6615aa83c6f2860c015b7cafc2a18362aa371901616951a1bd5d263933c  '"$ZIP" | sha256sum -c -
          test "$(stat -c%s "$ZIP")" = '44012716'
          rm -rf "$RUNNER_TEMP/api06" && mkdir -p "$RUNNER_TEMP/api06"
          python3 - "$ZIP" "$RUNNER_TEMP/api06" <<'PY'
          import pathlib,sys,zipfile
          z=zipfile.ZipFile(sys.argv[1]); assert z.testzip() is None
          names=z.namelist(); roots={n.split('/',1)[0] for n in names if n}
          assert roots=={'EPD2_API06_API_LAYER_COMPLETION_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1'}, roots
          assert all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in names)
          z.extractall(sys.argv[2])
          PY
          ROOT="$RUNNER_TEMP/api06/EPD2_API06_API_LAYER_COMPLETION_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1"
          (cd "$ROOT" && sha256sum --quiet -c SHA256SUMS.txt)
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo 'FINDST_BASE_IDENTITY:PASS'

      - name: Set up exact uv toolchain
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install accepted locked workspace and inherited runtime adapters
        shell: bash
        working-directory: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          uv lock --check
          uv sync --frozen --all-groups
          uv pip install --python .venv/bin/python pika==1.3.2
          mkdir -p .api03-crypto
          unzip -q -o packages/python/epd2-s2s-crypto/wheelhouse/cryptography-49.0.0-cp311-abi3-manylinux_2_34_x86_64.whl -d .api03-crypto
          echo "API06_API03_CRYPTO_PATH=$PWD/.api03-crypto" >> "$GITHUB_ENV"

      - name: Provision accepted API-04 live regression environment
        shell: bash
        working-directory: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          source scripts/api04_ci_setup.sh "$PWD"
          test -s "$API04_BROKER_TLS_BINDINGS"
          test -s "$API04_BROKER_SECRETS"

      - name: Reset API-06 database for pristine run
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=api06-synthetic-ci-only
          psql -h 127.0.0.1 -p 5432 -U api06 -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS epd2_api06 WITH (FORCE);'
          psql -h 127.0.0.1 -p 5432 -U api06 -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE epd2_api06 OWNER api06;'
          echo 'FINDST_API06_DB_RESET:PRISTINE:PASS'

      - name: Run pristine accepted API-06 40-gate baseline
        shell: bash
        working-directory: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          mkdir -p validation/find_st01_04
          export API06_CURRENT_MAIN_COMMIT=$(jq -r .main_commit docs/api/API-06/API06_ENTERING_BASELINE_IDENTITY.json)
          export API06_CURRENT_MAIN_TREE=$(jq -r .main_tree docs/api/API-06/API06_ENTERING_BASELINE_IDENTITY.json)
          export API06_CURRENT_PCR_SHA256=$(jq -r .program_control_register_sha256 docs/api/API-06/API06_ENTERING_BASELINE_IDENTITY.json)
          export API06_CURRENT_MASTER_SHA256=$(jq -r .master_register_sha256 docs/api/API-06/API06_ENTERING_BASELINE_IDENTITY.json)
          .venv/bin/python scripts/validation/validate_api06.py --out validation/find_st01_04/github-api06-pristine.json | tee "$RUNNER_TEMP/api06-pristine.log"
          grep -q '^API06_RESULT:PASS:40/40:' "$RUNNER_TEMP/api06-pristine.log"
          jq -e '.result=="PASS" and .passed_gates==40 and .failed_gates==[] and .environment_blocked_runs==[]' validation/find_st01_04/github-api06-pristine.json
          echo 'FINDST_PRISTINE_API06:PASS:40/40'

      - name: Apply exact 8-file correction overlay
        shell: bash
        working-directory: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          tar -xzf "$RUNNER_TEMP/findst-overlay.tgz" -C .
          echo 'FINDST_DECLARED_DELTA:PASS:8'

      - name: Reset API-06 database for corrected run
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=api06-synthetic-ci-only
          psql -h 127.0.0.1 -p 5432 -U api06 -d postgres -v ON_ERROR_STOP=1 -c 'DROP DATABASE IF EXISTS epd2_api06 WITH (FORCE);'
          psql -h 127.0.0.1 -p 5432 -U api06 -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE epd2_api06 OWNER api06;'
          echo 'FINDST_API06_DB_RESET:CORRECTED:PASS'

      - name: Run complete API-06 40-gate validator on corrected tree
        shell: bash
        working-directory: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          export API06_CURRENT_MAIN_COMMIT=$(jq -r .main_commit docs/api/API-06/API06_ENTERING_BASELINE_IDENTITY.json)
          export API06_CURRENT_MAIN_TREE=$(jq -r .main_tree docs/api/API-06/API06_ENTERING_BASELINE_IDENTITY.json)
          export API06_CURRENT_PCR_SHA256=$(jq -r .program_control_register_sha256 docs/api/API-06/API06_ENTERING_BASELINE_IDENTITY.json)
          export API06_CURRENT_MASTER_SHA256=$(jq -r .master_register_sha256 docs/api/API-06/API06_ENTERING_BASELINE_IDENTITY.json)
          .venv/bin/python scripts/validation/validate_api06.py --out validation/find_st01_04/github-api06-corrected.json | tee "$RUNNER_TEMP/api06-corrected.log"
          grep -q '^API06_RESULT:PASS:40/40:' "$RUNNER_TEMP/api06-corrected.log"
          jq -e '.result=="PASS" and .passed_gates==40 and .failed_gates==[] and .environment_blocked_runs==[]' validation/find_st01_04/github-api06-corrected.json
          echo 'FINDST_G31_API06:PASS:40/40'

      - name: Compare pristine and corrected API-06 gate sets
        shell: bash
        working-directory: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          jq -e --slurp '.[0].result=="PASS" and .[1].result=="PASS" and .[0].passed_gates==40 and .[1].passed_gates==40 and .[0].failed_gates==[] and .[1].failed_gates==[]' validation/find_st01_04/github-api06-pristine.json validation/find_st01_04/github-api06-corrected.json
          echo 'FINDST_G31_COMPARISON:PASS:NO_REGRESSION'

      - name: Run targeted FIND-ST01-04 integration tests
        shell: bash
        working-directory: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          .venv/bin/python -m pytest packages/python/epd2-runtime/tests/test_find_st01_04_identity_session_on_member_routes.py -q --junitxml=validation/find_st01_04/github-targeted.xml

      - name: Verify packaged 32-of-32 mutation evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.schema=="epd2.find-st01-04.mutations/1" and .work_item=="FIND-ST01-04" and .candidate_state=="CANDIDATE_NOT_ACCEPTED" and .self_acceptance==false and .result=="PASS" and .mutation_count==32 and .detected==32 and .missed==0 and ([.mutations[].id] | length)==32 and ([.mutations[] | select(.result!="DETECTED" or .restored!=true)] | length)==0' .epd2-findst-review/original-mutation-result.json
          echo 'FINDST_PACKAGED_MUTATION_EVIDENCE:PASS:32/32'
          echo 'NOTE: sealed System Trial harness commit referenced by the candidate is no longer reachable in GitHub; this verifies packaged mutation evidence and does not claim a fresh G33 replay.'

      - name: Upload detached GitHub review evidence
        uses: actions/upload-artifact@v4
        with:
          name: find-st01-04-github-review-${{ github.run_id }}
          path: |
            ${{ steps.base.outputs.root }}/validation/find_st01_04/
            ${{ steps.base.outputs.root }}/docs/api/FIND-ST01-04/
            ${{ runner.temp }}/api06-pristine.log
            ${{ runner.temp }}/api06-corrected.log
            ${{ runner.temp }}/overlay-files.txt
            .epd2-findst-review/original-mutation-result.json
          if-no-files-found: error
          retention-days: 90

      - name: External preseal review result
        run: echo 'FIND-ST01-04_GITHUB_PRESEAL_REVIEW:PASS:G31_COMPLETE:G32_G33_POSTSEAL_REQUIRED'
