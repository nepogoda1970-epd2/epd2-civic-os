name: INFRA-04 C2 Canonical Acceptance

on:
  push:
    branches: ["candidate/infra04-c2-canonical"]

permissions:
  contents: read
  actions: read

concurrency:
  group: infra04-c2-canonical
  cancel-in-progress: false

env:
  C2_NAME: EPD2_INFRA04_RESILIENCE_RECOVERY_AND_INFRA_CLOSURE_READINESS_CANDIDATE_0.1_C2
  INFRA02_PATH: handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip
  INFRA02_SHA256: d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
  INFRA02_SIZE: "15980332"

jobs:
  build:
    name: Build exact C2 and execute complete pre-seal
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      sha256: ${{ steps.identity.outputs.sha256 }}
      size: ${{ steps.identity.outputs.size }}
    steps:
      - name: Checkout C2 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Materialize governed C2 delta from accepted INFRA-02
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin handoff/infra
          git show "origin/handoff/infra:$INFRA02_PATH" > /tmp/infra02.zip
          test "$(sha256sum /tmp/infra02.zip | awk '{print $1}')" = "$INFRA02_SHA256"
          test "$(stat -c %s /tmp/infra02.zip)" = "$INFRA02_SIZE"
          unzip -t /tmp/infra02.zip >/dev/null
          python3 handoff/INFRA/infra04-c2-transport/apply.py --root "$GITHUB_WORKSPACE" --predecessor /tmp/infra02.zip
          cp -a handoff/INFRA/infra04-c2-overlay/. "$GITHUB_WORKSPACE"/
          rm -rf handoff/INFRA/infra04-c2-transport handoff/INFRA/infra04-c2-overlay
          echo "INFRA04_C2_TRANSPORT_MATERIALIZATION:PASS"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          enable-cache: true

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install PostgreSQL 16 runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/postgres --version

      - name: Install frozen dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-groups --frozen
          npm ci
          npx playwright install --with-deps chromium
          git diff --exit-code -- uv.lock package-lock.json

      - name: Bind current canonical main and exact INFRA-02 predecessor
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          MAIN=$(git rev-parse origin/main)
          test "$MAIN" = "81c2d0db987536718b30242eeb168aecc21877ca"
          git merge-base --is-ancestor origin/main HEAD
          test "$(sha256sum /tmp/infra02.zip | awk '{print $1}')" = "$INFRA02_SHA256"
          test "$(stat -c %s /tmp/infra02.zip)" = "$INFRA02_SIZE"
          git show origin/main:docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md > /tmp/current-pcr.md
          uv run python -m scripts.acceptance verify-reconciliation --root . --target-pcr /tmp/current-pcr.md
          echo "INFRA04_C2_CANONICAL_BASE:PASS:$MAIN"

      - name: Remove prior canonical package additions before new freeze
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch SHA256SUMS.txt ACCEPTANCE/FREEZE-INVENTORY.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Targeted INFRA-04 tests and live runtime gates
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q tests/repository/test_infra04_units.py tests/repository/test_infra04_mutation_suite.py | tee "$GITHUB_WORKSPACE/infra04-c2-targeted.txt"
          uv run python -m scripts.infra04.gates --artifact /tmp/infra02.zip | tee "$GITHUB_WORKSPACE/infra04-c2-runtime.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('validation/infra04/gate_report.json').read_text())
          s=g['summary']
          if s.get('pass') != 53 or s.get('fail') or s.get('blocked') or not s.get('all_runtime_passed'):
              raise SystemExit(s)
          m=json.loads(Path('validation/infra04/mutation_result.json').read_text())
          if m.get('mutation_total') != 48 or m.get('distinct_detector_total') != 48:
              raise SystemExit(m)
          d=json.loads(Path('validation/infra04/e2e_drill_report.json').read_text())
          if d.get('summary',{}).get('pass') != 18:
              raise SystemExit(d.get('summary'))
          print('INFRA04_C2_RUNTIME:PASS:53/53')
          print('INFRA04_C2_MUTATIONS:PASS:48/48')
          print('INFRA04_C2_DRILLS:PASS:18/18')
          PY

      - name: Regenerate exact changed-file lineage after runtime evidence
        shell: bash
        run: |
          set -euo pipefail
          uv run python -m scripts.infra04.build_changed_manifest
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('docs/infra/INFRA-04/INFRA04_CHANGED_FILE_MANIFEST.json')
          d=json.loads(p.read_text())
          missing=[]; bad=[]; pyc=[]
          for e in d['files']:
              if e.get('change')=='deleted': continue
              q=Path(e['path'])
              if not q.is_file(): missing.append(e['path']); continue
              if q.suffix=='.pyc' or '__pycache__' in q.parts: pyc.append(e['path'])
              h=hashlib.sha256(q.read_bytes()).hexdigest()
              if h!=e['sha256']: bad.append((e['path'],e['sha256'],h))
          if missing or bad or pyc: raise SystemExit({'missing':missing,'bad':bad,'pyc':pyc})
          if d['canonical_base']['commit']!='81c2d0db987536718b30242eeb168aecc21877ca': raise SystemExit(d['canonical_base'])
          print(f"INFRA04_C2_CHANGED_MANIFEST:PASS:{d['total_files']}")
          PY

      - name: Commit exact tested source/evidence snapshot locally
        shell: bash
        run: |
          set -euo pipefail
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'EPD2 INFRA04 C2 builder'
          git config user.email 'infra04-c2@invalid.local'
          git add -A
          git commit -m 'build(infra04): derive exact C2 runtime evidence and lineage'
          test -z "$(git status --porcelain)"
          echo "INFRA04_C2_LOCAL_SOURCE_COMMIT:$(git rev-parse HEAD)"

      - name: Complete canonical acceptance harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/acceptance-out"
          uv run python -m scripts.acceptance run --root . --output "$GITHUB_WORKSPACE/acceptance-out" | tee "$GITHUB_WORKSPACE/infra04-c2-harness.txt"
          RUN_DIR=$(dirname "$(find "$GITHUB_WORKSPACE/acceptance-out" -name EXECUTION-MANIFEST.json -type f -print -quit)")
          test -n "$RUN_DIR"
          echo "$RUN_DIR" > "$GITHUB_WORKSPACE/run-dir.txt"
          python - <<PY
          import json
          from pathlib import Path
          p=Path('$RUN_DIR')/'EXECUTION-MANIFEST.json'
          d=json.loads(p.read_text())
          if d.get('verdict')!='PASS': raise SystemExit(d.get('verdict'))
          print('INFRA04_C2_CANONICAL_HARNESS:PASS')
          PY

      - name: G53 exact-byte pre/post seal and developer pre-seal marker
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR=$(cat "$GITHUB_WORKSPACE/run-dir.txt")
          mkdir -p "$GITHUB_WORKSPACE/dist"
          uv run python -m scripts.infra04.preseal --root . --run-dir "$RUN_DIR" --out "$GITHUB_WORKSPACE/dist" | tee "$GITHUB_WORKSPACE/infra04-c2-preseal.txt"
          grep -Eq '^INFRA04_PRESEAL_RESULT:PASS:[0-9a-f]{64}:[0-9]+$' "$GITHUB_WORKSPACE/infra04-c2-preseal.txt"
          test -f "$GITHUB_WORKSPACE/dist/$C2_NAME.zip"
          test -f "$GITHUB_WORKSPACE/dist/$C2_NAME.zip.sha256"

      - name: Exact C2 identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          Z="$GITHUB_WORKSPACE/dist/$C2_NAME.zip"
          SHA=$(sha256sum "$Z" | awk '{print $1}')
          SIZE=$(stat -c %s "$Z")
          test "$(awk '{print $1}' "$Z.sha256")" = "$SHA"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "INFRA04_C2_BUILD_RESULT:PASS:$SHA:$SIZE"

      - name: Upload exact C2 candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra04-c2-exact-candidate-${{ github.run_id }}
          path: ${{ github.workspace }}/dist/${{ env.C2_NAME }}.zip
          if-no-files-found: error
          retention-days: 90

      - name: Upload build/pre-seal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra04-c2-build-evidence-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/infra04-c2-targeted.txt
            ${{ github.workspace }}/infra04-c2-runtime.txt
            ${{ github.workspace }}/infra04-c2-harness.txt
            ${{ github.workspace }}/infra04-c2-preseal.txt
            ${{ github.workspace }}/run-dir.txt
            ${{ github.workspace }}/dist/*.sha256
            ${{ github.workspace }}/dist/INFRA04_PRESEAL_FINAL.json
            ${{ github.workspace }}/dist/INFRA04_PACKAGE_SEAL_VERIFICATION.json
          if-no-files-found: warn
          retention-days: 90

  authoritative-review:
    name: Independent exact-byte authoritative review
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout only for repository authority access
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Download exact candidate from build job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: infra04-c2-exact-candidate-${{ github.run_id }}
          path: ${{ github.workspace }}/incoming

      - name: Verify exact identity and safe internal seal
        shell: bash
        run: |
          set -euo pipefail
          Z="$GITHUB_WORKSPACE/incoming/$C2_NAME.zip"
          test "$(sha256sum "$Z" | awk '{print $1}')" = "${{ needs.build.outputs.sha256 }}"
          test "$(stat -c %s "$Z")" = "${{ needs.build.outputs.size }}"
          Z="$Z" python - <<'PY'
          import hashlib,os,pathlib,zipfile
          z=pathlib.Path(os.environ['Z']); root=os.environ['C2_NAME']; prefix=root+'/'
          with zipfile.ZipFile(z) as f:
              names=f.namelist()
              if len(names)!=len(set(names)): raise SystemExit('duplicate archive members')
              if any(n.startswith('/') or n.startswith('../') or '/../' in '/'+n or '\\' in n for n in names): raise SystemExit('unsafe archive member')
              if any(n.endswith('.pyc') or '/__pycache__/' in n for n in names): raise SystemExit('runtime cache contamination')
              sums=f.read(prefix+'SHA256SUMS.txt').decode().splitlines()
              expected={line.split('  ',1)[1]:line.split('  ',1)[0] for line in sums if line.strip()}
              actual={n[len(prefix):]:hashlib.sha256(f.read(n)).hexdigest() for n in names if n!=prefix+'SHA256SUMS.txt' and not n.endswith('/')}
              if expected!=actual: raise SystemExit(f'internal seal mismatch expected={len(expected)} actual={len(actual)}')
              print(f'INFRA04_C2_ARCHIVE_SEAL:PASS:{len(actual)+1}')
          PY
          rm -rf "$GITHUB_WORKSPACE/review-root" && mkdir "$GITHUB_WORKSPACE/review-root"
          unzip -q "$Z" -d "$GITHUB_WORKSPACE/review-root"

      - name: Set up independent review toolchain
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          enable-cache: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: review-root/${{ env.C2_NAME }}/package-lock.json

      - name: Install PostgreSQL and frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          cd "$GITHUB_WORKSPACE/review-root/$C2_NAME"
          LOCKS_BEFORE=$(sha256sum uv.lock package-lock.json)
          uv sync --all-groups --frozen
          npm ci
          npx playwright install --with-deps chromium
          LOCKS_AFTER=$(sha256sum uv.lock package-lock.json)
          test "$LOCKS_BEFORE" = "$LOCKS_AFTER"

      - name: Bind live main and exact INFRA-02 independently
        shell: bash
        run: |
          set -euo pipefail
          R="$GITHUB_WORKSPACE/review-root/$C2_NAME"
          cd "$R"
          rm -rf .git .acceptance-run
          git init -q
          git config user.name 'EPD2 INFRA04 independent reviewer'
          git config user.email 'infra04-review@invalid.local'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git add -A && git commit -qm 'exact submitted INFRA04 C2 bytes'
          git fetch --no-tags origin main handoff/infra
          test "$(git rev-parse origin/main)" = "81c2d0db987536718b30242eeb168aecc21877ca"
          git show "origin/handoff/infra:$INFRA02_PATH" > /tmp/infra02-review.zip
          test "$(sha256sum /tmp/infra02-review.zip | awk '{print $1}')" = "$INFRA02_SHA256"
          git show origin/main:docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md > /tmp/review-current-pcr.md
          uv run python -m scripts.acceptance verify-reconciliation --root . --target-pcr /tmp/review-current-pcr.md
          echo "INFRA04_C2_REVIEW_FRESHNESS:PASS"

      - name: Independent targeted, runtime and mutation replay
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/review-root/$C2_NAME"
          uv run pytest -q tests/repository/test_infra04_units.py tests/repository/test_infra04_mutation_suite.py | tee "$GITHUB_WORKSPACE/review-targeted.txt"
          uv run python -m scripts.infra04.gates --artifact /tmp/infra02-review.zip | tee "$GITHUB_WORKSPACE/review-runtime.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('validation/infra04/gate_report.json').read_text())['summary']
          m=json.loads(Path('validation/infra04/mutation_result.json').read_text())
          d=json.loads(Path('validation/infra04/e2e_drill_report.json').read_text())['summary']
          if g.get('pass')!=53 or g.get('fail') or g.get('blocked') or not g.get('all_runtime_passed'): raise SystemExit(g)
          if m.get('mutation_total')!=48 or m.get('distinct_detector_total')!=48: raise SystemExit(m)
          if d.get('pass')!=18: raise SystemExit(d)
          print('INFRA04_C2_REVIEW_RUNTIME:PASS:53/53')
          print('INFRA04_C2_REVIEW_MUTATIONS:PASS:48/48')
          print('INFRA04_C2_REVIEW_DRILLS:PASS:18/18')
          PY

      - name: Independent repository quality and browser replay
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/review-root/$C2_NAME"
          uv run python scripts/check_repository.py
          uv run python scripts/check_forbidden_files.py
          uv run python scripts/verify_versions.py
          uv run ruff format --check .
          uv run ruff check .
          make typecheck
          uv run pytest -q
          npm run format:check
          npm run typecheck --workspace=packages/typescript/epd2-types
          npm run typecheck --workspace=frontend/web-shell
          npm run lint --workspace=frontend/web-shell
          npm run test --workspace=packages/typescript/epd2-types
          npm run test --workspace=frontend/web-shell
          npm run build --workspace=frontend/web-shell
          npm run test:browser --workspace=frontend/web-shell
          echo "INFRA04_C2_REVIEW_FULL_REPLAY:PASS"

      - name: Authoritative terminal marker
        shell: bash
        run: |
          set -euo pipefail
          SHA="${{ needs.build.outputs.sha256 }}"
          SIZE="${{ needs.build.outputs.size }}"
          echo "INFRA04_C2_AUTHORITATIVE_RESULT:PASS:$SHA:$SIZE" | tee "$GITHUB_WORKSPACE/authoritative-marker.txt"
          echo "CANDIDATE_NOT_ACCEPTED in submitted bytes; external review PASS only. Governance acceptance remains separate."

      - name: Upload independent evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra04-c2-authoritative-evidence-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/review-targeted.txt
            ${{ github.workspace }}/review-runtime.txt
            ${{ github.workspace }}/authoritative-marker.txt
          if-no-files-found: error
          retention-days: 90
