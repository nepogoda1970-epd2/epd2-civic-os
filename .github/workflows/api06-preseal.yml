name: API-06 WORKING 0.1 PRESEAL

on:
  push:
    branches:
      - tmp/api06-working-0.1-preseal
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: api06
          POSTGRES_PASSWORD: api06-synthetic-ci-only
          POSTGRES_DB: epd2_api06
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api06 -d epd2_api06"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EPD2_API06_DATABASE_URL: postgresql://api06:api06-synthetic-ci-only@127.0.0.1:5432/epd2_api06

    steps:
      - name: Checkout API-06 transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bind current canonical governance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          echo "API06_CURRENT_MAIN_COMMIT=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          echo "API06_CURRENT_PCR_SHA256=$(git show origin/main:docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "API06_CURRENT_MASTER_SHA256=$(git show origin/main:docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md | sha256sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Download exact API-05 working PRESEAL input
        uses: actions/download-artifact@v4
        with:
          name: api05-working-0.1-preseal
          path: incoming/api05
          run-id: 33568222120
          github-token: ${{ github.token }}

      - name: Materialize API-06 working tree
        shell: bash
        run: |
          set -euo pipefail
          cd incoming/api05
          sha256sum -c EPD2_API05_EXTERNAL_INTEGRATION_BOUNDARY_WORKING_0.1_PRESEAL.zip.sha256
          unzip -q EPD2_API05_EXTERNAL_INTEGRATION_BOUNDARY_WORKING_0.1_PRESEAL.zip -d "$RUNNER_TEMP/api06"
          ROOT="$RUNNER_TEMP/api06/EPD2_API05_EXTERNAL_INTEGRATION_BOUNDARY_WORKING_0.1_PRESEAL"
          cd "$GITHUB_WORKSPACE"
          base64 --decode handoff/API-06/WORKING_0.1/api06_overlay.tar.gz.b64 > "$RUNNER_TEMP/api06-overlay.tar.gz"
          tar --no-same-owner -xzf "$RUNNER_TEMP/api06-overlay.tar.gz" -C "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_ENV"

      - name: Install exact toolchain
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install locked workspace and exact inherited adapters
        shell: bash
        run: |
          set -euo pipefail
          cd "$root"
          uv sync --frozen --all-groups
          uv pip install --python .venv/bin/python pika==1.3.2
          mkdir -p .api03-crypto
          unzip -q -o packages/python/epd2-s2s-crypto/wheelhouse/cryptography-49.0.0-cp311-abi3-manylinux_2_34_x86_64.whl -d .api03-crypto
          echo "API06_API03_CRYPTO_PATH=$root/.api03-crypto" >> "$GITHUB_ENV"

      - name: Run canonical API-06 40-gate validator
        shell: bash
        run: |
          set -euo pipefail
          cd "$root"
          set +e
          .venv/bin/python scripts/validation/validate_api06.py | tee /tmp/api06-validator.log
          rc=${PIPESTATUS[0]}
          set -e
          jq '{result,passed_gates,failed_gates,environment_blocked_runs,gates:[.gates[]|{id,name,result}]}' validation/api06/api06_acceptance_result.json
          test "$rc" = 0
          grep -q '^API06_RESULT:PASS:40/40:validation/api06/api06_acceptance_result.json$' /tmp/api06-validator.log
          jq -e '.result=="PASS" and .passed_gates==40 and .failed_gates==[] and .environment_blocked_runs==[]' validation/api06/api06_acceptance_result.json

      - name: Build and independently verify exact PRESEAL
        id: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/api06-out"
          cd "$root"
          .venv/bin/python scripts/api06/build_api06_preseal.py --out-dir "$RUNNER_TEMP/api06-out" | tee /tmp/api06-package.log
          ZIP="$RUNNER_TEMP/api06-out/EPD2_API06_API_LAYER_COMPLETION_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL.zip"
          .venv/bin/python scripts/api06/verify_api06_package.py "$ZIP" --out "$RUNNER_TEMP/api06-out/api06_package_verification.json" | tee /tmp/api06-package-verify.log
          grep -q '^API06_PACKAGE_VERIFY:PASS:' /tmp/api06-package-verify.log
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sidecar=$ZIP.sha256" >> "$GITHUB_OUTPUT"
          echo "package_result=$RUNNER_TEMP/api06-out/api06_package_verification.json" >> "$GITHUB_OUTPUT"

      - name: Upload exact API-06 PRESEAL
        uses: actions/upload-artifact@v4
        with:
          name: api06-working-0.1-preseal
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sidecar }}
            ${{ steps.package.outputs.package_result }}
            ${{ env.root }}/docs/api/API-06/API06_DEVELOPER_REPORT.md
            ${{ env.root }}/validation/api06/api06_acceptance_result.json
            ${{ env.root }}/validation/api06/mutation_result.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Final developer result
        run: |
          echo 'API06_DEVELOPER_RESULT:PASS'
          echo 'API06_IMPLEMENTATION_COMPLETE / PRESEAL_READY / NOT_ACCEPTED'
          echo 'API-04 and API-05 authoritative acceptance remain required for final lineage and seal'
