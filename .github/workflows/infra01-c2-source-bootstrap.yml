name: INFRA-01 C2 Source Bootstrap

on:
  push:
    branches: [handoff/infra]
    paths: [.github/workflows/infra01-c2-source-bootstrap.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout handoff branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact C2 non-workflow delta to exact C0 source
        shell: bash
        run: |
          set -euo pipefail
          B64="handoff/INFRA/transport/infra01-c2-nonworkflow-delta.tar.gz.b64"
          cp "$B64" "$RUNNER_TEMP/delta.b64"
          base64 -d "$RUNNER_TEMP/delta.b64" > "$RUNNER_TEMP/delta.tar.gz"
          echo "de9ddab1977d9ca9e6becacddc172ed1cc21372addd8a376aeb5c6dce5c99e51  $RUNNER_TEMP/delta.tar.gz" | sha256sum -c -

          git fetch --no-tags origin tmp/infra01-c0-source-20260901
          git switch -C tmp/infra01-c2-source-no-workflows origin/tmp/infra01-c0-source-20260901
          tar -xzf "$RUNNER_TEMP/delta.tar.gz" -C .
          test ! -d .github/workflows
          git add -A
          git config user.name "EPD2 independent acceptance"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(infra01): apply exact C2 non-workflow delta"
          git push --force origin HEAD:refs/heads/tmp/infra01-c2-source-no-workflows

      - name: Report source identity
        run: |
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git status --porcelain
