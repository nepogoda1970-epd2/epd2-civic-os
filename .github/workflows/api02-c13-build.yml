name: api02-c13-build

on:
  push:
    branches:
      - tmp/api02-c13-repair
    paths:
      - '.github/workflows/api02-c13-build.yml'
      - 'handoff/API-02/tools/build_api02_c13.py'
      - 'handoff/API-02/tools/c13_followup_fix.py'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      C12_RUN_ID: '33490942304'
      C12_SHA256: 'ef124329645a92232285df6e2662df090114244bcf13953da015cc296518759a'
      C12_SIZE: '34640113'
      C12_NAME: 'EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C12.zip'
      C13_ROOT: 'EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C13'
      API01_NAME: 'EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5.zip'
      API01_SHA256: 'cea2fb0e23ee174e802ec1899cf62e570e5c8659a0f31c7e6c3c3955bffa3d27'
      DATA06_NAME: 'EPD2_DATA_SERIES_CANONICAL_BASELINE_0.1_FINAL.zip'
      DATA06_SHA256: '8cba01997e4943f6d3c2b3fc1fe11e2c3527cd6c39123171a827fb8e3669cbf1'

    steps:
      - name: '01 Checkout governed C13 builder branch'
        uses: actions/checkout@v4

      - name: '02 Install exact uv'
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: false

      - name: '03 Install exact CPython 3.12.12'
        run: uv python install 3.12.12

      - name: '04 Download exact sealed C12 candidate'
        uses: actions/download-artifact@v4
        with:
          name: api02-candidate
          path: transport/c12
          run-id: ${{ env.C12_RUN_ID }}
          github-token: ${{ github.token }}

      - name: '05 Download exact C12 acceptance anchors'
        uses: actions/download-artifact@v4
        with:
          name: api02-anchors
          path: transport/anchors
          run-id: ${{ env.C12_RUN_ID }}
          github-token: ${{ github.token }}

      - name: '06 Verify exact inputs'
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          C12="$(find transport/c12 -type f -name "$C12_NAME" -print -quit)"
          A1="$(find transport/anchors -type f -name "$API01_NAME" -print -quit)"
          D6="$(find transport/anchors -type f -name "$DATA06_NAME" -print -quit)"
          test -n "$C12" -a -n "$A1" -a -n "$D6"
          echo "$C12_SHA256  $C12" | sha256sum -c -
          [ "$(stat -c '%s' "$C12")" = "$C12_SIZE" ]
          echo "$API01_SHA256  $A1" | sha256sum -c -
          echo "$DATA06_SHA256  $D6" | sha256sum -c -
          echo "c12=$(realpath "$C12")" >> "$GITHUB_OUTPUT"
          echo "api01=$(realpath "$A1")" >> "$GITHUB_OUTPUT"
          echo "data06=$(realpath "$D6")" >> "$GITHUB_OUTPUT"

      - name: '07 Fresh extract and apply bounded C13 correction'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work out
          mkdir -p work out
          unzip -t "${{ steps.inputs.outputs.c12 }}" >/dev/null
          unzip -q "${{ steps.inputs.outputs.c12 }}" -d work
          mv "work/EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C12" "work/$C13_ROOT"
          python3 handoff/API-02/tools/build_api02_c13.py --patch-only --root "work/$C13_ROOT" --out out
          python3 handoff/API-02/tools/c13_followup_fix.py --root "work/$C13_ROOT"

      - name: '08 Frozen-format corrected Python files and prove formatter currentness'
        working-directory: work/${{ env.C13_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          export UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/c13-format-env"
          export RUFF_NO_CACHE=true
          uv sync --frozen --all-groups --python 3.12.12
          uv run --frozen ruff format scripts/api02/lineage_gates.py scripts/api02/validator_selftest.py scripts/api02/build_exact_inventories.py
          uv run --frozen ruff format --check scripts/api02/lineage_gates.py scripts/api02/validator_selftest.py scripts/api02/build_exact_inventories.py
          uv run --frozen ruff check scripts/api02/lineage_gates.py scripts/api02/validator_selftest.py scripts/api02/build_exact_inventories.py
          rm -rf .ruff_cache
          [ ! -e .venv ]

      - name: '09 Rebuild current identity and exact inventories'
        working-directory: work/${{ env.C13_ROOT }}
        env:
          API02_ACCEPTED_API01_C5_ZIP: ${{ steps.inputs.outputs.api01 }}
          API02_ACCEPTED_API01_ZIP: ${{ steps.inputs.outputs.api01 }}
          API02_ACCEPTED_DATA06_ZIP: ${{ steps.inputs.outputs.data06 }}
          API02_ENTERING_CANDIDATE_ZIP: ${{ steps.inputs.outputs.c12 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/api02/build_authorization_registers.py
          python3 scripts/api02/build_mandatory_tests.py
          python3 scripts/api02/build_v23_reconciliation.py
          python3 scripts/api02/build_exact_inventories.py
          python3 scripts/api02/build_correction_inventory.py
          python3 scripts/api02/acceptance_path_identity.py --root .

      - name: '10 Converge seal, require acceptance-path PASS and cache-free census'
        working-directory: work/${{ env.C13_ROOT }}
        env:
          API02_ACCEPTED_API01_C5_ZIP: ${{ steps.inputs.outputs.api01 }}
          API02_ACCEPTED_API01_ZIP: ${{ steps.inputs.outputs.api01 }}
          API02_ACCEPTED_DATA06_ZIP: ${{ steps.inputs.outputs.data06 }}
          API02_ENTERING_CANDIDATE_ZIP: ${{ steps.inputs.outputs.c12 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/api02/build_evidence_state.py
          python3 -c 'import sys;sys.path.insert(0,"scripts/api02");import finalize_candidate as f;f.write_validation_txt()'
          converged=0
          for pass in 1 2 3 4 5 6; do
            echo "SEAL_FIXED_POINT_PASS=$pass"
            python3 scripts/api02/build_stale_audit.py
            python3 scripts/api02/build_consistency_result.py
            python3 scripts/api02/build_correction_inventory.py
            python3 scripts/api02/build_bsi_classification.py
            python3 scripts/api02/build_correction_inventory.py
            python3 scripts/api02/build_bsi_classification.py --check
            python3 scripts/api02/build_sealed_accounting.py --layer-a-only
            python3 -c 'import sys;sys.path.insert(0,"scripts/api02");import finalize_candidate as f;print("CHECKSUM_ROWS",f.write_checksums())'
            python3 scripts/api02/build_sealed_accounting.py --layer-b-only
            if python3 scripts/api02/finalize_candidate.py --check; then converged=1; break; fi
          done
          [ "$converged" = 1 ]
          python3 scripts/validate_api02.py --acceptance-path-only
          python3 scripts/api02/acceptance_path_identity.py --root .
          python3 scripts/api02/finalize_candidate.py --check
          sha256sum --quiet -c SHA256SUMS.txt
          listed="$(grep -c . SHA256SUMS.txt)"
          actual="$(find . -type f ! -path ./SHA256SUMS.txt ! -path ./docs/api/API-02/API02_SEALED_FILE_MANIFEST.json | wc -l)"
          [ "$listed" = "$actual" ] || { echo "sealed census mismatch: SHA256SUMS=$listed tree=$actual" >&2; exit 1; }

      - name: '11 Prove C12 to C13 runtime-neutral correction'
        working-directory: work/${{ env.C13_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          d=json.load(open('docs/api/API-02/API02_C12_TO_C13_CORRECTION_INVENTORY.json'))
          runtime=('packages/','apps/','services/','src/','migrations/','db/','schema/','frontend/','contracts/')
          changed=[r for r in d['entries'] if r.get('change') in ('added','modified','removed')]
          bad=[r['path'] for r in changed if r['path'].startswith(runtime)]
          print('changed_rows',len(changed),d.get('counts')); print('runtime_delta_paths',bad)
          assert not bad,bad
          PY

      - name: '12 Assert C13 step27 schema correction is exact and fail-closed'
        working-directory: work/${{ env.C13_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          ! grep -F 'identity["mode"]' .github/workflows/api02-accept.yml
          ! grep -F 'identity["sha256"]' .github/workflows/api02-accept.yml
          grep -F 'assert identity["result"] == "PASS"' .github/workflows/api02-accept.yml
          grep -F 'assert identity["candidate"] == role' .github/workflows/api02-accept.yml
          grep -F 'assert identity["entering_role"] == "C12"' .github/workflows/api02-accept.yml
          grep -F 'candidate_sha = os.environ["CANDIDATE_SHA256"]' .github/workflows/api02-accept.yml

      - name: '13 Deterministically package exact C13'
        shell: bash
        run: |
          set -euo pipefail
          python3 handoff/API-02/tools/build_api02_c13.py --package-only --root "work/$C13_ROOT" --out out
          unzip -t "out/${C13_ROOT}.zip" >/dev/null
          cat out/candidate_sha256.txt
          cat out/candidate_meta.json

      - name: '14 Prepare exact anchors and builder evidence'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/accept-anchors out/evidence
          cp "${{ steps.inputs.outputs.api01 }}" out/accept-anchors/
          cp "${{ steps.inputs.outputs.data06 }}" out/accept-anchors/
          cp "${{ steps.inputs.outputs.c12 }}" out/accept-anchors/
          cp out/candidate_meta.json out/evidence/
          cp out/candidate_sha256.txt out/evidence/
          cp "work/$C13_ROOT/docs/api/API-02/API02_C12_TO_C13_CORRECTION_REPORT.md" out/evidence/
          cp "work/$C13_ROOT/docs/api/API-02/API02_C12_TO_C13_CORRECTION_INVENTORY.json" out/evidence/
          cp "work/$C13_ROOT/.github/workflows/api02-accept.yml" out/evidence/api02-accept.yml

      - name: '15 Upload canonical api02-candidate'
        uses: actions/upload-artifact@v4
        with:
          name: api02-candidate
          path: |
            out/${{ env.C13_ROOT }}.zip
            out/candidate_sha256.txt
            out/candidate_meta.json
          compression-level: 0
          if-no-files-found: error

      - name: '16 Upload canonical api02-anchors'
        uses: actions/upload-artifact@v4
        with:
          name: api02-anchors
          path: out/accept-anchors/*
          compression-level: 0
          if-no-files-found: error

      - name: '17 Upload C13 builder evidence'
        uses: actions/upload-artifact@v4
        with:
          name: api02-c13-build-evidence-${{ github.run_id }}
          path: out/evidence/*
          compression-level: 0
          if-no-files-found: error
