name: Temporary FRONT-02 regional model patch

on:
  push:
    branches:
      - governance/front02-regional-operating-model-2026-08-25

permissions:
  contents: write

jobs:
  patch-governance:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/front02-regional-operating-model-2026-08-25
          fetch-depth: 0

      - name: Patch FRONT-02 and Master narrowly
        shell: python
        run: |
          from pathlib import Path

          # FRONT-02 parent specification
          front = Path('docs/frontend/FRONT-02-SPECIFICATION.md')
          s = front.read_text(encoding='utf-8')
          old = '''Only approved public organization projections may be displayed. Internal member directories must not be exposed.\n'''
          new = '''Only approved public organization projections may be displayed. Internal member directories must not be exposed.\n\nThe regional operating model is governed by:\n\n`docs/frontend/FRONT-02-REGIONAL-OPERATING-MODEL.md`\n\nRegional party bodies do **not** receive separate local products or independently designed mini-sites. The model is one EPD² platform with organization-scoped public and authenticated views.\n\nA public `/regionen/[slug]` page is a regional hub inside the common WS-01 site and must support, where approved public content exists:\n\n- `Übersicht`;\n- `Aktuelles`;\n- `Termine`;\n- `Initiativen`;\n- approved public `Personen`;\n- public `Wahlen` information;\n- `Dokumente & Transparenz`;\n- `Kontakt`.\n\nThese views use centrally governed content families filtered/projected by authoritative organization scope; they must not create independent local copies of authoritative data.\n\nIn WS-02 and scoped administrative workspaces, the active Bund/Land/Kreis/Orts/body scope must be visible whenever it changes authority or dataset meaning. Users may switch only among scopes they are authorized to access. Scope changes must re-evaluate authorization and invalidate incompatible stale context. No universal cross-regional visibility or universal regional admin may be inferred from workspace access.\n\nRegional binding votes use the same isolated WS-03 Voting Client with one-time purpose- and organization-scoped handoff. No regional voting engine is created, and the WS-02 session is never transferred into WS-03.\n\nFRONT-02 presents and navigates existing governed organization scopes; it does not itself establish, dissolve, merge or territorially redefine party bodies or change their legal/organizational authority.\n'''
          if old not in s:
              raise SystemExit('Expected FRONT-02 Regionen anchor not found')
          if 'FRONT-02-REGIONAL-OPERATING-MODEL.md' not in s:
              s = s.replace(old, new, 1)
          front.write_text(s, encoding='utf-8')

          # Master FIR-UX-004 refinement
          master = Path('docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md')
          m = master.read_text(encoding='utf-8')
          anchor = '''- isolated Voting Client navigation;\n- session and identity boundary visibility.\n\nNavigation must not imply a shared session or shared identity where the\narchitecture prohibits it. Critical functions must not become inaccessible\nthrough hidden or inconsistent navigation.\n'''
          replacement = '''- isolated Voting Client navigation;\n- session and identity boundary visibility.\n\n### Regional and local organization operating model\n\nThe frontend must implement one EPD² platform with organization-scoped views,\nnot separate local products or independently designed mini-sites for Landes-,\nKreis-, Orts- or other governed party bodies.\n\nPublic regional discovery uses `/regionen` and `/regionen/[slug]`. A regional\ndetail page is a hub within the common public site and, where approved public\ncontent exists, must be able to present `Übersicht`, `Aktuelles`, `Termine`,\n`Initiativen`, approved public `Personen`, public `Wahlen`, `Dokumente &\nTransparenz` and `Kontakt`. Only approved public organization projections and\npublic renditions may appear. Internal member directories and protected\noperational data remain excluded.\n\nRegional public content must reuse centrally governed content families and be\nfiltered/projected by authoritative organization scope. The frontend must not\ncreate independent regional copies of authoritative `Aktuelles`, `Termine`,\ninitiative, election, person or document data merely to construct a local page.\n\nAuthenticated member and administrative surfaces must make the active\norganization scope visible whenever it materially changes authority, dataset or\nprocedural meaning. A scope selector may expose only authorized Bund/Land/Kreis/\nOrts/body scopes. Changing scope must re-evaluate authorization and purpose and\nclear or invalidate incompatible stale context. Workspace access does not create\nparty-wide or cross-regional authority, and no universal regional administrator\nmay be introduced.\n\nBinding regional votes use the same isolated Voting Client and the same voting\ntrust boundary as Bund-level votes. The handoff is one-time, purpose-scoped and\norganization-scoped; the member session is not transferred into the Voting\nClient. Frontend scope selection alone never establishes eligibility.\n\nFRONT-02 may present and navigate approved existing organization projections but\nmust not claim that frontend implementation itself establishes, dissolves,\nmerges, reassigns members between, or changes the territorial/legal competence\nof party bodies. Those are governed organization-lifecycle actions owned by the\nrelevant domain rules and authority.\n\nNavigation must not imply a shared session or shared identity where the\narchitecture prohibits it. Critical functions must not become inaccessible\nthrough hidden or inconsistent navigation.\n'''
          if anchor not in m:
              raise SystemExit('Expected FIR-UX-004 anchor not found')
          if '### Regional and local organization operating model' not in m:
              m = m.replace(anchor, replacement, 1)

          record_marker = '## FIR-BASE-001 — Current repository baseline\n'
          record = '''## 1.29 Documentation-only refinement — Regional/local frontend operating model (2026-08-25)\n\n**Round:** documentation/governance refinement only. No runtime, organization, membership, voting or administrative authority is activated by this round.\n\n**Governed decision:** Landes-, Kreis-, Orts- and other regional party bodies use one EPD² platform with organization-scoped public and authenticated views. They do not receive separate independently designed local products, separate identity systems or separate voting engines.\n\nPublic regional hubs use `/regionen` and `/regionen/[slug]` and aggregate only approved public organization projections/renditions from centrally governed content families. Authenticated scope switching is limited to authorized Bund/Land/Kreis/Orts/body scopes and must re-evaluate authorization and invalidate incompatible stale context. Regional binding votes use the same isolated WS-03 Voting Client with one-time purpose- and organization-scoped handoff. Regional administration remains scoped; no universal admin is introduced.\n\n**FIR IDs refined:** `FIR-UX-004` and existing FRONT/organization-scope/voting-isolation obligations. **Status changes:** none. **New FIR IDs:** none.\n\n**Frontend evidence/specification:** `docs/frontend/FRONT-02-REGIONAL-OPERATING-MODEL.md` and the Regionen section of `docs/frontend/FRONT-02-SPECIFICATION.md`.\n\n**Execution state:** unchanged. `API = NEXT`; `FRONT-02 = SPECIFICATION ESTABLISHED / IMPLEMENTATION NOT STARTED`.\n\n'''
          if record_marker not in m:
              raise SystemExit('Master round-record insertion marker not found')
          if '## 1.29 Documentation-only refinement — Regional/local frontend operating model' not in m:
              m = m.replace(record_marker, record + record_marker, 1)
          master.write_text(m, encoding='utf-8')

          # Fail-closed checks
          out_f = front.read_text(encoding='utf-8')
          out_m = master.read_text(encoding='utf-8')
          required = [
              ('FRONT-02', 'FRONT-02-REGIONAL-OPERATING-MODEL.md', out_f),
              ('FRONT-02', 'No regional voting engine is created', out_f),
              ('Master', '### Regional and local organization operating model', out_m),
              ('Master', 'one-time, purpose-scoped and', out_m),
          ]
          for label, phrase, text in required:
              if phrase not in text:
                  raise SystemExit(f'{label} missing required regional rule: {phrase}')

      - name: Commit governed refinement
        shell: bash
        run: |
          git config user.name "epd2-governance-bot"
          git config user.email "governance-bot@users.noreply.github.com"
          git add docs/frontend/FRONT-02-SPECIFICATION.md docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md
          git commit -m "Govern regional organization operating model"
          git push origin HEAD:governance/front02-regional-operating-model-2026-08-25
