name: Ruff pilot roadmap one-shot fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-fix:
    if: github.head_ref == 'fix/ruff-pilot-roadmap'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install locked dev environment
        run: uv sync --all-groups --frozen

      - name: Apply exact repository Ruff formatter
        run: uv run ruff format scripts/check_pilot_roadmap.py

      - name: Remove one-shot workflow and validate diff
        run: |
          set -euo pipefail
          rm .github/workflows/ruff-pilot-roadmap-fix-once.yml
          uv run ruff format --check scripts/check_pilot_roadmap.py
          git diff --check
          test "$(git diff --name-only | sort)" = "scripts/check_pilot_roadmap.py"

      - name: Commit format-only repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format PILOT roadmap guard"
          git push origin HEAD:fix/ruff-pilot-roadmap
