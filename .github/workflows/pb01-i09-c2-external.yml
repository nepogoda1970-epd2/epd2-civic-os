name: PB01-I09 C2 External Acceptance

on:
  push:
    branches: [pilot02-verify]
    paths:
      - 'EPD2_VCRYPTO-PB01-I09_PRODUCTION_PILOT_ROBUSTNESS_CONCURRENCY_AND_SCALE_QUALIFICATION_CANDIDATE_0.1_C2.zip'
      - '.github/workflows/pb01-i09-c2-external.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-i09-c2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Exact Rust/Cargo 1.97.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(node --version)" = 'v24.19.0'
          test "$(rustc --version)" = 'rustc 1.97.1 (8bab26f4f 2026-07-14)'
          test "$(cargo --version)" = 'cargo 1.97.1 (c980f4866 2026-06-30)'
          go version | grep -E 'go1\.(2[3-9]|[3-9][0-9])'

      - name: PostgreSQL 16
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16
          /usr/lib/postgresql/16/bin/postgres --version | grep 'PostgreSQL) 16\.'
          echo 'EPD2_I09_PG_BIN=/usr/lib/postgresql/16/bin' >> "$GITHUB_ENV"

      - name: Exact sealed ZIP integrity
        id: integrity
        run: |
          set -euo pipefail
          ZIP='EPD2_VCRYPTO-PB01-I09_PRODUCTION_PILOT_ROBUSTNESS_CONCURRENCY_AND_SCALE_QUALIFICATION_CANDIDATE_0.1_C2.zip'
          EXPECTED='48fbddb686466208e4972908a3c213aa7021f4178d8bf71cc0b211f4af45ba53'
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf /tmp/pb01-i09-c2 && mkdir -p /tmp/pb01-i09-c2
          unzip -q "$ZIP" -d /tmp/pb01-i09-c2
          mapfile -t ROOTS < <(find /tmp/pb01-i09-c2 -mindepth 1 -maxdepth 1 -type d)
          test "${#ROOTS[@]}" -eq 1
          ROOT="${ROOTS[0]}"
          echo "CANDIDATE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "CANDIDATE_ZIP=$GITHUB_WORKSPACE/$ZIP" >> "$GITHUB_ENV"
          cd "$ROOT"
          sha256sum -c SHA256SUMS.txt

      - name: Locked dependencies
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          npm ci --ignore-scripts

      - name: Full fresh validate:i09
        run: |
          set -o pipefail
          cd "$CANDIDATE_ROOT"
          I09_CANDIDATE_ZIP="$CANDIDATE_ZIP" EPD2_I09_PG_BIN="$EPD2_I09_PG_BIN" npm run validate:i09 2>&1 | tee "$GITHUB_WORKSPACE/i09-c2-external.log"

      - name: Materialize external acceptance result
        if: always()
        run: |
          set -euo pipefail
          RESULT="$CANDIDATE_ROOT/evidence/results/i09/I09_FINAL_VALIDATION.json"
          CONC="$CANDIDATE_ROOT/evidence/results/i09/c1-real-db-concurrency.json"
          MIXED="$CANDIDATE_ROOT/evidence/results/i09/c1-mixed-stage.json"
          PGQ="$CANDIDATE_ROOT/evidence/results/i09/postgresql-qualification.json"
          [ ! -f "$RESULT" ] || cp "$RESULT" PB01_I09_C2_CURRENT_RUN.json
          [ ! -f "$CONC" ] || cp "$CONC" PB01_I09_C2_CONCURRENCY.json
          [ ! -f "$MIXED" ] || cp "$MIXED" PB01_I09_C2_MIXED_STAGE.json
          [ ! -f "$PGQ" ] || cp "$PGQ" PB01_I09_C2_POSTGRESQL_QUALIFICATION.json
          {
            echo '# PB01-I09 C2 Independent External Acceptance'
            echo
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Source commit: $GITHUB_SHA"
            echo '- Candidate SHA256: `48fbddb686466208e4972908a3c213aa7021f4178d8bf71cc0b211f4af45ba53`'
            echo "- Node: \`$(node --version)\`"
            echo "- Go: \`$(go version)\`"
            echo "- Rust: \`$(rustc --version)\`"
            echo "- Cargo: \`$(cargo --version)\`"
            echo "- PostgreSQL: \`$(/usr/lib/postgresql/16/bin/postgres --version)\`"
            if [ -f "$RESULT" ]; then
              echo '- Fresh validate:i09 result: `PASS`'
              echo
              echo '```json'
              cat "$RESULT"
              echo '```'
              echo
              echo '**Verdict: PASS — PB01-I09 C2 exact external acceptance passed.**'
            else
              echo '- Fresh validate:i09 result: `NO PASS RESULT`'
              echo
              echo '**Verdict: NOT VERIFIED — no fresh PASS result was produced.**'
            fi
          } > PB01_I09_C2_VERIFY_RESULT.md

      - name: Publish result without branch race
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PB01_I09_C2_VERIFY_RESULT.md
          for f in PB01_I09_C2_CURRENT_RUN.json PB01_I09_C2_CONCURRENCY.json PB01_I09_C2_MIXED_STAGE.json PB01_I09_C2_POSTGRESQL_QUALIFICATION.json; do
            [ ! -f "$f" ] || git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m 'record PB01-I09 C2 external acceptance result'
          for attempt in 1 2 3 4 5; do
            git fetch origin pilot02-verify
            git rebase origin/pilot02-verify
            if git push origin HEAD:pilot02-verify; then exit 0; fi
            sleep 2
          done
          exit 1
