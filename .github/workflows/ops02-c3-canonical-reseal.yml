name: OPS-02 C3 Canonical Freshness Reseal

on:
  push:
    branches: [handoff/ops]
    paths: ['.github/workflows/ops02-c3-canonical-reseal.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reseal:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      C1: handoff/OPS/incoming/EPD2_OPS02_PREVIEW_OPERATIONS_DEPLOYMENT_OBSERVABILITY_AND_RECOVERY_CANDIDATE_0.1_C1.zip
      ENTERING_C1: 2878c3bbfeb11328adf294a2b59d631b851b43dd
      EPD2_OPS_PGHOST: 127.0.0.1
      EPD2_OPS_PGPORT: '5432'
      EPD2_OPS_PGUSER: postgres
      EPD2_OPS_PGDATABASE: epd2_ops01
      EPD2_PREVIEW_PGHOST: 127.0.0.1
      EPD2_PREVIEW_PGPORT: '5432'
      EPD2_PREVIEW_PGUSER: postgres
      EPD2_PREVIEW_PGDATABASE: epd2_preview
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: handoff/ops

      - name: Pin live canonical main and replay exact C1 implementation delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence c1
          git fetch origin main
          BASE=$(git rev-parse origin/main)
          TREE=$(git rev-parse origin/main^{tree})
          SUBJECT=$(git log -1 --format='%s' origin/main)
          echo "$BASE" | tee evidence/base-main.commit
          echo "$TREE" | tee evidence/base-main.tree
          printf '%s\n' "$SUBJECT" | tee evidence/base-main.subject
          git merge-base --is-ancestor "$ENTERING_C1" "$BASE"
          test "$(sha256sum "$C1" | awk '{print $1}')" = "495ed0bfc5168b20455005d8d53ea15b906ba1367e803c327c2f3ae046262b6b"
          unzip -t "$C1" > evidence/c1-unzip-test.log
          unzip -q "$C1" -d c1
          ROOT=c1
          n=$(find c1 -mindepth 1 -maxdepth 1 -type d | wc -l); f=$(find c1 -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$n" -eq 1 ] && [ "$f" -eq 0 ]; then ROOT=$(find c1 -mindepth 1 -maxdepth 1 -type d | head -n1); fi
          echo "$ROOT" > evidence/c1-root.txt
          git worktree add --detach entering "$ENTERING_C1"
          git worktree add -b tmp/ops02-c3-local work "$BASE"
          ROOT="$ROOT" BASE="$BASE" TREE="$TREE" SUBJECT="$SUBJECT" python - <<'PY' | tee evidence/reconciliation.json
          import os,json,hashlib,shutil,subprocess,re
          from pathlib import Path
          root=Path(os.environ['ROOT']); entering=Path('entering'); work=Path('work')
          base=os.environ['BASE']; tree=os.environ['TREE']; subject=os.environ['SUBJECT']
          def inv(p):
              d={}
              for f in p.rglob('*'):
                  if not f.is_file(): continue
                  rel=f.relative_to(p).as_posix()
                  if rel=='.git' or rel.startswith('.git/'): continue
                  d[rel]=hashlib.sha256(f.read_bytes()).hexdigest()
              return d
          a,b=inv(entering),inv(root)
          added=sorted(set(b)-set(a)); deleted=sorted(set(a)-set(b)); modified=sorted(k for k in set(a)&set(b) if a[k]!=b[k])
          counts={'added':len(added),'modified':len(modified),'deleted':len(deleted)}
          assert counts=={'added':111,'modified':5,'deleted':0}, counts
          advanced=set(subprocess.check_output(['git','diff','--name-only',f'{os.environ.get("ENTERING_C1","2878c3bbfeb11328adf294a2b59d631b851b43dd")}..{base}'],text=True).splitlines())
          delta=set(added)|set(modified)|set(deleted)
          overlap=sorted(delta & advanced)
          if overlap: raise SystemExit('SOURCE_DELTA_CONFLICT: '+', '.join(overlap))
          candidate_only={'CANDIDATE_NOT_ACCEPTED','OPS02_BSI_READINESS_DISPOSITION.json','OPS02_CANDIDATE_SELF_STATE.json','OPS02_FREEZE_MANIFEST.json','OPS02_PREVIEW_READINESS_PREREQUISITES.json'}
          for rel in added+modified:
              if rel in candidate_only: continue
              dst=work/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(root/rel,dst)
          for rel in deleted:
              if rel in candidate_only: continue
              p=work/rel
              if p.exists(): p.unlink()

          pcr=(work/'docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md').read_text()
          api_rows=[ln.strip() for ln in pcr.splitlines() if ln.strip().startswith('| API |')]
          if len(api_rows)!=1: raise SystemExit(f'expected exactly one current API row, got {len(api_rows)}')
          api_row=api_rows[0]
          ops_rows=[ln.strip() for ln in pcr.splitlines() if ln.strip().startswith('| OPS |')]
          if len(ops_rows)!=1: raise SystemExit(f'expected exactly one current OPS row, got {len(ops_rows)}')
          ops_row=ops_rows[0]

          p=work/'docs/ops/OPS-02/OPS02_ENTERING_BASELINE_IDENTITY.json'
          x=json.loads(p.read_text())
          x['entering_main_commit']=base
          x['entering_main_tree']=tree
          x['entering_main_subject']=subject
          x['canonical_advanced_since_assignment']=True
          x['canonical_advance_reconciliation']='C3 canonical-freshness correction: exact C1 implementation delta replayed without overlap onto live canonical main '+base+'. Current PCR is preserved byte-for-byte from that main. API/OPS state is bound to the exact PCR rows below rather than stale narrative text.'
          x['api_state_at_entry']=api_row
          x['ops_state_at_entry']=ops_row
          x['recorded_at']='2026-09-02'
          # Remove stale optional field if present and re-add exact API-04 accepted identity only as immutable predecessor fact.
          x['accepted_api04_candidate_sha256']='8356ba6f1b0e254f9aa215b4873a1e38f44a47fdac2ac859ff62bd95db999337'
          p.write_text(json.dumps(x,indent=2)+'\n')

          r=work/'docs/ops/OPS-02/OPS02_OPS01_RECONCILIATION.json'
          y=json.loads(r.read_text())
          y['binding']='OPS-02 C3 carries accepted OPS-01 C2 and replays the exact OPS-02 C1 implementation delta without overlap onto live canonical main '+base+'.'
          y['recorded_at']='2026-09-02'
          for item in y.get('changed_accepted_files',[]):
              if item.get('path')=='docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md':
                  item['sha256_ops02']=hashlib.sha256((work/item['path']).read_bytes()).hexdigest()
                  item['reason']='C3 preserves the live canonical PCR from main@'+base+' byte-for-byte; OPS-02 does not author this status file before acceptance.'
          r.write_text(json.dumps(y,indent=2,sort_keys=True)+'\n')

          # Remove stale C2 note if inherited; add source-of-truth-safe C3 note.
          for rel in ['docs/ops/OPS-02/OPS02_DEVELOPER_REPORT.md','docs/ops/OPS-02/OPS02_KNOWN_LIMITATIONS.md']:
              q=work/rel; s=q.read_text()
              s=re.sub(r'\n\n## C2 canonical-freshness reconciliation\n\n.*?(?=\n## |\Z)','',s,flags=re.S)
              note='\n\n## C3 canonical-freshness reconciliation\n\nC3 changes no OPS-02 runtime control. The exact C1 implementation delta was replayed without overlap onto canonical main `'+base+'`. Current API and OPS execution state is authoritative only in the embedded canonical `docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md`; this note deliberately does not restate a potentially stale stage status.\n'
              s += note
              q.write_text(s)

          s=work/'scripts/ops02/seal_candidate.py'; t=s.read_text()
          t=t.replace('CANDIDATE_0.1_C1.zip','CANDIDATE_0.1_C3.zip').replace('OPS02_C1_CANDIDATE_IDENTITY.json','OPS02_C3_CANDIDATE_IDENTITY.json').replace('OPS02_C1_PREACCEPTANCE_PROVENANCE.txt','OPS02_C3_PREACCEPTANCE_PROVENANCE.txt')
          s.write_text(t)
          print(json.dumps({'base_main':base,'base_tree':tree,'base_subject':subject,'delta_counts':counts,'overlap':overlap,'api_row':api_row,'ops_row':ops_row,'classification':'NO_SOURCE_DELTA_CONFLICT'},indent=2))
          PY

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6

      - name: Quality, tests and 42-gate preseal verification
        shell: bash
        run: |
          set -euo pipefail
          cd work
          uv sync --all-groups --frozen
          uv run ruff format --check packages/python/epd2-preview tests/ops02 scripts/validation/validate_ops02.py scripts/ops02
          uv run ruff check packages/python/epd2-preview tests/ops02 scripts/validation/validate_ops02.py scripts/ops02
          uv run mypy packages/python/epd2-preview/src scripts/validation scripts/ops02
          uv run mypy packages/python/epd2-preview/tests
          uv run mypy tests/ops02
          uv run pytest -q packages/python/epd2-preview/tests tests/ops02 | tee ../evidence/preseal-tests.log
          uv run python scripts/validation/validate_ops02.py | tee ../evidence/preseal-validator.log

      - name: Commit exact reconciled source and create source bundle
        shell: bash
        run: |
          set -euo pipefail
          cd work
          git config user.name 'EPD2 OPS-02 canonical reseal'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'build(ops02): canonical-freshness C3 reseal'
          SRC=$(git rev-parse HEAD); TREE=$(git rev-parse HEAD^{tree}); BASE=$(cat ../evidence/base-main.commit)
          echo "$SRC" | tee ../evidence/c3-source.commit
          echo "$TREE" | tee ../evidence/c3-source.tree
          test -z "$(git status --porcelain)"
          git bundle create ../evidence/EPD2_OPS02_C3_SOURCE_DELTA.bundle HEAD ^"$BASE"
          git bundle verify ../evidence/EPD2_OPS02_C3_SOURCE_DELTA.bundle | tee ../evidence/source-bundle-verify.log
          sha256sum ../evidence/EPD2_OPS02_C3_SOURCE_DELTA.bundle | tee ../evidence/EPD2_OPS02_C3_SOURCE_DELTA.bundle.sha256

      - name: Native C3 seal
        shell: bash
        run: |
          set -euo pipefail
          cd work
          uv run python scripts/ops02/seal_candidate.py --output dist | tee ../evidence/seal.log
          C=dist/EPD2_OPS02_PREVIEW_OPERATIONS_DEPLOYMENT_OBSERVABILITY_AND_RECOVERY_CANDIDATE_0.1_C3.zip
          sha256sum "$C" | tee ../evidence/c3.sha256
          stat -c '%s' "$C" | tee ../evidence/c3.size
          unzip -t "$C" > ../evidence/c3-unzip-test.log

      - name: Clean extracted exact-C3 verification and metadata consistency
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted-c3
          unzip -q work/dist/EPD2_OPS02_PREVIEW_OPERATIONS_DEPLOYMENT_OBSERVABILITY_AND_RECOVERY_CANDIDATE_0.1_C3.zip -d extracted-c3
          BASE=$(cat evidence/base-main.commit); TREE=$(cat evidence/base-main.tree); SUBJECT=$(cat evidence/base-main.subject)
          BASE="$BASE" TREE="$TREE" SUBJECT="$SUBJECT" python - <<'PY' | tee evidence/metadata-consistency.json
          import os,json
          from pathlib import Path
          r=Path('extracted-c3')
          x=json.loads((r/'docs/ops/OPS-02/OPS02_ENTERING_BASELINE_IDENTITY.json').read_text())
          pcr=(r/'docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md').read_text()
          api=[ln.strip() for ln in pcr.splitlines() if ln.strip().startswith('| API |')]
          ops=[ln.strip() for ln in pcr.splitlines() if ln.strip().startswith('| OPS |')]
          checks={
            'commit_match':x.get('entering_main_commit')==os.environ['BASE'],
            'tree_match':x.get('entering_main_tree')==os.environ['TREE'],
            'subject_match':x.get('entering_main_subject')==os.environ['SUBJECT'],
            'api_row_match':len(api)==1 and x.get('api_state_at_entry')==api[0],
            'ops_row_match':len(ops)==1 and x.get('ops_state_at_entry')==ops[0],
          }
          print(json.dumps({'checks':checks,'identity':x,'api_row':api,'ops_row':ops},indent=2))
          if not all(checks.values()): raise SystemExit('metadata consistency failure')
          PY
          cd extracted-c3
          uv sync --all-groups --frozen
          uv run pytest -q packages/python/epd2-preview/tests tests/ops02 | tee ../evidence/extracted-tests.log
          uv run python scripts/validation/validate_ops02.py | tee ../evidence/extracted-validator.log
          cp validation/ops02/ops02_acceptance_result.json ../evidence/extracted-acceptance-result.json
          cp OPS02_BSI_READINESS_DISPOSITION.json ../evidence/c3-bsi.json
          cp OPS02_PREVIEW_READINESS_PREREQUISITES.json ../evidence/c3-preview.json
          cp OPS02_CANDIDATE_SELF_STATE.json ../evidence/c3-self-state.json
          cp OPS02_FREEZE_MANIFEST.json ../evidence/c3-freeze.json

      - name: Publish exact C3 to OPS handoff
        shell: bash
        run: |
          set -euo pipefail
          cp work/dist/EPD2_OPS02_PREVIEW_OPERATIONS_DEPLOYMENT_OBSERVABILITY_AND_RECOVERY_CANDIDATE_0.1_C3.zip handoff/OPS/incoming/
          cp work/dist/EPD2_OPS02_PREVIEW_OPERATIONS_DEPLOYMENT_OBSERVABILITY_AND_RECOVERY_CANDIDATE_0.1_C3.zip.sha256 handoff/OPS/incoming/
          cp work/dist/OPS02_C3_CANDIDATE_IDENTITY.json handoff/OPS/incoming/
          cp work/dist/OPS02_C3_PREACCEPTANCE_PROVENANCE.txt handoff/OPS/incoming/
          cp evidence/EPD2_OPS02_C3_SOURCE_DELTA.bundle handoff/OPS/incoming/
          cp evidence/EPD2_OPS02_C3_SOURCE_DELTA.bundle.sha256 handoff/OPS/incoming/
          git config user.name 'EPD2 OPS-02 canonical reseal'
          git config user.email 'actions@users.noreply.github.com'
          git add handoff/OPS/incoming/EPD2_OPS02_PREVIEW_OPERATIONS_DEPLOYMENT_OBSERVABILITY_AND_RECOVERY_CANDIDATE_0.1_C3.zip handoff/OPS/incoming/EPD2_OPS02_PREVIEW_OPERATIONS_DEPLOYMENT_OBSERVABILITY_AND_RECOVERY_CANDIDATE_0.1_C3.zip.sha256 handoff/OPS/incoming/OPS02_C3_CANDIDATE_IDENTITY.json handoff/OPS/incoming/OPS02_C3_PREACCEPTANCE_PROVENANCE.txt handoff/OPS/incoming/EPD2_OPS02_C3_SOURCE_DELTA.bundle handoff/OPS/incoming/EPD2_OPS02_C3_SOURCE_DELTA.bundle.sha256
          git commit -m 'handoff(ops02): publish canonical-freshness C3 candidate'
          git push origin HEAD:handoff/ops
          git rev-parse HEAD | tee evidence/handoff-publish.commit

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ops02-c3-canonical-reseal-${{ github.run_id }}
          path: |
            evidence/
            work/dist/
          if-no-files-found: error
