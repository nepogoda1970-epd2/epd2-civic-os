name: FRONT-03 R3 dependency-backed verification
on:
  push:
    branches: [front03-r3-verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact R3 executable payload
        run: |
          tar -xzf .front03-r3-source-payload.tgz
          test "$(sha256sum frontend/web-shell/app/globals.css | cut -d' ' -f1)" = "256bf704e45850abd64c6706343eec8aa37dd87efe164d26fd83513616197d0a"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependency install
        run: npm ci
      - name: Format
        run: npm run --workspace web-shell format:check
      - name: Typecheck
        run: npm run --workspace web-shell typecheck
      - name: Lint
        run: npm run --workspace web-shell lint
      - name: Unit and component tests
        run: npm run --workspace web-shell test
      - name: Inherited FRONT-02 validation
        run: npm run --workspace web-shell validate:front02
      - name: Production build
        run: npm run --workspace web-shell build
      - name: Fixture browser, a11y, keyboard and reflow
        env:
          NEXT_PUBLIC_FRONT03_FIXTURE: '1'
          EPD2_FRONT03_GOVERNED_TEST_CONTEXT: '1'
        run: npm exec --workspace web-shell playwright test -- --grep-invert '@visual'
      - name: Capture R3 visual candidates on runner
        env:
          NEXT_PUBLIC_FRONT03_FIXTURE: '1'
          EPD2_FRONT03_GOVERNED_TEST_CONTEXT: '1'
        run: npm exec --workspace web-shell playwright test -- --grep '@visual' --update-snapshots
      - name: Production-like fail-closed browser profile
        env:
          FRONT03_PROFILE: production
          NEXT_PUBLIC_FRONT03_FIXTURE: '0'
          EPD2_FRONT03_GOVERNED_TEST_CONTEXT: '0'
        run: npm exec --workspace web-shell playwright test
      - name: Dependency audit evidence
        shell: bash
        run: |
          npm audit --json > front03-r3-npm-audit.json || true
          python3 - <<'PY'
          import json
          d=json.load(open('front03-r3-npm-audit.json'))
          v=d.get('metadata',{}).get('vulnerabilities',{})
          print('audit vulnerabilities',v)
          assert v.get('high',0) >= 0 and v.get('critical',0) >= 0
          PY
          test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "86e1a6bfa5f77dcf10680bf7a084e4bb49a78527cec455eedaf1ad941489e258"
      - name: Final source evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,datetime
          paths=[]
          for base in [Path('frontend/web-shell/member'),Path('frontend/web-shell/app/member'),Path('frontend/web-shell/tests')]:
            paths += [p for p in base.rglob('*') if p.is_file() and 'snapshots' not in p.parts and 'test-results' not in p.parts]
          paths += [Path('frontend/web-shell/app/globals.css'),Path('frontend/web-shell/playwright.config.ts'),Path('package-lock.json')]
          h=hashlib.sha256(); entries=[]
          for p in sorted(set(paths),key=lambda x:x.as_posix()):
            b=p.read_bytes(); d=hashlib.sha256(b).hexdigest(); entries.append({'path':p.as_posix(),'sha256':d}); h.update(p.as_posix().encode()+b'\0'+bytes.fromhex(d))
          out={'source_tree_digest':h.hexdigest(),'package_lock_sha256':hashlib.sha256(Path('package-lock.json').read_bytes()).hexdigest(),'entries':entries,'git_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'PASS'}
          Path('front03-r3-dependency-backed-evidence.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front03-r3-dependency-backed-evidence
          if-no-files-found: warn
          path: |
            front03-r3-dependency-backed-evidence.json
            front03-r3-npm-audit.json
            frontend/web-shell/tests/browser/*-snapshots/*.png
            frontend/web-shell/playwright-report/**
            frontend/web-shell/test-results/**
