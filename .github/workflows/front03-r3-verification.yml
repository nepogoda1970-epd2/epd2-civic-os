name: FRONT-03 R3 formatter normalization
on:
  push:
    branches: [front03-r3-verification]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Normalize new R3 verification files
        run: |
          npm exec --workspace web-shell prettier -- --write tests/browser/front03.browser.spec.ts tests/browser/front03.production.browser.spec.ts tests/front03.render.test.tsx
          git config user.name "epd2-governed-ci"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/web-shell/tests/browser/front03.browser.spec.ts frontend/web-shell/tests/browser/front03.production.browser.spec.ts frontend/web-shell/tests/front03.render.test.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(front03): format R3 verification tests"
          git push origin HEAD:front03-r3-verification
