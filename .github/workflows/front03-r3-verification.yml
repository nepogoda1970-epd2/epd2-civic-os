name: FRONT-03 R3 dependency-backed verification
on:
  push:
    branches: [front03-r3-verification]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependency install
        run: npm ci
      - name: Normalize R3 formatting once
        shell: bash
        run: |
          npm run --workspace web-shell format
          if ! git diff --quiet -- frontend/web-shell/member frontend/web-shell/app/member frontend/web-shell/tests/front03.test.ts; then
            git config user.name "epd2-governed-ci"
            git config user.email "actions@users.noreply.github.com"
            git add frontend/web-shell/member frontend/web-shell/app/member frontend/web-shell/tests/front03.test.ts
            git commit -m "style(front03): normalize R3 source with governed formatter"
            git push origin HEAD:front03-r3-verification
            echo "R3 source normalized; fresh run required on committed bytes."
            exit 78
          fi
      - name: Format check
        run: npm run --workspace web-shell format:check
      - name: Typecheck
        run: npm run --workspace web-shell typecheck
      - name: Lint
        run: npm run --workspace web-shell lint
      - name: Unit and component tests
        run: npm run --workspace web-shell test
      - name: Inherited FRONT-02 validation
        run: npm run --workspace web-shell validate:front02
      - name: Production build
        run: npm run --workspace web-shell build
      - name: Dependency audit evidence
        if: always()
        shell: bash
        run: |
          npm audit --json > front03-r3-npm-audit.json || true
          python3 - <<'PY'
          import json
          d=json.load(open('front03-r3-npm-audit.json'))
          print('audit vulnerabilities', d.get('metadata',{}).get('vulnerabilities',{}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front03-r3-dependency-backed-evidence
          if-no-files-found: warn
          path: front03-r3-npm-audit.json
