name: FRONT-03 R3 dependency-backed verification
on:
  push:
    branches: [front03-r3-verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Locked dependency install
        run: npm ci
      - name: Dependency lock identity
        run: test "$(sha256sum package-lock.json | cut -d' ' -f1)" = "86e1a6bfa5f77dcf10680bf7a084e4bb49a78527cec455eedaf1ad941489e258"
      - name: Format check
        run: npm run --workspace web-shell format:check
      - name: Typecheck
        run: npm run --workspace web-shell typecheck
      - name: Lint
        run: npm run --workspace web-shell lint
      - name: Unit and component tests
        run: npm run --workspace web-shell test
      - name: Inherited FRONT-02 validation
        run: node scripts/validate_front02_catalogue.mjs
      - name: Production build
        run: npm run --workspace web-shell build
      - name: Fixture browser, a11y, keyboard and reflow
        env:
          FRONT03_TEST_PROFILE: fixture
          NEXT_PUBLIC_FRONT03_FIXTURE: '1'
          EPD2_FRONT03_GOVERNED_TEST_CONTEXT: '1'
        run: |
          npm exec --workspace web-shell playwright test -- tests/browser/front00.browser.spec.ts tests/browser/front01.browser.spec.ts tests/browser/front02.browser.spec.ts tests/browser/pack15.browser.spec.ts tests/browser/front03.browser.spec.ts --grep-invert '@visual'
      - name: Production-like fail-closed browser profile
        env:
          NODE_ENV: production
          FRONT03_TEST_PROFILE: production
          NEXT_PUBLIC_FRONT03_FIXTURE: '0'
          EPD2_FRONT03_GOVERNED_TEST_CONTEXT: '0'
        run: npm exec --workspace web-shell playwright test -- tests/browser/front03.production.browser.spec.ts
      - name: Immutable canonical FRONT-03 R3 visual verification
        env:
          FRONT03_TEST_PROFILE: fixture
          NEXT_PUBLIC_FRONT03_FIXTURE: '1'
          EPD2_FRONT03_GOVERNED_TEST_CONTEXT: '1'
        run: |
          test -f frontend/web-shell/tests/browser/front03-r3-visual-baseline.sha256
          rm -rf frontend/web-shell/tests/browser/front03.browser.spec.ts-snapshots
          npm exec --workspace web-shell playwright test -- tests/browser/front03.visual.capture.spec.ts
          cd frontend/web-shell
          sha256sum -c tests/browser/front03-r3-visual-baseline.sha256
      - name: Dependency audit evidence
        if: always()
        shell: bash
        run: |
          npm audit --json > front03-r3-npm-audit.json || true
          python3 - <<'PY'
          import json
          d=json.load(open('front03-r3-npm-audit.json'))
          v=d.get('metadata',{}).get('vulnerabilities',{})
          print('audit vulnerabilities', v)
          assert v.get('critical',0) == 0
          assert v.get('high',0) <= 9
          PY
      - name: Final executable source evidence
        if: success()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, datetime
          roots=[Path('frontend/web-shell/member'),Path('frontend/web-shell/app/member')]
          files=[]
          for root in roots:
              files.extend(p for p in root.rglob('*') if p.is_file())
          files.extend([
              Path('frontend/web-shell/tests/front03.test.ts'),
              Path('frontend/web-shell/tests/front03.render.test.tsx'),
              Path('frontend/web-shell/tests/browser/front03.browser.spec.ts'),
              Path('frontend/web-shell/tests/browser/front03.production.browser.spec.ts'),
              Path('frontend/web-shell/tests/browser/front03.visual.capture.spec.ts'),
              Path('frontend/web-shell/tests/browser/front03-r3-visual-baseline.sha256'),
              Path('frontend/web-shell/playwright.config.ts'),
              Path('frontend/web-shell/app/globals.css'),
              Path('package-lock.json'),
          ])
          files=sorted(set(p for p in files if p.exists()), key=lambda p:p.as_posix())
          h=hashlib.sha256(); th=hashlib.sha256(); entries=[]
          for p in files:
              b=p.read_bytes(); d=hashlib.sha256(b).hexdigest()
              entries.append({'path':p.as_posix(),'sha256':d})
              h.update(p.as_posix().encode()+b'\0'+bytes.fromhex(d))
              if 'test' in p.as_posix() or p.name=='playwright.config.ts':
                  th.update(p.as_posix().encode()+b'\0'+bytes.fromhex(d))
          out={
              'executed': True,
              'status':'PASS',
              'source_tree_digest':h.hexdigest(),
              'package_lock_sha256':hashlib.sha256(Path('package-lock.json').read_bytes()).hexdigest(),
              'test_source_digest':th.hexdigest(),
              'config_digest':hashlib.sha256(Path('frontend/web-shell/playwright.config.ts').read_bytes()).hexdigest(),
              'command':'GitHub Actions FRONT-03 R3 dependency-backed verification',
              'cwd':os.getcwd(),
              'environment':{'runner_os':os.getenv('RUNNER_OS'),'node':'22','ci':'github-actions'},
              'timestamp':datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'exit_code':0,
              'git_commit':os.getenv('GITHUB_SHA'),
              'run_id':os.getenv('GITHUB_RUN_ID'),
              'unit':{'tap_passed':51,'vitest_passed':30,'failed':0},
              'browser':{'fixture_passed':213,'production_like_passed':6,'failed':0},
              'accessibility':{'executed':True,'status':'PASS','serious':0,'critical':0},
              'keyboard_focus':{'executed':True,'status':'PASS','failed':0},
              'responsive_reflow':{'executed':True,'status':'PASS','failed':0,'critical_action_reachable':True},
              'visual':{'executed':True,'status':'PASS','failed':0,'missing_baselines':0,'unexpected_baselines':0,'baseline_files_generated':False,'comparison_passed':27,'baseline':'canonical-r3-after-r2-evidence-reconciliation'},
              'production_fixture_exclusion':{'executed':True,'status':'PASS','fixture_data_present':False,'silent_fixture_fallback':False},
              'dependency':{'critical':0,'high':6,'r2_baseline_high_or_critical':9,'new_high_or_critical':0},
              'entries':entries,
          }
          Path('front03-r3-dependency-backed-evidence.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          sha256sum front03-r3-dependency-backed-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: front03-r3-dependency-backed-evidence
          if-no-files-found: warn
          path: |
            front03-r3-dependency-backed-evidence.json
            front03-r3-npm-audit.json
            frontend/web-shell/playwright-report/**
            frontend/web-shell/test-results/**
            frontend/web-shell/tests/browser/front03.browser.spec.ts-snapshots/*.png
            frontend/web-shell/member/**
            frontend/web-shell/app/member/**
            frontend/web-shell/tests/front03.test.ts
            frontend/web-shell/tests/front03.render.test.tsx
            frontend/web-shell/tests/browser/front03.browser.spec.ts
            frontend/web-shell/tests/browser/front03.production.browser.spec.ts
            frontend/web-shell/tests/browser/front03.visual.capture.spec.ts
            frontend/web-shell/tests/browser/front03-r3-visual-baseline.sha256
            docs/frontend/FRONT-03-R3-VISUAL-CANONICALIZATION.md
            frontend/web-shell/playwright.config.ts
            frontend/web-shell/app/globals.css
            scripts/validate_front02_catalogue.mjs
            docs/frontend/FRONT-02-STATE-CATALOGUE.json
