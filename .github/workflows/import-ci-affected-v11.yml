name: CI Affected Graph v1.1 exact bundle import

on:
  push:
    branches:
      - feature/ci-affected-graph-v1

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout import carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact developer bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .ci-import/feature-ci-affected-graph-v1.1.bundle.b64.part* > /tmp/feature.bundle.b64
          base64 -d /tmp/feature.bundle.b64 > /tmp/feature.bundle
          expected_bundle_sha="de385f90242d93f99236f8137a9434a9e323c1cc1db4942c1ce250605aee7592"
          actual_bundle_sha="$(sha256sum /tmp/feature.bundle | awk '{print $1}')"
          test "$actual_bundle_sha" = "$expected_bundle_sha"
          git bundle verify /tmp/feature.bundle
          git fetch /tmp/feature.bundle refs/heads/feature/ci-affected-graph-v1:refs/bundle/ci-affected-v11
          target="2900648113f089b9d16974beb3d21dcc33f5cf0e"
          base="7544f5dc3bf40304ae81b4d8ef476cc8ecb60ec5"
          v1="9ad0f318ffea2378335509a2fea08db294aceae6"
          test "$(git rev-parse refs/bundle/ci-affected-v11)" = "$target"
          test "$(git rev-parse "${target}^")" = "$v1"
          test "$(git rev-parse "${target}^^")" = "$base"
          test "$(git rev-list --count "${base}..${target}")" = "2"
          echo "CI_AFFECTED_GRAPH_V11_BUNDLE_VERIFY:PASS:${target}:${actual_bundle_sha}"

      - name: Publish exact bundle head to feature branch
        shell: bash
        run: |
          set -euo pipefail
          target="2900648113f089b9d16974beb3d21dcc33f5cf0e"
          git push --force origin "${target}:refs/heads/feature/ci-affected-graph-v1"
