name: INFRA-04 C2 formatting diagnostic
on:
  push:
    branches: ["diagnostic/infra04-c2-formatters-20260904"]
    paths: [".github/workflows/infra04-c2-format-diagnostic.yml"]
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Structurally format only the C2-owned reconciliation source
        shell: bash
        run: |
          set -euo pipefail
          TARGET=handoff/INFRA/infra04-c2-overlay/scripts/infra04/reconcile_inherited_acceptance_baseline.py
          uv sync --all-groups --frozen
          uv run ruff format "$TARGET"
          TARGET="$TARGET" python3 - <<'PY'
          import ast
          import json
          import os
          import re
          from pathlib import Path

          path = Path(os.environ["TARGET"])
          text = path.read_text(encoding="utf-8")

          # Long path+digest entries: preserve both string values while moving
          # the digest to a continuation line.
          digest_line = re.compile(r'^(\s*)("[^"]+":) "([0-9a-f]{64})",$', re.MULTILINE)
          text = digest_line.sub(
              lambda m: f'{m.group(1)}{m.group(2)} (\n{m.group(1)}    "{m.group(3)}"\n{m.group(1)}),',
              text,
          )

          # A few exact replacement strings intentionally contain escaped newlines
          # on one physical source line. Split their *values* into adjacent Python
          # literals; concatenation is exact, so reconciliation behavior is unchanged.
          tree = ast.parse(text)
          lines = text.splitlines(keepends=True)
          offsets = [0]
          for line in lines:
              offsets.append(offsets[-1] + len(line))
          replacements = []
          for node in ast.walk(tree):
              if not isinstance(node, ast.Constant) or not isinstance(node.value, str):
                  continue
              if node.lineno != node.end_lineno:
                  continue
              start = offsets[node.lineno - 1] + node.col_offset
              end = offsets[node.end_lineno - 1] + node.end_col_offset
              segment = text[start:end]
              if len(segment) <= 88:
                  continue
              value = node.value
              chunks = [value[i:i + 54] for i in range(0, len(value), 54)]
              indent = " " * node.col_offset
              child = " " * (node.col_offset + 4)
              replacement = "(\n" + "\n".join(child + json.dumps(c) for c in chunks) + "\n" + indent + ")"
              replacements.append((start, end, replacement))
          for start, end, replacement in sorted(replacements, reverse=True):
              text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
          uv run ruff format "$TARGET"
          mkdir -p /tmp/infra04-post-reconcile
          cp "$TARGET" /tmp/infra04-post-reconcile/reconcile_inherited_acceptance_baseline.py
          uv run ruff format --check "$TARGET"
          uv run ruff check "$TARGET"
      - name: Materialize exact canonical C2 with formatted owned source
        shell: bash
        env:
          CANONICAL_SHA: f4066a5a13949bdfbd53c19890e1f4b0fee5d6b0
          INFRA02_PATH: handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip
          INFRA02_SHA256: d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
        run: |
          set -euo pipefail
          SOURCE_ROOT="$GITHUB_WORKSPACE"
          CANDIDATE_ROOT="$RUNNER_TEMP/infra04-c2-post-reconcile"
          git fetch --no-tags origin candidate/infra04-c2-canonical handoff/infra main
          test "$(git rev-parse origin/candidate/infra04-c2-canonical)" = "$CANONICAL_SHA"
          git show "origin/handoff/infra:$INFRA02_PATH" > /tmp/infra02.zip
          test "$(sha256sum /tmp/infra02.zip | awk '{print $1}')" = "$INFRA02_SHA256"
          git worktree add --detach "$CANDIDATE_ROOT" "$CANONICAL_SHA"
          cp /tmp/infra04-post-reconcile/reconcile_inherited_acceptance_baseline.py \
            "$CANDIDATE_ROOT/handoff/INFRA/infra04-c2-overlay/scripts/infra04/reconcile_inherited_acceptance_baseline.py"
          python3 "$CANDIDATE_ROOT/handoff/INFRA/infra04-c2-transport/apply.py" \
            --root "$CANDIDATE_ROOT" --predecessor /tmp/infra02.zip
          cp -a "$CANDIDATE_ROOT/handoff/INFRA/infra04-c2-overlay/." "$CANDIDATE_ROOT"/
          rm -rf "$CANDIDATE_ROOT/handoff/INFRA/infra04-c2-transport" "$CANDIDATE_ROOT/handoff/INFRA/infra04-c2-overlay"
          printf '%s\n' "$CANDIDATE_ROOT" > /tmp/infra04-post-reconcile/candidate-root.txt
      - name: Install candidate dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/infra04-post-reconcile/candidate-root.txt)
          cd "$ROOT"
          uv sync --all-groups --frozen
          npm ci
          npx playwright install --with-deps chromium
      - name: Execute exact reconciliation and changed-file lineage
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/infra04-post-reconcile/candidate-root.txt)
          cd "$ROOT"
          git rm -f --ignore-unmatch SHA256SUMS.txt ACCEPTANCE/FREEZE-INVENTORY.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          uv run python -m scripts.infra04.build_changed_manifest
          echo INFRA04_POST_RECONCILIATION:PASS
      - name: Capture post-reconciliation static failures and formatter delta
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat /tmp/infra04-post-reconcile/candidate-root.txt)
          cd "$ROOT"
          set +e
          uv run ruff format --check --diff . > /tmp/infra04-post-reconcile/post-ruff-format.diff 2>&1
          echo "$?" > /tmp/infra04-post-reconcile/post-ruff-format.rc
          uv run ruff check . > /tmp/infra04-post-reconcile/post-ruff-lint.txt 2>&1
          echo "$?" > /tmp/infra04-post-reconcile/post-ruff-lint.rc
          npx prettier --check . > /tmp/infra04-post-reconcile/post-prettier-check.txt 2>&1
          echo "$?" > /tmp/infra04-post-reconcile/post-prettier.rc
          set -e
          git status --porcelain > /tmp/infra04-post-reconcile/post-reconcile-status.txt
          cp docs/infra/INFRA-04/INFRA04_CHANGED_FILE_MANIFEST.json /tmp/infra04-post-reconcile/changed-manifest.json
          uv run ruff format .
          uv run ruff check --fix . || true
          npx prettier --write . >/dev/null
          git diff --name-only > /tmp/infra04-post-reconcile/post-formatter-changed-paths.txt
          git diff --stat > /tmp/infra04-post-reconcile/post-formatter-diff-stat.txt
          git diff -- . ':(exclude)package-lock.json' ':(exclude)uv.lock' > /tmp/infra04-post-reconcile/post-formatter.diff
      - name: Persist exact evidence and formatted owned source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          OUT=diagnostics/infra04-c2-post-reconcile
          rm -rf "$OUT"
          mkdir -p "$OUT"
          cp /tmp/infra04-post-reconcile/* "$OUT"/ 2>/dev/null || true
          git config user.name 'EPD2 INFRA04 diagnostic'
          git config user.email 'infra04-diagnostic@invalid.local'
          git add "$OUT"
          if ! git diff --cached --quiet; then
            git commit -m 'diagnostic(infra04): persist post-reconciliation static evidence'
            git push origin HEAD:diagnostic/infra04-c2-formatters-20260904
          fi
