name: INFRA-04 C2 Final Rebind Registered
on:
  push:
    branches: ["diagnostic/infra04-c2-static-repair-v7"]
permissions:
  contents: read
jobs:
  rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Reconstruct exact C2 on live main and schema-v2 rebind
        shell: bash
        run: |
          set -euo pipefail
          cp -a handoff/INFRA/infra04-c2-transport "$RUNNER_TEMP/transport"
          cp -a handoff/INFRA/infra04-c2-overlay "$RUNNER_TEMP/overlay"
          cp handoff/INFRA/infra04-c2-final-rebind-v4.py "$RUNNER_TEMP/infra04-c2-final-rebind-v4.py"
          cp handoff/INFRA/test_infra04_final_rebind_schema_v2.py "$RUNNER_TEMP/test_infra04_final_rebind_schema_v2.py"
          git fetch --no-tags origin main handoff/infra
          git show origin/handoff/infra:handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip > "$RUNNER_TEMP/infra02.zip"
          test "$(sha256sum "$RUNNER_TEMP/infra02.zip" | awk '{print $1}')" = d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
          git reset --hard origin/main
          python3 "$RUNNER_TEMP/transport/apply.py" --root "$GITHUB_WORKSPACE" --predecessor "$RUNNER_TEMP/infra02.zip"
          cp -a "$RUNNER_TEMP/overlay/." "$GITHUB_WORKSPACE"/
          rm -f SHA256SUMS.txt ACCEPTANCE/FREEZE-INVENTORY.json
          python3 "$RUNNER_TEMP/infra04-c2-final-rebind-v4.py" | tee "$RUNNER_TEMP/rebind-values.txt"
          LIVE_MAIN="$(git rev-parse origin/main)"
          echo "LIVE_MAIN=$LIVE_MAIN" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with: {enable-cache: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "22"}
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-groups --frozen
          npm ci --no-audit --no-fund
      - name: Schema-v2 final-rebind regression tests
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -q "$RUNNER_TEMP/test_infra04_final_rebind_schema_v2.py"
      - name: Candidate-only normalize inherited OPS-03 additions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ops03-original/.github/workflows" "$RUNNER_TEMP/ops03-original/scripts/infra02" "$RUNNER_TEMP/ops03-original/scripts"
          cp scripts/ops03_c2_authoritative_runner.py scripts/ops03_c3_patch_from_c2.py "$RUNNER_TEMP/ops03-original/scripts/"
          cp .github/workflows/ops03-c3-authoritative-build.yml .github/workflows/ops03-c3-final.yml .github/workflows/ops03-c3-v2.yml "$RUNNER_TEMP/ops03-original/.github/workflows/"
          cp scripts/infra02/supply_chain_policy.json "$RUNNER_TEMP/ops03-original/scripts/infra02/"
          uv run ruff format scripts/ops03_c2_authoritative_runner.py scripts/ops03_c3_patch_from_c2.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/ops03_c2_authoritative_runner.py')
          text = p.read_text()
          if text.count('import json\n') != 1:
              raise SystemExit('OPS03_EXPECTED_SINGLE_UNUSED_JSON_IMPORT_NOT_FOUND')
          p.write_text(text.replace('import json\n', '', 1))
          PY
          python3 - <<'PY'
          import ast, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])/'ops03-original'/'scripts'
          def normalized_original(name: str) -> str:
              tree = ast.parse((temp/name).read_text())
              if name == 'ops03_c2_authoritative_runner.py':
                  removed = 0
                  body = []
                  for node in tree.body:
                      if isinstance(node, ast.Import) and len(node.names) == 1 and node.names[0].name == 'json' and node.names[0].asname is None:
                          removed += 1
                          continue
                      body.append(node)
                  if removed != 1:
                      raise SystemExit(f'OPS03_JSON_IMPORT_NORMALIZATION_COUNT:{removed}')
                  tree.body = body
              return ast.dump(tree, include_attributes=False)
          for name in ['ops03_c2_authoritative_runner.py','ops03_c3_patch_from_c2.py']:
              after = ast.dump(ast.parse((Path('scripts')/name).read_text()), include_attributes=False)
              if normalized_original(name) != after:
                  raise SystemExit(f'OPS03_NORMALIZED_AST_DRIFT:{name}')
          print('OPS03_NORMALIZED_AST_EQUIVALENCE:PASS:2')
          PY
          npx prettier --write .github/workflows/ops03-c3-authoritative-build.yml .github/workflows/ops03-c3-final.yml .github/workflows/ops03-c3-v2.yml scripts/infra02/supply_chain_policy.json
          uv run python - <<'PY'
          import json, os, yaml
          from pathlib import Path
          root = Path('.')
          before = Path(os.environ['RUNNER_TEMP'])/'ops03-original'
          for name in ['ops03-c3-authoritative-build.yml','ops03-c3-final.yml','ops03-c3-v2.yml']:
              a = yaml.safe_load((before/'.github/workflows'/name).read_text())
              b = yaml.safe_load((root/'.github/workflows'/name).read_text())
              if a != b:
                  raise SystemExit(f'OPS03_YAML_SEMANTIC_DRIFT:{name}')
          a = json.loads((before/'scripts/infra02/supply_chain_policy.json').read_text())
          b = json.loads((root/'scripts/infra02/supply_chain_policy.json').read_text())
          if a != b:
              raise SystemExit('INFRA02_POLICY_JSON_SEMANTIC_DRIFT')
          print('OPS03_PRETTIER_SEMANTIC_EQUIVALENCE:PASS:4')
          PY
          git diff --check -- scripts/ops03_c2_authoritative_runner.py scripts/ops03_c3_patch_from_c2.py .github/workflows/ops03-c3-authoritative-build.yml .github/workflows/ops03-c3-final.yml .github/workflows/ops03-c3-v2.yml scripts/infra02/supply_chain_policy.json
      - name: Strict verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$LIVE_MAIN"
          uv run ruff format --check .
          uv run ruff check .
          make typecheck
          npm run format:check
          uv run pytest -q -p no:randomly tests/repository/test_infra01_harness_units.py tests/repository/test_infra01_mutation_suite.py tests/repository/test_infra02_units.py tests/repository/test_infra02_mutation_suite.py tests/repository/test_infra03_units.py tests/repository/test_infra03_mutation_suite.py
          uv run python - <<'PY'
          from pathlib import Path
          from scripts.infra02.ci_policy import check_ci_policy
          findings=check_ci_policy(Path('.'))
          print('INFRA02_CI_POLICY_FINDINGS',len(findings))
          for f in findings: print(f)
          raise SystemExit(1 if findings else 0)
          PY
          uv run python -m scripts.acceptance verify-reconciliation --root . --target-pcr docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          uv run pytest -q -p no:randomly tests/repository/test_infra04_units.py tests/repository/test_infra04_mutation_suite.py
          echo INFRA04_FINAL_REBIND_VERIFY:PASS
      - name: Scan stale bindings and export exact verified bytes
        shell: bash
        run: |
          set -euo pipefail
          FILES=(docs/infra/INFRA-01/INFRA01_GOVERNANCE_RECONCILIATION.json docs/infra/INFRA-04/INFRA-04-KNOWN-LIMITATIONS.md docs/infra/INFRA-04/INFRA-04-STAGE-CONTRACT.md docs/infra/INFRA-04/INFRA04_DEVELOPER_REPORT.md validation/infra04/verification-summary.json validation/infra04/main-binding.json validation/infra04/verification-transcript.txt scripts/infra02/supply_chain_policy.json scripts/ops03_c2_authoritative_runner.py scripts/ops03_c3_patch_from_c2.py .github/workflows/ops03-c3-authoritative-build.yml .github/workflows/ops03-c3-final.yml .github/workflows/ops03-c3-v2.yml .github/workflows/infra04-c2-authoritative.yml)
          for stale in 81c2d0db987536718b30242eeb168aecc21877ca 5460ccd9ec5929c2136926a4a2585f3fca52937e 21857ce3ef10ab8a5cdd6b176938e564dc614cad1518b36525336ca64b454b5e 663b583a58453744e193cf468b7d6f59ff009d87; do
            for f in "${FILES[@]}"; do [ -f "$f" ] || continue; grep -Fq "$stale" "$f" && { echo "STALE_AUTHORITY:$stale:$f"; exit 1; } || true; done
          done
          grep -Fq 'OPS-03 ACCEPTED / CLOSED' docs/infra/INFRA-01/INFRA01_GOVERNANCE_RECONCILIATION.json
          grep -Fq 'OPS LAYER OPEN' docs/infra/INFRA-01/INFRA01_GOVERNANCE_RECONCILIATION.json
          grep -Fq 'System Trial Preview is NOT OPENED' docs/infra/INFRA-01/INFRA01_GOVERNANCE_RECONCILIATION.json
          OUT="$RUNNER_TEMP/rebind-export"
          for f in "${FILES[@]}"; do [ -f "$f" ] || continue; mkdir -p "$OUT/$(dirname "$f")"; cp "$f" "$OUT/$f"; done
          cp "$RUNNER_TEMP/rebind-values.txt" "$OUT/REBINDBINDING.txt"
          (cd "$OUT" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$OUT/SHA256SUMS.txt"
          echo INFRA04_STALE_AUTHORITY_SCAN:PASS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra04-c2-final-rebind-${{ github.run_id }}
          path: ${{ runner.temp }}/rebind-export
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true
