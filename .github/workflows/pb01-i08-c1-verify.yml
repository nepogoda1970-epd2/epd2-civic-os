name: PB01-I08 C1 Exact Candidate Verification

on:
  push:
    branches:
      - pilot02-verify
    paths:
      - 'EPD2_VCRYPTO-PB01-I08_INDEPENDENT_VERIFIER_RELEASE_HARDENING_AND_RUST_PARITY_CANDIDATE_0.1_C1.zip'
      - '.github/workflows/pb01-i08-c1-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-i08-c1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Set up Rust 1.97.1
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(node --version)" = "v24.19.0"
          go version | grep -E 'go1\.(2[3-9]|[3-9][0-9])'
          test "$(rustc --version)" = "rustc 1.97.1 (8bab26f4f 2026-07-14)"
          test "$(cargo --version)" = "cargo 1.97.1 (c980f4866 2026-06-30)"

      - name: Verify exact ZIP and unpack
        id: integrity
        shell: bash
        run: |
          set +e
          ZIP="EPD2_VCRYPTO-PB01-I08_INDEPENDENT_VERIFIER_RELEASE_HARDENING_AND_RUST_PARITY_CANDIDATE_0.1_C1.zip"
          EXPECTED="c274b373e153a875f5409c434330e2afded781619af842566cc5dc7e6c3be90a"
          {
            set -euo pipefail
            ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
            echo "ZIP_SHA256=$ACTUAL"
            test "$ACTUAL" = "$EXPECTED"
            rm -rf /tmp/pb01-i08-c1
            mkdir -p /tmp/pb01-i08-c1
            unzip -q "$ZIP" -d /tmp/pb01-i08-c1
            mapfile -t ROOTS < <(find /tmp/pb01-i08-c1 -mindepth 1 -maxdepth 1 -type d)
            test "${#ROOTS[@]}" -eq 1
            ROOT="${ROOTS[0]}"
            echo "CANDIDATE_ROOT=$ROOT" >> "$GITHUB_ENV"
            echo "CANDIDATE_ZIP=$GITHUB_WORKSPACE/$ZIP" >> "$GITHUB_ENV"
            cd "$ROOT"
            sha256sum -c SHA256SUMS.txt
          } 2>&1 | tee i08-integrity.log
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run exact live validate:i08
        id: validate
        if: steps.integrity.outputs.rc == '0'
        shell: bash
        run: |
          set +e
          cd "$CANDIDATE_ROOT"
          I08_CANDIDATE_ZIP="$CANDIDATE_ZIP" npm run validate:i08 2>&1 | tee "$GITHUB_WORKSPACE/i08-c1-validate.log"
          rc=${PIPESTATUS[0]}
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture current-run result
        if: always()
        shell: bash
        run: |
          RESULT="$CANDIDATE_ROOT/evidence/results/i08/current-run/I08_FINAL_VALIDATION.json"
          if [ -f "$RESULT" ]; then
            cp "$RESULT" "$GITHUB_WORKSPACE/PB01_I08_C1_CURRENT_RUN.json"
          fi

      - name: Record verification result
        if: always()
        shell: bash
        run: |
          INT_RC='${{ steps.integrity.outputs.rc }}'; [ -n "$INT_RC" ] || INT_RC=98
          VAL_RC='${{ steps.validate.outputs.rc }}'; [ -n "$VAL_RC" ] || VAL_RC=98
          NODEV="$(node --version 2>/dev/null || true)"
          GOV="$(go version 2>/dev/null || true)"
          RUSTV="$(rustc --version 2>/dev/null || true)"
          CARGOV="$(cargo --version 2>/dev/null || true)"
          if [ "$INT_RC" = 0 ] && [ "$VAL_RC" = 0 ]; then
            VERDICT="PASS — PB01-I08 C1 exact live validation passed"
          else
            VERDICT="NOT VERIFIED — PB01-I08 C1 exact live validation failed"
          fi
          {
            echo '# PB01-I08 C1 Verification Result'
            echo
            echo "**Verdict:** $VERDICT"
            echo
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo '- Candidate: `EPD2_VCRYPTO-PB01-I08_INDEPENDENT_VERIFIER_RELEASE_HARDENING_AND_RUST_PARITY_CANDIDATE_0.1_C1.zip`'
            echo '- Expected SHA256: `c274b373e153a875f5409c434330e2afded781619af842566cc5dc7e6c3be90a`'
            echo "- Node: \`$NODEV\`"
            echo "- Go: \`$GOV\`"
            echo "- Rust: \`$RUSTV\`"
            echo "- Cargo: \`$CARGOV\`"
            echo "- Integrity rc: $INT_RC"
            echo "- validate:i08 rc: $VAL_RC"
            echo
            echo '## validate:i08 log tail'
            echo '```text'
            tail -n 220 i08-c1-validate.log 2>/dev/null || true
            echo '```'
            if [ -f PB01_I08_C1_CURRENT_RUN.json ]; then
              echo
              echo '## Current-run result'
              echo '```json'
              cat PB01_I08_C1_CURRENT_RUN.json
              echo '```'
            fi
          } > PB01_I08_VERIFY_RESULT.md

      - name: Commit result back to verification branch
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PB01_I08_VERIFY_RESULT.md
          if [ -f PB01_I08_C1_CURRENT_RUN.json ]; then git add PB01_I08_C1_CURRENT_RUN.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "record PB01-I08 C1 verification result"
          git push origin HEAD:pilot02-verify

      - name: Final gate
        if: always()
        shell: bash
        run: |
          test '${{ steps.integrity.outputs.rc }}' = '0'
          test '${{ steps.validate.outputs.rc }}' = '0'
