name: INFRA-04 C2 G51 Diagnostics
on:
  push:
    branches: ["diagnostic/infra04-c2-g51"]
permissions:
  contents: read
env:
  INFRA02_PATH: handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip
  INFRA02_SHA256: d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
jobs:
  g51:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Materialize exact C2
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin handoff/infra
          git show "origin/handoff/infra:$INFRA02_PATH" > /tmp/infra02.zip
          test "$(sha256sum /tmp/infra02.zip|awk '{print $1}')" = "$INFRA02_SHA256"
          python3 handoff/INFRA/infra04-c2-transport/apply.py --root "$GITHUB_WORKSPACE" --predecessor /tmp/infra02.zip
          cp -a handoff/INFRA/infra04-c2-overlay/. "$GITHUB_WORKSPACE"/
          rm -rf handoff/INFRA/infra04-c2-transport handoff/INFRA/infra04-c2-overlay
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with: {enable-cache: true}
      - name: Install frozen Python deps
        shell: bash
        run: uv sync --all-groups --frozen
      - name: Exact inherited INFRA suites
        shell: bash
        run: |
          set +e
          uv run pytest \
            tests/repository/test_infra01_harness_units.py \
            tests/repository/test_infra01_mutation_suite.py \
            tests/repository/test_infra02_units.py \
            tests/repository/test_infra02_mutation_suite.py \
            tests/repository/test_infra03_units.py \
            tests/repository/test_infra03_mutation_suite.py \
            -vv -p no:randomly 2>&1 | tee /tmp/g51.txt
          RC=${PIPESTATUS[0]}
          echo G51_DIRECT_RC=$RC
          exit 0
      - name: Upload G51 log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra04-c2-g51-${{ github.run_id }}
          path: /tmp/g51.txt
          if-no-files-found: error
          retention-days: 7
