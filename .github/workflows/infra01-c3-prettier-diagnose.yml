name: INFRA-01 C3 Prettier Diagnose

on:
  push:
    branches: [handoff/infra]
    paths: [.github/workflows/infra01-c3-prettier-diagnose.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact failed-authoritative C3 source
        uses: actions/checkout@v4
        with:
          ref: f81b180eb3de62ce42b77fcd114ce20aa2c3c39b
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install exact locked Node dependencies
        run: npm ci --no-audit --no-fund
      - name: Show exact Prettier failures
        shell: bash
        run: |
          set +e
          npm run format:check
          rc=$?
          echo "PRETTIER_RC=$rc"
          exit 0
