name: api01-c5-reassemble

on:
  push:
    branches:
      - tmp/api01-c5-authoritative-run-20260826
    paths:
      - .github/workflows/api01-c5-reassemble.yml

permissions:
  contents: read

jobs:
  reassemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble exact C5 bytes
        shell: bash
        run: |
          set -euo pipefail
          P0='candidates/EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5.zip.00.part'
          P1='candidates/EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5.zip.01.part'
          OUT='EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5.zip'
          test -f "$P0" && test -f "$P1"
          cat "$P0" "$P1" > "$OUT"
          sha256sum "$P0" "$P1" "$OUT" | tee C5_REASSEMBLY_SHA256.txt
          unzip -t "$OUT"
          python3 - "$OUT" <<'PY'
          import sys, zipfile
          z=zipfile.ZipFile(sys.argv[1])
          names=z.namelist()
          roots={n.split('/',1)[0] for n in names if n}
          assert roots == {'EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5'}, roots
          wanted='EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5/.github/workflows/api01-accept.yml'
          data=z.read(wanted)
          open('api01-accept.packaged.yml','wb').write(data)
          print('PACKAGED_WORKFLOW_BYTES', len(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: api01-c5-reassembled
          path: |
            EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5.zip
            C5_REASSEMBLY_SHA256.txt
            api01-accept.packaged.yml
          if-no-files-found: error
          retention-days: 7
