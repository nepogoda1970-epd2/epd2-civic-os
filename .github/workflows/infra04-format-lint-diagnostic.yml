name: INFRA-04 Format Lint Diagnostic

on:
  push:
    branches: ["diagnostic/infra04-c2-final-blockers"]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Checkout exact current C2 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin candidate/infra04-c2-canonical handoff/infra
          git checkout --detach origin/candidate/infra04-c2-canonical
          test "$(git rev-parse HEAD)" = "f4066a5a13949bdfbd53c19890e1f4b0fee5d6b0"
          git show "origin/handoff/infra:handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip" > /tmp/infra02.zip
          test "$(sha256sum /tmp/infra02.zip | awk '{print $1}')" = "d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c"
          python3 handoff/INFRA/infra04-c2-transport/apply.py --root "$GITHUB_WORKSPACE" --predecessor /tmp/infra02.zip
          cp -a handoff/INFRA/infra04-c2-overlay/. "$GITHUB_WORKSPACE"/
          rm -rf handoff/INFRA/infra04-c2-transport handoff/INFRA/infra04-c2-overlay

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          enable-cache: true

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-groups --frozen
          npm ci

      - name: Expose Ruff format failures
        shell: bash
        continue-on-error: true
        run: uv run ruff format --check .

      - name: Expose Ruff lint failures
        shell: bash
        continue-on-error: true
        run: uv run ruff check .

      - name: Expose Prettier failures
        shell: bash
        continue-on-error: true
        run: npm run format:check
