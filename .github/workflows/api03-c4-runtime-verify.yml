name: API-03 C4 full dependency-backed runtime verification
on:
  push:
    branches: [tmp/api03-c1-runtime-verify]
    paths: ['.github/workflows/api03-c4-runtime-verify.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_DB: epd2_s2s
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d epd2_s2s"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CANDIDATE_SHA256: 09531e9b64dd66c558e3c2478ea897e020adfd4814a7237cd8eab7f18b568a86
      CANDIDATE_ARTIFACT_ID: '9800897620'
      C3_SHA256: 9b46a3ea5e5d812889d23fae5a66a94e770175a1444fe460fcbb1dbbcbb7b0a2
      C2_SHA256: 8f0a52464e05a8d66473b2c983fa4d5630a196e3f0368aac45862c9ef2bdabd6
      C1_SHA256: 9bc0835ec7894db5f8fb1ed38e08e1fd6943ca042685e4a7ef6c5e1d599d6941
      C13_SHA256: 9363561271f0f92d2afc42ccbb0d792cb5461c97c19a5f46a6fa51408bdfc6a9
      EPD2_S2S_DSN: postgresql://postgres@127.0.0.1:55432/epd2_s2s
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify exact C4 candidate
        shell: bash
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          curl -fL -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" -o /tmp/c4-artifact.zip
          mkdir /tmp/a && unzip -q /tmp/c4-artifact.zip -d /tmp/a
          C="$(find /tmp/a -maxdepth 2 -type f -name 'EPD2_API03_SERVICE_TO_SERVICE_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C4.zip' -print -quit)"
          test -n "$C"; echo "${CANDIDATE_SHA256}  ${C}" | sha256sum -c -; unzip -t "$C" >/dev/null
          mkdir /tmp/c && unzip -q "$C" -d /tmp/c
          ROOT="$(find /tmp/c -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test "$(cat "$ROOT/API03_C4_STATUS.txt")" = CANDIDATE_NOT_ACCEPTED
          test ! -e "$ROOT/API03_C3_STATUS.txt"
          echo "C4ROOT=$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: astral-sh/setup-uv@v6
        with: {version: '0.12.5'}
      - name: Frozen workspace install and prove 46.0.7 pin
        shell: bash
        run: |
          set -euo pipefail; cd "$C4ROOT"
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/api03-workspace-env" uv sync --frozen --all-groups --python "$(command -v python)"
          echo "WORKENV=${RUNNER_TEMP}/api03-workspace-env" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/api03-workspace-env/bin/python" - <<'PY' | tee /tmp/api03-c4-workspace-crypto.log
          import cryptography
          assert cryptography.__version__=='46.0.7',cryptography.__version__
          print('API03_C4_WORKSPACE_CRYPTO_PIN:PASS',cryptography.__version__)
          PY
      - name: Offline isolated crypto49 bootstrap and probe
        shell: bash
        run: |
          set -euo pipefail; cd "$C4ROOT"
          ./scripts/api03_bootstrap_crypto49.sh "${RUNNER_TEMP}/api03-crypto49" | tee /tmp/api03-c4-crypto-bootstrap.log
          echo "CRYPTOENV=${RUNNER_TEMP}/api03-crypto49" >> "$GITHUB_ENV"
          CRYPTO_SITE="$(${RUNNER_TEMP}/api03-crypto49/bin/python -c 'import sysconfig;print(sysconfig.get_paths()["purelib"])')"
          echo "CRYPTO_SITE=$CRYPTO_SITE" >> "$GITHUB_ENV"
          "${RUNNER_TEMP}/api03-crypto49/bin/python" scripts/api03_crypto_probe.py --venv "${RUNNER_TEMP}/api03-crypto49" --output /tmp/api03-c4-crypto-isolation.json | tee /tmp/api03-c4-crypto-probe.log
      - name: Prove PostgreSQL exact 16.15 and prepare isolated topology test DB
        shell: bash
        run: |
          set -euo pipefail
          "$WORKENV/bin/python" - <<'PY' | tee /tmp/api03-c4-postgres.log
          import os,psycopg
          with psycopg.connect(os.environ['EPD2_S2S_DSN']) as c:
            with c.cursor() as q:
              q.execute('SHOW server_version_num');vn=str(q.fetchone()[0]);q.execute('SHOW server_version');v=str(q.fetchone()[0])
          assert vn=='160015',(vn,v)
          with psycopg.connect('postgresql://postgres@127.0.0.1:55432/postgres',autocommit=True) as c:
            with c.cursor() as q:q.execute('DROP DATABASE IF EXISTS epd2_s2s_topology WITH (FORCE)');q.execute('CREATE DATABASE epd2_s2s_topology')
          print('API03_C4_POSTGRES:PASS',vn,v)
          PY
      - name: Execute 98 API-03 tests
        shell: bash
        run: |
          set -euo pipefail; cd "$C4ROOT"; export PYTHONNOUSERSITE=1; export PYTHONPATH="$CRYPTO_SITE:$PWD/packages/python/epd2-s2s-crypto/src:$PWD/packages/python/epd2-runtime/src:$PWD"
          "$WORKENV/bin/python" - <<'PY'
          import cryptography
          assert cryptography.__version__=='49.0.0',cryptography.__version__
          PY
          "$WORKENV/bin/python" -m pytest tests/api03 -q -k 'not cross_instance_revoke_without_restart' --junitxml=/tmp/api03-c4-main.xml | tee /tmp/api03-c4-main.log
      - name: Execute isolated cross-instance topology test
        shell: bash
        env: {EPD2_S2S_DSN: 'postgresql://postgres@127.0.0.1:55432/epd2_s2s_topology'}
        run: |
          set -euo pipefail; cd "$C4ROOT"; export PYTHONNOUSERSITE=1; export PYTHONPATH="$CRYPTO_SITE:$PWD/packages/python/epd2-s2s-crypto/src:$PWD/packages/python/epd2-runtime/src:$PWD"
          "$WORKENV/bin/python" -m pytest tests/api03/test_topology_r4.py::test_cross_instance_revoke_without_restart -q --junitxml=/tmp/api03-c4-topology-test.xml | tee /tmp/api03-c4-topology-test.log
      - name: Assert exact 99 of 99 API-03 tests
        shell: bash
        run: |
          "$WORKENV/bin/python" - <<'PY' | tee /tmp/api03-c4-99.log
          import xml.etree.ElementTree as E
          def c(p):
            r=E.parse(p).getroot();s=[r] if r.tag=='testsuite' else list(r.findall('testsuite'));return tuple(sum(int(x.attrib.get(k,0)) for x in s) for k in ('tests','failures','errors','skipped'))
          a=c('/tmp/api03-c4-main.xml');b=c('/tmp/api03-c4-topology-test.xml');t=tuple(x+y for x,y in zip(a,b));assert a==(98,0,0,0),a;assert b==(1,0,0,0),b;assert t==(99,0,0,0),t
          print('API03_C4_99_TESTS:PASS',t)
          PY
      - name: Execute governed R11 V23 runtime suite
        shell: bash
        run: |
          set -euo pipefail; cd "$C4ROOT"; export PYTHONNOUSERSITE=1; export PYTHONPATH="$CRYPTO_SITE:$PWD/packages/python/epd2-s2s-crypto/src:$PWD/packages/python/epd2-runtime/src:$PWD"
          "$WORKENV/bin/python" scripts/api03_run_r11_v23_tests.py --dsn "$EPD2_S2S_DSN" --output /tmp/api03-c4-r11-v23.json | tee /tmp/api03-c4-r11-v23.log
          "$WORKENV/bin/python" - <<'PY'
          import json
          x=json.load(open('/tmp/api03-c4-r11-v23.json'));assert x['executed'] is True and x['ok'] is True and x['failed']==0 and x['skipped_mandatory']==0 and x['tls13'] is True and x['postgres_jti_durable'] is True,x
          print('API03_C4_R11_V23:PASS',x['counts'])
          PY
      - name: Execute governed multi-process mTLS topology proof
        shell: bash
        run: |
          set -euo pipefail; cd "$C4ROOT"; export PYTHONNOUSERSITE=1; export PYTHONPATH="$CRYPTO_SITE:$PWD/packages/python/epd2-s2s-crypto/src:$PWD/packages/python/epd2-runtime/src:$PWD"
          "$WORKENV/bin/python" scripts/api03_run_topology.py --dsn "$EPD2_S2S_DSN" --venv "$CRYPTOENV" --output /tmp/api03-c4-topology-proof.json | tee /tmp/api03-c4-topology-proof.log
          "$WORKENV/bin/python" - <<'PY'
          import json
          x=json.load(open('/tmp/api03-c4-topology-proof.json'));assert x['executed'] is True and x['ok'] is True and x['server_version'].startswith('16.15'),x
          assert x['caller_a']['result'].get('ok') is True and x['caller_b']['result'].get('reason')=='REPLAY_DETECTED' and x['restart']['result'].get('reason')=='REPLAY_DETECTED',x
          print('API03_C4_TOPOLOGY:PASS')
          PY
      - name: Execute unchanged SEC-01 repository guard
        shell: bash
        run: |
          set -euo pipefail;cd "$C4ROOT"
          "$WORKENV/bin/python" -m pytest packages/python/epd2-runtime/tests/test_sec01_security_controls.py::test_the_cryptography_apis_three_advisories_need_are_absent -q | tee /tmp/api03-c4-sec01.log
      - name: Verify exact C4 lineage and reconciliation invariants
        shell: bash
        run: |
          set -euo pipefail;cd "$C4ROOT"
          "$WORKENV/bin/python" - <<'PY' | tee /tmp/api03-c4-static.log
          import json,pathlib,os,hashlib
          r=pathlib.Path('.')
          c1=json.load(open(r/'docs/api/API-03/API03_C1_EXACT_C13_DELTA_INVENTORY.json'));c2=json.load(open(r/'docs/api/API-03/API03_C2_EXACT_C1_DELTA_INVENTORY.json'));c3=json.load(open(r/'docs/api/API-03/API03_C3_EXACT_C2_DELTA_INVENTORY.json'));c4=json.load(open(r/'docs/api/API-03/API03_C4_EXACT_C3_DELTA_INVENTORY.json'))
          rec=json.load(open(r/'docs/api/API-03/API03_API02_RECONCILIATION_REQUIREMENTS.json'));fix4=json.load(open(r/'docs/api/API-03/API03_C4_CORRECTION_REPORT.json'))
          assert c1['base_api02_c13_sha256']==os.environ['C13_SHA256'] and c1['counts']=={'added':156,'modified':2,'removed':0}
          assert c2['base_c1_sha256']==os.environ['C1_SHA256'] and c2['counts']=={'added':2,'modified':2,'removed':1}
          assert c3['base_c2_sha256']==os.environ['C2_SHA256'] and c3['counts']=={'added':3,'modified':3,'removed':1}
          assert c4['base_c3_sha256']==os.environ['C3_SHA256'] and c4['counts']=={'added':2,'modified':3,'removed':1}
          assert rec['accepted_predecessor']['sha256']==os.environ['C13_SHA256'] and rec['accepted_predecessor']['authoritative_run']==33497989489 and rec['open_reconciliation_blockers']==[] and rec['self_accepted'] is False
          assert fix4['version_requirement_weakened'] is False and fix4['runtime_source_changed'] is False
          wh=r/'packages/python/epd2-s2s-crypto/wheelhouse';m=json.load(open(r/'packages/python/epd2-s2s-crypto/wheelhouse.manifest.json'));a={p.name:(p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest()) for p in wh.glob('*.whl')};e={w['filename']:(w['bytes'],w['sha256']) for w in m['wheels']};assert a==e
          pc=(r/'docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md').read_text();assert 'API-02 = ACCEPTED / CLOSED' in pc and 'API-03 = ACTIVE / IN DEVELOPMENT / NOT ACCEPTED' in pc
          for f in ('scripts/api03_run_r11_v23_tests.py','scripts/api03_run_topology.py'):
            s=(r/f).read_text();assert 'server_version_num' in s and '160015' in s and "!='16.15'" not in s
          print('API03_C4_STATIC:PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api03-c4-runtime-verification-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            /tmp/api03-c4-workspace-crypto.log
            /tmp/api03-c4-crypto-bootstrap.log
            /tmp/api03-c4-crypto-probe.log
            /tmp/api03-c4-crypto-isolation.json
            /tmp/api03-c4-postgres.log
            /tmp/api03-c4-main.xml
            /tmp/api03-c4-main.log
            /tmp/api03-c4-topology-test.xml
            /tmp/api03-c4-topology-test.log
            /tmp/api03-c4-99.log
            /tmp/api03-c4-r11-v23.json
            /tmp/api03-c4-r11-v23.log
            /tmp/api03-c4-topology-proof.json
            /tmp/api03-c4-topology-proof.log
            /tmp/api03-c4-sec01.log
            /tmp/api03-c4-static.log
