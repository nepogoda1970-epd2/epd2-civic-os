name: PILOT-05 C3 candidate hash

on:
  push:
    branches:
      - tmp/pilot05-c3-authoritative-20260825
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hash:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          F='tmp/PILOT05_DELTA_REASSEMBLED.zip'
          test -f "$F"
          echo "CANDIDATE_PATH=$F"
          stat -c 'CANDIDATE_SIZE=%s' "$F"
          sha256sum "$F"
          file "$F"
          unzip -t "$F" >/tmp/unzip-test.log
          tail -n 5 /tmp/unzip-test.log
