name: INTEGRATION-01 C3 transport probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    if: startsWith(github.head_ref, 'tmp/integration01-c3-authoritative-')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe transport blob
        run: bash verification/integration01-c3/probe.sh
