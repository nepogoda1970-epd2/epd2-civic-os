name: Build API-04 developer starter package v2

on:
  push:
    branches:
      - transport/api04-starter-package-20260831
    paths:
      - ".github/workflows/build-api04-starter-package-v2.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-starter:
    runs-on: ubuntu-latest
    env:
      PKG_NAME: EPD2_API04_DEVELOPER_STARTER_PACKAGE_0.1
      V26_ARTIFACT_ID: "9730109404"
      V26_TRANSPORT: EPD2_V26_API02_C7_CANONICAL_AUTHORITY_TRANSPORT_8ff32c3e.zip
      V26_SHA256: 9ab287e078cda548dc2a16697f7423d98c93d61ed185b6957054c8577665cc17
      V26_SOURCE_COMMIT: 8ff32c3e9ed654768ae86ac569a9c498f78c5aa2
      API03_BRANCH: review/api03-r13-external
      API03_PATH: handoff/API-03/incoming/API 03_R13.zip
      API03_GIT_BLOB: 4aff630b8a6f351f90bd8b3e5eacfd6449b10608
      API03_REVIEW_RUN: "33280355709"
      API03_REVIEW_JOB: "99174372036"
      API03_REVIEW_ARTIFACT: "9722794132"
      API03_REVIEW_ARTIFACT_SHA256: 1f10da8aff6d4966ba018c7105d5dcabdd75430644a4fe6d281b323633cb6e40
    steps:
      - name: Checkout transport source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble self-contained API-04 starter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/$PKG_NAME"
          mkdir -p "$ROOT/00_START_HERE" "$ROOT/01_ASSIGNMENT" \
                   "$ROOT/02_CURRENT_AUTHORITY/unpacked" \
                   "$ROOT/03_API03_WORKING_PREDECESSOR" \
                   "$ROOT/04_ACCEPTED_ANCHORS" \
                   "$ROOT/05_PACK13_MESSAGING_FOUNDATION" \
                   "$ROOT/06_CHECKLISTS"

          cp handoff/API-04/starter/EPD2_API04_EVENTS_AND_MESSAGING_RUNTIME_FULL_DEVELOPER_ASSIGNMENT_v1.0.md "$ROOT/01_ASSIGNMENT/"

          # Exact V26 authority transport from its successful GitHub artifact.
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${V26_ARTIFACT_ID}/zip" > "$RUNNER_TEMP/v26-artifact.zip"
          mkdir "$RUNNER_TEMP/v26-artifact"
          unzip -q "$RUNNER_TEMP/v26-artifact.zip" -d "$RUNNER_TEMP/v26-artifact"
          V26_INNER="$(find "$RUNNER_TEMP/v26-artifact" -type f -name "$V26_TRANSPORT" -print -quit)"
          test -n "$V26_INNER"
          echo "$V26_SHA256  $V26_INNER" | sha256sum -c -
          cp "$V26_INNER" "$ROOT/02_CURRENT_AUTHORITY/$V26_TRANSPORT"
          unzip -q "$V26_INNER" -d "$ROOT/02_CURRENT_AUTHORITY/unpacked"
          AUTH="$ROOT/02_CURRENT_AUTHORITY/unpacked"
          test -f "$AUTH/CANONICAL_SHA256SUMS.txt"
          (cd "$AUTH" && sha256sum -c CANONICAL_SHA256SUMS.txt)
          test -f "$AUTH/docs/roadmap/EPD2_PROJECT_ENTRYPOINT.md"
          test -f "$AUTH/docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md"
          test -f "$AUTH/docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md"
          test -f "$AUTH/docs/roadmap/EPD2_BSI_MASTER_UPDATE_EVIDENCE.json"
          test -f "$AUTH/docs/roadmap/EPD2_BSI_VOTING_BOOTSTRAP_RULE.md"
          test -f "$AUTH/docs/security/bsi/EPD2_BSI_CC_PP_0121_CERTIFICATION_READINESS_GAP_MATRIX_0.1.md"
          test -f "$AUTH/docs/security/bsi/EPD2_BSI_CC_PP_0121_P0_PRE_EVALUATION_QUESTIONNAIRE_0.1.md"
          test ! -e "$AUTH/docs/roadmap/EPD2_BSI_CC_PP_0121_CONFORMANCE_MATRIX.md"
          test ! -e "$AUTH/docs/security/bsi/EPD2_BSI_CC_PP_0121_CONFORMANCE_MATRIX.md"
          cp "$RUNNER_TEMP/v26-artifact/CANONICAL_SHA256SUMS.txt" "$ROOT/02_CURRENT_AUTHORITY/" 2>/dev/null || true
          cp "$RUNNER_TEMP/v26-artifact/V26_AUTHORITY_METADATA.txt" "$ROOT/02_CURRENT_AUTHORITY/" 2>/dev/null || true
          cp "$RUNNER_TEMP/v26-artifact/TRANSPORT_ZIP_SHA256.txt" "$ROOT/02_CURRENT_AUTHORITY/" 2>/dev/null || true

          # Exact API-03 R13 Git blob used in the PRE-SEAL external governed review.
          git fetch --no-tags origin "$API03_BRANCH"
          git show "FETCH_HEAD:$API03_PATH" > "$RUNNER_TEMP/API_03_R13.zip"
          test "$(git hash-object "$RUNNER_TEMP/API_03_R13.zip")" = "$API03_GIT_BLOB"
          API03_SHA="$(sha256sum "$RUNNER_TEMP/API_03_R13.zip" | awk '{print $1}')"
          API03_SIZE="$(stat -c '%s' "$RUNNER_TEMP/API_03_R13.zip")"
          test "$API03_SIZE" = "40735799"
          cp "$RUNNER_TEMP/API_03_R13.zip" "$ROOT/03_API03_WORKING_PREDECESSOR/API 03_R13.zip"
          git show "FETCH_HEAD:handoff/API-03/incoming/README_UPLOAD_HERE.md" > "$ROOT/03_API03_WORKING_PREDECESSOR/README_UPLOAD_HERE.md"
          git show "FETCH_HEAD:.github/workflows/api03-r13-external-review.yml" > "$ROOT/03_API03_WORKING_PREDECESSOR/api03-r13-external-review.yml"

          mkdir "$RUNNER_TEMP/api03-extract"
          unzip -q "$RUNNER_TEMP/API_03_R13.zip" -d "$RUNNER_TEMP/api03-extract"
          mapfile -t roots < <(find "$RUNNER_TEMP/api03-extract" -mindepth 1 -maxdepth 1 -type d -print)
          test "${#roots[@]}" -eq 1
          API03_ROOT="${roots[0]}"
          test -f "$API03_ROOT/SHA256SUMS.txt"
          (cd "$API03_ROOT" && sha256sum -c SHA256SUMS.txt >/dev/null)

          if test -d "$API03_ROOT/docs/api/API-03"; then cp -a "$API03_ROOT/docs/api/API-03" "$ROOT/03_API03_WORKING_PREDECESSOR/API-03_DOCS"; fi
          if test -d "$API03_ROOT/docs/api/API-02"; then cp -a "$API03_ROOT/docs/api/API-02" "$ROOT/03_API03_WORKING_PREDECESSOR/API-02_DOCS_AS_CARRIED_BY_R13"; fi
          test -d "$API03_ROOT/docs/packs/PACK-13"
          cp -a "$API03_ROOT/docs/packs/PACK-13" "$ROOT/05_PACK13_MESSAGING_FOUNDATION/PACK-13"
          if test -d "$API03_ROOT/contracts/events"; then cp -a "$API03_ROOT/contracts/events" "$ROOT/05_PACK13_MESSAGING_FOUNDATION/contracts-events"; fi
          if test -f "$API03_ROOT/packages/python/epd2-core/src/epd2_core/event_envelope.py"; then
            mkdir -p "$ROOT/05_PACK13_MESSAGING_FOUNDATION/epd2-core"
            cp "$API03_ROOT/packages/python/epd2-core/src/epd2_core/event_envelope.py" "$ROOT/05_PACK13_MESSAGING_FOUNDATION/epd2-core/"
          fi
          # Convenience: include current messaging/data-plane implementation files referenced by PACK-13 when present.
          if test -d "$API03_ROOT/services/data-plane-service"; then
            mkdir -p "$ROOT/05_PACK13_MESSAGING_FOUNDATION/runtime-reference"
            find "$API03_ROOT/services/data-plane-service" -type f \( -iname '*outbox*' -o -iname '*inbox*' -o -iname '*message*' -o -iname '*schema*' -o -iname '*event*' \) -print0 | while IFS= read -r -d '' f; do
              rel="${f#$API03_ROOT/}"
              mkdir -p "$ROOT/05_PACK13_MESSAGING_FOUNDATION/runtime-reference/$(dirname "$rel")"
              cp "$f" "$ROOT/05_PACK13_MESSAGING_FOUNDATION/runtime-reference/$rel"
            done
          fi

          cat > "$ROOT/03_API03_WORKING_PREDECESSOR/API03_R13_EXTERNAL_REVIEW_RECORD.md" <<EOF
          # API-03 R13 working predecessor — external review record

          **Classification:** \`WORKING_INTEGRATION_PREDECESSOR / PRESEAL_NOT_ACCEPTED\`  
          **Archive:** \`API 03_R13.zip\`  
          **Size:** \`$API03_SIZE bytes\`  
          **Git blob:** \`$API03_GIT_BLOB\`  
          **SHA-256:** \`$API03_SHA\`

          External fresh-extract governed review:
          - run: \`$API03_REVIEW_RUN\`
          - job: \`$API03_REVIEW_JOB\`
          - conclusion: \`success\`
          - evidence artifact ID: \`$API03_REVIEW_ARTIFACT\`
          - evidence artifact digest: \`sha256:$API03_REVIEW_ARTIFACT_SHA256\`

          The review passed ZIP integrity, fresh extraction, archive/Windows path hygiene, SHA256SUMS, repository/version checks and the API-03 V24 validator. It is PRE-SEAL verification, not final API-03 acceptance. Final API-03 C1 remains dependent on exact accepted API-02 reconciliation.
          EOF

          cat > "$ROOT/02_CURRENT_AUTHORITY/AUTHORITY_IDENTITY.md" <<EOF
          # Current canonical authority transport

          Exact transport: \`$V26_TRANSPORT\`  
          SHA-256: \`$V26_SHA256\`  
          Source authority commit: \`$V26_SOURCE_COMMIT\`

          Exact unpacked authority files are included unchanged and validated against the transport's own \`CANONICAL_SHA256SUMS.txt\`.

          Included BSI authority files use their canonical V26 names:
          - \`docs/roadmap/EPD2_BSI_MASTER_UPDATE_EVIDENCE.json\`
          - \`docs/roadmap/EPD2_BSI_VOTING_BOOTSTRAP_RULE.md\`
          - \`docs/security/bsi/EPD2_BSI_CC_PP_0121_CERTIFICATION_READINESS_GAP_MATRIX_0.1.md\`
          - \`docs/security/bsi/EPD2_BSI_CC_PP_0121_P0_PRE_EVALUATION_QUESTIONNAIRE_0.1.md\`

          The CC PP-0121 conformance matrix is intentionally absent. Do not fabricate or substitute it.
          EOF

          cat > "$ROOT/04_ACCEPTED_ANCHORS/ACCEPTED_ANCHORS.md" <<'EOF'
          # Accepted anchors needed by API-04

          ## API-01 — ACCEPTED / CLOSED
          - archive: `EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5.zip`
          - SHA-256: `cea2fb0e23ee174e802ec1899cf62e570e5c8659a0f31c7e6c3c3955bffa3d27`
          - authoritative run: `32967210855`
          - evidence artifact: `api01-c5-acceptance-evidence-32967210855`
          - evidence artifact ID: `9606736122`
          - evidence SHA-256: `88fdd20fc7239eb5dfc9f66b4d3ddd5aadae013e726269b24454605a557ba8bd`

          ## DATA — ACCEPTED / CLOSED
          - archive: `EPD2_DATA_SERIES_CANONICAL_BASELINE_0.1_FINAL.zip`
          - SHA-256: `8cba01997e4943f6d3c2b3fc1fe11e2c3527cd6c39123171a827fb8e3669cbf1`
          - inherited PostgreSQL Phase-B: `3 failed, 203 passed, 32 skipped`, `new_failures=0`
          - interpretation: `NO_NEW_REGRESSION_AGAINST_ACCEPTED_DATA06_BASELINE`

          API-02 and API-03 are deliberately not represented as accepted anchors in this package.
          EOF

          cat > "$ROOT/06_CHECKLISTS/API04_PRESEAL_TO_FINAL_C1_RECONCILIATION_CHECKLIST.md" <<'EOF'
          # PRESEAL → final C1 reconciliation
          Do this only after API-03 is independently `ACCEPTED / CLOSED`.

          - obtain exact accepted API-03 archive/SHA and authoritative evidence;
          - mechanically compare it against working R13 for every API-04-consumed path;
          - classify every relevant delta;
          - update only required API-04 adapters/contracts;
          - rerun full API-04 tests/failure fixtures/mutations;
          - bind exact accepted API-03 in `API04_LINEAGE.json`;
          - change status from `PARALLEL_WORKING_PRESEAL_NOT_ACCEPTED` to `CANDIDATE_NOT_ACCEPTED`;
          - regenerate exact predecessor→C1 inventory, sealed manifest and checksums;
          - fresh-extract verify C1;
          - never self-claim `ACCEPTED`, `CLOSED`, `FINAL PASS` or `API-05 NEXT`.
          EOF

          cat > "$ROOT/06_CHECKLISTS/API04_DEVELOPER_DELIVERY_CHECKLIST.md" <<'EOF'
          # Current API-04 developer delivery
          Required archive: `EPD2_API04_EVENTS_AND_MESSAGING_RUNTIME_WORKING_0.1_PRESEAL.zip`
          Required status: `PARALLEL_WORKING_PRESEAL_NOT_ACCEPTED`

          Verify before return: safe one-root archive; SHA sidecar; complete inventory/manifest; real pinned broker; PostgreSQL outbox/inbox/dedup; at-least-once transport/effectively-once effect; runtime topic registry; schema evolution; API-03 service identity ACL; retry/DLQ/quarantine/redrive; replay; queued-work reauthorization; readiness/lag; privacy/retention/legal hold; voting/BSI impact; failure fixtures; adversarial mutations; inherited API/DATA no-new-regression; every mandatory PRESEAL gate executed.
          EOF

          cat > "$ROOT/06_CHECKLISTS/API04_ACCEPTANCE_RESPONSIBILITY.md" <<'EOF'
          # Acceptance responsibility
          Developer responsibility: implementation + PRESEAL verification + complete working delivery.

          Final flow:
          `developer PRESEAL → accepted API-03 reconciliation → sealed API-04 C1 → independent authoritative review → governance update only on PASS`

          Before independent PASS, API-04 is not accepted/closed, API-05 is not next and production readiness is not established.
          EOF

          cat > "$ROOT/00_START_HERE/README_START_HERE.md" <<EOF
          # EPD² API-04 developer starter package
          **Stage:** API-04 — Events & Messaging Runtime / Delivery Semantics  
          **Mode:** \`PARALLEL_WORKING_PRESEAL_NOT_ACCEPTED\`

          ## Reading order
          1. \`02_CURRENT_AUTHORITY/unpacked/docs/roadmap/EPD2_PROJECT_ENTRYPOINT.md\`
          2. \`02_CURRENT_AUTHORITY/unpacked/docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md\`
          3. \`02_CURRENT_AUTHORITY/unpacked/docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md\`
          4. BSI authority/readiness files under \`02_CURRENT_AUTHORITY/unpacked\`
          5. \`01_ASSIGNMENT/EPD2_API04_EVENTS_AND_MESSAGING_RUNTIME_FULL_DEVELOPER_ASSIGNMENT_v1.0.md\`
          6. \`03_API03_WORKING_PREDECESSOR/API03_R13_EXTERNAL_REVIEW_RECORD.md\`
          7. API-03 docs and exact \`API 03_R13.zip\`
          8. \`05_PACK13_MESSAGING_FOUNDATION/\`
          9. \`04_ACCEPTED_ANCHORS/ACCEPTED_ANCHORS.md\`
          10. \`06_CHECKLISTS/\`

          API-03 R13 exact SHA-256: \`$API03_SHA\`  
          API-03 status here: \`WORKING_INTEGRATION_PREDECESSOR\`, not accepted predecessor.  
          V26 exact authority transport SHA-256: \`$V26_SHA256\`.

          API-04 development may proceed now. Final C1 waits for predecessor reconciliation/freeze; development does not restart then unless a real incompatibility is found.
          EOF

          python - "$ROOT" <<'PY'
          import hashlib, json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); entries=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file(): continue
              rel=p.relative_to(root).as_posix()
              if rel in {'00_START_HERE/PACKAGE_MANIFEST.json','SHA256SUMS.txt'}: continue
              b=p.read_bytes(); entries.append({'path':rel,'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          api03=next(e['sha256'] for e in entries if e['path']=='03_API03_WORKING_PREDECESSOR/API 03_R13.zip')
          out={'package':root.name,'stage':'API-04','status':'PARALLEL_WORKING_PRESEAL_NOT_ACCEPTED','authority_transport_sha256':'9ab287e078cda548dc2a16697f7423d98c93d61ed185b6957054c8577665cc17','api03_working_predecessor_sha256':api03,'files':entries}
          (root/'00_START_HERE/PACKAGE_MANIFEST.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
          (cd "$ROOT" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt >/dev/null)

          cd "$RUNNER_TEMP"
          zip -q -X -r "$PKG_NAME.zip" "$PKG_NAME"
          sha256sum "$PKG_NAME.zip" > "$PKG_NAME.zip.sha256"
          unzip -t "$PKG_NAME.zip" >/dev/null
          test "$(unzip -Z1 "$PKG_NAME.zip" | sed 's#/.*##' | sort -u | wc -l)" -eq 1
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$PKG_NAME.zip" "$PKG_NAME.zip.sha256" "$GITHUB_WORKSPACE/out/"
          echo "PACKAGE_SHA256=$(awk '{print $1}' "$PKG_NAME.zip.sha256")" >> "$GITHUB_ENV"
          echo "API03_SHA256=$API03_SHA" >> "$GITHUB_ENV"

      - name: Fresh-extract final package verification
        shell: bash
        run: |
          set -euo pipefail
          cd out
          sha256sum -c "$PKG_NAME.zip.sha256"
          mkdir "$RUNNER_TEMP/verify"
          unzip -q "$PKG_NAME.zip" -d "$RUNNER_TEMP/verify"
          ROOT="$RUNNER_TEMP/verify/$PKG_NAME"
          (cd "$ROOT" && sha256sum -c SHA256SUMS.txt >/dev/null)
          python - "$ROOT/00_START_HERE/PACKAGE_MANIFEST.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          assert d['stage']=='API-04'
          assert d['status']=='PARALLEL_WORKING_PRESEAL_NOT_ACCEPTED'
          assert d['authority_transport_sha256']=='9ab287e078cda548dc2a16697f7423d98c93d61ed185b6957054c8577665cc17'
          PY
          test -f "$ROOT/03_API03_WORKING_PREDECESSOR/API 03_R13.zip"
          test -f "$ROOT/05_PACK13_MESSAGING_FOUNDATION/PACK-13/PACK-13-SPECIFICATION.md"
          echo "PACKAGE_SHA256=$PACKAGE_SHA256"
          echo "API03_SHA256=$API03_SHA256"

      - name: Upload verified starter package
        uses: actions/upload-artifact@v4
        with:
          name: api04-developer-starter-package-${{ github.run_id }}
          path: |
            out/EPD2_API04_DEVELOPER_STARTER_PACKAGE_0.1.zip
            out/EPD2_API04_DEVELOPER_STARTER_PACKAGE_0.1.zip.sha256
          if-no-files-found: error
          retention-days: 30
