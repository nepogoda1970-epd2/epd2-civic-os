name: ops01-c1-precheck

on:
  push:
    branches:
      - handoff/ops
    paths:
      - 'handoff/OPS/incoming/EPD2_OPS01_OPERATIONAL_READINESS_INCIDENT_RECOVERY_AND_CHANGE_CONTROL_CANDIDATE_0.1_C1.zip'
      - '.github/workflows/ops01-c1-precheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/ops01-venv
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      OPS01_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - name: Structural exact-byte inspection
        shell: bash
        run: |
          set -euo pipefail
          ZIP='handoff/OPS/incoming/EPD2_OPS01_OPERATIONAL_READINESS_INCIDENT_RECOVERY_AND_CHANGE_CONTROL_CANDIDATE_0.1_C1.zip'
          python - <<'PY'
          import hashlib, os, pathlib, stat, zipfile
          zpath=pathlib.Path('handoff/OPS/incoming/EPD2_OPS01_OPERATIONAL_READINESS_INCIDENT_RECOVERY_AND_CHANGE_CONTROL_CANDIDATE_0.1_C1.zip')
          data=zpath.read_bytes()
          print('CANDIDATE_SIZE_BYTES=', len(data))
          print('CANDIDATE_SHA256=', hashlib.sha256(data).hexdigest())
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'ops01-candidate'
          if out.exists():
              import shutil; shutil.rmtree(out)
          out.mkdir(parents=True)
          bad=[]; seen=set(); casefold={}; nested=[]; syms=[]
          with zipfile.ZipFile(zpath) as z:
              corrupt=z.testzip()
              if corrupt: bad.append(f'CRC:{corrupt}')
              infos=z.infolist()
              for i in infos:
                  p=pathlib.PurePosixPath(i.filename)
                  if p.is_absolute() or '..' in p.parts or '\\' in i.filename:
                      bad.append(f'UNSAFE_PATH:{i.filename}')
                  if i.filename in seen: bad.append(f'DUPLICATE:{i.filename}')
                  seen.add(i.filename)
                  cf=i.filename.casefold()
                  if cf in casefold and casefold[cf] != i.filename:
                      bad.append(f'CASE_COLLISION:{casefold[cf]}::{i.filename}')
                  casefold[cf]=i.filename
                  mode=(i.external_attr >> 16) & 0xFFFF
                  if stat.S_ISLNK(mode): syms.append(i.filename)
                  if i.filename.lower().endswith(('.zip','.7z','.rar','.tar','.tgz','.tar.gz')): nested.append(i.filename)
              print('ZIP_ENTRIES=', len(infos))
              print('ZIP_SYMLINKS=', len(syms), syms[:20])
              print('NESTED_ARCHIVES=', len(nested), nested[:20])
              if syms: bad.extend('SYMLINK:'+x for x in syms)
              if nested: bad.extend('NESTED_ARCHIVE:'+x for x in nested)
              if bad:
                  print('STRUCTURAL_FAIL=', bad[:100])
                  raise SystemExit(2)
              z.extractall(out)
          tops=sorted(p.name for p in out.iterdir())
          print('TOP_LEVEL=', tops)
          dirs=[p for p in out.iterdir() if p.is_dir()]
          files=[p for p in out.iterdir() if p.is_file()]
          root=dirs[0] if len(dirs)==1 and not files else out
          print('CANDIDATE_ROOT=', root)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write(f'CANDIDATE_ROOT={root}\n')
          print('STRUCTURAL_RESULT=PASS')
          PY

      - name: Repository hygiene before any generated environment
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          python scripts/check_repository.py
          python scripts/check_forbidden_files.py
          python scripts/verify_versions.py
          echo 'REPOSITORY_PREINSTALL_RESULT=PASS'

      - name: Show candidate-owned OPS-01 verification contract
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          echo '=== CANDIDATE WORKFLOW ==='
          cat .github/workflows/ops01-verify.yml
          echo '=== MAKE TARGETS ==='
          grep -n -A80 -B10 'verify-ops01' Makefile || true
          echo '=== SELF STATE ==='
          cat OPS01_CANDIDATE_SELF_STATE.json
          echo '=== INFRA RECONCILIATION ==='
          cat docs/ops/OPS-01/INFRA01_RECONCILIATION_RESULT.json
          echo '=== KNOWN LIMITATIONS ==='
          cat docs/ops/OPS-01/OPS01_KNOWN_LIMITATIONS.md

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact locked Python environment outside candidate tree
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          python -m pip install --disable-pip-version-check 'uv==0.12.5'
          uv sync --all-groups --frozen
          test ! -e .venv
          echo "UV_PROJECT_ENVIRONMENT=$UV_PROJECT_ENVIRONMENT"
          echo 'LOCKED_ENV_RESULT=PASS'

      - name: Candidate canonical OPS-01 verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          make verify-ops01

      - name: Inspect OPS-01 terminal evidence
        if: always()
        shell: bash
        run: |
          set -u
          cd "$CANDIDATE_ROOT"
          echo '=== VALIDATION OUTPUTS ==='
          find validation/ops01 -maxdepth 2 -type f -print -exec sh -c 'echo --- $1; cat "$1"' sh {} \; 2>/dev/null || true
          echo '=== TREE CONTAMINATION CHECK ==='
          python scripts/check_forbidden_files.py || true

      - name: Final candidate identity
        if: always()
        shell: bash
        run: |
          set -u
          cd "$GITHUB_WORKSPACE"
          ZIP='handoff/OPS/incoming/EPD2_OPS01_OPERATIONAL_READINESS_INCIDENT_RECOVERY_AND_CHANGE_CONTROL_CANDIDATE_0.1_C1.zip'
          sha256sum "$ZIP" || true
          stat -c '%s bytes' "$ZIP" || true
