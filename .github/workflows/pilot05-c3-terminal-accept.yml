name: PILOT-05 C3 Terminal Acceptance

on:
  push:
    branches:
      - tmp/pilot05-c3-authoritative-20260825
    paths:
      - '.github/workflows/pilot05-c3-terminal-accept.yml'
      - '.pilot05-c3-terminal-trigger'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_ADDOPTS: '-p no:cacheprovider'
  C3_SHA256: 'fc3f371bcf180e6559bc8ccc72cb74a88deef293f768424bcae7576731e8d8fb'
  C3_ROOT: 'EPD2_PILOT05_REPRESENTATIVE_DESK_AND_TRANSPARENCY_PILOT_CANDIDATE_0.1_C3'
  PGHOST: localhost
  PGPORT: '5432'
  PGUSER: postgres
  PGPASSWORD: postgres
  PGDATABASE: pilot05_c3_acceptance
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pilot05_c3_acceptance
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pilot05_c3_acceptance
  EPD2_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pilot05_c3_acceptance
  PILOT05_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pilot05_c3_acceptance
  EPD2_PILOT05_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pilot05_c3_acceptance
  POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/pilot05_c3_acceptance
  POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/pilot05_c3_acceptance

jobs:
  terminal-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pilot05_c3_acceptance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pilot05_c3_acceptance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout acceptance-control branch
        uses: actions/checkout@v4
        with:
          path: control
          ref: tmp/pilot05-c3-authoritative-20260825
          fetch-depth: 0

      - name: Checkout exact C3 transport branch
        uses: actions/checkout@v4
        with:
          path: transport
          ref: pilot05-c3-acceptance-transport
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Reassemble exact immutable C3
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import gzip, lzma, itertools, hashlib, pathlib
          root = pathlib.Path('transport/tmp/pilot05-c3-transport')
          chunks = {i: (root / f'chunk{i:02d}.txt').read_bytes() for i in range(8)}
          expected = 'fc3f371bcf180e6559bc8ccc72cb74a88deef293f768424bcae7576731e8d8fb'
          def sha(b): return hashlib.sha256(b).hexdigest()
          def streams(start, decoder):
              rest = [i for i in chunks if i != start]
              hits = []
              for n in range(len(rest) + 1):
                  for tail in itertools.permutations(rest, n):
                      order = (start,) + tail
                      data = b''.join(chunks[i] for i in order)
                      try: out = decoder(data)
                      except Exception: continue
                      hits.append((order, out))
              return hits
          matches = []
          for go, gout in streams(0, gzip.decompress):
              for xo, xout in streams(1, lzma.decompress):
                  if set(go) & set(xo): continue
                  for label, data in [('gzip', gout), ('xz', xout), ('gzip+xz', gout+xout), ('xz+gzip', xout+gout)]:
                      if sha(data) == expected:
                          matches.append((label, go, xo, data))
          if len(matches) != 1:
              raise SystemExit(f'exact governed C3 reconstruction count={len(matches)}')
          label, go, xo, candidate = matches[0]
          out = pathlib.Path('/tmp/PILOT05_C3_REASSEMBLED.zip')
          out.write_bytes(candidate)
          print('REASSEMBLY', label, go, xo)
          print('CANDIDATE_SHA256', sha(candidate))
          print('CANDIDATE_SIZE', len(candidate))
          PY
          echo "$C3_SHA256  /tmp/PILOT05_C3_REASSEMBLED.zip" | sha256sum -c -
          rm -rf /tmp/pilot05-c3-tree
          mkdir -p /tmp/pilot05-c3-tree
          unzip -q /tmp/PILOT05_C3_REASSEMBLED.zip -d /tmp/pilot05-c3-tree
          test -d "/tmp/pilot05-c3-tree/$C3_ROOT"
          test "$(find /tmp/pilot05-c3-tree -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1
          test "$(unzip -Z -1 /tmp/PILOT05_C3_REASSEMBLED.zip | wc -l)" -eq 3744
          chmod -R a-w "/tmp/pilot05-c3-tree/$C3_ROOT"

      - name: Prepare exact frozen candidate environment outside C3
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/pilot05-c3-tree/$C3_ROOT"
          export UV_PROJECT_ENVIRONMENT=/tmp/pilot05-c3-project-env
          cd "$ROOT"
          uv sync --all-groups --frozen
          /tmp/pilot05-c3-project-env/bin/python - <<'PY'
          import sys, cryptography, psycopg
          print('PYTHON', sys.version)
          print('EXECUTABLE', sys.executable)
          print('CRYPTOGRAPHY', cryptography.__version__)
          print('PSYCOPG', psycopg.__version__)
          assert sys.version_info[:2] == (3, 12)
          assert cryptography.__version__ == '46.0.7'
          assert psycopg.__version__ == '3.3.4'
          PY

      - name: Prepare independent verifier runtime outside candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/tmp/pilot05-c3-tree/$C3_ROOT"
          rm -rf /mnt/data/python
          sudo mkdir -p /mnt/data
          sudo chown "$USER:$USER" /mnt/data
          uv venv --python "$(which python)" /mnt/data/python
          if [ -d "$ROOT/packages/python/epd2-independent-verifier" ]; then
            uv pip install --python /mnt/data/python/bin/python --no-deps "$ROOT/packages/python/epd2-independent-verifier"
            uv pip install --python /mnt/data/python/bin/python 'cryptography==46.0.7' 'cffi==2.1.0' 'pycparser==3.0'
          fi
          /mnt/data/python/bin/python - <<'PY'
          import sys, cryptography
          print('VERIFIER_PYTHON', sys.version)
          print('VERIFIER_EXECUTABLE', sys.executable)
          print('VERIFIER_CRYPTOGRAPHY', cryptography.__version__)
          assert sys.version_info[:2] == (3, 12)
          assert cryptography.__version__ == '46.0.7'
          PY
          echo "EPD2_VERIFIER_PYTHON=/mnt/data/python/bin/python" >> "$GITHUB_ENV"
          echo "INDEPENDENT_VERIFIER_PYTHON=/mnt/data/python/bin/python" >> "$GITHUB_ENV"
          echo "VERIFIER_PYTHON=/mnt/data/python/bin/python" >> "$GITHUB_ENV"
          echo "/mnt/data/python/bin" >> "$GITHUB_PATH"

      - name: Prepare clean PostgreSQL 16.15 acceptance database
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -d postgres -c "SELECT version();"
          psql -v ON_ERROR_STOP=1 -d pilot05_c3_acceptance -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"
          psql -v ON_ERROR_STOP=1 -d pilot05_c3_acceptance -Atc "SHOW server_version; SELECT extname || '=' || extversion FROM pg_extension WHERE extname='pgcrypto';" | tee /tmp/postgres-version.txt
          grep -q '^16.15' /tmp/postgres-version.txt

      - name: Run exact C3 validator to natural completion
        id: validator
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ROOT="/tmp/pilot05-c3-tree/$C3_ROOT"
          EVIDENCE="$GITHUB_WORKSPACE/control/tmp/pilot05-c3-terminal-evidence/run-$GITHUB_RUN_ID"
          rm -rf "$EVIDENCE"
          mkdir -p "$EVIDENCE"
          export UV_PROJECT_ENVIRONMENT=/tmp/pilot05-c3-project-env
          cd "$ROOT"
          /tmp/pilot05-c3-project-env/bin/python scripts/validate_pilot05_c3.py --tree "$ROOT" --evidence-out "$EVIDENCE" 2>&1 | tee "$GITHUB_WORKSPACE/control/tmp/pilot05-c3-terminal-evidence/run-$GITHUB_RUN_ID/00_validator_terminal.log"
          rc=${PIPESTATUS[0]}
          echo "$rc" > "$GITHUB_WORKSPACE/control/tmp/pilot05-c3-terminal-evidence/run-$GITHUB_RUN_ID/VALIDATOR_EXIT_CODE.txt"
          echo "validator_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Inspect mandatory terminal evidence and create machine summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$GITHUB_WORKSPACE/control/tmp/pilot05-c3-terminal-evidence/run-$GITHUB_RUN_ID"
          export EVIDENCE
          ROOT="/tmp/pilot05-c3-tree/$C3_ROOT"
          sha256sum /tmp/PILOT05_C3_REASSEMBLED.zip > "$EVIDENCE/CANDIDATE_SHA256.txt"
          /tmp/pilot05-c3-project-env/bin/python --version > "$EVIDENCE/PYTHON_VERSION.txt" 2>&1
          /tmp/pilot05-c3-project-env/bin/python -c "import psycopg,cryptography; print('psycopg='+psycopg.__version__); print('cryptography='+cryptography.__version__)" > "$EVIDENCE/RUNTIME_PACKAGES.txt"
          cp /tmp/postgres-version.txt "$EVIDENCE/POSTGRESQL_VERSION.txt"
          printf '%s\n' "GITHUB_RUN_ID=$GITHUB_RUN_ID" "GITHUB_SHA=$GITHUB_SHA" > "$EVIDENCE/GITHUB_EXECUTION.txt"
          for f in RESULT.txt 02_GOVERNANCE_CHECKS.json 03_INHERITED_AND_PILOT05_JUNIT.xml 03_pytest_tail.log 04_MANDATORY_EXECUTION.json 05_F01_ADVERSARIAL.json 06_F02_UNLINKABILITY.json; do
            test -s "$EVIDENCE/$f" || { echo "MISSING_MANDATORY_EVIDENCE=$f"; exit 44; }
          done
          cat "$EVIDENCE/RESULT.txt"
          /tmp/pilot05-c3-project-env/bin/python - <<'PY'
          import json, os, re, hashlib, xml.etree.ElementTree as ET
          from pathlib import Path
          e = Path(os.environ['EVIDENCE'])
          result = (e/'RESULT.txt').read_text().strip()
          if not re.fullmatch(r'PILOT05_C3_RESULT:(PASS|FAIL):.+', result):
              raise SystemExit('validator did not emit governed terminal token')
          xml_root = ET.parse(e/'03_INHERITED_AND_PILOT05_JUNIT.xml').getroot()
          suites = [xml_root] if xml_root.tag == 'testsuite' else list(xml_root.iter('testsuite'))
          # For testsuites roots, avoid double-counting aggregate parent suites by using direct children when available.
          if xml_root.tag == 'testsuites':
              suites = list(xml_root.findall('testsuite'))
          tests = sum(int(s.attrib.get('tests','0')) for s in suites)
          failures = sum(int(s.attrib.get('failures','0')) for s in suites)
          errors = sum(int(s.attrib.get('errors','0')) for s in suites)
          skipped = sum(int(s.attrib.get('skipped','0')) for s in suites)
          failed = failures + errors
          passed = tests - failed - skipped
          gov = json.loads((e/'02_GOVERNANCE_CHECKS.json').read_text())
          mandatory = json.loads((e/'04_MANDATORY_EXECUTION.json').read_text())
          f01 = json.loads((e/'05_F01_ADVERSARIAL.json').read_text())
          f02 = json.loads((e/'06_F02_UNLINKABILITY.json').read_text())
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          summary = {
              'terminal_token': result,
              'candidate_filename': 'PILOT05_C3_REASSEMBLED.zip',
              'candidate_sha256': 'fc3f371bcf180e6559bc8ccc72cb74a88deef293f768424bcae7576731e8d8fb',
              'candidate_root': 'EPD2_PILOT05_REPRESENTATIVE_DESK_AND_TRANSPARENCY_PILOT_CANDIDATE_0.1_C3',
              'member_count': 3744,
              'junit': {'tests': tests, 'passed': passed, 'failed': failed, 'failures': failures, 'errors': errors, 'skipped': skipped},
              'governance': gov,
              'mandatory_execution': mandatory,
              'f01': f01,
              'f02': f02,
              'github_run_id': os.environ.get('GITHUB_RUN_ID'),
              'github_sha': os.environ.get('GITHUB_SHA'),
              'evidence_files_sha256': {p.name: digest(p) for p in [e/'RESULT.txt',e/'02_GOVERNANCE_CHECKS.json',e/'03_INHERITED_AND_PILOT05_JUNIT.xml',e/'03_pytest_tail.log',e/'04_MANDATORY_EXECUTION.json',e/'05_F01_ADVERSARIAL.json',e/'06_F02_UNLINKABILITY.json']},
          }
          (e/'TERMINAL_SUMMARY.json').write_text(json.dumps(summary, indent=2, sort_keys=True)+'\n')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Commit terminal evidence to temporary acceptance branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd control
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "tmp/pilot05-c3-terminal-evidence/run-$GITHUB_RUN_ID"
          git commit -m "PILOT-05 C3 terminal evidence run $GITHUB_RUN_ID"
          git push origin HEAD:tmp/pilot05-c3-authoritative-20260825

      - name: Upload complete terminal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot05-c3-terminal-evidence-${{ github.run_id }}
          path: control/tmp/pilot05-c3-terminal-evidence/run-${{ github.run_id }}/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce validator exit and terminal token
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE="$GITHUB_WORKSPACE/control/tmp/pilot05-c3-terminal-evidence/run-$GITHUB_RUN_ID"
          token="$(cat "$EVIDENCE/RESULT.txt")"
          rc="$(cat "$EVIDENCE/VALIDATOR_EXIT_CODE.txt")"
          case "$token" in
            PILOT05_C3_RESULT:PASS:*) test "$rc" -eq 0 ;;
            PILOT05_C3_RESULT:FAIL:*) exit 1 ;;
            *) echo "NO_GOVERNED_TERMINAL_TOKEN"; exit 2 ;;
          esac
