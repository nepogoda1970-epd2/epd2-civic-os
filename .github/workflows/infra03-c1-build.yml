name: INFRA-03 C1 canonical candidate build

on:
  push:
    branches: [tmp/infra03-c1-canonical-build]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0, persist-credentials: false}

      - name: Download exact accepted INFRA-02
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: infra02-authoritative-candidate-33574647511
          path: incoming/infra02
          run-id: 33574647511
          github-token: ${{ github.token }}
      - name: Download exact accepted API-06
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: api06-c1-candidate-v3
          path: incoming/api06
          run-id: 33628261946
          github-token: ${{ github.token }}

      - name: Construct C1 from exact INFRA-02 plus bounded correction overlay
        id: source
        shell: bash
        run: |
          set -euo pipefail
          I2=$(find incoming/infra02 -type f -name 'EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip' -print -quit)
          A6=$(find incoming/api06 -type f -name 'EPD2_API06_API_LAYER_COMPLETION_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1.zip' -print -quit)
          test -n "$I2" -a -n "$A6"
          echo 'd91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c  '"$I2" | sha256sum -c -
          echo '3432b6615aa83c6f2860c015b7cafc2a18362aa371901616951a1bd5d263933c  '"$A6" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/infra03-src"
          python3 - "$I2" "$RUNNER_TEMP/infra03-src" <<'PY'
          import pathlib,sys,zipfile
          z=zipfile.ZipFile(sys.argv[1]); assert z.testzip() is None; z.extractall(sys.argv[2])
          PY
          ROOT=$(find "$RUNNER_TEMP/infra03-src" -mindepth 1 -maxdepth 1 -type d -print -quit)
          base64 --decode handoff/INFRA-03/C1/infra03_overlay.tar.gz.b64 > "$RUNNER_TEMP/infra03-overlay.tar.gz"
          echo '755591cf5c10a79053195a11c75ebe848931676cf6403d4789204c98536b1b19  '"$RUNNER_TEMP/infra03-overlay.tar.gz" | sha256sum -c -
          tar --no-same-owner -xzf "$RUNNER_TEMP/infra03-overlay.tar.gz" -C "$ROOT"
          rm -f "$ROOT/SHA256SUMS.txt" "$ROOT/ACCEPTANCE/FREEZE-INVENTORY.json"
          cp handoff/INFRA-03/templates/C1/infra03-accept.yml "$ROOT/handoff/INFRA-03/templates/C1/infra03-accept.yml"
          # Final C1 truth patches over the earlier PRESEAL wording.
          sed -i 's/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1/g' "$ROOT/scripts/infra03/gates.py" "$ROOT/docs/infra/INFRA-03/INFRA03_DEVELOPER_REPORT.md"
          python3 - "$ROOT" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); p=root/'scripts/check_repository.py'; s=p.read_text()
          needle='    "docs/api/API-05/API05_C1_ACCEPTANCE_RECORD.json",\n'
          if 'docs/api/API-06/API06_C1_ACCEPTANCE_RECORD.json' not in s: s=s.replace(needle,needle+'    "docs/api/API-06/API06_C1_ACCEPTANCE_RECORD.json",\n')
          needle='    "validation/infra03/baseline_identity.json",\n'
          if 'validation/infra03/api06_reconciliation_result.json' not in s: s=s.replace(needle,needle+'    "validation/infra03/api06_reconciliation_result.json",\n')
          p.write_text(s)
          PY
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"; echo "i2=$I2" >> "$GITHUB_OUTPUT"; echo "a6=$A6" >> "$GITHUB_OUTPUT"

      - name: Reconcile exact source to fresh canonical main and seal C1 controls
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.source.outputs.root }}'
          git fetch --no-tags origin main
          for p in \
            docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md \
            docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md \
            docs/api/API-05/API05_C1_ACCEPTANCE_RECORD.json \
            docs/api/API-06/API06_C1_ACCEPTANCE_RECORD.json \
            docs/infra/INFRA-02/INFRA02_ACCEPTANCE_RECORD.json \
            docs/ops/OPS-02/OPS02_C3_ACCEPTANCE_RECORD.json \
            docs/ops/OPS-02/OPS02_C3_AUTHORITATIVE_ACCEPTANCE_RESULT.json \
            docs/ops/OPS-02/OPS02_C3_BSI_READINESS_DISPOSITION.json \
            docs/ops/OPS-02/OPS02_C3_PREVIEW_READINESS_DISPOSITION.json; do
              mkdir -p "$ROOT/$(dirname "$p")"; git show "origin/main:$p" > "$ROOT/$p"
          done
          PYTHONPATH="$ROOT" python3 - "$ROOT" "$GITHUB_WORKSPACE" <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          from datetime import datetime,UTC
          from scripts.acceptance.governance import build_reconciliation_record
          root=pathlib.Path(sys.argv[1]); gitroot=sys.argv[2]
          def g(*a): return subprocess.check_output(['git','-C',gitroot,*a],text=True).strip()
          def b(path): return subprocess.check_output(['git','-C',gitroot,'show',f'origin/main:{path}'])
          pcr='docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md'; master='docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md'
          pb=b(pcr); mb=b(master)
          target={'repository':'nepogoda1970-epd2/epd2-civic-os','branch':'main','commit':g('rev-parse','origin/main'),'tree':g('rev-parse','origin/main^{tree}'),'pcr_git_blob':g('rev-parse',f'origin/main:{pcr}'),'pcr_sha256':hashlib.sha256(pb).hexdigest(),'master_git_blob':g('rev-parse',f'origin/main:{master}'),'master_sha256':hashlib.sha256(mb).hexdigest()}
          facts=[{'id':'api-layer-closed','region':'primary_position','must_include':['API-06 = ACCEPTED / CLOSED','API = CLOSED'],'must_exclude':['API-06 = NEXT','API-06 = ACTIVE']},{'id':'infra-predecessors-closed','region':'layer_table','must_include':['INFRA-01 ACCEPTED / CLOSED','INFRA-02 ACCEPTED / CLOSED','INFRA LAYER OPEN'],'must_exclude':[]}]
          rec=build_reconciliation_record(target,hashlib.sha256((root/pcr).read_bytes()).hexdigest(),facts,datetime.now(UTC).isoformat(timespec='seconds'),g('show','-s','--format=%cI','origin/main'),'INFRA-03 C1 final reconciliation after API-06 authoritative closure; candidate remains NOT_ACCEPTED until independent review.')
          (root/'docs/infra/INFRA-01/INFRA01_GOVERNANCE_RECONCILIATION.json').write_text(json.dumps(rec,indent=2,sort_keys=True)+'\n')
          api=json.loads((root/'docs/api/API-06/API06_C1_ACCEPTANCE_RECORD.json').read_text())
          wf=root/'handoff/INFRA-03/templates/C1/infra03-accept.yml'; wfsha=hashlib.sha256(wf.read_bytes()).hexdigest()
          seal={'schema':'epd2.infra03.c1.seal/1','stage':'INFRA-03','candidate_role':'C1','candidate_self_state':'CANDIDATE_NOT_ACCEPTED','self_accepted':False,'source_predecessor':{'stage':'INFRA-02','sha256':'d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c','authoritative_run_id':33574647511},'api06_reconciliation':{'sha256':api['candidate']['sha256'],'authoritative_run_id':api['authoritative']['run_id'],'decision':api['decision']},'target_main':target,'builder':{'run_id':int(__import__('os').environ['GITHUB_RUN_ID']),'provenance_commit':__import__('os').environ['GITHUB_SHA']},'sealed_acceptance_workflow':{'path':'handoff/INFRA-03/templates/C1/infra03-accept.yml','sha256':wfsha},'correction_scope':['API-06 exact accepted-byte reconciliation','OpenSSL/Python TLS SKI+AKI portability','final verdict fail-closed semantics'],'governed_runtime_gates':40,'package_phase_gates':['G39','G40'],'mutation_classes':36}
          (root/'docs/infra/INFRA-03/INFRA03_C1_SEAL_RECORD.json').write_text(json.dumps(seal,indent=2)+'\n')
          (root/'docs/infra/INFRA-03/INFRA03_DEVELOPER_REPORT.md').write_text(f'''# INFRA-03 C1 DEVELOPER REPORT\n\nC1 is a cumulative final-seal candidate built from exact accepted INFRA-02 `{seal['source_predecessor']['sha256']}` and reconciled to live canonical main `{target['commit']}`. API-06 is accepted/closed and the exact accepted API-06 candidate `{api['candidate']['sha256']}` is a mandatory G41 input.\n\nCorrections from PRESEAL are bounded to TLS certificate portability (SKI/AKI), fail-closed final verdict semantics, and live exact-byte API-06 reconciliation. No runtime/business gate is weakened.\n\nSelf-state: `CANDIDATE_NOT_ACCEPTED`. Independent authoritative acceptance is required.\n''')
          PY

      - name: Create clean source identity
        shell: bash
        run: |
          set -euo pipefail
          ROOT='${{ steps.source.outputs.root }}'; cd "$ROOT"
          rm -rf .git; git init -q; git config user.email epd2-builder@users.noreply.github.com; git config user.name epd2-builder; git add -A; git commit -qm 'INFRA-03 C1 reconstructed source'; git remote add origin https://github.com/nepogoda1970-epd2/epd2-civic-os.git; git fetch -q --depth=1 origin main

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with: {version: "0.12.5", enable-cache: false}
      - name: Install locked environment and PostgreSQL 16
        working-directory: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          uv lock --check; uv sync --frozen --all-groups
          test -x /usr/lib/postgresql/16/bin/initdb || (sudo apt-get update -qq && sudo apt-get install -y postgresql-16)

      - name: Run all INFRA-03 unit and mutation tests
        working-directory: ${{ steps.source.outputs.root }}
        run: .venv/bin/python -m pytest -q tests/repository/test_infra03_units.py tests/repository/test_infra03_mutation_suite.py

      - name: Run 40-gate INFRA-03 runtime phase
        working-directory: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.infra03.gates --root "$PWD" --git-root "$PWD" --artifact '${{ steps.source.outputs.i2 }}' --api06-artifact '${{ steps.source.outputs.a6 }}' | tee /tmp/infra03-c1-gates.log
          grep -F "INFRA03 gates: {'PASS': 40, 'FAIL': 0, 'BLOCKED': 0} verdict=PASS" /tmp/infra03-c1-gates.log
          jq -e '.verdict=="PASS" and .counts.PASS==40 and .counts.FAIL==0 and .counts.BLOCKED==0' validation/infra03/infra03_preseal_result.json
          git add validation/infra03 docs/infra/INFRA-03/INFRA03_DEVELOPER_REPORT.md; git commit -qm 'INFRA-03 C1 governed runtime evidence'

      - name: Verify fresh governance target before packaging
        working-directory: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          git fetch -q --depth=1 origin main
          git show origin/main:docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md > /tmp/current-pcr.md
          .venv/bin/python -m scripts.acceptance verify-reconciliation --root "$PWD" --target-pcr /tmp/current-pcr.md

      - name: Run full canonical harness and package C1
        id: canon
        working-directory: ${{ steps.source.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen python -m scripts.acceptance run --root "$PWD" --output "$RUNNER_TEMP/canonical" | tee /tmp/infra03-c1-canonical.log
          grep -F 'INFRA01_ACCEPTANCE_RESULT:PASS:' /tmp/infra03-c1-canonical.log
          RUN=$(find "$RUNNER_TEMP/canonical" -mindepth 1 -maxdepth 1 -type d -name 'run-*' -print -quit); test -n "$RUN"
          ZIP="$RUN/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1.zip"; test -f "$ZIP"
          mkdir -p "$RUNNER_TEMP/final"
          .venv/bin/python -m scripts.infra03.preseal --root "$PWD" --run-dir "$RUN" --out "$RUNNER_TEMP/final" | tee /tmp/infra03-c1-package.log
          FZIP="$RUNNER_TEMP/final/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1.zip"
          echo "zip=$FZIP" >> "$GITHUB_OUTPUT"; echo "sha=$(sha256sum "$FZIP"|cut -d' ' -f1)" >> "$GITHUB_OUTPUT"; echo "size=$(stat -c%s "$FZIP")" >> "$GITHUB_OUTPUT"; echo "run_dir=$RUN" >> "$GITHUB_OUTPUT"

      - name: Upload sealed C1 candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra03-c1-candidate
          path: |
            ${{ steps.canon.outputs.zip }}
            ${{ steps.canon.outputs.zip }}.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Upload build evidence
        uses: actions/upload-artifact@ea165f8d65b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: infra03-c1-build-evidence-${{ github.run_id }}
          path: |
            ${{ steps.source.outputs.root }}/validation/infra03/
            ${{ steps.canon.outputs.run_dir }}/EXECUTION-MANIFEST.json
            /tmp/infra03-c1-gates.log
            /tmp/infra03-c1-canonical.log
            /tmp/infra03-c1-package.log
          if-no-files-found: warn
          retention-days: 90
      - name: Developer result
        run: echo 'INFRA03_C1_DEVELOPER_RESULT:PASS:${{ steps.canon.outputs.sha }}:${{ steps.canon.outputs.size }}; state=CANDIDATE_NOT_ACCEPTED'
