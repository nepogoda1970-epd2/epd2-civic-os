name: FIR-AI-003 placement refinement

on:
  push:
    branches:
      - governance/fir-ai-003-correspondence
    paths:
      - .github/workflows/fir-ai-003-placement.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/fir-ai-003-correspondence
          fetch-depth: 0

      - name: Apply V18 refinement
        run: python scripts/apply_fir_ai003_placement_v18.py

      - name: Verify and commit
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import hashlib

          master = Path("docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md")
          control = Path("docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md")
          m = master.read_text(encoding="utf-8")
          c = control.read_text(encoding="utf-8")
          digest = hashlib.sha256(master.read_bytes()).hexdigest()
          assert m.count("### Implementation placement matrix") == 1
          assert m.count("## 1.32 Documentation-only refinement — FIR-AI-003 Implementation Placement Matrix (2026-08-27)") == 1
          assert "Current Master maintenance level established by project governance work: **V18**" in c
          assert digest in c
          assert "**`API-02 = NEXT`**" in c
          assert not Path("scripts/apply_fir_ai003_placement_v18.py").exists()
          assert not Path(".github/workflows/fir-ai-003-placement.yml").exists()
          print("MASTER_SHA256=" + digest)
          print("FIR_AI_003_PLACEMENT=PASS")
          print("PROGRAM_CONTROL_V18=PASS")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "governance: place FIR-AI-003 across implementation layers"
          git push origin HEAD:governance/fir-ai-003-correspondence
