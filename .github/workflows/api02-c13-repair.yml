name: api02-c13-repair

on:
  push:
    branches:
      - tmp/api02-c13-repair
    paths:
      - '.github/workflows/api02-c13-repair.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: api02-candidate
          path: /tmp/candidate
          run-id: 33490942304
          github-token: ${{ github.token }}
      - name: Inspect exact-inventory change-rule schema
        shell: bash
        run: |
          set -euo pipefail
          CAND=/tmp/candidate/EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C12.zip
          rm -rf /tmp/c12 && mkdir /tmp/c12
          unzip -q "$CAND" -d /tmp/c12
          ROOT=/tmp/c12/EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C12
          cd "$ROOT"
          echo '=== RULES 1-330 ==='
          sed -n '1,330p' scripts/api02/build_exact_inventories.py
          echo '=== RULES 430-550 ==='
          sed -n '430,550p' scripts/api02/build_exact_inventories.py
          echo '=== REASON FUNCTION ==='
          grep -n -A85 -B10 'def reason_for' scripts/api02/build_exact_inventories.py || true
