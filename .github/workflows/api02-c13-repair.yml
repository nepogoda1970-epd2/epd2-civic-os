name: api02-c13-repair

on:
  push:
    branches:
      - tmp/api02-c13-repair
    paths:
      - '.github/workflows/api02-c13-repair.yml'

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: api02-candidate
          path: /tmp/candidate
          run-id: 33490942304
          github-token: ${{ github.token }}
      - name: Inspect exact C12 entering metadata and current declarations
        shell: bash
        run: |
          set -euo pipefail
          CAND=/tmp/candidate/EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C12.zip
          echo "C12_SHA=$(sha256sum "$CAND" | cut -d' ' -f1)"
          echo "C12_SIZE=$(stat -c %s "$CAND")"
          rm -rf /tmp/c12 && mkdir /tmp/c12
          unzip -q "$CAND" -d /tmp/c12
          ROOT=/tmp/c12/EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C12
          cd "$ROOT"
          echo "C12_SHA256SUM_ROWS=$(wc -l < SHA256SUMS.txt)"
          echo '=== LINEAGE JSON ==='; cat docs/api/API-02/API02_LINEAGE.json
          echo '=== EXECUTIVE ==='; cat docs/api/API-02/01_EXECUTIVE_RESULT.md
          echo '=== ENTERING ==='; cat docs/api/API-02/03_ENTERING_BASELINE.md
          echo '=== C11-C12 REPORT ==='; cat docs/api/API-02/API02_C11_TO_C12_CORRECTION_REPORT.md
          echo '=== CHANGE RULE MATCHES ==='
          grep -n -E 'pattern.*(api02-accept|lineage_gates|validator_selftest|01_EXECUTIVE|03_ENTERING|V23_CRYPTO|11_VOTING|CORRECTION_REPORT)' scripts/api02/build_exact_inventories.py || true
