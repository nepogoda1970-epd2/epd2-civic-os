name: FRONT-03 C1 governance apply
on:
  push:
    branches: [gov/front03-c1-acceptance-20260901]
    paths: ['.github/workflows/front03-c1-governance-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout governed branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify current canonical main has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3d0b2fec5f86c491f36de1041caa66d983727480"
          git merge-base --is-ancestor 3d0b2fec5f86c491f36de1041caa66d983727480 HEAD
      - name: Apply acceptance record and PCR transition
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_front03_c1_governance.py
          test "$(git diff --name-only | sort | paste -sd, -)" = "docs/frontend/FRONT-03-C1-ACCEPTANCE-RECORD.json,docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md"
          git diff --check
      - name: Commit same governed change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "EPD2 Governance Bot"
          git config user.email "governance@epd2.invalid"
          git add docs/frontend/FRONT-03-C1-ACCEPTANCE-RECORD.json docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          git commit -m "gov(front03): accept C1 and close bounded FRONT-03 stage"
          git push origin HEAD:gov/front03-c1-acceptance-20260901
