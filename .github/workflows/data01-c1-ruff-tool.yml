name: DATA-01 C1 Ruff Tool

on:
  push:
    branches: [tmp/data01-candidate-20260820]
    paths:
      - '.github/workflows/data01-c1-ruff-tool.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ruff-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download pinned Ruff wheel
        run: |
          set -euo pipefail
          mkdir -p /tmp/ruff
          python -m pip download --no-deps --only-binary=:all: ruff==0.15.22 -d /tmp/ruff
          sha256sum /tmp/ruff/*
      - uses: actions/upload-artifact@v4
        with:
          name: data01-c1-ruff-0.15.22
          path: /tmp/ruff/*
          compression-level: 0
      - name: Record run id
        if: always()
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_RUN_ID" > DATA01_C1_RUFF_RUN_ID.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DATA01_C1_RUFF_RUN_ID.txt
          git commit -m 'record DATA-01 C1 Ruff run [skip ci]' || true
          git push origin HEAD:tmp/data01-candidate-20260820 || true
