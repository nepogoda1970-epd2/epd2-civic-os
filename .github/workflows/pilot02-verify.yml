name: PILOT-02 Docker Verification

on:
  push:
    branches:
      - pilot02-verify
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment
        run: |
          uname -a
          cat /etc/os-release
          docker --version
          docker compose version
          ls -l /dev/fd
          bash -c 'cat < <(printf "process-substitution-ok\n")'

      - name: Verify candidate ZIP
        run: |
          set -euo pipefail
          ZIP="EPD2_PILOT-02_PUBLIC_SITE_INTEGRATION_AND_UNIFIED_PILOT_PRODUCT_CANDIDATE_0.51.0.zip"
          EXPECTED="6af0dbba39048ae50d358de74c2e758425b5a017dd058c96e196ffb21e381d12"
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          echo "ZIP_SHA256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf /tmp/pilot02-candidate
          mkdir -p /tmp/pilot02-candidate
          unzip -q "$ZIP" -d /tmp/pilot02-candidate
          ROOT="$(find /tmp/pilot02-candidate -mindepth 1 -maxdepth 1 -type d | head -n1)"
          test -n "$ROOT"
          echo "CANDIDATE_ROOT=$ROOT" >> "$GITHUB_ENV"
          cd "$ROOT"
          sha256sum -c SHA256SUMS.txt

      - name: Run PILOT-02 product smoke
        env:
          BUILDKIT_PROGRESS: plain
        run: |
          set -o pipefail
          cd "$CANDIDATE_ROOT"
          bash scripts/pilot02/product-smoke.sh 2>&1 | tee "$GITHUB_WORKSPACE/pilot02-product-smoke.log"

      - name: Verify success marker
        run: |
          grep -F "PILOT-02 PRODUCT SMOKE OK" pilot02-product-smoke.log

      - name: Upload raw log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot02-product-smoke-log
          path: pilot02-product-smoke.log
