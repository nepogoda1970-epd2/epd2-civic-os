name: PB01-I08 Node 24.19 toolchain

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/pb01-i08-node2419-trigger.txt"

permissions:
  contents: read

jobs:
  package-node:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Verify and package exact runtime
        run: |
          test "$(node --version)" = "v24.19.0"
          node --version | tee node-version.txt
          npm --version | tee npm-version.txt
          NODE_BIN="$(readlink -f "$(command -v node)")"
          NODE_PREFIX="$(dirname "$(dirname "$NODE_BIN")")"
          echo "$NODE_BIN" > node-path.txt
          tar -C "$NODE_PREFIX" -czf node-v24.19.0-linux-x64-runtime.tgz bin include lib share
          sha256sum node-v24.19.0-linux-x64-runtime.tgz > node-runtime-sha256.txt
      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: pb01-i08-node-v24.19.0-linux-x64
          path: |
            node-v24.19.0-linux-x64-runtime.tgz
            node-version.txt
            npm-version.txt
            node-path.txt
            node-runtime-sha256.txt
          retention-days: 2
