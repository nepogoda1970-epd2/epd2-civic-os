name: api02-c10-authoritative-accept

on:
  push:
    branches:
      - tmp/api02-c10-canonical-accept
    paths:
      - 'handoff/API-02/C10_ACCEPTANCE_INPUTS.env'

permissions:
  contents: read
  actions: read

concurrency:
  group: api02-c10-authoritative-accept-${{ github.ref }}
  cancel-in-progress: false

env:
  CANDIDATE_ROLE: C10
  CANDIDATE_NAME: EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C10
  CANDIDATE_SHA256: 479e17323422f20e0badec5256ced45c48392e8a103698d9a32d37324e393eeb
  ENTERING_NAME: EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C9.zip
  ENTERING_SHA256: 42a1a59a5b4aaf769d38fac0c0426d5a436550b050d33b1cf7a0f4f1cd37a48b
  API01_NAME: EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5.zip
  API01_SHA256: cea2fb0e23ee174e802ec1899cf62e570e5c8659a0f31c7e6c3c3955bffa3d27
  DATA06_NAME: EPD2_DATA_SERIES_CANONICAL_BASELINE_0.1_FINAL.zip
  DATA06_SHA256: 8cba01997e4943f6d3c2b3fc1fe11e2c3527cd6c39123171a827fb8e3669cbf1
  PLAYWRIGHT_VERSION: '1.62.0'
  CANONICAL_CHROMIUM: /opt/pw-browsers/chromium
  PYTHONDONTWRITEBYTECODE: '1'
  UV_FROZEN: '1'
  UV_NO_SYNC_PROGRESS: '1'

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: 01 Checkout provenance/control only
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 02 Resolve externally pinned exact-byte inputs
        id: control
        shell: bash
        run: |
          set -euo pipefail
          CONTROL='handoff/API-02/C10_ACCEPTANCE_INPUTS.env'
          test -f "$CONTROL"
          CANDIDATE_SHA="$(grep '^candidate_sha256=' "$CONTROL" | cut -d= -f2-)"
          CANDIDATE_RUN="$(grep '^candidate_run_id=' "$CONTROL" | cut -d= -f2-)"
          ANCHORS_RUN="$(grep '^anchors_run_id=' "$CONTROL" | cut -d= -f2-)"
          [ "$CANDIDATE_SHA" = "$CANDIDATE_SHA256" ] || { echo '::error::control candidate SHA differs from governed C10 SHA'; exit 1; }
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          [[ "$ANCHORS_RUN" =~ ^[0-9]+$ ]]
          echo "candidate_run_id=$CANDIDATE_RUN" >> "$GITHUB_OUTPUT"
          echo "anchors_run_id=$ANCHORS_RUN" >> "$GITHUB_OUTPUT"

      - name: 03 Download exact C10 candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: api02-candidate
          path: incoming/candidate
          run-id: ${{ steps.control.outputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: 04 Download exact acceptance anchors
        uses: actions/download-artifact@v4
        with:
          name: api02-anchors
          path: incoming/anchors
          run-id: ${{ steps.control.outputs.anchors_run_id }}
          github-token: ${{ github.token }}

      - name: 05 Locate and verify all four exact archives before reading them
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          find_one() {
            local n="$1" roots="$2" found
            found="$(find $roots -type f -name "$n" 2>/dev/null | head -n 2)"
            [ "$(printf '%s\n' "$found" | grep -c .)" -eq 1 ] || { echo "::error::$n expected exactly once, got: $found"; exit 1; }
            printf '%s' "$found"
          }
          CAND="$(find_one "${CANDIDATE_NAME}.zip" 'incoming/candidate')"
          A1="$(find_one "$API01_NAME" 'incoming/anchors')"
          D6="$(find_one "$DATA06_NAME" 'incoming/anchors')"
          E1="$(find_one "$ENTERING_NAME" 'incoming/anchors')"
          echo "$CANDIDATE_SHA256  $CAND" | sha256sum -c -
          echo "$API01_SHA256  $A1" | sha256sum -c -
          echo "$DATA06_SHA256  $D6" | sha256sum -c -
          echo "$ENTERING_SHA256  $E1" | sha256sum -c -
          [ "$(stat -c '%s' "$CAND")" = '34652031' ]
          [ "$CANDIDATE_SHA256" != "$API01_SHA256" ]
          [ "$CANDIDATE_SHA256" != "$DATA06_SHA256" ]
          [ "$CANDIDATE_SHA256" != "$ENTERING_SHA256" ]
          echo "candidate=$(realpath "$CAND")" >> "$GITHUB_OUTPUT"
          echo "a1=$(realpath "$A1")" >> "$GITHUB_OUTPUT"
          echo "d6=$(realpath "$D6")" >> "$GITHUB_OUTPUT"
          echo "e1=$(realpath "$E1")" >> "$GITHUB_OUTPUT"

      - name: 06 Fresh extract exact sealed C10 and prove archive safety/CRC
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir work
          cd work
          python3 - '${{ steps.inputs.outputs.candidate }}' "$CANDIDATE_NAME" <<'PY'
          import pathlib, sys, zipfile
          archive, root = sys.argv[1:3]
          z = zipfile.ZipFile(archive)
          names = z.namelist()
          assert names and {n.split('/',1)[0] for n in names} == {root}
          assert len(names) == len(set(names)), 'duplicate ZIP members'
          assert all(not n.startswith('/') and '..' not in n.split('/') for n in names), 'unsafe path'
          assert z.testzip() is None, 'CRC failure'
          z.extractall('.')
          for info in z.infolist():
              if (info.external_attr >> 16) & 0o111:
                  pathlib.Path(info.filename).chmod(0o755)
          PY
          echo "root=$(pwd)/$CANDIDATE_NAME" >> "$GITHUB_OUTPUT"

      - name: 07 Verify candidate-carried acceptance-path identity and sealed checksums
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/api02/acceptance_path_identity.py --root .
          python3 scripts/validate_api02.py --acceptance-path-only
          sha256sum --quiet -c SHA256SUMS.txt
          n_listed="$(grep -c . SHA256SUMS.txt)"
          n_files="$(find . -type f ! -path ./SHA256SUMS.txt ! -path ./docs/api/API-02/API02_SEALED_FILE_MANIFEST.json | wc -l)"
          [ "$n_listed" = "$n_files" ]

      - name: 08 Verify Layer A/Layer B accounting against exact C10, API-01, DATA-06 and C9
        working-directory: ${{ steps.extract.outputs.root }}
        env:
          API02_ACCEPTED_API01_ZIP: ${{ steps.inputs.outputs.a1 }}
          API02_ACCEPTED_DATA06_ZIP: ${{ steps.inputs.outputs.d6 }}
          API02_ENTERING_CANDIDATE_ZIP: ${{ steps.inputs.outputs.e1 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/run-logs" "${RUNNER_TEMP}/candidate-supplied-evidence"
          python3 scripts/validate_api02.py --accounting-only | tee "${RUNNER_TEMP}/run-logs/accounting.out"
          grep -q '^API02_ACCOUNTING:PASS:' "${RUNNER_TEMP}/run-logs/accounting.out"
          cp -r validation/api02 "${RUNNER_TEMP}/candidate-supplied-evidence/validation-api02-as-sealed"
          printf '%s\n' 'CANDIDATE-SUPPLIED PRECHECK MATERIAL — NON-AUTHORITATIVE.' > "${RUNNER_TEMP}/candidate-supplied-evidence/README.txt"

      - name: 09 Install exact uv 0.12.5
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: false

      - name: 10 Install exact CPython 3.12.12 and 3.13.7
        run: |
          uv python install 3.12.12 3.13.7
          uv --version | grep -q '^uv 0\.12\.5'

      - name: 11 Install exact Node 22.16.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: 12 Pin npm 10.9.2
        run: |
          npm install -g npm@10.9.2
          node --version | grep -qx 'v22.16.0'
          npm --version | grep -qx '10.9.2'

      - name: 13 Build exact canonical PostgreSQL 16.15
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libreadline-dev zlib1g-dev libssl-dev >/dev/null
          curl -fsSL -o /tmp/postgresql-16.15.tar.gz http://archive.ubuntu.com/ubuntu/pool/main/p/postgresql-16/postgresql-16_16.15.orig.tar.gz
          echo '4f200ca23dfb120ff9838f13ce06014aad1d3c432d16ee9f93ab2000c0eeef7b  /tmp/postgresql-16.15.tar.gz' | sha256sum -c -
          mkdir -p /tmp/pgsrc
          tar xzf /tmp/postgresql-16.15.tar.gz -C /tmp/pgsrc
          cd /tmp/pgsrc/postgresql-16.15
          ./configure --prefix=/opt/pg1615 --without-icu --with-openssl >/tmp/pg-configure.log
          make -j"$(nproc)" >/tmp/pg-make.log
          make install >/tmp/pg-install.log
          (cd contrib/pgcrypto && make -j"$(nproc)" >>/tmp/pg-make.log && make install >>/tmp/pg-install.log)
          /opt/pg1615/bin/postgres --version | grep -q '16.15'

      - name: 14 Start PostgreSQL 16.15 and canonical test databases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/pg1615"
          /opt/pg1615/bin/initdb -D "${RUNNER_TEMP}/pg1615/data" --auth=trust -U epd2 >/dev/null
          /opt/pg1615/bin/pg_ctl -D "${RUNNER_TEMP}/pg1615/data" -l "${RUNNER_TEMP}/pg1615/pg.log" -o '-p 5432 -c listen_addresses=127.0.0.1' -w start
          v="$(/opt/pg1615/bin/psql -h 127.0.0.1 -p 5432 -U epd2 -d postgres -tAc 'show server_version')"
          [ "$v" = '16.15' ] || { echo "::error::server_version=$v"; exit 1; }
          /opt/pg1615/bin/psql -h 127.0.0.1 -p 5432 -U epd2 -d postgres -c "alter user epd2 password 'epd2-ci-only'"
          for db in epd2_test epd2_voting_test epd2_identity_test; do
            /opt/pg1615/bin/psql -h 127.0.0.1 -p 5432 -U epd2 -d postgres -c "create database $db owner epd2"
          done
          /opt/pg1615/bin/psql -h 127.0.0.1 -p 5432 -U epd2 -d epd2_test -c 'create extension if not exists pgcrypto'
          echo '/opt/pg1615/bin' >> "$GITHUB_PATH"

      - name: 15 Frozen-sync exact dependency graph outside candidate tree
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/epd2-api02-root-env" uv sync --frozen --all-groups --python 3.12.12
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/epd2-api02-root-env" uv run --frozen python --version | grep -qx 'Python 3.12.12'
          UV_PROJECT_ENVIRONMENT="${RUNNER_TEMP}/epd2-api02-gateway-env" uv sync --frozen --all-groups --python 3.13.7
          "${RUNNER_TEMP}/epd2-api02-gateway-env/bin/python" --version | grep -qx 'Python 3.13.7'
          [ ! -e .venv ]

      - name: 16 Provision frozen Chromium fail-closed outside candidate tree
        working-directory: ${{ steps.extract.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          LOCKED="$(python3 -c "import json; print(json.load(open('package-lock.json'))['packages']['node_modules/@playwright/test']['version'])")"
          [ "$LOCKED" = "$PLAYWRIGHT_VERSION" ]
          PW_DIR="${RUNNER_TEMP}/playwright-provision"
          mkdir -p "$PW_DIR"
          (cd "$PW_DIR" && npm init -y >/dev/null && npm install --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION")
          INSTALLED="$(node -e "console.log(require('$PW_DIR/node_modules/playwright/package.json').version)")"
          [ "$INSTALLED" = "$PLAYWRIGHT_VERSION" ]
          "$PW_DIR/node_modules/.bin/playwright" install chromium
          CHROMIUM_EXECUTABLE="$(node -e "console.log(require('$PW_DIR/node_modules/playwright').chromium.executablePath())")"
          test -f "$CHROMIUM_EXECUTABLE" && test -x "$CHROMIUM_EXECUTABLE"
          sudo mkdir -p "$(dirname "$CANONICAL_CHROMIUM")"
          sudo ln -sfn "$CHROMIUM_EXECUTABLE" "$CANONICAL_CHROMIUM"
          test -x "$CANONICAL_CHROMIUM"
          CHROMIUM_VERSION="$("$CANONICAL_CHROMIUM" --version)"
          python3 - "$PW_DIR" "$CHROMIUM_EXECUTABLE" "$CHROMIUM_VERSION" "$LOCKED" > "${RUNNER_TEMP}/run-logs/browser_provisioning.json" <<'PY'
          import json, os, subprocess, sys
          pw, exe, version, locked = sys.argv[1:5]
          json.dump({
            'step':'16 browser provisioning (fail-closed)',
            'playwright_frozen_version_package_lock':locked,
            'playwright_workflow_pin':os.environ['PLAYWRIGHT_VERSION'],
            'playwright_cli_version':subprocess.run([f'{pw}/node_modules/.bin/playwright','--version'],capture_output=True,text=True).stdout.strip(),
            'resolution_method':"require('playwright').chromium.executablePath()",
            'resolved_chromium_executable':exe,
            'resolved_exists':os.path.isfile(exe),
            'resolved_executable_bit':os.access(exe,os.X_OK),
            'canonical_chromium_path':os.environ['CANONICAL_CHROMIUM'],
            'canonical_target':os.path.realpath(os.environ['CANONICAL_CHROMIUM']),
            'canonical_executable_bit':os.access(os.environ['CANONICAL_CHROMIUM'],os.X_OK),
            'chromium_version':version,
            'fail_open_suppression_used':False,
            'github_run_id':os.environ['GITHUB_RUN_ID']
          },sys.stdout,indent=2)
          PY

      - name: 17 Run complete API-02 validator on exact sealed C10
        id: validate
        working-directory: ${{ steps.extract.outputs.root }}
        env:
          API02_ACCEPTED_API01_ZIP: ${{ steps.inputs.outputs.a1 }}
          API02_ACCEPTED_DATA06_ZIP: ${{ steps.inputs.outputs.d6 }}
          API02_ENTERING_CANDIDATE_ZIP: ${{ steps.inputs.outputs.e1 }}
          API02_BROWSER_PROVISIONING_JSON: ${{ runner.temp }}/run-logs/browser_provisioning.json
          EPD2_TEST_DATABASE_URL: postgresql://epd2:epd2-ci-only@127.0.0.1:5432/epd2_test
          EPD2_VOTING_TEST_DATABASE_URL: postgresql://epd2:epd2-ci-only@127.0.0.1:5432/epd2_voting_test
          EPD2_IDENTITY_DATABASE_URL: postgresql://epd2:epd2-ci-only@127.0.0.1:5432/epd2_identity_test
          DATA06_PG_BINDIR: /opt/pg1615/bin
          DATA06_WORKDIR: /tmp/d6w
          EPD2_LOCAL_CI_HOME: ${{ runner.temp }}/epd2-local-ci-api02
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/epd2-api02-root-env
          API02_GATEWAY_ENV: ${{ runner.temp }}/epd2-api02-gateway-env
          API02_SCRATCH: ${{ runner.temp }}/epd2-api02-scratch
          EPD2_CHROMIUM: /opt/pw-browsers/chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$DATA06_WORKDIR"
          uv run --frozen python scripts/validate_api02.py --candidate-zip '${{ steps.inputs.outputs.candidate }}' | tee "${RUNNER_TEMP}/run-logs/validator.out"
          grep -q '^API02_RESULT:PASS:validation/api02/validator_result.json$' "${RUNNER_TEMP}/run-logs/validator.out"

      - name: 18 Assert complete 32-gate PASS, mutation detection and exact runtime evidence
        working-directory: ${{ steps.extract.outputs.root }}
        env:
          AUTHORITATIVE_CANDIDATE_SHA: ${{ env.CANDIDATE_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          r=json.load(open('validation/api02/final_validator_result.json'))
          gates=r['gates']
          assert r['result']=='PASS' and r['failed_gates']==[], r
          assert len(gates)==32, len(gates)
          assert [int(g['gate']) for g in gates]==list(range(32)), [g['gate'] for g in gates]
          assert all(g['result']=='PASS' for g in gates), [(g['gate'],g['result']) for g in gates if g['result']!='PASS']
          assert r['acceptance_state']=='LOCAL_PRECHECK_PASS_CANDIDATE_NOT_ACCEPTED'
          st=json.load(open('validation/api02/validator_selftest_result.json'))
          assert st['result']=='PASS' and st['fixture_count']>=81
          assert all(f['clean_accepted'] and f['mutation_rejected'] for f in st['fixtures'])
          pg=json.load(open('validation/api02/postgresql_result.json'))
          assert pg['result']=='PASS' and pg['server_version']=='16.15'
          br=json.load(open('validation/api02/browser_environment_result.json'))
          assert br['result']=='PASS' and not br['browser_environment_problems'] and not br['workflow_provisioning_problems']
          ident=json.load(open('validation/api02/candidate_identity_result.json'))
          assert ident['result']=='PASS' and ident['candidate']=='C10'
          env=json.load(open('validation/api02/environment.json'))
          assert env['github_actions'] is True and env['github_run_id']==os.environ['GITHUB_RUN_ID']
          assert env['github_sha']==os.environ['GITHUB_SHA']
          assert ident['sha256']==os.environ['AUTHORITATIVE_CANDIDATE_SHA']
          json.dump({
            'schema':'epd2.api02.authoritative-acceptance/1',
            'authoritative':True,
            'workflow':'.github/workflows/api02-c10-authoritative-accept.yml',
            'github_run_id':os.environ['GITHUB_RUN_ID'],
            'github_sha':os.environ['GITHUB_SHA'],
            'candidate':'C10',
            'candidate_sha256':os.environ['AUTHORITATIVE_CANDIDATE_SHA'],
            'validator_terminal':'API02_RESULT:PASS:validation/api02/validator_result.json',
            'gates_passed':32,
            'mutation_fixtures_detected':st['fixture_count'],
            'postgresql_server_version':pg['server_version'],
            'result':'PASS'
          },open('validation/api02/authoritative_run.json','w'),indent=2)
          print('AUTHORITATIVE_API02_ACCEPTANCE:PASS',os.environ['GITHUB_RUN_ID'],os.environ['AUTHORITATIVE_CANDIDATE_SHA'])
          PY

      - name: 19 Publish authoritative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api02-c10-acceptance-evidence-${{ github.run_id }}
          path: |
            ${{ steps.extract.outputs.root }}/validation/api02/
            ${{ runner.temp }}/run-logs/
            ${{ runner.temp }}/candidate-supplied-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: 20 Authoritative result
        shell: bash
        run: |
          echo "API-02 C10 authoritative acceptance run ${GITHUB_RUN_ID}"
          echo "candidate sha256 ${CANDIDATE_SHA256}"
          echo 'outcome: PASS — all fail-closed steps completed successfully.'
