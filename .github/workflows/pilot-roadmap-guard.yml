name: PILOT Roadmap Guard

on:
  push:
    branches:
      - main
      - pilot02-verify
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  roadmap-scope:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify locked roadmap
        run: python scripts/check_pilot_roadmap.py --self-check

      - name: Verify any PILOT-03 candidate archives in repository root
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(EPD2_PILOT03*.zip EPD2_PILOT-03*.zip)
          for candidate in "${candidates[@]}"; do
            python scripts/check_pilot_roadmap.py --zip "$candidate"
          done

      - name: Guard result
        run: echo 'PILOT roadmap guard PASS'

  ctrl01-canonical-promotion:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      BASE_MAIN: 217559b7f21c338d6fe8d4e4676082cd3840251c
      ACCEPTANCE_RUN_ID: '33618683269'
      CANDIDATE_FILE: EPD2_CTRL01_GOVERNED_CONTROL_PLANE_CANDIDATE_0.1_C1.zip
      CANDIDATE_SHA256: 07134db175587a9aa441fe87a811c7cfca6cc8dfbd30006279dd0edb598783b5
      CANDIDATE_SIZE: '190099'
    steps:
      - name: Checkout current canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fail closed on pre-promotion drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          trigger="$(git rev-parse HEAD)"
          test "$(git rev-parse origin/main)" = "$trigger"
          git merge-base --is-ancestor "$BASE_MAIN" HEAD
          extras="$(git diff --name-only "$BASE_MAIN"..HEAD | grep -Ev '^\.github/workflows/(ctrl01-c1-promote-canonical|pilot-roadmap-guard)\.yml$' || true)"
          test -z "$extras" || { echo 'unexpected canonical drift:' >&2; echo "$extras" >&2; exit 1; }
          echo "PROMOTION_TRIGGER_COMMIT=$trigger" >> "$GITHUB_ENV"

      - name: Download exact accepted candidate
        uses: actions/download-artifact@v4
        with:
          name: ctrl01-c1-sealed-candidate-33618683269
          path: ${{ runner.temp }}/candidate
          repository: nepogoda1970-epd2/epd2-civic-os
          run-id: 33618683269
          github-token: ${{ github.token }}

      - name: Download authoritative evidence
        uses: actions/download-artifact@v4
        with:
          name: ctrl01-c1-authoritative-evidence-33618683269
          path: ${{ runner.temp }}/evidence
          repository: nepogoda1970-epd2/epd2-civic-os
          run-id: 33618683269
          github-token: ${{ github.token }}

      - name: Verify immutable acceptance basis
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/candidate/$CANDIDATE_FILE"
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "$CANDIDATE_SHA256"
          test "$(stat -c '%s' "$candidate")" = "$CANDIDATE_SIZE"
          mkdir -p "$RUNNER_TEMP/extracted"
          unzip -q "$candidate" -d "$RUNNER_TEMP/extracted"
          root="$RUNNER_TEMP/extracted/EPD2_CTRL01_GOVERNED_CONTROL_PLANE_CANDIDATE_0.1_C1"
          (cd "$root" && sha256sum -c SHA256SUMS.txt)
          ROOT="$root" EVIDENCE="$RUNNER_TEMP/evidence/ctrl01_c1_authoritative_acceptance_result.json" python - <<'PY'
          import json, os
          from pathlib import Path

          identity = json.loads((Path(os.environ['ROOT']) / 'candidate_identity.json').read_text())
          assert identity['self_state'] == 'CANDIDATE_NOT_ACCEPTED', identity
          assert identity['base_main_commit'] == os.environ['BASE_MAIN'], identity
          assert identity['api06_state'] == 'NEXT / NOT ACCEPTED', identity
          assert identity['system_trial_preview'] == 'CHECKPOINT_NOT_OPEN', identity
          assert identity['ctrl_layer_state'] == 'OPEN / NOT CLOSED', identity

          evidence = json.loads(Path(os.environ['EVIDENCE']).read_text())
          assert evidence['conclusion'] == 'PASS', evidence
          assert evidence['candidate_sha256'] == os.environ['CANDIDATE_SHA256'], evidence
          assert evidence['candidate_size'] == int(os.environ['CANDIDATE_SIZE']), evidence
          assert evidence['base_main'] == os.environ['BASE_MAIN'], evidence
          assert evidence['run_id'] == int(os.environ['ACCEPTANCE_RUN_ID']), evidence
          assert evidence['job'] == 'authoritative-review', evidence
          assert evidence['gates'] == '22/22 PASS', evidence
          assert evidence['mutations'] == '37/37 DETECTED', evidence
          assert evidence['self_acceptance'] is False, evidence
          assert set(evidence['unreconciled_dependencies']) == {'API-06'}, evidence
          assert evidence['system_trial_preview'] == 'CHECKPOINT_NOT_OPEN / API-06 BLOCKED', evidence
          assert evidence['ctrl_layer_state'] == 'OPEN / NOT CLOSED', evidence
          assert evidence['terminal_marker'] == f"CTRL01_C1_AUTHORITATIVE_RESULT:PASS:{os.environ['CANDIDATE_SHA256']}:{os.environ['CANDIDATE_SIZE']}", evidence
          PY

      - name: Write canonical acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ctrl/CTRL-01
          cp "$RUNNER_TEMP/evidence/ctrl01_c1_authoritative_acceptance_result.json" docs/ctrl/CTRL-01/CTRL01_C1_AUTHORITATIVE_ACCEPTANCE_RESULT.json
          python - <<'PY'
          import json
          from pathlib import Path

          acceptance = {
            'schema': 'epd2.ctrl01.acceptance-record/1',
            'stage': 'CTRL-01 — Governed Control Plane',
            'decision': 'ACCEPTED / CLOSED',
            'decision_date': '2026-09-02',
            'authority': 'Project Owner',
            'scope': 'BOUNDED_CTRL01_STAGE_ONLY',
            'previous_state': 'NOT_STARTED / PRESEAL PARALLEL WORK NOT ACCEPTED',
            'overall_ctrl_layer': 'OPEN / NOT CLOSED',
            'system_trial_preview': 'CHECKPOINT_NOT_OPEN / API-06 BLOCKED',
            'candidate': {
              'file': 'EPD2_CTRL01_GOVERNED_CONTROL_PLANE_CANDIDATE_0.1_C1.zip',
              'sha256': '07134db175587a9aa441fe87a811c7cfca6cc8dfbd30006279dd0edb598783b5',
              'size_bytes': 190099,
              'base_main': '217559b7f21c338d6fe8d4e4676082cd3840251c',
              'p1_sha256': '490d8ca31d4607da204f03addaf900161257b289d51ec6f0b7e52433fd5cbe71',
              'self_state_before_governance_decision': 'CANDIDATE_NOT_ACCEPTED'
            },
            'authoritative_review': {
              'workflow': '.github/workflows/ctrl01-c1-canonical.yml',
              'workflow_commit': '246824a099fd1e7359e79650a7107d7cfa8ddb43',
              'run_id': 33618683269,
              'build_job_id': 100210392348,
              'authoritative_job_id': 100210596079,
              'conclusion': 'PASS',
              'terminal_marker': 'CTRL01_C1_AUTHORITATIVE_RESULT:PASS:07134db175587a9aa441fe87a811c7cfca6cc8dfbd30006279dd0edb598783b5:190099',
              'candidate_artifact': {'name': 'ctrl01-c1-sealed-candidate-33618683269', 'id': 9842006799, 'artifact_zip_sha256': '12898d5a9ad7658aefe02c0ad62be4c91328e2420e41c7c56291647afd05dbb3'},
              'build_evidence_artifact': {'name': 'ctrl01-c1-build-evidence-33618683269', 'id': 9842007526, 'artifact_zip_sha256': 'a722f8a2bb614a69e089d63a14a494b3466588791ba1bc018d252bdd1c3d7b7e'},
              'authoritative_evidence_artifact': {'name': 'ctrl01-c1-authoritative-evidence-33618683269', 'id': 9842027832, 'artifact_zip_sha256': '4f4454f9cbdf17059882136ee7588e470e61458636795885adb8c74c03ae82ef'}
            },
            'verification': {
              'ruff': 'PASS',
              'mypy': 'PASS / 17 source files',
              'pytest_build': '178 passed',
              'pytest_authoritative': '178 passed',
              'governance_gates': '22/22 PASS',
              'mutations': '37/37 DETECTED',
              'commit_time_reauthorization_mutations': 43,
              'same_bytes_and_internal_sha256s': 'PASS',
              'self_acceptance': False
            },
            'dependencies': {'API-06': 'NEXT / NOT ACCEPTED; API layer remains open until API-06 closes'},
            'open_blockers_for_ctrl01_acceptance': [],
            'remaining_program_blockers': ['API-06 authoritative acceptance before API closure and System Trial Preview opening'],
            'master_future_register': {'changed': False, 'reason': 'No FIR status promotion is requested or evidenced by bounded CTRL-01 C1 acceptance.'},
            'nonclaims': ['overall CTRL layer closure', 'System Trial Preview opening', 'production readiness', 'legal activation', 'BSI/Common Criteria/EAL4 certification', 'final security acceptance']
          }
          Path('docs/ctrl/CTRL-01/CTRL01_C1_ACCEPTANCE_RECORD.json').write_text(json.dumps(acceptance, indent=2, sort_keys=True, ensure_ascii=False) + '\n')

          disposition = {
            'schema': 'epd2.ctrl01.dependency-disposition/1',
            'stage': 'CTRL-01 C1',
            'decision': 'BOUNDED_ACCEPTANCE_ALLOWED',
            'api06': 'NEXT / NOT ACCEPTED',
            'api_layer': 'OPEN',
            'system_trial_preview': 'CHECKPOINT_NOT_OPEN',
            'overall_ctrl_layer': 'OPEN / NOT CLOSED',
            'classification': 'API-06 is not a blocker to bounded CTRL-01 C1 acceptance; it remains a blocker to API-layer closure and System Trial Preview opening.',
            'authoritative_acceptance_run': 33618683269,
            'candidate_sha256': '07134db175587a9aa441fe87a811c7cfca6cc8dfbd30006279dd0edb598783b5'
          }
          Path('docs/ctrl/CTRL-01/CTRL01_C1_DEPENDENCY_DISPOSITION.json').write_text(json.dumps(disposition, indent=2, sort_keys=True) + '\n')
          PY

      - name: Update canonical Program Control Register
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md')
          text = p.read_text()
          old = '| CTRL | `NOT_STARTED` | Control-plane specifications may be prepared; integrated closure follows OPS/INFRA. |'
          new = '| CTRL | `CTRL-01 ACCEPTED / CLOSED; CTRL LAYER OPEN` | Exact bounded CTRL-01 C1 Governed Control Plane is accepted/closed. The overall CTRL layer remains open; API-06 remains NEXT / NOT ACCEPTED and System Trial Preview remains CHECKPOINT_NOT_OPEN. Later CTRL work and whole-layer closure remain separately governed. |'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected CTRL row count: {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = '\n\n## 2. Program phase state'
          note = """

**CTRL-01 authoritative acceptance and bounded stage closure (2026-09-02):** exact sealed candidate `EPD2_CTRL01_GOVERNED_CONTROL_PLANE_CANDIDATE_0.1_C1.zip`, SHA-256 `07134db175587a9aa441fe87a811c7cfca6cc8dfbd30006279dd0edb598783b5`, size `190,099` bytes, passed independent exact-byte GitHub Actions review in `.github/workflows/ctrl01-c1-canonical.yml`, authoritative run `33618683269`, build job `100210392348`, authoritative job `100210596079`, workflow commit `246824a099fd1e7359e79650a7107d7cfa8ddb43`, conclusion `success`. The independent replay verified the complete internal SHA-256 seal, locked dependencies, Ruff, mypy, `178/178` runtime tests, all `22/22` governed CTRL gates, `37/37` mutation attacks detected, and `43` commit-time reauthorization mutations. Terminal marker: `CTRL01_C1_AUTHORITATIVE_RESULT:PASS:07134db175587a9aa441fe87a811c7cfca6cc8dfbd30006279dd0edb598783b5:190099`. Authoritative evidence artifact `ctrl01-c1-authoritative-evidence-33618683269`, artifact ID `9842027832`, artifact ZIP SHA-256 `4f4454f9cbdf17059882136ee7588e470e61458636795885adb8c74c03ae82ef`. The sealed candidate correctly retained `CANDIDATE_NOT_ACCEPTED`; that no-self-acceptance state is superseded only for this bounded module by `docs/ctrl/CTRL-01/CTRL01_C1_ACCEPTANCE_RECORD.json`. **CTRL-01 C1 is therefore `ACCEPTED / CLOSED` as a bounded Governed Control Plane stage.** The overall CTRL layer remains **OPEN / NOT CLOSED**. `API-06` remains `NEXT / NOT ACCEPTED`; the API layer remains open and System Trial Preview remains **CHECKPOINT_NOT_OPEN**. No production-readiness, legal-activation, BSI/Common Criteria/EAL4 or final-security claim follows.
"""
          if text.count(marker) != 1:
              raise SystemExit(f'unexpected phase marker count: {text.count(marker)}')
          p.write_text(text.replace(marker, note + marker, 1))
          PY

      - name: Assert canonical acceptance semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          a = json.loads(Path('docs/ctrl/CTRL-01/CTRL01_C1_ACCEPTANCE_RECORD.json').read_text())
          r = json.loads(Path('docs/ctrl/CTRL-01/CTRL01_C1_AUTHORITATIVE_ACCEPTANCE_RESULT.json').read_text())
          d = json.loads(Path('docs/ctrl/CTRL-01/CTRL01_C1_DEPENDENCY_DISPOSITION.json').read_text())
          assert a['decision'] == 'ACCEPTED / CLOSED'
          assert a['scope'] == 'BOUNDED_CTRL01_STAGE_ONLY'
          assert a['overall_ctrl_layer'] == 'OPEN / NOT CLOSED'
          assert a['open_blockers_for_ctrl01_acceptance'] == []
          assert a['verification']['self_acceptance'] is False
          assert r['conclusion'] == 'PASS' and r['gates'] == '22/22 PASS' and r['mutations'] == '37/37 DETECTED'
          assert d['decision'] == 'BOUNDED_ACCEPTANCE_ALLOWED' and d['system_trial_preview'] == 'CHECKPOINT_NOT_OPEN'
          pcr = Path('docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md').read_text()
          assert '| CTRL | `CTRL-01 ACCEPTED / CLOSED; CTRL LAYER OPEN` |' in pcr
          assert '**CTRL-01 C1 is therefore `ACCEPTED / CLOSED` as a bounded Governed Control Plane stage.**' in pcr
          PY
          git diff --check

      - name: Restore transport workflows and commit canonical governance state
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$BASE_MAIN" -- .github/workflows/pilot-roadmap-guard.yml
          rm -f .github/workflows/ctrl01-c1-promote-canonical.yml
          git config user.name 'epd2-governance-bot'
          git config user.email 'epd2-governance-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'no canonical governance delta' >&2; exit 1; }
          git commit -m 'governance(ctrl01): accept and close bounded CTRL-01 C1'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$PROMOTION_TRIGGER_COMMIT"
          git push origin HEAD:main
          echo "CTRL01_C1_CANONICAL_PROMOTION:PASS:$(git rev-parse HEAD)"
