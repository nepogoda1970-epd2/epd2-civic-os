name: PILOT Roadmap Guard

on:
  push:
    branches:
      - main
      - pilot02-verify
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  roadmap-scope:
    runs-on: ubuntu-24.04
    env:
      EPD2_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      EPD2_LOCAL_CI_HOME: ${{ runner.temp }}/epd2-local-ci
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify locked roadmap
        run: python scripts/check_pilot_roadmap.py --self-check

      - name: Verify any PILOT-03 candidate archives in repository root
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          candidates=(EPD2_PILOT03*.zip EPD2_PILOT-03*.zip)
          for candidate in "${candidates[@]}"; do
            python scripts/check_pilot_roadmap.py --zip "$candidate"
          done

      - name: Guard result
        run: echo 'PILOT roadmap guard PASS'

      - name: Set up Node 24.19.0 for C9 exact-byte acceptance
        if: github.event_name == 'pull_request' && github.head_ref == 'tmp/pilot04-c9-clean-20260822'
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Set up uv 0.10.0 for C9 exact-byte acceptance
        if: github.event_name == 'pull_request' && github.head_ref == 'tmp/pilot04-c9-clean-20260822'
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          enable-cache: true

      - name: Start PostgreSQL 16.15 for C9 exact-byte acceptance
        if: github.event_name == 'pull_request' && github.head_ref == 'tmp/pilot04-c9-clean-20260822'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          docker run -d --name pilot04-c9-pg \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 postgres:16.15
          for i in $(seq 1 60); do
            if PGPASSWORD=postgres psql "$EPD2_TEST_DATABASE_URL" -Atc 'SELECT 1' >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          PGPASSWORD=postgres psql "$EPD2_TEST_DATABASE_URL" -Atc 'SHOW server_version'

      - name: Download frozen PB01 I10 C6 for C9 exact-byte acceptance
        if: github.event_name == 'pull_request' && github.head_ref == 'tmp/pilot04-c9-clean-20260822'
        uses: actions/download-artifact@v4
        with:
          name: pb01-i10-c6-exact-candidate
          path: pb01
          github-token: ${{ github.token }}
          repository: nepogoda1970-epd2/epd2-civic-os
          run-id: '32388797195'

      - name: Run PILOT-04 C9 exact-byte authoritative acceptance
        if: github.event_name == 'pull_request' && github.head_ref == 'tmp/pilot04-c9-clean-20260822'
        shell: bash
        run: bash scripts/tmp_pilot04_c9_exact_accept.sh

      - name: Upload PILOT-04 C9 authoritative evidence
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'tmp/pilot04-c9-clean-20260822'
        uses: actions/upload-artifact@v4
        with:
          name: pilot04-c9-roadmap-authoritative-evidence
          path: |
            PILOT04_C9_ACCEPTANCE_EVIDENCE.json
            PILOT04_C9_AUTHORITATIVE.log
          if-no-files-found: warn
          retention-days: 90

      - name: Upload exact accepted C9 candidate
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'tmp/pilot04-c9-clean-20260822'
        uses: actions/upload-artifact@v4
        with:
          name: pilot04-c9-roadmap-exact-accepted-candidate
          path: inputs/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C9.zip
          if-no-files-found: error
          retention-days: 90
