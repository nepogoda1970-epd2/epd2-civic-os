name: ctrl02-discover

on:
  push:
    branches:
      - handoff/ctrl
    paths:
      - '.github/workflows/ctrl02-discover.yml'
      - 'handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.1_PRESEAL.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact CTRL-02 candidate
        shell: bash
        run: |
          set -euo pipefail
          ZIP='handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.1_PRESEAL.zip'
          test -f "$ZIP"
          sha256sum "$ZIP"
          stat -c 'SIZE=%s' "$ZIP"
          rm -rf /tmp/ctrl02 && mkdir -p /tmp/ctrl02
          python - <<'PY'
          import hashlib, pathlib, zipfile, re, sys
          p=pathlib.Path('handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.1_PRESEAL.zip')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          print('CTRL02_ARCHIVE_SHA256='+h)
          print('CTRL02_ARCHIVE_SIZE='+str(p.stat().st_size))
          with zipfile.ZipFile(p) as z:
              bad=z.testzip()
              if bad: raise SystemExit('ZIP_CRC_FAIL:'+bad)
              names=z.namelist()
              if len(names)!=len(set(names)): raise SystemExit('ZIP_DUPLICATE_PATHS')
              for n in names:
                  pp=pathlib.PurePosixPath(n)
                  if pp.is_absolute() or '..' in pp.parts: raise SystemExit('ZIP_PATH_TRAVERSAL:'+n)
              print('ZIP_ENTRIES='+str(len(names)))
              nested=[n for n in names if n.lower().endswith(('.zip','.tar','.tgz','.tar.gz','.7z'))]
              print('NESTED_ARCHIVES='+repr(nested[:50]))
              print('--- RELEVANT PATHS ---')
              pats=re.compile(r'(ctrl|control|handover|handoff|accept|verify|valid|test|report|lineage|candidate|entrypoint|program_control|master_future|readme|pyproject|makefile)',re.I)
              rel=[n for n in names if pats.search(n)]
              for n in rel[:600]: print(n)
              if len(rel)>600: print(f'... {len(rel)-600} more relevant paths')
              z.extractall('/tmp/ctrl02')
          roots=[x for x in pathlib.Path('/tmp/ctrl02').iterdir()]
          print('--- EXTRACT ROOT ---')
          for x in roots: print(x)
          PY
          echo '--- CANONICAL / CTRL TEXT MATCHES ---'
          python - <<'PY'
          import pathlib,re
          root=pathlib.Path('/tmp/ctrl02')
          files=list(root.rglob('*'))
          text=[]
          for p in files:
              if not p.is_file() or p.stat().st_size>2_000_000: continue
              if p.suffix.lower() not in {'.md','.json','.yml','.yaml','.toml','.txt','.py','.ps1','.sh'} and p.name not in {'Makefile'}: continue
              try: s=p.read_text('utf-8')
              except Exception: continue
              if re.search(r'CTRL[-_ ]?0?2|regional intervention|privileged operations|FIR-GOV-004|Program Control Register',s,re.I):
                  text.append((str(p),s))
          for path,s in text[:80]:
              print('\n### FILE',path)
              lines=s.splitlines()
              hits=[i for i,l in enumerate(lines) if re.search(r'CTRL[-_ ]?0?2|regional intervention|privileged operations|FIR-GOV-004|CTRL =|CTRL-',l,re.I)]
              shown=set()
              for i in hits[:80]:
                  a=max(0,i-2); b=min(len(lines),i+4)
                  for j in range(a,b):
                      if j not in shown:
                          print(f'{j+1}: {lines[j]}'); shown.add(j)
          PY
          echo 'CTRL02_DISCOVERY_PASS'
