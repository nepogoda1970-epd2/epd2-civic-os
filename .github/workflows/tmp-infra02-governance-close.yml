name: INFRA-02 Governance Close

on:
  push:
    branches:
      - tmp/infra02-governance-close-20260902

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile and record INFRA-02 acceptance
        shell: bash
        env:
          PATCH_B64: 
        run: |
          set -euo pipefail
          EXPECTED_BASE="4b95cc952897bd78fe912a2737f53e66264d6ff1"
          BASE="$(git rev-parse HEAD)"
          test "$BASE" = "$EXPECTED_BASE"
          test ! -e docs/infra/INFRA-02/INFRA02_ACCEPTANCE_RECORD.json
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/infra02_close.py
          python /tmp/infra02_close.py
          python -m json.tool docs/infra/INFRA-02/INFRA02_ACCEPTANCE_RECORD.json >/dev/null
          grep -F 'INFRA-02 ACCEPTED / CLOSED; INFRA LAYER OPEN' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md >/dev/null
          grep -F 'INFRA02_AUTHORITATIVE_RESULT:PASS' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md >/dev/null
          grep -F 'API-05 = ACCEPTED / CLOSED' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md >/dev/null
          grep -F 'API-06 = NEXT' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md >/dev/null
          git config user.name "epd2-governance-bot"
          git config user.email "epd2-governance-bot@users.noreply.github.com"
          git add docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md docs/infra/INFRA-02/INFRA02_ACCEPTANCE_RECORD.json
          git diff --cached --check
          git commit -m "governance(infra02): accept and close INFRA-02"
          COMMIT="$(git rev-parse HEAD)"
          git push origin HEAD:main
          echo "INFRA02_GOVERNANCE_COMMIT:PASS:$COMMIT"
