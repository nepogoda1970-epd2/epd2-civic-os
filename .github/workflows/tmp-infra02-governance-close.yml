name: INFRA-02 Governance Close

on:
  push:
    branches:
      - tmp/infra02-governance-close-20260902

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile and record INFRA-02 acceptance
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE="4b95cc952897bd78fe912a2737f53e66264d6ff1"
          BASE="$(git rev-parse HEAD)"
          test "$BASE" = "$EXPECTED_BASE"
          test ! -e docs/infra/INFRA-02/INFRA02_ACCEPTANCE_RECORD.json

          python - <<'PY'
          from pathlib import Path
          import json

          p = Path('docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md')
          s = p.read_text()

          assert 'INFRA02_AUTHORITATIVE_RESULT:PASS' not in s
          assert '`INFRA-02 ACCEPTED / CLOSED`' not in s

          infra01_marker = '**OPS-01 authoritative acceptance and bounded stage closure (2026-09-01):**'
          assert infra01_marker in s
          infra02_para = '''**INFRA-02 authoritative acceptance and bounded stage closure (2026-09-02):** exact sealed candidate `EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip`, SHA-256 `d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c`, size `15,980,332` bytes, passed the independent exact-byte GitHub Actions authoritative review, run `33574647511`, job `100075828121`, conclusion `success`. The review independently verified exact transport identity, clean single-root ZIP/seal hygiene, the exact accepted INFRA-01 C3 predecessor SHA-256 `5cd90da141056badc38ee3fb34f2d648002ace5b87c6a0cce1d331431364b131`, exact predecessor delta `35 added / 11 modified / 0 removed / 1450 unchanged`, governance freshness, `146/146` targeted INFRA-01/INFRA-02 unit and mutation tests, and the complete canonical harness `51/51 PASS` including locked dependencies, backend/security, frontend/build/browser/accessibility/visual, secret scans, vulnerability gate, Git-history secret scan, package/freeze integrity, SBOM/provenance, promotion-by-digest, drift detection and release evidence sanitation. Current-run evidence verification returned `INFRA01_EVIDENCE_RESULT:PASS`; the harness-produced package and submitted exact candidate were independently bound by `INFRA02_PACKAGE_CONTENT_IDENTITY:PASS:1496`; terminal authoritative marker `INFRA02_AUTHORITATIVE_RESULT:PASS:d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c:15980332`. Post-run reconciliation against newer `main@4b95cc952897bd78fe912a2737f53e66264d6ff1` found only the API-05 governance closure in the Program Control Register and a formatting-only API-05 governance helper change after the run's freshness gate; neither changes INFRA-02 source, accepted INFRA-01 predecessor, Master/BSI authority, or supply-chain acceptance semantics, so classification is `NO_INFRA02_CONTROLLING_CONFLICT`. The governance decision is recorded in `docs/infra/INFRA-02/INFRA02_ACCEPTANCE_RECORD.json`. **INFRA-02 is therefore `ACCEPTED / CLOSED` as the bounded CI/CD & Software Supply-Chain Integrity stage.** The overall INFRA layer remains open; INFRA-03…INFRA-07 are not accepted or closed by this decision. `API-06 = NEXT` remains unchanged. No production-readiness, hosting-provider, legal-activation, BSI/CC/EAL4 or final-security claim follows from this transition.

'''
          s = s.replace(infra01_marker, infra02_para + infra01_marker, 1)

          old_row = '| INFRA | `INFRA-01 ACCEPTED / CLOSED; INFRA LAYER OPEN` | Exact bounded INFRA-01 CI Acceptance Harness & Release-Integrity Foundation is accepted/closed at C3. The overall INFRA layer remains open; final INFRA closure still follows API dependencies. |'
          new_row = '| INFRA | `INFRA-01 ACCEPTED / CLOSED; INFRA-02 ACCEPTED / CLOSED; INFRA LAYER OPEN` | Exact bounded INFRA-01 C3 and INFRA-02 software supply-chain foundation are accepted/closed. The overall INFRA layer remains open; INFRA-03…INFRA-07 and final INFRA closure remain governed separately and still follow API dependencies. |'
          assert old_row in s
          s = s.replace(old_row, new_row, 1)

          section7 = '\n---\n\n## 7. Branch / reconciliation discipline'
          assert section7 in s
          transition = '''
### INFRA-02 authoritative transition — 2026-09-02

- **Previous state:** `PARALLEL_WORKING_PRESEAL_NOT_ACCEPTED` in the independently reviewed candidate line; no canonical INFRA-02 acceptance/closure had yet been recorded on `main`.
- **New state:** `INFRA-02 ACCEPTED / CLOSED`.
- **Governing candidate:** `EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip`.
- **Candidate SHA-256:** `d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c`.
- **Candidate size:** `15,980,332` bytes.
- **Accepted predecessor:** INFRA-01 C3 SHA-256 `5cd90da141056badc38ee3fb34f2d648002ace5b87c6a0cce1d331431364b131`.
- **Authoritative run:** `33574647511`, job `100075828121`, conclusion `success`.
- **Independent structural/runtime proof:** exact transport PASS; seal/freeze PASS; exact predecessor delta `35/11/0/1450`; targeted tests `146/146 PASS`; complete canonical harness `51/51 PASS`; current-run evidence `INFRA01_EVIDENCE_RESULT:PASS`; exact package member-content identity `1496/1496`; terminal result `INFRA02_AUTHORITATIVE_RESULT:PASS`.
- **Authoritative evidence artifact:** `infra02-authoritative-evidence-33574647511`, artifact ID `9826333069`, GitHub artifact-wrapper SHA-256 `4fada409e8fe58f861a0615e2606d5e26615e815b2da6126f430a583b045e5b1`.
- **Exact reviewed candidate artifact:** `infra02-authoritative-candidate-33574647511`, artifact ID `9826333641`, GitHub artifact-wrapper SHA-256 `69bdcf1210f7ef371513f41d22d32bed42bf25ab81dd2aa5a244aca95ec17ab6`.
- **Post-run reconciliation:** authoritative freshness gate observed `main@b359c575b224727a9b69cabc1ea3f3bf63a2f64c`; before governance closure, `main` advanced to `4b95cc952897bd78fe912a2737f53e66264d6ff1`. The concurrent delta is limited to `docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md` for authoritative API-05 closure and `scripts/api05_governance_close.py` for formatting. Classification: `NO_INFRA02_CONTROLLING_CONFLICT`; current API state `API-05 ACCEPTED / CLOSED; API-06 NEXT` is preserved rather than overwritten by the older candidate-local PCR.
- **Acceptance decision:** `docs/infra/INFRA-02/INFRA02_ACCEPTANCE_RECORD.json`.
- **Open blockers for INFRA-02:** none.
- **Scope consequence:** bounded INFRA-02 closes at the exact candidate above; the overall INFRA layer remains open and INFRA-03…INFRA-07 are not promoted. No production-readiness, legal-activation, BSI/CC/EAL4 or final-security claim follows.
- **Next permitted primary program stage:** unchanged — `API-06 = NEXT`.
'''
