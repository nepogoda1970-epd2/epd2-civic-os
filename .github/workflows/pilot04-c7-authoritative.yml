name: PILOT-04 C7 authoritative exact-byte gate

on:
  push:
    branches:
      - tmp/pilot04-c7-authoritative-20260822
    paths:
      - 'artifacts/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip.part00'
      - 'artifacts/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip.part01'
      - 'artifacts/PILOT04_C7_GITHUB_DELTA_BUNDLE.zip'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  authoritative-c7:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      EPD2_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      EPD2_LOCAL_CI_HOME: ${{ runner.temp }}/epd2-local-ci
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout verification transport branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'

      - name: Set up uv 0.10.0
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          enable-cache: true

      - name: Install PostgreSQL 16 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          python --version
          uv --version
          node --version
          psql --version
          pg_dump --version
          PGPASSWORD=postgres psql "$EPD2_TEST_DATABASE_URL" -Atc 'SHOW server_version' | tee "$RUNNER_TEMP/postgres-server-version.txt"
          grep -Fx '16.15' "$RUNNER_TEMP/postgres-server-version.txt"

      - name: Require and verify exact transport inputs
        shell: bash
        run: |
          set -euo pipefail
          P0='artifacts/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip.part00'
          P1='artifacts/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip.part01'
          DB='artifacts/PILOT04_C7_GITHUB_DELTA_BUNDLE.zip'
          test -f "$P0" && test -f "$P1" && test -f "$DB"
          echo '8f750c7821462bbeef50686089353f62d5935f0669bede5e3e166e75f49aa201  '"$P0" | sha256sum -c -
          echo '074d33a0eb13ddba1ec54f5dd91d3c4586768c1cb24504ae8d836f5ade78749e  '"$P1" | sha256sum -c -
          echo '36cf6781d79394034c4047cff0e9a72abb6cbc14d3df19e4e99a7b2fc81b3c0a  '"$DB" | sha256sum -c -

      - name: Restore exact C3-C7 and PILOT-03 archive bytes
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/pilot04-exact"
          D="$RUNNER_TEMP/pilot04-deltas"
          mkdir -p "$W" "$D"

          C3='EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C3.zip'
          C4='EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip'
          C5='EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C5.zip'
          C6='EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C6.zip'
          C7='EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C7.zip'
          P3='EPD2_PILOT03_ASSEMBLIES_MOTIONS_AND_COMMUNICATIONS_CANDIDATE_0.1_C3.zip'

          cat \
            artifacts/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip.part00 \
            artifacts/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip.part01 \
            > "$W/$C4"
          echo '994f97c022e499b9847e8c36b48e04aa30b0da0b6e3b4741df13b8f1fcd083d1  '"$W/$C4" | sha256sum -c -

          unzip -q artifacts/PILOT04_C7_GITHUB_DELTA_BUNDLE.zip -d "$D"
          python scripts/tmp_apply_zip_sparse_patch.py "$W/$C4" "$D/c4_to_pilot04c3.zsp" "$W/$C3"
          python scripts/tmp_apply_zip_sparse_patch.py "$W/$C4" "$D/c4_to_pilot03c3.zsp" "$W/$P3"
          python scripts/tmp_apply_zip_sparse_patch.py "$W/$C4" "$D/c4_to_c5.zsp" "$W/$C5"
          python scripts/tmp_apply_zip_sparse_patch.py "$W/$C5" "$D/c5_to_c6.zsp" "$W/$C6"
          python scripts/tmp_apply_zip_sparse_patch.py "$W/$C6" "$D/c6_to_c7.zsp" "$W/$C7"

          cat > "$RUNNER_TEMP/pilot04-expected.sha256" <<EOF
          7d9dc40c6b935d2ca899e9c53cc5a1cddef202bc69aa23994871dab1dfa5c1ff  $W/$C3
          994f97c022e499b9847e8c36b48e04aa30b0da0b6e3b4741df13b8f1fcd083d1  $W/$C4
          6d63b8a05e369960e4ef2f691cf4cfb44cf2eae37ffa7cab9fa95064e214b495  $W/$C5
          4899c29a004112d38a33fce51e4e637ceb0951b49a47de71bac5b850e8f31b84  $W/$C6
          812652950e996bd7c781512e4bbc03488c58eb74ca0c652c2b830056d76c1f1d  $W/$C7
          52b5bbfe312d90d65f500f0b6085d33ffe3235ce4bd90562110a26a8fae208d1  $W/$P3
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/pilot04-expected.sha256"
          sha256sum -c "$RUNNER_TEMP/pilot04-expected.sha256"
          unzip -t "$W/$C7" >/dev/null
          echo "PILOT04_EXACT_DIR=$W" >> "$GITHUB_ENV"

      - name: Download frozen PB01 I10 C6 exact candidate from authoritative run 32388797195
        uses: actions/download-artifact@v4
        with:
          name: pb01-i10-c6-exact-candidate
          path: ${{ runner.temp }}/pb01-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nepogoda1970-epd2/epd2-civic-os
          run-id: '32388797195'

      - name: Verify and normalize PB01 exact anchor filename
        shell: bash
        run: |
          set -euo pipefail
          W="$PILOT04_EXACT_DIR"
          PB='EPD2_VCRYPTO-PB01-I10_FINAL_CRYPTOGRAPHIC_PROFILE_FREEZE_AND_RELEASE_READINESS_DECISION_CANDIDATE_0.1_C6.zip'
          export PB_OUT="$W/$PB"
          python - <<'PY'
          import hashlib, os, shutil
          from pathlib import Path
          expected = '442b83d9639a7398b3da767beb95976d379190229610d9b5ccb550d53d277d25'
          root = Path(os.environ['RUNNER_TEMP']) / 'pb01-artifact'
          matches=[]
          for p in root.rglob('*'):
              if p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest() == expected:
                  matches.append(p)
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one PB01 exact candidate, found {matches}')
          shutil.copyfile(matches[0], Path(os.environ['PB_OUT']))
          print(matches[0])
          PY
          echo '442b83d9639a7398b3da767beb95976d379190229610d9b5ccb550d53d277d25  '"$W/$PB" | sha256sum -c -
          unzip -t "$W/$PB" >/dev/null

      - name: Materialize exact C7 workspace and warm frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          W="$PILOT04_EXACT_DIR"
          C7="$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C7.zip"
          T="$RUNNER_TEMP/c7-workspace"
          mkdir -p "$T"
          unzip -q "$C7" -d "$T"
          ROOT="$T/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C7"
          test -d "$ROOT"
          cd "$ROOT"
          uv sync --all-groups --frozen
          uv run python -c 'import psycopg, cryptography; print("psycopg", psycopg.__version__); print("cryptography", cryptography.__version__)'
          echo "C7_WORKSPACE=$ROOT" >> "$GITHUB_ENV"

      - name: Prepare independent verifier runtime before security suites
        shell: bash
        run: |
          set -euo pipefail
          cd "$C7_WORKSPACE"
          uv run python scripts/verifier_runtime.py --force --json | tee "$RUNNER_TEMP/verifier-runtime.json"
          VERIFIER="$EPD2_LOCAL_CI_HOME/verifier-runtime/bin/epd2-verify"
          test -x "$VERIFIER"
          "$VERIFIER" --version
          "$EPD2_LOCAL_CI_HOME/verifier-runtime/bin/python" -c 'from cryptography.hazmat.primitives.asymmetric import ed25519; import cryptography; print(cryptography.__version__)'
          echo "EPD2_INDEPENDENT_VERIFIER_EXECUTABLE=$VERIFIER" >> "$GITHUB_ENV"

      - name: Run authoritative PILOT-04 C7 gate over exact external bytes
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          W="$PILOT04_EXACT_DIR"
          cd "$C7_WORKSPACE"
          C3="$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C3.zip"
          C4="$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip"
          C5="$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C5.zip"
          C6="$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C6.zip"
          C7="$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C7.zip"
          P3="$W/EPD2_PILOT03_ASSEMBLIES_MOTIONS_AND_COMMUNICATIONS_CANDIDATE_0.1_C3.zip"
          PB="$W/EPD2_VCRYPTO-PB01-I10_FINAL_CRYPTOGRAPHIC_PROFILE_FREEZE_AND_RELEASE_READINESS_DECISION_CANDIDATE_0.1_C6.zip"
          EVIDENCE="$RUNNER_TEMP/PILOT04_C7_GITHUB_AUTHORITATIVE_ACCEPTANCE.json"

          uv run python scripts/validate_pilot04_c7.py \
            --candidate "$C7" \
            --predecessor "$C6" \
            --base "$C3" \
            --historical "$C4" \
            --historical "$C5" \
            --anchor "$P3" \
            --anchor "$PB" \
            --json "$EVIDENCE" \
            --lineage docs/pilot/PILOT-04/PILOT04_C7_LINEAGE.json \
            --runner uv \
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}"
          echo "PILOT04_C7_EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"

      - name: Authoritatively re-verify current-run evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$C7_WORKSPACE"
          readarray -t VALUES < <(python - "$PILOT04_C7_EVIDENCE" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          if d.get('status') != 'PASS' or d.get('exit_code') != 0 or d.get('all_passed') is not True:
              raise SystemExit('evidence is not a complete PASS')
          print(d['freshness']['nonce'])
          print(d['result_digest'])
          PY
          )
          test "${#VALUES[@]}" -eq 2
          uv run python scripts/validate_pilot04_c7.py \
            --verify "$PILOT04_C7_EVIDENCE" \
            --expect-nonce "${VALUES[0]}" \
            --expect-digest "${VALUES[1]}"

      - name: Write frozen acceptance record
        shell: bash
        run: |
          set -euo pipefail
          python - "$PILOT04_C7_EVIDENCE" "$RUNNER_TEMP/PILOT04_C7_FROZEN_ACCEPTANCE.txt" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding='utf-8'))
          expected='812652950e996bd7c781512e4bbc03488c58eb74ca0c652c2b830056d76c1f1d'
          measured=d['identity']['candidate']['measured_sha256']
          assert measured == expected
          assert d['status']=='PASS' and d['exit_code']==0 and d['all_passed'] is True
          open(sys.argv[2], 'w', encoding='utf-8').write(
              'PILOT-04 C7 — ACCEPTED / FROZEN — NON-BINDING DIGITAL VOTE PILOT\n'
              f'SHA-256: {expected}\n'
              f"Result digest: {d['result_digest']}\n"
              f"Run id: {d['freshness']['run_id']}\n"
          )
          PY
          cat "$RUNNER_TEMP/PILOT04_C7_FROZEN_ACCEPTANCE.txt"

      - name: Upload authoritative acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot04-c7-authoritative-evidence
          path: |
            ${{ runner.temp }}/PILOT04_C7_GITHUB_AUTHORITATIVE_ACCEPTANCE.json
            ${{ runner.temp }}/PILOT04_C7_FROZEN_ACCEPTANCE.txt
            ${{ runner.temp }}/verifier-runtime.json
            ${{ runner.temp }}/postgres-server-version.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Upload exact frozen C7 candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pilot04-c7-exact-frozen-candidate
          path: ${{ env.PILOT04_EXACT_DIR }}/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C7.zip
          compression-level: 0
          retention-days: 90
