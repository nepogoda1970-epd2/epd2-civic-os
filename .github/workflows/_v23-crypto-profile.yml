name: V23 cryptographic profile patch

on:
  push:
    branches:
      - governance/v23-crypto-profile
    paths:
      - '.github/workflows/_v23-crypto-profile.yml'

permissions:
  contents: write

jobs:
  apply-v23:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: governance/v23-crypto-profile
          fetch-depth: 0

      - name: Apply governed V23 patch
        run: python .github/scripts/_v23_crypto_profile_patch.py

      - name: Normalize only V23 output and reconcile Master hash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re

          master_path = Path('docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md')
          control_path = Path('docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md')
          profile_path = Path('docs/governance/EPD2_CRYPTOGRAPHIC_KEY_CLASSES_ALGORITHM_PROFILE_0.1.md')

          master = master_path.read_text(encoding='utf-8')
          marker = '## V23 governance maintenance record'
          before, sep, after = master.partition(marker)
          assert sep
          v23 = sep + after
          v23 = '\n'.join(line.rstrip() for line in v23.splitlines()).rstrip() + '\n'
          master = before + v23
          master_path.write_text(master, encoding='utf-8')

          profile = profile_path.read_text(encoding='utf-8')
          profile = '\n'.join(line.rstrip() for line in profile.splitlines()).rstrip() + '\n'
          profile_path.write_text(profile, encoding='utf-8')

          master_sha = hashlib.sha256(master.encode('utf-8')).hexdigest()
          control = control_path.read_text(encoding='utf-8')
          # Keep the pre-existing header line byte-stable; only V23 governance content changes.
          control = control.replace('**Updated:** 2026-08-28  ', '**Updated:** 2026-08-27  ', 1)
          pattern = r'(\*\*Documentation-only V23 governance update \(2026-08-28\):\*\*.*?Canonical Master SHA-256 after this update: `)[0-9a-f]{64}(`)'
          control, count = re.subn(pattern, lambda m: m.group(1) + master_sha + m.group(2), control, count=1, flags=re.S)
          assert count == 1
          control_path.write_text(control, encoding='utf-8')
          print('NORMALIZED_MASTER_SHA256=' + master_sha)
          PY

      - name: Verify governed files and status
        run: |
          grep -q 'FIR-TRUST-003' docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md
          grep -q 'Current Master maintenance level established by project governance work: \*\*V23\*\*' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          grep -q 'API-02 = ACTIVE / IN DEVELOPMENT' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          grep -q 'API-03 = PARALLEL_WORKING_PRESEAL_NOT_ACCEPTED' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          grep -q 'API-03 C1 seal is blocked' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          test -f docs/governance/EPD2_CRYPTOGRAPHIC_KEY_CLASSES_ALGORITHM_PROFILE_0.1.md
          test -f docs/governance/EPD2_CRYPTOGRAPHIC_KEY_CLASSES_ALGORITHM_PROFILE_0.1.json
          python -m json.tool docs/governance/EPD2_CRYPTOGRAPHIC_KEY_CLASSES_ALGORITHM_PROFILE_0.1.json >/dev/null
          git add -N docs/governance/EPD2_CRYPTOGRAPHIC_KEY_CLASSES_ALGORITHM_PROFILE_0.1.md docs/governance/EPD2_CRYPTOGRAPHIC_KEY_CLASSES_ALGORITHM_PROFILE_0.1.json
          git diff --check

      - name: Commit V23 governed result without helper files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/scripts/_v23_crypto_profile_patch.py .github/workflows/_v23-crypto-profile.yml
          git add -A
          git commit -m 'governance: add cryptographic key classes and algorithm profile'
          git push origin HEAD:governance/v23-crypto-profile
