name: Prettier repository one-shot fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-fix:
    if: github.head_ref == 'fix/prettier-repository-format'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci

      - name: Apply exact repository Prettier formatter
        run: npx prettier --write .

      - name: Remove one-shot workflow and validate formatting
        run: |
          set -euo pipefail
          rm .github/workflows/prettier-repository-fix-once.yml
          npm run format:check
          git diff --check
          test ! -e .github/workflows/prettier-repository-fix-once.yml

      - name: Commit format-only repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply repository Prettier formatting"
          git push origin HEAD:fix/prettier-repository-format
