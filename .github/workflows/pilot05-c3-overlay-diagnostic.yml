name: PILOT-05 C3 overlay diagnostic

on:
  push:
    branches:
      - tmp/pilot05-c3-authoritative-20260825
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  inspect-overlay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4

      - name: Reassemble binary overlay
        shell: bash
        run: |
          set -euo pipefail
          parts=(tmp/pilot05-c3-transport/chunk*.txt)
          printf 'PART_COUNT=%s\n' "${#parts[@]}"
          printf '%s\n' "${parts[@]}"
          cat "${parts[@]}" > /tmp/pilot05-c3-overlay.tar.gz
          ls -l /tmp/pilot05-c3-overlay.tar.gz
          sha256sum /tmp/pilot05-c3-overlay.tar.gz
          file /tmp/pilot05-c3-overlay.tar.gz
          gzip -t /tmp/pilot05-c3-overlay.tar.gz
          echo 'GZIP_TEST=PASS'
          echo '--- TAR LIST BEGIN ---'
          tar -tzf /tmp/pilot05-c3-overlay.tar.gz | tee /tmp/pilot05-c3-overlay.members.txt
          echo '--- TAR LIST END ---'
          printf 'TAR_MEMBER_COUNT=%s\n' "$(wc -l < /tmp/pilot05-c3-overlay.members.txt)"

      - name: Upload reconstructed overlay
        uses: actions/upload-artifact@v4
        with:
          name: pilot05-c3-overlay-diagnostic
          path: |
            /tmp/pilot05-c3-overlay.tar.gz
            /tmp/pilot05-c3-overlay.members.txt
          if-no-files-found: error
          retention-days: 14
