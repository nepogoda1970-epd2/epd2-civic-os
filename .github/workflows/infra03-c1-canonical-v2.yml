name: INFRA-03 C1 Canonical Acceptance V2

on:
  push:
    branches: ["handoff/infra"]
    paths:
      - ".github/workflows/infra03-c1-canonical-v2.yml"

permissions:
  contents: read

concurrency:
  group: infra03-c1-canonical-v2
  cancel-in-progress: false

env:
  PRESEAL: handoff/INFRA/incoming/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL.zip
  PRESEAL_SHA256: 30033863c854b34532b42a216bb275c691e57413053724f393b183ad814685fe
  PRESEAL_SIZE: "16176926"
  C1_NAME: EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1
  INFRA02: handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip
  INFRA02_SHA256: d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
  INFRA02_SIZE: "15980332"
  API06_SHA256: 3432b6615aa83c6f2860c015b7cafc2a18362aa371901616951a1bd5d263933c
  API06_RUN_ID: "33629147572"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    outputs:
      sha256: ${{ steps.identity.outputs.sha256 }}
      size: ${{ steps.identity.outputs.size }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify governed inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$PRESEAL" | awk '{print $1}')" = "$PRESEAL_SHA256"
          test "$(stat -c %s "$PRESEAL")" = "$PRESEAL_SIZE"
          test "$(sha256sum "$INFRA02" | awk '{print $1}')" = "$INFRA02_SHA256"
          test "$(stat -c %s "$INFRA02")" = "$INFRA02_SIZE"
          unzip -t "$PRESEAL" >/dev/null
          unzip -t "$INFRA02" >/dev/null
          cp "$INFRA02" /tmp/infra02.zip
          echo "INFRA03_INPUT_PRESEAL:PASS:$PRESEAL_SHA256:$PRESEAL_SIZE"
          echo "INFRA03_INPUT_INFRA02:PASS:$INFRA02_SHA256:$INFRA02_SIZE"

      - name: Derive governed C1 from exact PRESEAL
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _c1
          python - <<'PY'
          import os, pathlib, zipfile
          p=pathlib.Path(os.environ['PRESEAL']); out=pathlib.Path('_c1')
          with zipfile.ZipFile(p) as z:
              seen=set()
              for i in z.infolist():
                  n=i.filename.replace('\\','/')
                  if n.startswith('/') or n.startswith('../') or '/../' in '/'+n or n in seen:
                      raise SystemExit(f'unsafe/duplicate archive member: {n}')
                  seen.add(n)
              z.extractall(out)
          roots=[x for x in out.iterdir() if x.is_dir()]
          if len(roots)!=1: raise SystemExit(f'bad archive roots: {roots}')
          root=roots[0]
          pathlib.Path('_c1_root').write_text(str(root))

          gates=root/'scripts/infra03/gates.py'
          s=gates.read_text(encoding='utf-8')
          old='''        self._record(\n            "G41",\n            "BLOCKED_FOR_FINAL_SEAL / DEVELOPMENT_MAY_CONTINUE",\n            "API-06 has no authoritative acceptance (API-06 = NEXT on the live "\n            "register); exact accepted API-06 reconciliation is impossible and is "\n            "not faked. Final seal is blocked until it exists.",\n            "baseline_identity.json",\n        )'''
          new='''        api06_path = "docs/api/API-06/API06_C1_ACCEPTANCE_RECORD.json"\n        try:\n            api06_bytes = subprocess.run(\n                ["git", "-C", str(self.root), "show", f"origin/main:{api06_path}"],\n                capture_output=True, timeout=120, check=True,\n            ).stdout\n            api06 = json.loads(api06_bytes)\n            authoritative = api06.get("authoritative", {})\n            candidate = api06.get("candidate", {})\n            checks = {\n                "decision": api06.get("decision") == "ACCEPTED_CLOSED",\n                "new_state": api06.get("new_state") == "ACCEPTED / CLOSED",\n                "api_layer_state": api06.get("api_layer_state") == "CLOSED",\n                "candidate_sha256": candidate.get("sha256") == "3432b6615aa83c6f2860c015b7cafc2a18362aa371901616951a1bd5d263933c",\n                "candidate_self_accepted_false": candidate.get("self_accepted") is False,\n                "authoritative_run": authoritative.get("run_id") == 33629147572,\n                "authoritative_success": str(authoritative.get("conclusion", "")).upper() == "SUCCESS",\n                "authoritative_40_of_40": authoritative.get("governed_gates_total") == 40 and authoritative.get("passed_gates") == 40 and authoritative.get("failed_gates") == 0,\n            }\n            ok = all(checks.values())\n            api06_evidence = self._emit(\n                "api06_reconciliation_result.json",\n                {\n                    "source": f"origin/main:{api06_path}",\n                    "record_sha256": __import__("hashlib").sha256(api06_bytes).hexdigest(),\n                    "candidate_sha256": candidate.get("sha256"),\n                    "authoritative_run_id": authoritative.get("run_id"),\n                    "checks": checks,\n                    "accepted": ok,\n                },\n            )\n            self._record(\n                "G41",\n                "PASS" if ok else "BLOCKED_FOR_FINAL_SEAL / DEVELOPMENT_MAY_CONTINUE",\n                "live API-06 acceptance reconciled exactly (ACCEPTED / CLOSED; API layer CLOSED; authoritative 40/40 PASS)" if ok else "live API-06 acceptance identity mismatch",\n                api06_evidence,\n            )\n        except (subprocess.CalledProcessError, json.JSONDecodeError) as error:\n            api06_evidence = self._emit(\n                "api06_reconciliation_result.json",\n                {"source": f"origin/main:{api06_path}", "accepted": False, "error": str(error)[:240]},\n            )\n            self._record(\n                "G41",\n                "BLOCKED_FOR_FINAL_SEAL / DEVELOPMENT_MAY_CONTINUE",\n                "live API-06 acceptance could not be reconciled",\n                api06_evidence,\n            )'''
          if old not in s: raise SystemExit('exact PRESEAL G41 block not found')
          s=s.replace(old,new,1)
          old_blockers='''                "final_seal_blockers": [\n                    "canonical governance has not promoted/opened INFRA-03 (proposed "\n                    "working contract only)",\n                    "API-06 has no authoritative acceptance (G41 BLOCKED_FOR_FINAL_SEAL)",\n                ],'''
          new_blockers='''                "final_seal_blockers": [\n                    f"{gate_id}: {gate.get('detail', '')}"\n                    for gate_id, gate in sorted(self.gates.items())\n                    if gate.get("state") == "FAIL" or str(gate.get("state", "")).startswith("BLOCKED")\n                ],'''
          if old_blockers not in s: raise SystemExit('exact PRESEAL blocker block not found')
          s=s.replace(old_blockers,new_blockers,1)
          s=s.replace('"API-06 is NEXT and unaccepted, so no API-06 material exists here."','"API-06 is accepted/closed on live governance; no API-06 business runtime is bundled into INFRA-03."')
          gates.write_text(s,encoding='utf-8')

          old_name='EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL'
          c1=os.environ['C1_NAME']
          for rel in ('scripts/acceptance/__main__.py','scripts/infra03/preseal.py'):
              p=root/rel; t=p.read_text(encoding='utf-8')
              if old_name not in t: raise SystemExit(f'old package identity absent in {rel}')
              p.write_text(t.replace(old_name,c1),encoding='utf-8')

          note=root/'docs/infra/INFRA-03/INFRA03_C1_RECONCILIATION.md'
          note.write_text('''# INFRA-03 C1 reconciliation\n\nC1 derives from exact PRESEAL SHA-256 `30033863c854b34532b42a216bb275c691e57413053724f393b183ad814685fe` (16,176,926 bytes). Runtime implementation is unchanged. The C1 delta only releases the obsolete API-06 seal blocker by verifying the live canonical API-06 acceptance record exactly and updates the package identity to C1. Any missing or changed API-06 acceptance remains fail-closed.\n\nThis candidate never self-accepts. Independent authoritative replay and Project Owner governance are required. INFRA layer closure, production readiness, legal activation, final security acceptance and BSI/Common Criteria/EAL4 certification are not asserted.\n''',encoding='utf-8')
          print(f'INFRA03_C1_DERIVATION:PASS:{root}')
          PY

      - name: Initialize isolated replay repository
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat _c1_root)
          cd "$ROOT"
          rm -rf .git .venv .pytest_cache
          git init -q
          git config user.name 'EPD2 INFRA03 C1 builder'
          git config user.email 'infra03-c1@invalid.local'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -qm 'derive infra03 c1 from exact preseal'
          git fetch --no-tags origin main
          python -m pip install --disable-pip-version-check -q uv
          uv sync --frozen
          echo "REPLAY_GIT_HEAD=$(git rev-parse HEAD)"
          echo "LIVE_MAIN=$(git rev-parse origin/main)"

      - name: Targeted unit and mutation tests
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat _c1_root); cd "$ROOT"
          uv run pytest -q tests/repository/test_infra03_units.py tests/repository/test_infra03_mutation_suite.py | tee "$GITHUB_WORKSPACE/infra03-c1-tests.txt"

      - name: Live governed gates G01-G38 G41-G42
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat _c1_root); cd "$ROOT"
          uv run python -m scripts.infra03.gates --artifact /tmp/infra02.zip | tee "$GITHUB_WORKSPACE/infra03-c1-gates.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('validation/infra03/infra03_preseal_result.json').read_text())
          print(json.dumps(d,indent=2,sort_keys=True))
          gates={g['gate']:g for g in d['gates']}
          required=[f'G{i:02d}' for i in list(range(1,39))+[41,42]]
          bad={k:gates.get(k) for k in required if not gates.get(k) or gates[k].get('state')!='PASS'}
          if bad: raise SystemExit(f'governed runtime gate failure: {bad}')
          if d.get('final_seal_blockers'): raise SystemExit(f'final seal blockers remain: {d["final_seal_blockers"]}')
          api=json.loads(Path('validation/infra03/api06_reconciliation_result.json').read_text())
          if not api.get('accepted') or api.get('candidate_sha256')!='3432b6615aa83c6f2860c015b7cafc2a18362aa371901616951a1bd5d263933c' or api.get('authoritative_run_id')!=33629147572:
              raise SystemExit(f'API06 reconciliation invalid: {api}')
          print('INFRA03_RUNTIME_GATES:PASS:40/40')
          print('INFRA03_API06_RECONCILIATION:PASS')
          mut=json.loads(Path('validation/infra03/mutation_result.json').read_text())
          print('INFRA03_MUTATION_EVIDENCE='+json.dumps(mut,sort_keys=True))
          PY

      - name: Freeze live evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat _c1_root); cd "$ROOT"
          git add -A
          git commit -qm 'freeze authoritative live gate evidence'
          test -z "$(git status --porcelain)"

      - name: Build canonical harness archive and package gates G39-G40
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat _c1_root); cd "$ROOT"
          uv run python -m scripts.acceptance run | tee "$GITHUB_WORKSPACE/infra03-c1-harness.txt"
          RUN_DIR=$(find . -type f -name EXECUTION-MANIFEST.json -printf '%T@ %h\n' | sort -n | tail -1 | cut -d' ' -f2-)
          echo "RUN_DIR=$RUN_DIR"
          test -n "$RUN_DIR"
          test -f "$RUN_DIR/$C1_NAME.zip"
          rm -rf /tmp/infra03-c1-final; mkdir -p /tmp/infra03-c1-final
          uv run python -m scripts.infra03.preseal --root . --run-dir "$RUN_DIR" --out /tmp/infra03-c1-final | tee "$GITHUB_WORKSPACE/infra03-c1-package.txt"
          grep -q 'G39 archive hygiene: PASS' "$GITHUB_WORKSPACE/infra03-c1-package.txt"
          grep -q 'G40 same-bytes identity: PASS' "$GITHUB_WORKSPACE/infra03-c1-package.txt"
          grep -q 'INFRA03_PRESEAL_RESULT:PASS:' "$GITHUB_WORKSPACE/infra03-c1-package.txt"
          cp "/tmp/infra03-c1-final/$C1_NAME.zip" "$GITHUB_WORKSPACE/$C1_NAME.zip"
          cp /tmp/infra03-c1-final/INFRA03_PRESEAL_FINAL.json "$GITHUB_WORKSPACE/INFRA03_C1_BUILD_SEAL.json"
          echo 'INFRA03_PACKAGE_GATES:PASS:2/2'

      - name: Candidate identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(sha256sum "$C1_NAME.zip" | awk '{print $1}')
          SIZE=$(stat -c %s "$C1_NAME.zip")
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "INFRA03_C1_CANDIDATE:SEALED:$SHA:$SIZE"

      - uses: actions/upload-artifact@v4
        with:
          name: infra03-c1-exact-candidate-${{ github.run_id }}
          path: EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1.zip
          compression-level: 0
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: infra03-c1-build-evidence-${{ github.run_id }}
          path: |
            INFRA03_C1_BUILD_SEAL.json
            infra03-c1-tests.txt
            infra03-c1-gates.txt
            infra03-c1-harness.txt
            infra03-c1-package.txt
          if-no-files-found: error

  authoritative-review:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: infra03-c1-exact-candidate-${{ github.run_id }}
          path: _artifact

      - name: Verify exact candidate and predecessor inputs
        shell: bash
        run: |
          set -euo pipefail
          ZIP="_artifact/$C1_NAME.zip"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "${{ needs.build.outputs.sha256 }}"
          test "$(stat -c %s "$ZIP")" = "${{ needs.build.outputs.size }}"
          test "$(sha256sum "$INFRA02" | awk '{print $1}')" = "$INFRA02_SHA256"
          test "$(stat -c %s "$INFRA02")" = "$INFRA02_SIZE"
          cp "$INFRA02" /tmp/infra02-review.zip
          rm -rf _review
          ZIP="$ZIP" python - <<'PY'
          import os,pathlib,zipfile
          p=pathlib.Path(os.environ['ZIP']); out=pathlib.Path('_review')
          with zipfile.ZipFile(p) as z:
              seen=set()
              for i in z.infolist():
                  n=i.filename.replace('\\','/')
                  if n.startswith('/') or n.startswith('../') or '/../' in '/'+n or n in seen:
                      raise SystemExit(f'unsafe/duplicate member: {n}')
                  seen.add(n)
              z.extractall(out)
          roots=[x for x in out.iterdir() if x.is_dir()]
          if len(roots)!=1 or roots[0].name!=os.environ['C1_NAME']: raise SystemExit(f'wrong archive root: {roots}')
          pathlib.Path('_review_root').write_text(str(roots[0]))
          print(f'INFRA03_C1_ARCHIVE_HYGIENE:PASS:{len(seen)}')
          PY
          echo "INFRA03_C1_EXACT_TRANSPORT:PASS:${{ needs.build.outputs.sha256 }}:${{ needs.build.outputs.size }}"

      - name: Independent isolated environment
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat _review_root); cd "$ROOT"
          rm -rf .git .venv .pytest_cache
          git init -q
          git config user.name 'EPD2 INFRA03 independent review'
          git config user.email 'infra03-review@invalid.local'
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git add -A; git commit -qm 'exact C1 review source'
          git fetch --no-tags origin main
          python -m pip install --disable-pip-version-check -q uv
          uv sync --frozen

      - name: Independent exact-byte tests and live gate replay
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat _review_root); cd "$ROOT"
          uv run pytest -q tests/repository/test_infra03_units.py tests/repository/test_infra03_mutation_suite.py | tee "$GITHUB_WORKSPACE/infra03-c1-authoritative-tests.txt"
          uv run python -m scripts.infra03.gates --artifact /tmp/infra02-review.zip | tee "$GITHUB_WORKSPACE/infra03-c1-authoritative-gates.txt"
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('validation/infra03/infra03_preseal_result.json').read_text())
          gates={g['gate']:g for g in d['gates']}
          required=[f'G{i:02d}' for i in list(range(1,39))+[41,42]]
          bad={k:gates.get(k) for k in required if not gates.get(k) or gates[k].get('state')!='PASS'}
          if bad: raise SystemExit(f'authoritative gate failure: {bad}')
          if d.get('final_seal_blockers'): raise SystemExit(f'authoritative blockers: {d["final_seal_blockers"]}')
          api=json.loads(Path('validation/infra03/api06_reconciliation_result.json').read_text())
          if not api.get('accepted'): raise SystemExit(f'API06 rejected: {api}')
          print('INFRA03_C1_AUTHORITATIVE_RUNTIME:PASS:40/40')
          print('INFRA03_C1_AUTHORITATIVE_API06:PASS')
          mut=json.loads(Path('validation/infra03/mutation_result.json').read_text())
          print('INFRA03_C1_AUTHORITATIVE_MUTATION_EVIDENCE='+json.dumps(mut,sort_keys=True))
          PY

      - name: Independent package verification and immutability
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/_artifact/$C1_NAME.zip"
          BEFORE=$(sha256sum "$ZIP" | awk '{print $1}')
          ROOT=$(cat _review_root); cd "$ROOT"
          uv run python -m scripts.acceptance verify-package "$ZIP" | tee "$GITHUB_WORKSPACE/infra03-c1-authoritative-package.txt"
          AFTER=$(sha256sum "$ZIP" | awk '{print $1}')
          test "$BEFORE" = "$AFTER"
          test "$AFTER" = "${{ needs.build.outputs.sha256 }}"
          echo 'INFRA03_C1_AUTHORITATIVE_PACKAGE:PASS:G39/G40-reverified'
          echo "INFRA03_C1_SOURCE_ARCHIVE_UNCHANGED:PASS:$AFTER"

      - name: Emit authoritative result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p authoritative-evidence
          python - <<'PY'
          import json,os,pathlib,re
          text=pathlib.Path('infra03-c1-authoritative-tests.txt').read_text(errors='replace')
          m=re.search(r'(\d+) passed',text)
          passed=int(m.group(1)) if m else None
          result={
            'schema':'epd2.infra03.c1-authoritative-result/1',
            'stage':'INFRA-03',
            'result':'PASS',
            'candidate':{'filename':os.environ['C1_NAME']+'.zip','sha256':'${{ needs.build.outputs.sha256 }}','size_bytes':int('${{ needs.build.outputs.size }}'),'self_acceptance':False},
            'preseal':{'sha256':os.environ['PRESEAL_SHA256'],'size_bytes':int(os.environ['PRESEAL_SIZE'])},
            'accepted_predecessor':{'stage':'INFRA-02','sha256':os.environ['INFRA02_SHA256'],'size_bytes':int(os.environ['INFRA02_SIZE'])},
            'api06':{'candidate_sha256':os.environ['API06_SHA256'],'authoritative_run_id':int(os.environ['API06_RUN_ID']),'reconciled':'PASS'},
            'governed_gates':{'runtime_passed':40,'runtime_total':40,'G39':'PASS','G40':'PASS','total_passed':42,'total':42},
            'tests':{'targeted_passed':passed},
            'workflow':{'run_id':int(os.environ['GITHUB_RUN_ID']),'head_sha':os.environ['GITHUB_SHA']},
            'nonclaims':['INFRA layer closure','production readiness','legal activation','final security acceptance','BSI/Common Criteria/EAL4 certification']
          }
          pathlib.Path('authoritative-evidence/INFRA03_C1_AUTHORITATIVE_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          PY
          cp infra03-c1-authoritative-tests.txt authoritative-evidence/
          cp infra03-c1-authoritative-gates.txt authoritative-evidence/
          cp infra03-c1-authoritative-package.txt authoritative-evidence/
          echo "INFRA03_C1_AUTHORITATIVE_RESULT:PASS:${{ needs.build.outputs.sha256 }}:${{ needs.build.outputs.size }}"

      - uses: actions/upload-artifact@v4
        with:
          name: infra03-c1-authoritative-evidence-${{ github.run_id }}
          path: authoritative-evidence
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: infra03-c1-authoritative-candidate-${{ github.run_id }}
          path: _artifact/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1.zip
          compression-level: 0
          if-no-files-found: error
