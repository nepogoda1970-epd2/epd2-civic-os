name: PB01-I09 C4 Status Probe
on:
  push:
    branches: [pilot02-verify]
    paths: ['.github/workflows/pb01-i09-c4-status.yml']
permissions:
  actions: read
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh run list --repo "$GITHUB_REPOSITORY" --workflow pb01-i09-c4-final.yml --branch pilot02-verify --limit 5 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > PB01_I09_C4_FINAL_RUN_STATUS.json
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PB01_I09_C4_FINAL_RUN_STATUS.json
          git commit -m 'record PB01-I09 C4 final run status' || exit 0
          for n in 1 2 3 4 5; do git fetch origin pilot02-verify; git rebase origin/pilot02-verify; git push origin HEAD:pilot02-verify && exit 0; sleep 2; done
          exit 1
