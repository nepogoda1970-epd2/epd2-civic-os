name: v25-canonical-build

on:
  push:
    branches: [tmp/v25-reconcile-20260829]
    paths:
      - .github/workflows/v25-canonical-build.yml
      - .v25build/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct exact C5 delta and build V25
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib
          root=pathlib.Path('.v25build/patchparts20k')
          parts=[(root/f'part{i:02d}').read_bytes() for i in range(8)]
          assert [len(x) for x in parts] == [20000,20000,20000,20000,20000,20000,20000,12812], [len(x) for x in parts]
          candidate=b''.join(parts)
          expect='0fa3ce6842a2a7c54de68ccf51439744c4bc7ac8724c0e2931b157f73f9f2faf'
          got=hashlib.sha256(candidate).hexdigest()
          assert len(candidate)==152812, len(candidate)
          assert got==expect, (got, expect)
          pathlib.Path('.v25build/v23_to_c5.patch.xz.b64').write_bytes(candidate)
          print('PATCH_TRANSPORT_SHA256='+got)
          print('PATCH_TRANSPORT_LENGTH='+str(len(candidate)))
          PY
          python .v25build/build_v25.py | tee /tmp/v25-build.log
          grep -qx 'V25_RECONCILIATION=PASS' /tmp/v25-build.log
          mkdir -p /tmp/v25out
          cp docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md /tmp/v25out/master.md
          cp docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md /tmp/v25out/pcr.md
          cp docs/roadmap/EPD2_MASTER_V25_RECONCILIATION.json /tmp/v25out/reconciliation.json
          python - <<'PY'
          import hashlib, json, pathlib, re
          m=pathlib.Path('/tmp/v25out/master.md').read_bytes()
          pb=pathlib.Path('/tmp/v25out/pcr.md').read_bytes()
          p=pb.decode()
          r=json.loads(pathlib.Path('/tmp/v25out/reconciliation.json').read_text())
          mh=hashlib.sha256(m).hexdigest(); ph=hashlib.sha256(pb).hexdigest()
          assert r['status']=='PASS'
          assert r['result']['master_sha256']==mh
          assert r['result']['pcr_sha256']==ph
          assert mh in p
          assert r['result']['missing_after_merge']==[]
          assert r['result']['extra_after_merge']==[]
          assert r['result']['duplicate_active_ids']==[]
          assert r['result']['v25_unique_firs']==241
          assert all(r['result']['required_presence'].values())
          ids=re.findall(rb'^##\s+(FIR-[A-Z0-9_*.-]+)\b',m,flags=re.M)
          assert len(ids)==len(set(ids))==241
          for x in [b'FIR-OSS-007',b'FIR-UX-012',b'FIR-UX-013',b'FIR-AI-003',b'FIR-GOV-004',b'FIR-GOV-005',b'FIR-SEC-004',b'FIR-TRUST-002',b'FIR-TRUST-003']:
              assert x in m
          print('PRECOMMIT_MASTER_SHA256='+mh)
          print('PRECOMMIT_PCR_SHA256='+ph)
          print('PRECOMMIT_V25_FIRS=241')
          PY

      - name: Create clean one-commit V25 branch directly from current main
        run: |
          set -euo pipefail
          BASE=007b5d71cf5a54e417cbd5647a35a57098ead186
          test "$(git rev-parse origin/main)" = "$BASE"
          git checkout --detach "$BASE"
          git switch -C tmp/v25-canonical-20260829
          cp /tmp/v25out/master.md docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md
          cp /tmp/v25out/pcr.md docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          cp /tmp/v25out/reconciliation.json docs/roadmap/EPD2_MASTER_V25_RECONCILIATION.json
          git add docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md \
                  docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md \
                  docs/roadmap/EPD2_MASTER_V25_RECONCILIATION.json
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 3
          git config user.name 'epd2-governance-bot'
          git config user.email 'governance@epd2.invalid'
          git commit -m 'governance: reconcile master lineage as V25'
          test "$(git rev-parse HEAD^)" = "$BASE"
          MASTER_SHA="$(sha256sum docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md | awk '{print $1}')"
          PCR_SHA="$(sha256sum docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md | awk '{print $1}')"
          grep -Fq "$MASTER_SHA" docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          echo "CANONICAL_V25_COMMIT=$(git rev-parse HEAD)"
          echo "CANONICAL_V25_MASTER_SHA256=$MASTER_SHA"
          echo "CANONICAL_V25_PCR_SHA256=$PCR_SHA"
          git push --force origin HEAD:tmp/v25-canonical-20260829
