name: INFRA-01 Independent Inspection Transport

on:
  push:
    branches:
      - tmp/infra01-independent-inspection-20260901
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-and-transport:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify exact candidate ZIP and hygiene
        shell: bash
        run: |
          set -euo pipefail
          ZIP='handoff/INFRA/incoming/EPD2_INFRA01_CI_ACCEPTANCE_HARNESS_CANDIDATE_0.1.zip'
          test -f "$ZIP"
          mkdir -p transport
          cp -- "$ZIP" transport/
          {
            echo "candidate=$ZIP"
            stat -c 'size=%s' "$ZIP"
            sha256sum "$ZIP"
            git hash-object "$ZIP"
          } | tee transport/identity.txt
          unzip -t "$ZIP" | tee transport/unzip-test.txt
          python3 - <<'PY' | tee transport/zip-hygiene.txt
          import pathlib, stat, zipfile, collections, sys
          p=pathlib.Path('handoff/INFRA/incoming/EPD2_INFRA01_CI_ACCEPTANCE_HARNESS_CANDIDATE_0.1.zip')
          bad=[]
          with zipfile.ZipFile(p) as z:
              infos=z.infolist()
              names=[i.filename for i in infos]
              dup=[n for n,c in collections.Counter(names).items() if c>1]
              roots=sorted({n.split('/',1)[0] for n in names if n and not n.startswith('/')})
              nested=[n for n in names if n.lower().endswith(('.zip','.tar','.tgz','.tar.gz','.7z','.rar'))]
              syms=[]
              for i in infos:
                  n=i.filename
                  pp=pathlib.PurePosixPath(n)
                  if n.startswith('/') or '..' in pp.parts or '\\' in n:
                      bad.append(f'unsafe_path:{n}')
                  mode=(i.external_attr >> 16) & 0xffff
                  if stat.S_ISLNK(mode): syms.append(n)
              print(f'entries={len(infos)}')
              print(f'roots={roots}')
              print(f'duplicates={dup}')
              print(f'symlinks={syms}')
              print(f'nested_archives={nested}')
              print(f'unsafe={bad}')
              if len(roots)!=1 or dup or syms or bad:
                  sys.exit(2)
          PY

      - name: Upload exact candidate transport
        uses: actions/upload-artifact@v4
        with:
          name: infra01-independent-inspection-transport
          path: transport/
          if-no-files-found: error
          retention-days: 7
