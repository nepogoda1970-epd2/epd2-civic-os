name: API-06 C1 sealed candidate build v3
on:
  push:
    branches: [tmp/api06-c1-build-final]
    paths:
      - '.github/workflows/api06-c1-build-v3.yml'
      - 'handoff/API-06/C1/api06_c1_correction.py'
      - 'handoff/API-06/templates/C1/api06-accept.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: api06-c1-build-v3
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: api06
          POSTGRES_PASSWORD: api06-synthetic-ci-only
          POSTGRES_DB: epd2_api06
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U api06 -d epd2_api06"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EPD2_API06_DATABASE_URL: postgresql://api06:api06-synthetic-ci-only@127.0.0.1:5432/epd2_api06
      API06_API05_SHA: 38bab7663b54f9f81538666315ee16195b0aa086e5b5c50c2b87acc3f4f03a70
      API06_API05_SIZE: '43953160'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact accepted API-05 C1
        uses: actions/download-artifact@v4
        with:
          name: api05-c1-candidate
          path: incoming/api05
          run-id: 33574093099
          github-token: ${{ github.token }}

      - name: Verify and extract accepted predecessor
        id: base
        shell: bash
        run: |
          set -euo pipefail
          A5=$(find incoming/api05 -type f -name 'EPD2_API05_EXTERNAL_INTEGRATION_BOUNDARY_CANDIDATE_0.1_C1.zip' -print -quit)
          test -n "$A5"
          echo "$API06_API05_SHA  $A5" | sha256sum -c -
          test "$(stat -c%s "$A5")" = "$API06_API05_SIZE"
          rm -rf "$RUNNER_TEMP/api06" "$RUNNER_TEMP/api05-pristine"
          mkdir -p "$RUNNER_TEMP/api06" "$RUNNER_TEMP/api05-pristine"
          python3 - "$A5" "$RUNNER_TEMP/api06" "$RUNNER_TEMP/api05-pristine" <<'PY'
          import pathlib, shutil, sys, zipfile
          z=zipfile.ZipFile(sys.argv[1]); ns=z.namelist(); roots={n.split('/',1)[0] for n in ns if n}
          assert roots=={'EPD2_API05_EXTERNAL_INTEGRATION_BOUNDARY_CANDIDATE_0.1_C1'}
          assert z.testzip() is None
          assert all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in ns)
          z.extractall(sys.argv[2]); src=pathlib.Path(sys.argv[2])/next(iter(roots))
          shutil.copytree(src,pathlib.Path(sys.argv[3])/'base')
          PY
          ROOT="$RUNNER_TEMP/api06/EPD2_API05_EXTERNAL_INTEGRATION_BOUNDARY_CANDIDATE_0.1_C1"
          (cd "$ROOT" && sha256sum --quiet -c SHA256SUMS.txt)
          cp "$ROOT/uv.lock" /tmp/api05-uv.lock
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo 'API06_API05_EXACT:PASS'

      - name: Apply historical API-06 implementation and restore accepted API-05
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin fd3c4a2073a38709c4d007a4d8c3f3c750a6f5cb
          git show fd3c4a2073a38709c4d007a4d8c3f3c750a6f5cb:handoff/API-06/WORKING_0.1/api06_overlay.tar.gz.b64 | base64 --decode > "$RUNNER_TEMP/api06-old-overlay.tar.gz"
          tar --no-same-owner -xzf "$RUNNER_TEMP/api06-old-overlay.tar.gz" -C '${{ steps.base.outputs.root }}'
          python3 - '${{ steps.base.outputs.root }}' "$RUNNER_TEMP/api05-pristine/base" <<'PY'
          import pathlib, shutil, sys
          root=pathlib.Path(sys.argv[1]); base=pathlib.Path(sys.argv[2]); n=0
          for p in base.rglob('*'):
              if p.is_file():
                  rel=p.relative_to(base); q=root/rel; q.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,q); n+=1
          print(f'API06_PREDECESSOR_RESTORE:PASS:{n}')
          PY
          python3 handoff/API-06/C1/api06_c1_correction.py '${{ steps.base.outputs.root }}'
          mkdir -p '${{ steps.base.outputs.root }}/handoff/API-06/templates/C1'
          cp handoff/API-06/templates/C1/api06-accept.yml '${{ steps.base.outputs.root }}/handoff/API-06/templates/C1/api06-accept.yml'

      - name: Bind current canonical governance
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          ROOT='${{ steps.base.outputs.root }}'
          git show origin/main:docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md > "$ROOT/docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md"
          git show origin/main:docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md > "$ROOT/docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md"
          git show origin/main:docs/api/API-05/API05_C1_ACCEPTANCE_RECORD.json > "$ROOT/docs/api/API-05/API05_C1_ACCEPTANCE_RECORD.json"
          echo "API06_CURRENT_MAIN_COMMIT=$(git rev-parse origin/main)" >> "$GITHUB_ENV"
          echo "API06_CURRENT_MAIN_TREE=$(git rev-parse origin/main^{tree})" >> "$GITHUB_ENV"
          echo "API06_CURRENT_PCR_SHA256=$(sha256sum "$ROOT/docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md"|cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "API06_CURRENT_MASTER_SHA256=$(sha256sum "$ROOT/docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md"|cut -d' ' -f1)" >> "$GITHUB_ENV"
          jq -e '.decision=="ACCEPTED_CLOSED" and .candidate.sha256=="38bab7663b54f9f81538666315ee16195b0aa086e5b5c50c2b87acc3f4f03a70" and .authoritative.run_id==33574342011' "$ROOT/docs/api/API-05/API05_C1_ACCEPTANCE_RECORD.json"
          grep -q '^API-05 = ACCEPTED / CLOSED$' "$ROOT/docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md"
          grep -q '^API-06 = NEXT$' "$ROOT/docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md"

      - name: Generate governed API-06 artifacts
        working-directory: ${{ steps.base.outputs.root }}
        run: python3 scripts/api06/build_api06_artifacts.py

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: false

      - name: Preserve accepted lock and bootstrap exact API-03 crypto49 isolation
        shell: bash
        working-directory: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          uv lock --check
          cmp --silent uv.lock /tmp/api05-uv.lock
          python3 - <<'PY'
          import tomllib
          d=tomllib.loads(open('uv.lock').read()); v={p['name']:p.get('version') for p in d['package']}
          assert v.get('psycopg')=='3.3.4' and v.get('psycopg-binary')=='3.3.4'
          assert v.get('cryptography')=='46.0.7'
          print('API06_LOCK_PRESERVED:PASS')
          PY
          uv sync --frozen --all-groups
          uv pip install --python .venv/bin/python pika==1.3.2
          rm -rf "$RUNNER_TEMP/api03-crypto49"
          bash scripts/api03_bootstrap_crypto49.sh "$RUNNER_TEMP/api03-crypto49"
          CRYPTO_SITE="$($RUNNER_TEMP/api03-crypto49/bin/python -c 'import sysconfig;print(sysconfig.get_paths()["purelib"])')"
          PYTHONNOUSERSITE=1 PYTHONPATH="$CRYPTO_SITE:$PWD/packages/python/epd2-s2s-crypto/src:$PWD/packages/python/epd2-runtime/src:$PWD" .venv/bin/python - <<'PY'
          import cryptography
          assert cryptography.__version__=='49.0.0', cryptography.__version__
          print('API06_API03_CRYPTO49_PROBE:PASS', cryptography.__version__)
          PY
          echo "API06_API03_CRYPTO_PATH=$CRYPTO_SITE" >> "$GITHUB_ENV"
          echo "PYTHONNOUSERSITE=1" >> "$GITHUB_ENV"

      - name: Ruff API-06 authored scope
        working-directory: ${{ steps.base.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          T='services/api-closure-runtime scripts/api06 scripts/validation/validate_api06.py'
          uv run --frozen ruff format $T
          uv run --frozen ruff check $T
          uv run --frozen ruff format --check $T
          find . -type d -name .ruff_cache -prune -exec rm -rf {} +

      - name: Provision accepted API-04 live regression environment
        shell: bash
        working-directory: ${{ steps.base.outputs.root }}
        run: |
          set -euo pipefail
          source scripts/api04_ci_setup.sh "$PWD"
          test -s "$API04_BROKER_TLS_BINDINGS"
          test -s "$API04_BROKER_SECRETS"
          python3 - "$API04_BROKER_TLS_BINDINGS" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert 'membership-service' in d and d['membership-service'].get('fingerprint')
          assert all(v.get('fingerprint') for v in d.values())
          print(f'API06_API04_RUNTIME_BINDINGS:PASS:{len(d)}')
          PY

      - name: Run complete 40-gate API-06 validator
        id: validate
        working-directory: ${{ steps.base.outputs.root }}
        shell: bash
        run: |
          set +e
          .venv/bin/python scripts/validation/validate_api06.py --out validation/api06/api06_acceptance_result.json | tee /tmp/api06-c1-validator.log
          RC=${PIPESTATUS[0]}
          echo '--- API-06 validator diagnostics ---'
          jq '{result,passed_gates,failed_gates,environment_blocked_runs,runs: (.runs|with_entries(.value |= {result,exit_code,stdout_tail,stderr_tail,server_version_num,server_version}))}' validation/api06/api06_acceptance_result.json || true
          if [ "$RC" -ne 0 ]; then exit "$RC"; fi
          grep -q '^API06_RESULT:PASS:40/40:validation/api06/api06_acceptance_result.json$' /tmp/api06-c1-validator.log
          jq -e '.result=="PASS" and .passed_gates==40 and .failed_gates==[] and .environment_blocked_runs==[]' validation/api06/api06_acceptance_result.json
          jq -e '.result=="PASS" and .detected==30 and .missed==0' validation/api06/mutation_result.json

      - name: Clean transient outputs and seal C1
        id: pkg
        working-directory: ${{ steps.base.outputs.root }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .venv .api03-crypto .pytest_cache .mypy_cache .ruff_cache
          find . -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          python3 - "$RUNNER_TEMP" <<'PY'
          import hashlib,json,os,pathlib,shutil,sys,zipfile
          root=pathlib.Path('.').resolve(); out=pathlib.Path(sys.argv[1]); name='EPD2_API06_API_LAYER_COMPLETION_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1'
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          wf=root/'handoff/API-06/templates/C1/api06-accept.yml'; wfsha=h(wf)
          seal={'schema':'epd2.api06.c1.seal/1','stage':'API-06','candidate_role':'C1','candidate_self_state':'CANDIDATE_NOT_ACCEPTED','self_accepted':False,'accepted_predecessor':{'stage':'API-05','sha256':os.environ['API06_API05_SHA'],'size_bytes':43953160,'authoritative_run_id':33574342011,'authoritative_job_id':100074902089},'builder':{'run_id':int(os.environ['GITHUB_RUN_ID']),'provenance_commit':os.environ['GITHUB_SHA']},'sealed_acceptance_workflow':{'path':'handoff/API-06/templates/C1/api06-accept.yml','sha256':wfsha},'governed_gates':'40/40 PASS','mutations':'30/30 detected'}
          (root/'docs/api/API-06/API06_C1_SEAL_RECORD.json').write_text(json.dumps(seal,indent=2)+'\n')
          ident={'schema':'epd2.api06.c1.candidate-identity/1','filename':name+'.zip','state':'CANDIDATE_NOT_ACCEPTED','self_accepted':False,'builder_run_id':int(os.environ['GITHUB_RUN_ID']),'builder_provenance_commit':os.environ['GITHUB_SHA'],'outer_archive_sha256':None,'outer_archive_hash_location':'detached sidecar','accepted_api05_sha256':os.environ['API06_API05_SHA'],'sealed_acceptance_workflow_sha256':wfsha}
          (root/'docs/api/API-06/API06_CANDIDATE_IDENTITY.json').write_text(json.dumps(ident,indent=2)+'\n')
          (root/'SHA256SUMS.txt').unlink(missing_ok=True)
          files=sorted(p for p in root.rglob('*') if p.is_file())
          (root/'SHA256SUMS.txt').write_text('\n'.join(f'{h(p)}  {p.relative_to(root)}' for p in files)+'\n')
          stage=out/name; shutil.copytree(root,stage); zip_path=out/(name+'.zip')
          with zipfile.ZipFile(zip_path,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in sorted(stage.rglob('*')):
                  if p.is_file(): z.write(p,f'{name}/{p.relative_to(stage).as_posix()}')
          with zipfile.ZipFile(zip_path) as z: assert z.testzip() is None
          digest=h(zip_path); (out/(name+'.zip.sha256')).write_text(f'{digest}  {name}.zip\n')
          print('API06_C1_PACKAGE:PASS',digest,zip_path.stat().st_size)
          PY
          ZIP="$RUNNER_TEMP/EPD2_API06_API_LAYER_COMPLETION_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1.zip"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "side=$ZIP.sha256" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum "$ZIP"|cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Upload sealed candidate
        uses: actions/upload-artifact@v4
        with:
          name: api06-c1-candidate-v3
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.side }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api06-c1-build-evidence-v3-${{ github.run_id }}
          path: |
            ${{ steps.base.outputs.root }}/docs/api/API-06/
            ${{ steps.base.outputs.root }}/validation/api06/
            /tmp/api06-c1-validator.log
          if-no-files-found: warn
          retention-days: 90

      - name: Developer result
        if: success()
        run: echo 'API06_C1_DEVELOPER_RESULT:PASS; state=CANDIDATE_NOT_ACCEPTED'