name: api01-c5-retry-bootstrap

on:
  push:
    branches: [main]
    paths: [.github/workflows/api01-c5-retry-bootstrap.yml]

permissions:
  actions: write
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale API-01 C5 pending run holding concurrency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/32966322534/cancel"
          echo 'Stale C5 run 32966322534 cancelled; queued run 32966657208 may proceed.'
