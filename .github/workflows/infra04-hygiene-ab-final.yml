name: INFRA-04 final hygiene A/B

on:
  push:
    branches: ["diagnostic/infra04-hygiene-ab-final"]

permissions:
  contents: read

env:
  BASE_REF: 7544f5dc3bf40304ae81b4d8ef476cc8ecb60ec5
  INFRA02_PATH: handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip
  INFRA02_SHA256: d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
  INFRA02_SIZE: "15980332"

jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout diagnostic carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Bind predecessor and materialize exact A/B roots
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="$GITHUB_WORKSPACE"
          BASELINE_ROOT="$RUNNER_TEMP/infra04-hygiene-baseline"
          CANDIDATE_ROOT="$RUNNER_TEMP/infra04-hygiene-candidate"
          git fetch --no-tags origin main handoff/infra
          test "$(git rev-parse origin/main)" = "$BASE_REF"
          git show "origin/handoff/infra:$INFRA02_PATH" > /tmp/infra02.zip
          test "$(sha256sum /tmp/infra02.zip | awk '{print $1}')" = "$INFRA02_SHA256"
          test "$(stat -c %s /tmp/infra02.zip)" = "$INFRA02_SIZE"
          unzip -t /tmp/infra02.zip >/dev/null
          git worktree add --detach "$BASELINE_ROOT" "$BASE_REF"
          git worktree add --detach "$CANDIDATE_ROOT" "$BASE_REF"

          SOURCE_ROOT="$SOURCE_ROOT" BASELINE_ROOT="$BASELINE_ROOT" python3 - <<'PY'
          import importlib.util, os, pathlib, zipfile
          source=pathlib.Path(os.environ['SOURCE_ROOT'])
          root=pathlib.Path(os.environ['BASELINE_ROOT'])
          p=source/'handoff/INFRA/infra04-c2-transport/apply.py'
          spec=importlib.util.spec_from_file_location('infra04_apply',p)
          mod=importlib.util.module_from_spec(spec); assert spec and spec.loader
          spec.loader.exec_module(mod)
          with zipfile.ZipFile('/tmp/infra02.zip') as z:
              files=[n for n in z.namelist() if not n.endswith('/')]
              roots={n.split('/',1)[0] for n in files if '/' in n}
              if len(roots)!=1: raise SystemExit(roots)
              prefix=next(iter(roots))+'/'
              for rel in mod.PREDECESSOR_PATHS:
                  member=prefix+rel
                  if member not in z.namelist(): raise SystemExit(f'missing {rel}')
                  dest=mod.safe_dest(root,rel); dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(z.read(member))
          print(f'HYGIENE_BASELINE_RESTORED:PASS:{len(mod.PREDECESSOR_PATHS)}')
          PY

          python3 "$SOURCE_ROOT/handoff/INFRA/infra04-c2-transport/apply.py" --root "$CANDIDATE_ROOT" --predecessor /tmp/infra02.zip
          cp -a "$SOURCE_ROOT/handoff/INFRA/infra04-c2-overlay/." "$CANDIDATE_ROOT"/
          printf '%s\n' "$BASELINE_ROOT" > "$GITHUB_WORKSPACE/baseline-root.txt"
          printf '%s\n' "$CANDIDATE_ROOT" > "$GITHUB_WORKSPACE/candidate-root.txt"
          echo HYGIENE_AB_MATERIALIZATION:PASS

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install exact dependencies in both roots
        shell: bash
        run: |
          set -euo pipefail
          for f in baseline-root.txt candidate-root.txt; do
            ROOT=$(cat "$GITHUB_WORKSPACE/$f")
            cd "$ROOT"
            uv sync --all-groups --frozen
            npm ci
          done
          cd "$(cat "$GITHUB_WORKSPACE/candidate-root.txt")"
          npx playwright install --with-deps chromium
          echo HYGIENE_AB_DEPS:PASS

      - name: Apply exact current C2 reconciliation to candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat "$GITHUB_WORKSPACE/candidate-root.txt")
          cd "$ROOT"
          uv run python scripts/infra04/reconcile_inherited_acceptance_baseline.py --root "$ROOT"
          echo HYGIENE_CANDIDATE_RECONCILIATION:PASS

      - name: Run three hygiene checks A/B without short-circuiting
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/hygiene"
          run_root() {
            LABEL="$1"; ROOT="$2"
            cd "$ROOT"
            set +e
            uv run ruff format --check . >"$GITHUB_WORKSPACE/hygiene/$LABEL-ruff-format.txt" 2>&1
            RF=$?
            uv run ruff check . >"$GITHUB_WORKSPACE/hygiene/$LABEL-ruff-lint.txt" 2>&1
            RL=$?
            npm run format:check >"$GITHUB_WORKSPACE/hygiene/$LABEL-prettier.txt" 2>&1
            PR=$?
            set -e
            printf 'ruff_format=%s\nruff_lint=%s\nprettier=%s\n' "$RF" "$RL" "$PR" >"$GITHUB_WORKSPACE/hygiene/$LABEL-rc.txt"
            echo "HYGIENE_RESULT:$LABEL:ruff-format=$RF:ruff-lint=$RL:prettier=$PR"
          }
          run_root baseline "$(cat "$GITHUB_WORKSPACE/baseline-root.txt")"
          run_root candidate "$(cat "$GITHUB_WORKSPACE/candidate-root.txt")"
          echo '--- BASELINE RUFF FORMAT ---'; cat "$GITHUB_WORKSPACE/hygiene/baseline-ruff-format.txt"
          echo '--- CANDIDATE RUFF FORMAT ---'; cat "$GITHUB_WORKSPACE/hygiene/candidate-ruff-format.txt"
          echo '--- BASELINE RUFF LINT ---'; cat "$GITHUB_WORKSPACE/hygiene/baseline-ruff-lint.txt"
          echo '--- CANDIDATE RUFF LINT ---'; cat "$GITHUB_WORKSPACE/hygiene/candidate-ruff-lint.txt"
          echo '--- BASELINE PRETTIER ---'; cat "$GITHUB_WORKSPACE/hygiene/baseline-prettier.txt"
          echo '--- CANDIDATE PRETTIER ---'; cat "$GITHUB_WORKSPACE/hygiene/candidate-prettier.txt"

      - name: Upload exact hygiene evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra04-final-hygiene-ab-${{ github.run_id }}
          path: ${{ github.workspace }}/hygiene/**
          if-no-files-found: error
          retention-days: 30
