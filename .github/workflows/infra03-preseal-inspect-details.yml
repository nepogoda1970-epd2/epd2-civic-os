name: INFRA-03 PRESEAL Inspect Details

on:
  push:
    branches: ["handoff/infra"]
    paths:
      - ".github/workflows/infra03-preseal-inspect-details.yml"

permissions:
  contents: read

jobs:
  inspect-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate promotion-sensitive constants
        shell: bash
        run: |
          set -euo pipefail
          CAND='handoff/INFRA/incoming/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL.zip'
          rm -rf _infra03
          python - <<'PY'
          import zipfile
          p='handoff/INFRA/incoming/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL.zip'
          zipfile.ZipFile(p).extractall('_infra03')
          PY
          ROOT=$(find _infra03 -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "ROOT=$ROOT"
          echo '===== PRESEAL NAME / MODE OCCURRENCES ====='
          grep -RIn --exclude='*.json' --exclude='*.md' --exclude='*.lock' --exclude='package-lock.json' -E 'EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0\.1_PRESEAL|PARALLEL_WORKING_PRESEAL_NOT_ACCEPTED|API-06 has no authoritative acceptance|API-06 = NEXT' "$ROOT" | head -300 || true
          echo '===== GATES TAIL ====='
          sed -n '1040,1195p' "$ROOT/scripts/infra03/gates.py"
          echo '===== ACCEPTANCE NAMING ====='
          grep -RIn --include='*.py' -E 'candidate_name|CANDIDATE_NAME|EPD2_INFRA03|INFRA03' "$ROOT/scripts/acceptance" | head -300 || true
