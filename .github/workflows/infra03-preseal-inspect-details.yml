name: INFRA-03 PRESEAL Inspect Details

on:
  push:
    branches: ["handoff/infra"]
    paths:
      - ".github/workflows/infra03-preseal-inspect-details.yml"

permissions:
  contents: read

jobs:
  inspect-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect final packaging contract
        shell: bash
        run: |
          set -euo pipefail
          CAND='handoff/INFRA/incoming/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL.zip'
          rm -rf _infra03
          python - <<'PY'
          import zipfile
          p='handoff/INFRA/incoming/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL.zip'
          zipfile.ZipFile(p).extractall('_infra03')
          PY
          ROOT=$(find _infra03 -mindepth 1 -maxdepth 1 -type d | head -1)
          echo '===== PRESEAL FULL ====='
          sed -n '1,280p' "$ROOT/scripts/infra03/preseal.py"
          echo '===== G39 G40 REFERENCES ====='
          grep -RIn -E 'G39|G40|archive hygiene|same-bytes|package_identity' "$ROOT/scripts/infra03" "$ROOT/tests/repository/test_infra03_units.py" | head -240 || true
