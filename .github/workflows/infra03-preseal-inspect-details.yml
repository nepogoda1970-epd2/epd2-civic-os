name: INFRA-03 PRESEAL Inspect Details

on:
  push:
    branches: ["handoff/infra"]
    paths:
      - ".github/workflows/infra03-preseal-inspect-details.yml"

permissions:
  contents: read

jobs:
  inspect-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect G41 implementation and API06 schema
        shell: bash
        run: |
          set -euo pipefail
          CAND='handoff/INFRA/incoming/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL.zip'
          rm -rf _infra03
          python - <<'PY'
          import zipfile
          p='handoff/INFRA/incoming/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL.zip'
          zipfile.ZipFile(p).extractall('_infra03')
          PY
          ROOT=$(find _infra03 -mindepth 1 -maxdepth 1 -type d | head -1)
          echo '===== G41 AREA ====='
          sed -n '430,515p' "$ROOT/scripts/infra03/gates.py"
          echo '===== G41 CALL AREA ====='
          sed -n '250,370p' "$ROOT/scripts/infra03/gates.py"
          echo '===== CURRENT API06 RECORD ====='
          git fetch --no-tags origin main
          git show origin/main:docs/api/API-06/API06_C1_ACCEPTANCE_RECORD.json
          echo '===== INFRA02 ACCEPTANCE RECORD ====='
          git show origin/main:docs/infra/INFRA-02/INFRA02_ACCEPTANCE_RECORD.json | head -220
