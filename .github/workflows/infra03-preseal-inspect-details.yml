name: INFRA-03 PRESEAL Inspect Details

on:
  push:
    branches: ["handoff/infra"]
    paths:
      - ".github/workflows/infra03-preseal-inspect-details.yml"

permissions:
  contents: read

jobs:
  inspect-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read candidate executable acceptance surface
        shell: bash
        run: |
          set -euo pipefail
          CAND='handoff/INFRA/incoming/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL.zip'
          rm -rf _infra03
          python - <<'PY'
          import zipfile
          p='handoff/INFRA/incoming/EPD2_INFRA03_DEPLOYMENT_RUNTIME_AND_PREVIEW_READINESS_WORKING_0.1_PRESEAL.zip'
          zipfile.ZipFile(p).extractall('_infra03')
          PY
          ROOT=$(find _infra03 -mindepth 1 -maxdepth 1 -type d | head -1)
          echo "ROOT=$ROOT"
          for f in scripts/infra03/gates.py scripts/infra03/config.py tests/repository/test_infra03_units.py tests/repository/test_infra03_mutation_suite.py validation/infra03/run_preview_deployment.py; do
            echo "===== FILE:$f ====="
            sed -n '1,520p' "$ROOT/$f"
          done
          echo '===== SCRIPT ENTRYPOINTS ====='
          grep -RIn -E 'if __name__|argparse|def main|run_gate|gate_suite|INFRA03_' "$ROOT/scripts/infra03" "$ROOT/validation/infra03/run_preview_deployment.py" | head -400 || true
