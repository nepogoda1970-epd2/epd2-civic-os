name: OPS-03 C2 final current-main build
on:
  push:
    branches: [tmp/ops03-c2-build]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EPD2_OPS_PGHOST: 127.0.0.1
      EPD2_OPS_PGPORT: "5432"
      EPD2_OPS_PGUSER: postgres
      EPD2_OPS_PGDATABASE: epd2_ops01
      EPD2_PREVIEW_PGHOST: 127.0.0.1
      EPD2_PREVIEW_PGPORT: "5432"
      EPD2_PREVIEW_PGUSER: postgres
      EPD2_PREVIEW_PGDATABASE: epd2_preview
      EPD2_OPS03_PGHOST: 127.0.0.1
      EPD2_OPS03_PGPORT: "5432"
      EPD2_OPS03_PGUSER: postgres
      EPD2_OPS03_PGDATABASE: epd2_ops03
    steps:
      - name: Checkout builder control
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download exact accepted API-06 C1 artifact
        uses: actions/download-artifact@v4
        with:
          name: api06-c1-candidate-v3
          path: ${{ runner.temp }}/accepted-api06
          run-id: 33628261946
          github-token: ${{ github.token }}
      - name: Bind exact accepted API-06 C1 candidate
        shell: bash
        run: |
          set -euo pipefail
          P=$(find "$RUNNER_TEMP/accepted-api06" -type f -name 'EPD2_API06_API_LAYER_COMPLETION_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1.zip' -print -quit)
          test -n "$P"
          echo '3432b6615aa83c6f2860c015b7cafc2a18362aa371901616951a1bd5d263933c  '"$P" | sha256sum -c -
          test "$(stat -c%s "$P")" = '44012716'
          echo "EPD2_OPS03_ACCEPTED_API06_ZIP=$P" >> "$GITHUB_ENV"
          echo 'OPS03_C2_ACCEPTED_API06_ARTIFACT:PASS'
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up exact uv toolchain
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.6.14"
          enable-cache: false
      - name: Install exact C2 governance overlay before seal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/ops03_c2_ci.sh")
          text = path.read_text(encoding="utf-8")
          anchor = "grep -q '^OPS03_C2_API06_PATCH:PASS:' \"$RUNNER_TEMP/ops03-c2-api06-patch.log\"\n"
          insertion = (
              anchor
              + "python3 \"$REPO_ROOT/scripts/ops03_c2_exact_binding_overlay.py\" \"$ROOT\"\n"
              + "python3 \"$REPO_ROOT/scripts/ops03_c2_normalize_generated.py\" \"$ROOT\"\n"
              + "uvx --from ruff==0.15.22 ruff format \"$ROOT/packages/python/epd2-qualification/src/epd2_qualification/api06_binding.py\" \"$ROOT/scripts/validation/validate_ops03.py\"\n"
          )
          if text.count(anchor) != 1:
              raise SystemExit(f"OPS03 C2 API06 post-patch anchor count={text.count(anchor)}")
          text = text.replace(anchor, insertion, 1)
          path.write_text(text, encoding="utf-8")
          print("OPS03_C2_EXACT_BINDING_CONTROL:PASS")
          PY
      - name: Reconcile seal and qualify exact C2
        id: c2
        shell: bash
        run: bash scripts/ops03_c2_ci.sh
      - name: Prove tested frozen packaged governed bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - '${{ steps.c2.outputs.candidate }}' '${{ steps.c2.outputs.evidence }}/same_bytes_result.json' <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          candidate = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(candidate) as zf:
              names = set(zf.namelist())
              freeze = json.loads(zf.read("OPS03_FREEZE_MANIFEST.json"))
              bad = []
              for rel, expected in freeze["files"].items():
                  if rel not in names:
                      bad.append(f"missing:{rel}")
                      continue
                  actual = hashlib.sha256(zf.read(rel)).hexdigest()
                  if actual != expected:
                      bad.append(f"digest:{rel}")
              sums_bad = []
              for row in zf.read("SHA256SUMS.txt").decode("utf-8").splitlines():
                  if not row.strip():
                      continue
                  digest, rel = row.split(None, 1)
                  rel = rel.strip()
                  if rel not in names or hashlib.sha256(zf.read(rel)).hexdigest() != digest:
                      sums_bad.append(rel)
          acceptance = json.loads((out.parent / "ops03_acceptance_result.json").read_text())
          unchanged = acceptance["result"]["same_governed_source_bytes_after_execution"] is True
          result = {
              "schema": "epd2.ops03.c2.same-bytes/1",
              "result": "PASS" if not bad and not sums_bad and unchanged else "FAIL",
              "tested_source_unchanged": unchanged,
              "frozen_files_verified_in_package": freeze["file_count"] - len(bad),
              "frozen_files_total": freeze["file_count"],
              "sha256sums_failures": sums_bad,
              "freeze_failures": bad,
              "statement": "tested governed source bytes == frozen governed bytes == packaged governed bytes",
          }
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          if result["result"] != "PASS":
              raise SystemExit(result)
          print(f"OPS03_C2_SAME_BYTES:PASS:{freeze['file_count']}")
          PY
      - name: Write C2 developer report
        shell: bash
        run: |
          set -euo pipefail
          cat > '${{ steps.c2.outputs.evidence }}/OPS03_C2_DEVELOPER_REPORT.md' <<'EOF'
          # OPS-03 C2 Developer Report

          C1 was not promoted. It was stale for current authoritative acceptance because its entering baseline was `main@217559b7f21c338d6fe8d4e4676082cd3840251c` and its G05 semantics treated API-06 as `NEXT` / API-layer closure as a stale-baseline blocker.

          C2 is a minimal corrective reconciliation on the current canonical baseline:

          - old entering baseline: `217559b7f21c338d6fe8d4e4676082cd3840251c`
          - new entering baseline commit: `${{ steps.c2.outputs.main }}`
          - new entering baseline tree: `${{ steps.c2.outputs.tree }}`
          - accepted API-06 candidate: `EPD2_API06_API_LAYER_COMPLETION_AND_PREVIEW_READINESS_CANDIDATE_0.1_C1.zip`
          - accepted API-06 SHA-256: `3432b6615aa83c6f2860c015b7cafc2a18362aa371901616951a1bd5d263933c`
          - accepted API-06 size: `44012716` bytes
          - authoritative API-06 run/job: `33629147572` / `100243984921`
          - API-06 state required by G05: `ACCEPTED_CLOSED`; API layer: `CLOSED`
          - G05 change: exact acceptance-record identity + filename/SHA/size/run/job + exact accepted archive bytes + bounded runtime load/soak + explicit binding evidence
          - governed qualification: `50/50 PASS`, `0 FAIL`, `0 BLOCKED`
          - mutation suite: `24/24 DETECTED`
          - predecessor regression: OPS-01 + exact accepted OPS-02 regression PASS
          - candidate package SHA-256: `${{ steps.c2.outputs.candidate_sha }}`
          - candidate package size: `${{ steps.c2.outputs.candidate_size }}` bytes
          - self-state: `CANDIDATE_NOT_ACCEPTED`
          - same-bytes: tested governed source bytes == frozen governed bytes == packaged governed bytes
          - System Trial Preview: NOT OPEN; OPS-03 may qualify preview-readiness minimum only, and a separate governed checkpoint-opening decision remains required.

          No automatic acceptance, closure, production-readiness, or System Trial Preview opening is claimed by candidate bytes.
          EOF
      - name: Upload exact sealed C2 candidate
        uses: actions/upload-artifact@v4
        with:
          name: ops03-c2-sealed-candidate-${{ github.run_id }}
          path: ${{ steps.c2.outputs.candidate }}
          if-no-files-found: error
          retention-days: 90
      - name: Upload C2 builder evidence
        uses: actions/upload-artifact@v4
        with:
          name: ops03-c2-build-evidence-${{ github.run_id }}
          path: ${{ steps.c2.outputs.evidence }}/
          if-no-files-found: error
          retention-days: 90
      - name: Terminal builder result
        run: echo 'OPS03_C2_BUILD_RESULT:PASS:${{ steps.c2.outputs.candidate_sha }}:${{ steps.c2.outputs.candidate_size }}:${{ steps.c2.outputs.workflow_sha }}:${{ steps.c2.outputs.main }}:${{ steps.c2.outputs.tree }}'