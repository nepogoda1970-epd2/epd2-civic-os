name: INFRA-02 exact candidate export
on:
  push:
    branches:
      - handoff/infra
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify source candidate exists
        shell: bash
        run: |
          set -euo pipefail
          p='handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip'
          test -f "$p"
          sha256sum "$p"
          stat -c '%s' "$p"
          git hash-object "$p"
          unzip -t "$p" >/dev/null
      - name: Stage exact candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          cp 'handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip' "$RUNNER_TEMP/export/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra02-exact-candidate-export
          path: ${{ runner.temp }}/export/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip
          if-no-files-found: error
          compression-level: 0
