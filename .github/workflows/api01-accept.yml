# Temporary registration stub for API-01 C5 workflow_dispatch.
# The authoritative run is dispatched to tmp/api01-c5-authoritative-run-20260826,
# where this path contains the exact workflow blob sealed inside C5.
name: api01-accept
on:
  workflow_dispatch:
    inputs:
      candidate_sha256:
        required: true
      candidate_run_id:
        required: false
        default: ""
      anchors_run_id:
        required: false
        default: ""
permissions:
  contents: read
jobs:
  registration-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'registration stub must not be used as the authoritative run'
          exit 1
