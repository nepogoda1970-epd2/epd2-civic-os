# Registration stub for the API-01 authoritative workflow.
# GitHub requires a workflow_dispatch workflow to exist on the default branch.
# Authoritative API-01 C4 runs MUST be dispatched to the sealed run branch;
# that branch contains the exact workflow blob from the sealed C4 candidate.

name: api01-accept

on:
  workflow_dispatch:
    inputs:
      candidate_sha256:
        description: expected SHA-256 of the sealed API-01 candidate
        required: true
      candidate_run_id:
        description: optional candidate artifact run id
        required: false
        default: ""
      anchors_run_id:
        description: optional anchors artifact run id
        required: false
        default: ""

permissions:
  contents: read

jobs:
  default-branch-registration-only:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse execution of registration stub
        run: |
          echo "This default-branch file only registers workflow_dispatch."
          echo "Dispatch the authoritative run to the sealed API-01 C4 run branch."
          exit 1
