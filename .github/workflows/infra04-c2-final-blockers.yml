name: INFRA-04 C2 Final Blockers
on:
  push:
    branches: ["diagnostic/infra04-c2-final-blockers"]
permissions:
  contents: read
env:
  INFRA02_PATH: handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip
  INFRA02_SHA256: d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
jobs:
  blockers:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Materialize exact C2 and remove diagnostic self-file
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin handoff/infra
          git show "origin/handoff/infra:$INFRA02_PATH" > /tmp/infra02.zip
          test "$(sha256sum /tmp/infra02.zip|awk '{print $1}')" = "$INFRA02_SHA256"
          python3 handoff/INFRA/infra04-c2-transport/apply.py --root "$GITHUB_WORKSPACE" --predecessor /tmp/infra02.zip
          cp -a handoff/INFRA/infra04-c2-overlay/. "$GITHUB_WORKSPACE"/
          rm -rf handoff/INFRA/infra04-c2-transport handoff/INFRA/infra04-c2-overlay
          rm -f .github/workflows/infra04-c2-final-blockers.yml
          git rm -f --ignore-unmatch SHA256SUMS.txt ACCEPTANCE/FREEZE-INVENTORY.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with: {enable-cache: true}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install frozen dependencies and Chromium
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-groups --frozen
          npm ci
          npx playwright install --with-deps chromium
      - name: Snapshot governed bytes before tests
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 > /tmp/status-before.txt
          find . -type f -not -path './.git/*' -not -path './.venv/*' -not -path './node_modules/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/all-before.sha256
      - name: Full pytest
        shell: bash
        run: |
          set +e
          uv run pytest -q 2>&1 | tee /tmp/full-pytest.txt
          echo PYTEST_RC=${PIPESTATUS[0]} | tee /tmp/full-pytest-rc.txt
          exit 0
      - name: Browser
        shell: bash
        run: |
          set +e
          npm run test:browser --workspace=frontend/web-shell 2>&1 | tee /tmp/browser.txt
          echo BROWSER_RC=${PIPESTATUS[0]} | tee /tmp/browser-rc.txt
          exit 0
      - name: Detect test-induced byte drift
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain=v1 > /tmp/status-after.txt
          find . -type f -not -path './.git/*' -not -path './.venv/*' -not -path './node_modules/*' -print0 | sort -z | xargs -0 sha256sum > /tmp/all-after.sha256
          diff -u /tmp/all-before.sha256 /tmp/all-after.sha256 > /tmp/byte-drift.diff || true
          git diff --name-status > /tmp/git-diff-name-status.txt || true
          cat /tmp/git-diff-name-status.txt
      - name: Vulnerability diagnostics
        shell: bash
        run: |
          set +e
          uv run python - <<'PY' 2>&1 | tee /tmp/vulnerability.txt
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          from scripts.infra02.vulnerability import run_pip_audit, run_npm_audit, load_exceptions, evaluate_gate
          root=Path('.')
          pa,ps=run_pip_audit(root)
          na,ns=run_npm_audit(root)
          print('PIP_STATUS',ps)
          print('NPM_STATUS',ns)
          print('PIP_ADVISORIES',json.dumps([a.__dict__ for a in (pa or [])],indent=2,sort_keys=True))
          print('NPM_ADVISORIES',json.dumps([a.__dict__ for a in (na or [])],indent=2,sort_keys=True))
          if pa is not None and na is not None:
              findings=evaluate_gate(pa+na,load_exceptions(),now=datetime.now(tz=UTC))
              print('POLICY_FINDINGS',json.dumps([f.__dict__ for f in findings],indent=2,sort_keys=True))
          PY
          exit 0
      - name: Upload final blocker evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra04-c2-final-blockers-${{ github.run_id }}
          path: /tmp/*.txt
          if-no-files-found: error
          retention-days: 7
