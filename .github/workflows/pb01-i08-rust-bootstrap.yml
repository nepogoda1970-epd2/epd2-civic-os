name: PB01-I08 Rust bootstrap

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/pb01-i08-trigger.txt"

permissions:
  contents: read

jobs:
  rust-bootstrap:
    name: Pinned Rust locked/offline bootstrap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout technical I08 branch
        uses: actions/checkout@v4
        with:
          ref: pb01-i08-rust-bootstrap

      - name: Materialize verifier source
        run: |
          mkdir -p i08-bootstrap/src
          cat i08-bootstrap/main.rs.gz.b64.part1 i08-bootstrap/main.rs.gz.b64.part2 | base64 -d | gzip -d > i08-bootstrap/src/main.rs
          echo "c6f042635ef2980b6ec2514ff7e2221815b6493cd5f7d6251608eb753e6a8ad9  i08-bootstrap/src/main.rs" | sha256sum -c -

      - name: Install pinned Rust 1.97.1
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Generate exact lock, compile and test
        working-directory: i08-bootstrap
        run: |
          rustc --version | tee rustc-version.txt
          cargo --version | tee cargo-version.txt
          cargo generate-lockfile
          cargo build --locked --release
          cargo test --locked
          cargo tree --locked > dependency-tree.txt
          cargo metadata --locked --format-version 1 > cargo-metadata.json
          sha256sum Cargo.lock target/release/epd2-i08-verifier-c > bootstrap-sha256.txt

      - name: Vendor dependency closure and prove offline build
        working-directory: i08-bootstrap
        run: |
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          rm -rf target
          cargo build --locked --release --offline
          cargo test --locked --offline
          sha256sum target/release/epd2-i08-verifier-c >> bootstrap-sha256.txt

      - name: Package bootstrap evidence
        run: |
          tar -C i08-bootstrap -czf i08-rust-bootstrap.tgz \
            Cargo.lock rustc-version.txt cargo-version.txt dependency-tree.txt \
            cargo-metadata.json bootstrap-sha256.txt .cargo vendor \
            target/release/epd2-i08-verifier-c

      - name: Upload bootstrap artifact
        uses: actions/upload-artifact@v4
        with:
          name: pb01-i08-rust-bootstrap
          path: i08-rust-bootstrap.tgz
          if-no-files-found: error
          retention-days: 7

      - name: Package pinned Rust toolchain for local live validation
        run: |
          tar -C "$HOME/.rustup/toolchains" -czf rust-toolchain-1.97.1-x86_64-unknown-linux-gnu.tgz 1.97.1-x86_64-unknown-linux-gnu

      - name: Upload pinned Rust toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: pb01-i08-rust-toolchain-1.97.1
          path: rust-toolchain-1.97.1-x86_64-unknown-linux-gnu.tgz
          if-no-files-found: error
          retention-days: 2
