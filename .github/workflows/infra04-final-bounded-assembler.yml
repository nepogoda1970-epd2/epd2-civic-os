name: INFRA-04 final bounded source assembler
on:
  push:
    branches: ["repair/infra04-c2-final-bounded"]
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Verify assembler base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5f619b76f9bc6ef81e076f785d6f5cb307965133"
          test "$(git rev-parse origin/candidate/infra04-c2-canonical)" = "5f619b76f9bc6ef81e076f785d6f5cb307965133"
      - name: Install bounded authoritative source only
        shell: bash
        env:
          WORKFLOW_B64: ...34730 chars truncated...
          BASELINE_B64: ...24049 chars truncated...{archive.name}\n", encoding="utf-8")
          ...