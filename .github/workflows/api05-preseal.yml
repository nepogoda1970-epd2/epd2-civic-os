name: API-05 WORKING 0.1 PRESEAL

on:
  push:
    branches:
      - tmp/api05-working-0.1-preseal
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: api05
          POSTGRES_PASSWORD: api05-synthetic-ci-only
          POSTGRES_DB: epd2_api05
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U api05 -d epd2_api05"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      EPD2_API05_DATABASE_URL: postgresql://api05:api05-synthetic-ci-only@127.0.0.1:5432/epd2_api05
      API04_POSTGRES_DSN: postgresql://api05:api05-synthetic-ci-only@127.0.0.1:5432/epd2_api05

    steps:
      - name: Checkout API-05 transport branch
        uses: actions/checkout@v4

      - name: Download exact API-04 working snapshot input
        uses: actions/download-artifact@v4
        with:
          name: api04-c1-reconciled-snapshot-33565519471
          path: incoming/api04
          run-id: 33565519471
          github-token: ${{ github.token }}

      - name: Materialize API-05 working tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/api05"
          tar --no-same-owner -xzf incoming/api04/API04_C1_SNAPSHOT.tar.gz -C "$RUNNER_TEMP/api05"
          ROOT="$RUNNER_TEMP/api05/API04_C1_SNAPSHOT"
          base64 --decode handoff/API-05/WORKING_0.1/api05_overlay.tar.gz.b64 > "$RUNNER_TEMP/api05-overlay.tar.gz"
          tar --no-same-owner -xzf "$RUNNER_TEMP/api05-overlay.tar.gz" -C "$ROOT"
          echo "root=$ROOT" >> "$GITHUB_ENV"

      - name: Install exact toolchain
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Install locked workspace and API-04 exact adapter dependency
        shell: bash
        run: |
          set -euo pipefail
          cd "$root"
          uv sync --frozen --all-groups
          uv pip install --python .venv/bin/python pika==1.3.2

      - name: Run API-05 current-path validator
        shell: bash
        run: |
          set -euo pipefail
          cd "$root"
          .venv/bin/python scripts/validate_api05.py --out validation/api05/validator_result.json | tee /tmp/api05-validator.log
          grep -q '^API05_PRESEAL_RESULT:PASS:validation/api05/validator_result.json$' /tmp/api05-validator.log
          jq -e '.result=="PASS" and .failed_gates==[] and .environment_blocked_gates==[]' validation/api05/validator_result.json

      - name: Freeze and package exact working PRESEAL
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cd "$root"
          rm -rf .venv .pytest_cache .mypy_cache .ruff_cache
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          rm -f SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = {
              "schema_version": "1",
              "candidate_name": "EPD2_API05_EXTERNAL_INTEGRATION_BOUNDARY_WORKING_0.1_PRESEAL",
              "state": "WORKING_PRESEAL_NOT_ACCEPTED",
              "accepted_api04_sha256": None,
              "outer_archive_sha256": None,
              "outer_archive_hash_location": "sidecar only",
          }
          path = Path("docs/api/API-05/API05_CANDIDATE_IDENTITY.json")
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY
          find . -type f ! -path './SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          sha256sum --quiet -c SHA256SUMS.txt
          listed=$(grep -c . SHA256SUMS.txt)
          actual=$(find . -type f ! -path './SHA256SUMS.txt' | wc -l)
          test "$listed" = "$actual"
          FINAL="$RUNNER_TEMP/EPD2_API05_EXTERNAL_INTEGRATION_BOUNDARY_WORKING_0.1_PRESEAL"
          mv "$root" "$FINAL"
          ZIP="$RUNNER_TEMP/EPD2_API05_EXTERNAL_INTEGRATION_BOUNDARY_WORKING_0.1_PRESEAL.zip"
          (cd "$RUNNER_TEMP" && zip -q -r -X "$ZIP" "$(basename "$FINAL")")
          SHA=$(sha256sum "$ZIP" | cut -d' ' -f1)
          printf '%s  %s\n' "$SHA" "$(basename "$ZIP")" > "$ZIP.sha256"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha_file=$ZIP.sha256" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "API05_WORKING_PRESEAL_SHA256=$SHA"

      - name: Upload API-05 working PRESEAL
        uses: actions/upload-artifact@v4
        with:
          name: api05-working-0.1-preseal
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha_file }}
            ${{ runner.temp }}/EPD2_API05_EXTERNAL_INTEGRATION_BOUNDARY_WORKING_0.1_PRESEAL/docs/api/API-05/API05_DEVELOPER_REPORT.md
            ${{ runner.temp }}/EPD2_API05_EXTERNAL_INTEGRATION_BOUNDARY_WORKING_0.1_PRESEAL/validation/api05/validator_result.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Final developer result
        run: |
          echo 'API05_DEVELOPER_RESULT:PASS'
          echo 'state remains WORKING_PRESEAL_NOT_ACCEPTED; API-04 accepted predecessor is still required'

