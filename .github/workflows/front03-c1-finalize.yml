name: FRONT-03 C1 governed finalize
on:
  push:
    branches: [tmp/front03-c1-closure]
    paths: ['.github/workflows/front03-c1-finalize.yml']
permissions:
  contents: read
  actions: read
jobs:
  independent-accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout acceptance runner
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up governed Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Independent governed acceptance on sealed C1
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/front03_c1_independent_accept.sh
      - name: Upload independent acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: front03-c1-acceptance-evidence-${{ github.run_id }}
          path: acceptance/
          if-no-files-found: error
          retention-days: 90
