name: INFRA-04 governance closure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/infra04-governance-close.yml

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch canonical control state and write acceptance record
        run: python3 scripts/infra04_governance_close.py

      - name: Commit canonical closure
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "epd2-governance-bot"
          git config user.email "epd2-governance-bot@users.noreply.github.com"
          git add docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md docs/infra/INFRA-04/INFRA04_C2_ACCEPTANCE_RECORD.json
          git diff --cached --quiet && { echo "no governance delta"; exit 1; } || true
          git commit -m "governance(infra04): accept close C2 in PCR"
          git push origin HEAD:main

      - name: Result
        run: echo INFRA04_GOVERNANCE_CLOSURE_PASS
