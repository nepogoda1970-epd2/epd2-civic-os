name: FRONT-05 Canonical Promotion

on:
  push:
    branches: [handoff/front]
    paths:
      - '.github/workflows/front05-canonical-promote.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_MAIN: 8a4d336589f2322984dbf03b1af3b5a575643005
      CANDIDATE_REL: handoff/FRONT/incoming/EPD2_FRONT05_WS04_REPRESENTATIVE_WORKSPACE_CANDIDATE_0.1_C1.zip
      EXPECTED_SHA256: ed8d8f0c7f3da68cfe5d871149c799484548bb172907e5b954f1f10728c88f7a
      EXPECTED_SIZE: '27161590'
      ACCEPT_RUN: '33700475382'
      ACCEPT_HEAD: d45c478c70b2098d4bed2c73ab048ccacf9c081e
      VERIFY_JOB: '100478465454'
      REVIEW_JOB: '100480260808'
      EVIDENCE_ARTIFACT: '9873516980'
      EVIDENCE_ARTIFACT_DIGEST: sha256:e382021fb9eae34e3ab153ebac47446eda9f49876d028e63c148de1d02822b52
      CANDIDATE_ARTIFACT: '9873517578'
      CANDIDATE_ARTIFACT_DIGEST: sha256:870dec54b8564a122dce7219d22710a4b03d5ebb1e5caa27cbf15c708a975ce4
      CONTRACT_DIGEST: dd76d17772275ac4389a659181f6286dcd7d97a65cf6a1e539e4463e935d26bd
      SOURCE_TREE_DIGEST: f9cdd397b944835174a440ec4f470b26743d94839eb32ccbda9f69d325c99ce1
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          fetch-depth: 0

      - name: Checkout authoritative handoff
        uses: actions/checkout@v4
        with:
          ref: handoff/front
          path: handoff
          fetch-depth: 0

      - name: Pin canonical parent and authoritative evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C repo rev-parse HEAD)" = "$EXPECTED_MAIN"
          test -f "handoff/$CANDIDATE_REL"
          test "$(sha256sum "handoff/$CANDIDATE_REL" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c '%s' "handoff/$CANDIDATE_REL")" = "$EXPECTED_SIZE"
          test -f handoff/handoff/FRONT/evidence/FRONT05_CANONICAL_ACCEPTANCE_C1.json

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('handoff/handoff/FRONT/evidence/FRONT05_CANONICAL_ACCEPTANCE_C1.json')
          r=json.loads(p.read_text())
          assert r['schema']=='epd2.front05.c1-authoritative-result/2'
          assert r['result']=='PASS' and r['self_acceptance'] is False
          assert r['candidate']['sha256']==os.environ['EXPECTED_SHA256']
          assert r['candidate']['size_bytes']==int(os.environ['EXPECTED_SIZE'])
          assert r['workflow']['run_id']==int(os.environ['ACCEPT_RUN'])
          assert r['workflow']['head_sha']==os.environ['ACCEPT_HEAD']
          assert r['workflow']['verify_job_id']==int(os.environ['VERIFY_JOB'])
          assert r['workflow']['review_job_id']==int(os.environ['REVIEW_JOB'])
          assert r['validator']=={'passed':46,'total':46,'status':'PASS'}
          assert r['mutations']=={'detected':44,'total':44,'status':'PASS'}
          assert r['archive_hygiene']=='PASS'
          assert r['contract_digest']==os.environ['CONTRACT_DIGEST']
          assert r['binding']['source_tree_digest']==os.environ['SOURCE_TREE_DIGEST']
          assert r['terminal_marker']==f"FRONT05_C1_AUTHORITATIVE_RESULT:PASS:{os.environ['EXPECTED_SHA256']}:{os.environ['EXPECTED_SIZE']}"
          PY

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPT_RUN" > /tmp/front05-run.json
          python3 - <<'PY'
          import json, os
          r=json.load(open('/tmp/front05-run.json'))
          assert r['status']=='completed' and r['conclusion']=='success',r
          assert str(r['id'])==os.environ['ACCEPT_RUN']
          assert r['head_sha']==os.environ['ACCEPT_HEAD']
          assert r['path']=='.github/workflows/front05-c1-canonical-v2.yml'
          PY

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPT_RUN/jobs?per_page=100" > /tmp/front05-jobs.json
          python3 - <<'PY'
          import json, os
          jobs=json.load(open('/tmp/front05-jobs.json'))['jobs']
          byid={str(j['id']):j for j in jobs}
          for jid,name in [(os.environ['VERIFY_JOB'],'verify'),(os.environ['REVIEW_JOB'],'independent-review')]:
              j=byid[jid]
              assert j['name']==name and j['status']=='completed' and j['conclusion']=='success',j
          PY

          gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$ACCEPT_RUN/artifacts?per_page=100" > /tmp/front05-artifacts.json
          python3 - <<'PY'
          import json, os
          arts=json.load(open('/tmp/front05-artifacts.json'))['artifacts']
          byid={str(a['id']):a for a in arts}
          e=byid[os.environ['EVIDENCE_ARTIFACT']]
          c=byid[os.environ['CANDIDATE_ARTIFACT']]
          assert not e['expired'] and e['digest']==os.environ['EVIDENCE_ARTIFACT_DIGEST'],e
          assert not c['expired'] and c['digest']==os.environ['CANDIDATE_ARTIFACT_DIGEST'],c
          assert e['name']==f"front05-c1-verification-{os.environ['ACCEPT_RUN']}"
          assert c['name']==f"front05-c1-exact-candidate-{os.environ['ACCEPT_RUN']}"
          PY

      - name: Safe extract and reconcile predecessors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/front05-candidate
          mkdir -p /tmp/front05-candidate
          python3 - <<'PY'
          import os, stat
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          z='handoff/'+os.environ['CANDIDATE_REL']
          with ZipFile(z) as f:
              names=f.namelist(); assert names and len(names)==len(set(names))
              for i in f.infolist():
                  p=PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert not stat.S_ISLNK((i.external_attr>>16)&0xffff)
                  low='/'+i.filename.lower()
                  assert '/node_modules/' not in low and '/.next/' not in low and '__pycache__' not in low
                  assert not low.endswith(('.pyc','.pyo'))
              f.extractall('/tmp/front05-candidate')
          PY

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/front05-candidate')
          r=json.loads((root/'validation/front05/authoritative_preseal_result.json').read_text())
          m=json.loads((root/'validation/front05/mutation_report.json').read_text())
          a=json.loads((root/'validation/front05/authorization_negatives.json').read_text())
          l=json.loads((root/'validation/front05/lineage.json').read_text())
          assert r['status']=='PASS' and (r['gates_passed'],r['gates_total'])==(46,46)
          assert r['candidate_state']=='CANDIDATE_NOT_ACCEPTED' and r['self_acceptance'] is False
          assert r['stage_contract']['contract_version']=='1.0.0'
          assert r['stage_contract']['contract_digest']=='dd76d17772275ac4389a659181f6286dcd7d97a65cf6a1e539e4463e935d26bd'
          assert m['status']=='PASS' and (m['detected'],m['count'])==(44,44)
          assert (a['satisfied'],a['case_count'])==(18,18)
          pred=json.dumps(l['accepted_predecessors'],sort_keys=True)
          for sha in [
              'aaf980a2cd3b3b06d48218adaa68d109c8770e6abfcbef230197b51a87006179',
              'fec7b19d77c27cbc3ef8a34e433f5aef94ef7853f76d3212bed6acd682497c26',
              '1ac87914a30e589b4059e3b7c74e0a0fd940a78cecbe7f06de299421c8da55f8']:
              assert sha in pred,sha
          pcr=Path('repo/docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md').read_text()
          for sha in ['fec7b19d77c27cbc3ef8a34e433f5aef94ef7853f76d3212bed6acd682497c26','1ac87914a30e589b4059e3b7c74e0a0fd940a78cecbe7f06de299421c8da55f8']:
              assert sha in pcr,sha
          assert 'FRONT-03 C1 is therefore `ACCEPTED / CLOSED`' in pcr
          assert 'FRONT-04 C2 is therefore `ACCEPTED / CLOSED`' in pcr
          PY

      - name: Install cumulative accepted FRONT payload and governance records
        shell: bash
        run: |
          set -euo pipefail
          SRC=/tmp/front05-candidate
          DST=repo

          for d in web-shell voting-client representative-workspace; do
            rm -rf "$DST/frontend/$d"
            mkdir -p "$DST/frontend"
            cp -a "$SRC/frontend/$d" "$DST/frontend/$d"
          done
          cp "$SRC/package.json" "$DST/package.json"
          cp "$SRC/package-lock.json" "$DST/package-lock.json"

          mkdir -p "$DST/docs/frontend" "$DST/scripts" "$DST/validation/front05"
          find "$DST/docs/frontend" -maxdepth 1 -type f -name 'FRONT-05-*' -delete
          find "$SRC/docs/frontend" -maxdepth 1 -type f -name 'FRONT-05-*' -exec cp {} "$DST/docs/frontend/" \;
          find "$DST/scripts" -maxdepth 1 -type f -name '*front05*' -delete
          find "$SRC/scripts" -maxdepth 1 -type f -name '*front05*' -exec cp {} "$DST/scripts/" \;
          rm -rf "$DST/validation/front05"
          cp -a "$SRC/validation/front05" "$DST/validation/front05"
          cp handoff/handoff/FRONT/evidence/FRONT05_CANONICAL_ACCEPTANCE_C1.json "$DST/docs/frontend/FRONT-05-C1-AUTHORITATIVE-EVIDENCE.json"

          python3 - <<'PY'
          import json, os, hashlib
          from pathlib import Path
          root=Path('repo')
          package=json.loads((root/'package.json').read_text())
          assert package['workspaces']==[
              'packages/typescript/epd2-types','frontend/web-shell','frontend/voting-client','frontend/representative-workspace']
          record={
            'schema':'epd2.front05.acceptance-record/1',
            'stage':'FRONT-05 — WS-04 Representative Workspace',
            'decision':'ACCEPTED / CLOSED',
            'decision_date':'2026-09-03',
            'scope':'BOUNDED_FRONT05_WS04_STAGE_ONLY',
            'candidate':{
              'filename':'EPD2_FRONT05_WS04_REPRESENTATIVE_WORKSPACE_CANDIDATE_0.1_C1.zip',
              'sha256':os.environ['EXPECTED_SHA256'],'size_bytes':int(os.environ['EXPECTED_SIZE'])},
            'authoritative_review':{
              'conclusion':'PASS','workflow':'.github/workflows/front05-c1-canonical-v2.yml',
              'run_id':int(os.environ['ACCEPT_RUN']),'run_attempt':1,'head_sha':os.environ['ACCEPT_HEAD'],
              'verify_job_id':int(os.environ['VERIFY_JOB']),'independent_review_job_id':int(os.environ['REVIEW_JOB']),
              'terminal_marker':f"FRONT05_C1_AUTHORITATIVE_RESULT:PASS:{os.environ['EXPECTED_SHA256']}:{os.environ['EXPECTED_SIZE']}"},
            'authoritative_artifacts':{
              'evidence':{'id':int(os.environ['EVIDENCE_ARTIFACT']),'digest':os.environ['EVIDENCE_ARTIFACT_DIGEST']},
              'exact_candidate':{'id':int(os.environ['CANDIDATE_ARTIFACT']),'digest':os.environ['CANDIDATE_ARTIFACT_DIGEST']}},
            'evidence':{
              'gates':'46/46 PASS','mutations':'44/44 DETECTED','authorization_negative':'18/18 PASS',
              'unit_tests':'111 PASS','browser':'297 PASS','browser_production':'297 PASS','authorization_negative_runtime':'132 PASS','visual':'33 PASS',
              'archive_hygiene':'PASS','stale_source_rejection':'PASS','source_tree_digest':os.environ['SOURCE_TREE_DIGEST']},
            'stage_contract':{'version':'1.0.0','digest':os.environ['CONTRACT_DIGEST'],'governance_decision':'RATIFIED_FOR_C1_ACCEPTANCE'},
            'accepted_predecessors':{
              'FRONT-02_C2_1':'aaf980a2cd3b3b06d48218adaa68d109c8770e6abfcbef230197b51a87006179',
              'FRONT-03_C1':'fec7b19d77c27cbc3ef8a34e433f5aef94ef7853f76d3212bed6acd682497c26',
              'FRONT-04_C2':'1ac87914a30e589b4059e3b7c74e0a0fd940a78cecbe7f06de299421c8da55f8'},
            'self_acceptance':False,
            'canonical_install':{'cumulative_front_payload_through':'FRONT-05 C1','promotion_run_id':int(os.environ['GITHUB_RUN_ID']),'pre_promotion_main':os.environ['EXPECTED_MAIN']},
            'open_stage_blockers':[],
            'governed_deferred_items':[
              {'id':'SSD-01','owner':'PACK-13 / owning backend-security stage','disposition':'FRONT-05 FAILS CLOSED; NOT A FRONT-05 ACCEPTANCE BLOCKER'},
              {'id':'FRONT05_ROUTE_PREFIX','disposition':'DISPLAY/POLICY PREFIX GOVERNANCE ITEM; CANONICAL ROUTE REMAINS /representative'}],
            'overall_front_layer':'OPEN / NOT CLOSED',
            'production_readiness':'NOT_ASSERTED','legal_activation':'NOT_ASSERTED','certification':'NOT_ASSERTED','final_security_acceptance':'NOT_ASSERTED','final_integration':'NOT_ASSERTED'}
          rec=root/'docs/frontend/FRONT-05-C1-ACCEPTANCE-RECORD.json'
          rec.write_text(json.dumps(record,indent=2,ensure_ascii=False)+'\n')

          targets=[]
          targets += [Path('package.json'),Path('package-lock.json')]
          for base in [Path('frontend/web-shell'),Path('frontend/voting-client'),Path('frontend/representative-workspace'),Path('validation/front05')]:
              targets += sorted(p.relative_to(root) for p in (root/base).rglob('*') if p.is_file())
          targets += sorted(p.relative_to(root) for p in (root/'docs/frontend').glob('FRONT-05-*') if p.is_file())
          targets += sorted(p.relative_to(root) for p in (root/'scripts').glob('*front05*') if p.is_file())
          targets=sorted(set(targets))
          files=[]
          for rel in targets:
              data=(root/rel).read_bytes()
              files.append({'path':rel.as_posix(),'sha256':hashlib.sha256(data).hexdigest(),'size_bytes':len(data)})
          manifest={
            'schema':'epd2.front05.canonical-installation-manifest/1',
            'stage':'FRONT-05 — WS-04 Representative Workspace','candidate_sha256':os.environ['EXPECTED_SHA256'],
            'candidate_size_bytes':int(os.environ['EXPECTED_SIZE']),'authoritative_run_id':int(os.environ['ACCEPT_RUN']),
            'promotion_run_id':int(os.environ['GITHUB_RUN_ID']),'pre_promotion_main':os.environ['EXPECTED_MAIN'],
            'cumulative_payload':['frontend/web-shell','frontend/voting-client','frontend/representative-workspace'],
            'file_count':len(files),'files':files}
          (root/'docs/frontend/FRONT-05-C1-CANONICAL-INSTALLATION-MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')
          PY

      - name: Update Program Control Register
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('repo/docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md')
          s=p.read_text()
          assert 'FRONT-05 authoritative acceptance and bounded stage closure' not in s
          paragraph=(
            "**FRONT-05 authoritative acceptance and bounded stage closure (2026-09-03):** exact sealed candidate "
            "`EPD2_FRONT05_WS04_REPRESENTATIVE_WORKSPACE_CANDIDATE_0.1_C1.zip`, SHA-256 "
            "`ed8d8f0c7f3da68cfe5d871149c799484548bb172907e5b954f1f10728c88f7a`, size `27,161,590` bytes, "
            "passed independent exact-byte GitHub Actions verification in `.github/workflows/front05-c1-canonical-v2.yml`, authoritative run "
            "`33700475382`, verify job `100478465454`, independent-review job `100480260808`, reviewed head "
            "`d45c478c70b2098d4bed2c73ab048ccacf9c081e`, conclusion `success`. The run reproduced all `46/46` governed gates, "
            "detected all `44/44` governed mutations, passed `18/18` authorization-negative scenarios, archive hygiene and stale-source rejection, "
            "and bound source-tree digest `f9cdd397b944835174a440ec4f470b26743d94839eb32ccbda9f69d325c99ce1` plus stage-contract digest "
            "`dd76d17772275ac4389a659181f6286dcd7d97a65cf6a1e539e4463e935d26bd`. Runtime evidence includes `111` unit tests, "
            "`297` browser tests, `297` production-browser tests, `132` authorization-negative runtime tests and `33` visual tests PASS. "
            "Authoritative evidence artifact ID `9873516980` has digest `sha256:e382021fb9eae34e3ab153ebac47446eda9f49876d028e63c148de1d02822b52`; "
            "exact-candidate artifact ID `9873517578` has wrapper digest `sha256:870dec54b8564a122dce7219d22710a4b03d5ebb1e5caa27cbf15c708a975ce4`. "
            "The sealed candidate correctly retained `CANDIDATE_NOT_ACCEPTED`; the separate independent review and this post-run governance decision preserve no-self-acceptance. "
            "Stage contract `1.0.0` is ratified for this bounded C1 acceptance. SSD-01 remains an explicitly recorded external PACK-13 security finding and FRONT-05 fails closed on the unavailable publication/authorization path; it is not a FRONT-05 stage blocker. "
            "The exact cumulative accepted frontend payload through FRONT-05 is installed in canonical `main` and recorded by `docs/frontend/FRONT-05-C1-CANONICAL-INSTALLATION-MANIFEST.json`. "
            "Governance decision: `docs/frontend/FRONT-05-C1-ACCEPTANCE-RECORD.json`. **FRONT-05 C1 is therefore `ACCEPTED / CLOSED` as the bounded WS-04 Representative Workspace stage.** "
            "The overall FRONT layer remains **OPEN / NOT CLOSED**; no production-readiness, legal-activation, final-integration, BSI/CC/EAL4 or final-security claim follows."
          )
          marker='\n\n**INFRA-01 authoritative acceptance and bounded stage closure (2026-09-01):**'
          assert marker in s
          s=s.replace(marker,'\n\n'+paragraph+marker,1)

          front_row=("| FRONT | `FRONT-02 C2.1 ACCEPTED_IMPLEMENTATION_BASELINE; FRONT-03 C1 ACCEPTED / CLOSED; FRONT-04 C2 ACCEPTED / CLOSED; FRONT-05 C1 ACCEPTED / CLOSED; NOT_STARTED_FINAL` | "
                     "Exact FRONT-02 C2.1, bounded FRONT-03 C1, FRONT-04 C2 and FRONT-05 C1 are accepted governed frontend baselines. The cumulative accepted frontend payload through WS-04 is installed in canonical main. The overall FRONT layer remains open; later FRONT stages, final integrated journeys and FRONT-layer closure remain governed separately and dependent on completion of the canonical INFRA → OPS → CTRL → FRONT path. |")
          s,n=re.subn(r'^\| FRONT \|.*$',front_row,s,count=1,flags=re.M)
          assert n==1

          new_parallel=("**Parallel FRONT action:** `FRONT-02 C2.1`, `FRONT-03 C1`, `FRONT-04 C2` and `FRONT-05 C1` are accepted governed frontend baselines; FRONT-05 is now `ACCEPTED / CLOSED` as the bounded WS-04 Representative Workspace stage and the cumulative accepted frontend payload through WS-04 is installed in canonical main. The overall FRONT layer remains `OPEN / NOT CLOSED`; later FRONT stages, final integrated journeys, mobile target scope where applicable, final integration and final SEC remain separately governed. SSD-01 stays fail-closed as an external dependency finding and does not authorize an unavailable backend action path. No production-readiness, legal-activation or certification claim follows from FRONT-05 acceptance.")
          s,n=re.subn(r'^\*\*Parallel FRONT action:\*\*.*$',new_parallel,s,count=1,flags=re.M)
          assert n==1
          p.write_text(s)
          PY

      - name: Commit canonical state
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          git config user.name epd2-governance-bot
          git config user.email epd2-governance-bot@users.noreply.github.com
          git add package.json package-lock.json frontend/web-shell frontend/voting-client frontend/representative-workspace docs/frontend scripts validation/front05 docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'governance(front05): accept close and install canonical C1'
          git push origin HEAD:main
          echo "FRONT05_CANONICAL_PROMOTION_RESULT:PASS:$EXPECTED_SHA256:$EXPECTED_SIZE"
