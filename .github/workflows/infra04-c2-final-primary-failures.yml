name: INFRA-04 C2 final primary failure evidence

on:
  push:
    branches: ["diagnostic/infra04-c2-final-primary-failures"]

permissions:
  contents: read
  actions: read

jobs:
  isolate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      INFRA02_PATH: handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip
      INFRA02_SHA256: d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
      INFRA02_SIZE: "15980332"
    steps:
      - name: Checkout diagnostic carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Materialize exact governed C2 source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main handoff/infra
          test "$(git rev-parse origin/main)" = "7544f5dc3bf40304ae81b4d8ef476cc8ecb60ec5"
          git show "origin/handoff/infra:$INFRA02_PATH" > /tmp/infra02.zip
          test "$(sha256sum /tmp/infra02.zip | awk '{print $1}')" = "$INFRA02_SHA256"
          test "$(stat -c %s /tmp/infra02.zip)" = "$INFRA02_SIZE"
          python3 handoff/INFRA/infra04-c2-transport/apply.py --root "$GITHUB_WORKSPACE" --predecessor /tmp/infra02.zip
          cp -a handoff/INFRA/infra04-c2-overlay/. "$GITHUB_WORKSPACE"/
          rm -rf handoff/INFRA/infra04-c2-transport handoff/INFRA/infra04-c2-overlay
          rm -f .github/workflows/infra04-c2-final-primary-failures.yml
          echo "DIAG_C2_MATERIALIZATION:PASS"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          enable-cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          uv sync --all-groups --frozen
          npm ci
          npx playwright install --with-deps chromium

      - name: Derive the same exact tested C2 snapshot
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md > /tmp/current-pcr.md
          uv run python -m scripts.acceptance verify-reconciliation --root . --target-pcr /tmp/current-pcr.md
          git rm -f --ignore-unmatch SHA256SUMS.txt ACCEPTANCE/FREEZE-INVENTORY.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          uv run pytest -q tests/repository/test_infra04_units.py tests/repository/test_infra04_mutation_suite.py > "$GITHUB_WORKSPACE/targeted.log" 2>&1
          uv run python -m scripts.infra04.gates --artifact /tmp/infra02.zip > "$GITHUB_WORKSPACE/runtime.log" 2>&1
          uv run python -m scripts.infra04.build_changed_manifest > "$GITHUB_WORKSPACE/manifest.log" 2>&1
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git config user.name 'EPD2 INFRA04 diagnostic'
          git config user.email 'infra04-diagnostic@invalid.local'
          git add -A
          git commit -m 'diag(infra04): derive exact tested C2 snapshot'
          test -z "$(git status --porcelain)"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" | tee "$GITHUB_WORKSPACE/source-identity.txt"
          echo "SOURCE_TREE=$(git rev-parse HEAD^{tree})" | tee -a "$GITHUB_WORKSPACE/source-identity.txt"

      - name: Reproduce backend canonical sequence with complete evidence
        shell: bash
        run: |
          set +e
          SOURCE=$(git rev-parse HEAD)
          ROOT="$RUNNER_TEMP/infra04-backend-isolate"
          git worktree add --detach "$ROOT" "$SOURCE"
          cd "$ROOT"
          {
            echo '=== preinstall ==='
            uv sync --all-groups --frozen
            npm ci --no-audit --no-fund
            echo '=== ruff-format ==='
            uv run ruff format --check .
            echo '=== ruff-lint ==='
            uv run ruff check .
            echo '=== mypy ==='
            make typecheck
            echo '=== pytest ==='
            uv run pytest
          } > "$GITHUB_WORKSPACE/backend-canonical.log" 2>&1
          RC=$?
          echo "backend_rc=$RC" | tee "$GITHUB_WORKSPACE/backend-result.txt"
          git status --porcelain=v1 --untracked-files=all > "$GITHUB_WORKSPACE/backend-status.txt"
          git diff --binary > "$GITHUB_WORKSPACE/backend-diff.patch"
          exit 0

      - name: Reproduce browser after canonical frontend/build sequence with complete evidence
        shell: bash
        run: |
          set +e
          SOURCE=$(git rev-parse HEAD)
          ROOT="$RUNNER_TEMP/infra04-browser-isolate"
          git worktree add --detach "$ROOT" "$SOURCE"
          cd "$ROOT"
          uv sync --all-groups --frozen > "$GITHUB_WORKSPACE/browser-prep.log" 2>&1
          npm ci --no-audit --no-fund >> "$GITHUB_WORKSPACE/browser-prep.log" 2>&1
          npm run format:check >> "$GITHUB_WORKSPACE/browser-prep.log" 2>&1
          npm run typecheck --workspace=packages/typescript/epd2-types >> "$GITHUB_WORKSPACE/browser-prep.log" 2>&1
          npm run typecheck --workspace=frontend/web-shell >> "$GITHUB_WORKSPACE/browser-prep.log" 2>&1
          npm run lint --workspace=frontend/web-shell >> "$GITHUB_WORKSPACE/browser-prep.log" 2>&1
          npm run test --workspace=packages/typescript/epd2-types >> "$GITHUB_WORKSPACE/browser-prep.log" 2>&1
          npm run test --workspace=frontend/web-shell >> "$GITHUB_WORKSPACE/browser-prep.log" 2>&1
          npm run build --workspace=frontend/web-shell >> "$GITHUB_WORKSPACE/browser-prep.log" 2>&1
          PREP_RC=$?
          npm run test:browser --workspace=frontend/web-shell > "$GITHUB_WORKSPACE/browser-canonical.log" 2>&1
          BROWSER_RC=$?
          echo "prep_rc=$PREP_RC" | tee "$GITHUB_WORKSPACE/browser-result.txt"
          echo "browser_rc=$BROWSER_RC" | tee -a "$GITHUB_WORKSPACE/browser-result.txt"
          git status --porcelain=v1 --untracked-files=all > "$GITHUB_WORKSPACE/browser-status.txt"
          git diff --binary > "$GITHUB_WORKSPACE/browser-diff.patch"
          exit 0

      - name: Upload exact failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra04-c2-primary-failure-evidence-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/source-identity.txt
            ${{ github.workspace }}/targeted.log
            ${{ github.workspace }}/runtime.log
            ${{ github.workspace }}/manifest.log
            ${{ github.workspace }}/backend-canonical.log
            ${{ github.workspace }}/backend-result.txt
            ${{ github.workspace }}/backend-status.txt
            ${{ github.workspace }}/backend-diff.patch
            ${{ github.workspace }}/browser-prep.log
            ${{ github.workspace }}/browser-canonical.log
            ${{ github.workspace }}/browser-result.txt
            ${{ github.workspace }}/browser-status.txt
            ${{ github.workspace }}/browser-diff.patch
          if-no-files-found: warn
          retention-days: 7
