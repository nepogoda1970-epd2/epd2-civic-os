name: PILOT-05 Export Python 3.12 Runtime

on:
  push:
    branches:
      - tmp/pilot05-c3-authoritative-20260825
    paths:
      - '.github/workflows/pilot05-export-python312.yml'
      - '.pilot05-python312-export-trigger'
  workflow_dispatch:

jobs:
  export-python312:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          check-latest: false
      - name: Record runtime
        run: |
          python --version
          python - <<'PY'
          import sys, pathlib
          print(sys.executable)
          print(sys.prefix)
          pathlib.Path('/tmp/python-prefix.txt').write_text(sys.prefix)
          PY
      - name: Package compact Python 3.12 runtime
        run: |
          PREFIX="$(cat /tmp/python-prefix.txt)"
          tar -C "$PREFIX" -cJf /tmp/python312-runtime.tar.xz .
          sha256sum /tmp/python312-runtime.tar.xz | tee /tmp/python312-runtime.sha256
          ls -lh /tmp/python312-runtime.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: pilot05-python312-runtime-xz
          path: |
            /tmp/python312-runtime.tar.xz
            /tmp/python312-runtime.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
