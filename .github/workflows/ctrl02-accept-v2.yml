name: ctrl02-accept-v2

on:
  push:
    branches: [handoff/ctrl]
    paths:
      - '.github/workflows/ctrl02-accept-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  governed-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CTRL02_ZIP: handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.1_PRESEAL.zip
      EXPECTED_SHA256: daddb4dfaeb3097e22d15e3448b5d927d7c3b1d7d4dd3332230d23ccd999df1d
      EXPECTED_SIZE: '16718551'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: handoff/ctrl
          fetch-depth: 1

      - name: Pin identity and safe extract
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CTRL02_ZIP"
          test "$(sha256sum "$CTRL02_ZIP" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(stat -c '%s' "$CTRL02_ZIP")" = "$EXPECTED_SIZE"
          realpath "$CTRL02_ZIP" > /tmp/ctrl02_archive
          rm -rf /tmp/ctrl02_accept && mkdir -p /tmp/ctrl02_accept
          python3 - <<'PY'
          import os,pathlib,zipfile
          zpath=pathlib.Path(os.environ['CTRL02_ZIP']); dest=pathlib.Path('/tmp/ctrl02_accept')
          with zipfile.ZipFile(zpath) as z:
              if (bad:=z.testzip()): raise SystemExit('ZIP_CRC_FAIL='+bad)
              names=z.namelist()
              if len(names)!=len(set(names)): raise SystemExit('ZIP_DUPLICATE_PATHS')
              for n in names:
                  p=pathlib.PurePosixPath(n)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit('ZIP_PATH_TRAVERSAL='+n)
              z.extractall(dest)
          roots=[p for p in dest.iterdir() if p.is_dir()]
          if len(roots)!=1: raise SystemExit(f'EXPECTED_ONE_ROOT_GOT_{len(roots)}')
          root=roots[0]
          required=['pyproject.toml','uv.lock','package.json','package-lock.json','scripts/ctrl02_validator.py','scripts/ctrl02_mutation_suite.py','scripts/verify_ctrl02_package.py','scripts/build_ctrl02_preseal.py','contracts/control/ctrl02_control_console.json','validation/ctrl02/ctrl02_preseal_result.json','validation/ctrl02/freeze_manifest.json','validation/ctrl02/package_identity_result.json','validation/ctrl02/ctrl01_reconciliation_result.json','validation/ctrl02/fir_reconciliation.json','validation/ctrl02/test_result.json','validation/ctrl02/mutation_result.json']
          missing=[x for x in required if not (root/x).is_file()]
          if missing: raise SystemExit('MISSING_REQUIRED_FILES='+repr(missing))
          pathlib.Path('/tmp/ctrl02_root').write_text(str(root))
          print('CTRL02_ARCHIVE_IDENTITY_PASS')
          PY

      - name: Parse embedded CTRL-02 evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/ctrl02_root)"
          ROOT="$ROOT" python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ['ROOT'])/'validation/ctrl02'; files=list(d.glob('*.json'))
          if len(files)<10: raise SystemExit('INSUFFICIENT_CTRL02_EVIDENCE_FILES')
          for p in files:
              obj=json.loads(p.read_text('utf-8')); text=json.dumps(obj,sort_keys=True).lower()
              if any(x in text for x in ['"status": "fail"','"status": "failed"','"result": "fail"','"result": "failed"','"verdict": "fail"','"verdict": "failed"']): raise SystemExit('EMBEDDED_FAIL='+p.name)
          print('CTRL02_JSON_EVIDENCE_COUNT='+str(len(files)))
          print('CTRL02_EMBEDDED_EVIDENCE_PASS')
          PY

      - name: Frozen dependency sync
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cat /tmp/ctrl02_root)"
          python3 -m pip install --disable-pip-version-check --quiet uv
          uv sync --all-groups --frozen
          echo CTRL02_FROZEN_PYTHON_SYNC_PASS

      - name: Package verifier pre-execution
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(cat /tmp/ctrl02_archive)"; cd "$(cat /tmp/ctrl02_root)"
          uv run python scripts/verify_ctrl02_package.py "$ARCHIVE"
          echo CTRL02_PACKAGE_VERIFY_PRE_PASS

      - name: Candidate validator
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cat /tmp/ctrl02_root)"
          uv run python scripts/ctrl02_validator.py
          echo CTRL02_VALIDATOR_RUNTIME_PASS

      - name: Candidate mutation suite
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cat /tmp/ctrl02_root)"
          uv run python scripts/ctrl02_mutation_suite.py
          echo CTRL02_MUTATION_RUNTIME_PASS

      - name: CTRL-02 runtime tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cat /tmp/ctrl02_root)"
          mapfile -t TESTS < <(find tests services -type f -name 'test_*.py' 2>/dev/null | grep -Ei 'ctrl02|regional|intervention|privileged|control.?plane|breakglass|reauthor|four.?eyes|quorum|authority|suspension' || true)
          if [ "${#TESTS[@]}" -eq 0 ]; then uv run pytest -q; else printf 'CTRL02_TEST=%s\n' "${TESTS[@]}"; uv run pytest -q "${TESTS[@]}"; fi
          echo CTRL02_RUNTIME_TESTS_PASS

      - name: Node frozen install and tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$(cat /tmp/ctrl02_root)"
          npm ci --ignore-scripts
          npm test --if-present
          echo CTRL02_NODE_LOCK_AND_TEST_PASS

      - name: Package verifier post-execution
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(cat /tmp/ctrl02_archive)"; cd "$(cat /tmp/ctrl02_root)"
          uv run python scripts/verify_ctrl02_package.py "$ARCHIVE"
          echo CTRL02_PACKAGE_VERIFY_POST_PASS

      - name: Terminal result consistency
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/ctrl02_root)"; ROOT="$ROOT" python3 - <<'PY'
          import json,os,pathlib
          d=pathlib.Path(os.environ['ROOT'])/'validation/ctrl02'
          for name in ['ctrl02_preseal_result.json','test_result.json','mutation_result.json','package_identity_result.json','ctrl01_reconciliation_result.json','fir_reconciliation.json']:
              obj=json.loads((d/name).read_text('utf-8')); text=json.dumps(obj,sort_keys=True).lower()
              bad=['"status": "fail"','"status": "failed"','"result": "fail"','"result": "failed"','"verdict": "fail"','"verdict": "failed"','"pass": false']
              if any(x in text for x in bad): raise SystemExit('TERMINAL_RESULT_NOT_PASS='+name)
              print('TERMINAL_RESULT_ACCEPTED='+name)
          print('CTRL02_TERMINAL_RESULTS_PASS')
          PY

      - name: Publish acceptance evidence
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          OUT='handoff/CTRL/evidence/CTRL02_CANONICAL_ACCEPTANCE_V2.json'; mkdir -p "$(dirname "$OUT")"
          python3 - <<'PY'
          import json,os,pathlib
          obj={'schema':'epd2.ctrl02.canonical_acceptance.v2','module':'CTRL-02','artifact':'EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.1_PRESEAL.zip','artifact_sha256':os.environ['EXPECTED_SHA256'],'artifact_size':int(os.environ['EXPECTED_SIZE']),'source_upload_commit':'38edc71816dd54ee13eee97e01cbac07a9ace821','acceptance_workflow':'ctrl02-accept-v2','acceptance_run_id':int(os.environ['RUN_ID']),'workflow_head_sha':os.environ['HEAD_SHA'],'gates':{'archive_identity':'PASS','zip_integrity':'PASS','embedded_evidence':'PASS','frozen_python_sync':'PASS','package_verify_pre':'PASS','ctrl02_validator':'PASS','mutation_suite':'PASS','runtime_tests':'PASS','node_lock_and_tests':'PASS','package_verify_post':'PASS','terminal_results':'PASS'},'status':'CANON_PASS'}
          pathlib.Path('handoff/CTRL/evidence/CTRL02_CANONICAL_ACCEPTANCE_V2.json').write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          PY
          python3 -m json.tool "$OUT" >/dev/null; grep -q '"status": "CANON_PASS"' "$OUT"
          git config user.name 'epd2-ctrl02-acceptance'; git config user.email 'actions@users.noreply.github.com'
          git add "$OUT"; git commit -m 'CTRL-02: publish canonical acceptance V2 evidence'; git push origin HEAD:handoff/ctrl
          echo CTRL02_CANON_PASS
