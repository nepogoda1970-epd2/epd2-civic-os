name: api01-c5-install-packaged-workflow

on:
  push:
    branches:
      - tmp/api01-c5-authoritative-run-20260826
    paths:
      - .github/workflows/api01-c5-install-packaged-workflow.yml

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install exact packaged api01-accept workflow
        shell: bash
        run: |
          set -euo pipefail
          C5='EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5.zip'
          cat candidates/${C5}.00.part candidates/${C5}.01.part > /tmp/${C5}
          echo 'cea2fb0e23ee174e802ec1899cf62e570e5c8659a0f31c7e6c3c3955bffa3d27  /tmp/EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5.zip' | sha256sum -c -
          unzip -p /tmp/${C5} 'EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5/.github/workflows/api01-accept.yml' > .github/workflows/api01-accept.yml
          test -s .github/workflows/api01-accept.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/api01-accept.yml
          git commit -m 'TEMP: install exact packaged API-01 C5 authoritative workflow'
          git push origin HEAD:tmp/api01-c5-authoritative-run-20260826
