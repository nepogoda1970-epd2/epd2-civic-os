name: INFRA-04 C2 exact Prettier diagnostic

on:
  push:
    branches: ["diagnostic/infra04-c2-prettier-exact-20260905"]

permissions:
  contents: read
  actions: read

env:
  INFRA02_PATH: handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip
  INFRA02_SHA256: d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
  INFRA02_SIZE: "15980332"
  EXACT_SOURCE: 0e99b019211d74eeaa9c622c273cda7b9941207d

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact current INFRA-04 candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.EXACT_SOURCE }}
          fetch-depth: 0

      - name: Materialize exact governed C2
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin handoff/infra main
          git show "origin/handoff/infra:$INFRA02_PATH" > /tmp/infra02.zip
          test "$(sha256sum /tmp/infra02.zip | awk '{print $1}')" = "$INFRA02_SHA256"
          test "$(stat -c %s /tmp/infra02.zip)" = "$INFRA02_SIZE"
          python3 handoff/INFRA/infra04-c2-transport/apply.py --root "$GITHUB_WORKSPACE" --predecessor /tmp/infra02.zip
          cp -a handoff/INFRA/infra04-c2-overlay/. "$GITHUB_WORKSPACE"/
          rm -rf handoff/INFRA/infra04-c2-transport handoff/INFRA/infra04-c2-overlay
          test "$(git rev-parse origin/main)" = 7544f5dc3bf40304ae81b4d8ef476cc8ecb60ec5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          enable-cache: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          uv sync --all-groups --frozen
          npm ci
          git diff --exit-code -- uv.lock package-lock.json

      - name: Reproduce runtime evidence and changed-file lineage
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch SHA256SUMS.txt ACCEPTANCE/FREEZE-INVENTORY.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          uv run pytest -q tests/repository/test_infra04_units.py tests/repository/test_infra04_mutation_suite.py
          uv run python -m scripts.infra04.gates --artifact /tmp/infra02.zip
          uv run python -m scripts.infra04.build_changed_manifest
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete

      - name: Run exact repository Prettier check and expose every failing path
        id: prettier
        shell: bash
        run: |
          set +e
          npm run format:check 2>&1 | tee "$GITHUB_WORKSPACE/infra04-current-prettier.txt"
          rc=${PIPESTATUS[0]}
          echo "PRETTIER_RC:$rc"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Show concise failing-path evidence
        if: always()
        shell: bash
        run: |
          set +e
          echo '--- PRETTIER WARNINGS ---'
          grep -E '^\[warn\]|Code style issues|Checking formatting|All matched files' "$GITHUB_WORKSPACE/infra04-current-prettier.txt" || true
          echo "PRETTIER_CAPTURE_RC:${{ steps.prettier.outputs.rc }}"

      - name: Upload exact Prettier capture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra04-current-prettier-${{ github.run_id }}
          path: ${{ github.workspace }}/infra04-current-prettier.txt
          if-no-files-found: error
          retention-days: 7
