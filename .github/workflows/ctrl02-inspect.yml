name: ctrl02-inspect
on:
  push:
    branches: [handoff/ctrl]
    paths: ['.github/workflows/ctrl02-inspect.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: handoff/ctrl
      - name: Capture complete CTRL-02 reconciliation contract
        shell: bash
        run: |
          set -euo pipefail
          ZIP='handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.1_PRESEAL.zip'
          OUT='handoff/CTRL/evidence/CTRL02_RECONCILIATION_CONTRACT_FULL.md'
          rm -rf /tmp/c02full && mkdir -p /tmp/c02full
          python3 - <<'PY'
          import pathlib,zipfile
          zp=pathlib.Path('handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.1_PRESEAL.zip')
          d=pathlib.Path('/tmp/c02full')
          with zipfile.ZipFile(zp) as z:z.extractall(d)
          root=next(p for p in d.iterdir() if p.is_dir())
          wanted=['scripts/ctrl02_validator.py','scripts/build_ctrl02_preseal.py','scripts/verify_ctrl02_package.py','validation/ctrl02/ctrl01_reconciliation_result.json','validation/ctrl02/source_identity_result.json','validation/ctrl02/ctrl02_preseal_result.json','validation/ctrl02/freeze_manifest.json','validation/ctrl02/package_identity_result.json','validation/ctrl02/fir_reconciliation.json']
          parts=['# CTRL-02 reconciliation contract full','']
          for rel in wanted:
              p=root/rel
              parts += [f'## `{rel}`','```text',p.read_text('utf-8') if p.is_file() else 'MISSING','```','']
          out=pathlib.Path('handoff/CTRL/evidence/CTRL02_RECONCILIATION_CONTRACT_FULL.md'); out.parent.mkdir(parents=True,exist_ok=True); out.write_text('\n'.join(parts))
          print(out.stat().st_size)
          PY
          test -s "$OUT"
          grep -q 'BLOCKED_FOR_FINAL_SEAL' "$OUT"
          git config user.name epd2-ctrl02-verifier
          git config user.email actions@users.noreply.github.com
          git add "$OUT"
          git commit -m 'CTRL-02: persist full reconciliation contract'
          git push origin HEAD:handoff/ctrl
