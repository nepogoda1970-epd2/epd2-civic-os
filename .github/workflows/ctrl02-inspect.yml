name: ctrl02-reconcile-build
on:
  push:
    branches: [handoff/ctrl]
    paths: ['.github/workflows/ctrl02-inspect.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  reconcile-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_MAIN: 217559b7f21c338d6fe8d4e4676082cd3840251c
      BASE_TREE: eb8a3254c2b8a30feff71318d4377eff2435605c
      CTRL01_RUN: '33619101714'
      CTRL01_HEAD: f4c09fca58d1699bf14b46e077f2972b9cb4b92f
      CTRL01_SHA256: c9c666d01e17fe615f78c2e408169ce4b6434d3b8dec23dfda889b2ce91e3c49
      CTRL01_SIZE: '190092'
      OLD_ZIP: handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.1_PRESEAL.zip
      NEW_ZIP: handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: handoff/ctrl
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - name: Verify authoritative CTRL-01 predecessor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['CTRL01_RUN']}"
          req=urllib.request.Request(url,headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r: d=json.load(r)
          assert d['status']=='completed' and d['conclusion']=='success',d
          assert d['head_sha']==os.environ['CTRL01_HEAD'],d['head_sha']
          assert d['path']=='.github/workflows/ctrl01-c1-canonical.yml',d['path']
          assert d['head_branch']=='ctrl01/canonical-c1',d['head_branch']
          print('CTRL01_AUTHORITATIVE_RUN_PASS',d['id'],d['head_sha'])
          PY
      - name: Reconstruct exact 0.1 source on pinned baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$OLD_ZIP"|awk '{print $1}')" = daddb4dfaeb3097e22d15e3448b5d927d7c3b1d7d4dd3332230d23ccd999df1d
          rm -rf /tmp/ctrl02src /tmp/ctrl02work
          mkdir -p /tmp/ctrl02src
          python3 - <<'PY'
          import pathlib,zipfile
          z=pathlib.Path('handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.1_PRESEAL.zip')
          d=pathlib.Path('/tmp/ctrl02src')
          with zipfile.ZipFile(z) as a:
              if (bad:=a.testzip()): raise SystemExit('CRC '+bad)
              names=a.namelist()
              if len(names)!=len(set(names)): raise SystemExit('duplicate zip paths')
              for n in names:
                  p=pathlib.PurePosixPath(n)
                  if p.is_absolute() or '..' in p.parts: raise SystemExit('unsafe path '+n)
              a.extractall(d)
          roots=[p for p in d.iterdir() if p.is_dir()]
          if len(roots)!=1: raise SystemExit('bad candidate root')
          pathlib.Path('/tmp/ctrl02root').write_text(str(roots[0]))
          PY
          git worktree add --detach /tmp/ctrl02work "$BASE_MAIN"
          test "$(git -C /tmp/ctrl02work rev-parse HEAD)" = "$BASE_MAIN"
          test "$(git -C /tmp/ctrl02work rev-parse 'HEAD^{tree}')" = "$BASE_TREE"
          cp -a "$(cat /tmp/ctrl02root)/." /tmp/ctrl02work/
      - name: Apply governed CTRL-01 reconciliation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          r=Path('/tmp/ctrl02work')
          p=r/'scripts/ctrl02_validator.py'
          s=p.read_text()
          old='CTRL01_SHA = "490d8ca31d4607da204f03addaf900161257b289d51ec6f0b7e52433fd5cbe71"'
          new='''CTRL01_SHA = "c9c666d01e17fe615f78c2e408169ce4b6434d3b8dec23dfda889b2ce91e3c49"\nCTRL01_ACCEPTANCE_RUN = 33619101714\nCTRL01_ACCEPTANCE_HEAD = "f4c09fca58d1699bf14b46e077f2972b9cb4b92f"\nCTRL01_ACCEPTED_SIZE = 190092'''
          assert old in s;s=s.replace(old,new)
          needle='''    mutation_pass = mutation.get("detected") == 40 and mutation.get("undetected") == []\n    freeze_pass = record_or_verify_freeze(args.record_freeze)\n'''
          insert='''    mutation_pass = mutation.get("detected") == 40 and mutation.get("undetected") == []\n    freeze_pass = record_or_verify_freeze(args.record_freeze)\n    ctrl01_acceptance_path = VALIDATION / "ctrl01_authoritative_acceptance.json"\n    ctrl01_acceptance = json.loads(ctrl01_acceptance_path.read_text()) if ctrl01_acceptance_path.exists() else {}\n    ctrl01_reconciled = (\n        ctrl01_acceptance.get("stage") == "CTRL-01"\n        and ctrl01_acceptance.get("conclusion") == "PASS"\n        and ctrl01_acceptance.get("run_id") == CTRL01_ACCEPTANCE_RUN\n        and ctrl01_acceptance.get("workflow_head_sha") == CTRL01_ACCEPTANCE_HEAD\n        and ctrl01_acceptance.get("candidate_sha256") == CTRL01_SHA\n        and ctrl01_acceptance.get("candidate_size") == CTRL01_ACCEPTED_SIZE\n        and ctrl01_acceptance.get("gates") == "22/22 PASS"\n        and ctrl01_acceptance.get("self_acceptance") is False\n    )\n'''
          assert needle in s;s=s.replace(needle,insert)
          s=s.replace('"ctrl01_state": "WORKING_PREDECESSOR_NOT_ACCEPTED",','"ctrl01_state": "CANONICAL_ACCEPTED",')
          old_block='''                    "status": "BLOCKED_FOR_FINAL_SEAL",\n                    "reason": "authoritative CTRL-01 acceptance identity is absent",\n                    "development_may_continue": True,'''
          new_block='''                    "status": "PASS" if ctrl01_reconciled else "FAIL",\n                    "reason": "authoritative CTRL-01 C1 identity reconciled" if ctrl01_reconciled else "authoritative CTRL-01 identity mismatch",\n                    "development_may_continue": True,\n                    "accepted_candidate_sha256": CTRL01_SHA,\n                    "accepted_candidate_size": CTRL01_ACCEPTED_SIZE,\n                    "acceptance_run_id": CTRL01_ACCEPTANCE_RUN,\n                    "acceptance_workflow_head": CTRL01_ACCEPTANCE_HEAD,'''
          assert old_block in s;s=s.replace(old_block,new_block)
          old_gate='''        if gate_id == "G04":\n            status = "BLOCKED_FOR_FINAL_SEAL"'''
          new_gate='''        if gate_id == "G04":\n            status = "PASS" if ctrl01_reconciled else "FAIL"'''
          assert old_gate in s;s=s.replace(old_gate,new_gate)
          s=s.replace('{"id": gate_id, "name": name, "status": status, "executed": gate_id != "G04"}','{"id": gate_id, "name": name, "status": status, "executed": True}')
          s=s.replace('"overall": "DEVELOPMENT_PASS_FINAL_SEAL_BLOCKED" if not failed else "FAIL",','"overall": "PASS" if not failed and not blocked else "FAIL",')
          old_print='''    print(\n        "CTRL02_DEVELOPMENT_RESULT:"\n        f"{'PASS' if not failed else 'FAIL'}:{passed}/46_PASS:"\n        "G04_BLOCKED_FOR_FINAL_SEAL"\n    )\n    return 0 if not failed else 1'''
          new_print='''    print(f"CTRL02_RESULT:{'PASS' if not failed and not blocked else 'FAIL'}:{passed}/46_PASS")\n    return 0 if not failed and not blocked else 1'''
          assert old_print in s;s=s.replace(old_print,new_print)
          p.write_text(s)
          # Reproducible builder now requires the fully reconciled 46/46 result and unique 0.2 identity.
          b=r/'scripts/build_ctrl02_preseal.py'; t=b.read_text()
          t=t.replace('WORKING_0.1_PRESEAL"','WORKING_0.2_PRESEAL"')
          t=t.replace('result["overall"] != "DEVELOPMENT_PASS_FINAL_SEAL_BLOCKED"','result["overall"] != "PASS"')
          t=t.replace('result["gates_passed"] != 45 or result["gates_blocked_for_final_seal"] != ["G04"]','result["gates_passed"] != 46 or result["gates_blocked_for_final_seal"] != []')
          t=t.replace('"45/46 PASS; G04 BLOCKED_FOR_FINAL_SEAL"','"46/46 PASS"')
          b.write_text(t)
          # Replace stale static-hash package verifier with complete archive/freeze/result verifier.
          v=r/'scripts/verify_ctrl02_package.py'
          v.write_text('''#!/usr/bin/env python3\nfrom __future__ import annotations\nimport argparse,hashlib,json,pathlib,tempfile,zipfile\n\ndef sha(p):\n h=hashlib.sha256();\n with p.open("rb") as f:\n  for c in iter(lambda:f.read(1024*1024),b""): h.update(c)\n return h.hexdigest()\n\ndef main():\n ap=argparse.ArgumentParser();ap.add_argument("archive",type=pathlib.Path);a=ap.parse_args().archive\n if not a.is_file(): raise SystemExit("archive missing")\n with zipfile.ZipFile(a) as z:\n  if (bad:=z.testzip()): raise SystemExit("CRC_FAIL="+bad)\n  names=z.namelist()\n  if len(names)!=len(set(names)): raise SystemExit("DUPLICATE_PATHS")\n  for n in names:\n   q=pathlib.PurePosixPath(n)\n   if q.is_absolute() or ".." in q.parts: raise SystemExit("UNSAFE_PATH="+n)\n  if any(n.lower().endswith(".zip") for n in names): raise SystemExit("NESTED_ARCHIVE")\n  with tempfile.TemporaryDirectory() as td:\n   z.extractall(td); roots=[p for p in pathlib.Path(td).iterdir() if p.is_dir()]\n   if len(roots)!=1: raise SystemExit("ROOT_COUNT")\n   r=roots[0]; val=r/"validation/ctrl02"\n   result=json.loads((val/"ctrl02_preseal_result.json").read_text())\n   if result.get("overall")!="PASS" or result.get("gates_passed")!=46 or result.get("gates_failed") or result.get("gates_blocked_for_final_seal"): raise SystemExit("GATE_RESULT_INVALID")\n   rec=json.loads((val/"ctrl01_reconciliation_result.json").read_text())\n   if rec.get("status")!="PASS" or rec.get("accepted_candidate_sha256")!="c9c666d01e17fe615f78c2e408169ce4b6434d3b8dec23dfda889b2ce91e3c49" or rec.get("acceptance_run_id")!=33619101714: raise SystemExit("CTRL01_RECONCILIATION_INVALID")\n   mut=json.loads((val/"mutation_result.json").read_text())\n   if mut.get("detected")!=40 or mut.get("undetected")!=[]: raise SystemExit("MUTATION_INVALID")\n   fir=json.loads((val/"fir_reconciliation.json").read_text())\n   if not all(fir.get("fir_presence",{}).values()): raise SystemExit("FIR_RECONCILIATION_INVALID")\n   frozen=json.loads((val/"freeze_manifest.json").read_text()); files=frozen.get("files",{})\n   if not files: raise SystemExit("FREEZE_EMPTY")\n   for rel,digest in files.items():\n    p=r/rel\n    if not p.is_file() or sha(p)!=digest: raise SystemExit("FREEZE_MISMATCH="+rel)\n print(f"CTRL02_PACKAGE_VERIFY:PASS:{sha(a)}:{a.stat().st_size}")\n return 0\nif __name__=="__main__": raise SystemExit(main())\n''')
          acc={
            'schema':'epd2.ctrl01.authoritative-acceptance-result/1','stage':'CTRL-01',
            'candidate_sha256':os.environ['CTRL01_SHA256'],'candidate_size':int(os.environ['CTRL01_SIZE']),
            'base_main':'217559b7f21c338d6fe8d4e4676082cd3840251c','run_id':int(os.environ['CTRL01_RUN']),
            'workflow_head_sha':os.environ['CTRL01_HEAD'],'job':'authoritative-review','conclusion':'PASS',
            'gates':'22/22 PASS','self_acceptance':False,
            'terminal_marker':f"CTRL01_C1_AUTHORITATIVE_RESULT:PASS:{os.environ['CTRL01_SHA256']}:{os.environ['CTRL01_SIZE']}"
          }
          q=r/'validation/ctrl02/ctrl01_authoritative_acceptance.json';q.write_text(json.dumps(acc,indent=2,sort_keys=True)+'\n')
          doc=r/'docs/ctrl/CTRL-02/CTRL02_C1_RECONCILIATION.md'
          doc.write_text(f'''# CTRL-02 predecessor reconciliation\n\nCTRL-01 authoritative acceptance run: {os.environ["CTRL01_RUN"]}\n\nAccepted CTRL-01 candidate SHA-256: `{os.environ["CTRL01_SHA256"]}`\n\nAccepted CTRL-01 candidate size: `{os.environ["CTRL01_SIZE"]}` bytes.\n\nCanonical workflow head: `{os.environ["CTRL01_HEAD"]}`.\n\nThis record resolves CTRL-02 gate G04 without self-acceptance; CTRL-02 remains a candidate until independent governed acceptance.\n''')
          PY
      - name: Locked execution, mutations, freeze and 46-gate validation
        working-directory: /tmp/ctrl02work
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-groups --frozen
          export PYTHONPATH="$PWD/services/control-plane-service/src${PYTHONPATH:+:$PYTHONPATH}"
          uv run python scripts/ctrl02_mutation_suite.py
          uv run python scripts/ctrl02_validator.py --record-freeze | tee /tmp/ctrl02-record.log
          uv run python scripts/ctrl02_validator.py | tee /tmp/ctrl02-validator.log
          grep -q 'CTRL02_RESULT:PASS:46/46_PASS' /tmp/ctrl02-validator.log
          python3 - <<'PY'
          import json
          r=json.load(open('validation/ctrl02/ctrl02_preseal_result.json'))
          assert r['overall']=='PASS' and r['gates_passed']==46 and not r['gates_failed'] and not r['gates_blocked_for_final_seal'],r
          c=json.load(open('validation/ctrl02/ctrl01_reconciliation_result.json'))
          assert c['status']=='PASS' and c['accepted_candidate_sha256']=='c9c666d01e17fe615f78c2e408169ce4b6434d3b8dec23dfda889b2ce91e3c49',c
          m=json.load(open('validation/ctrl02/mutation_result.json'));assert m['detected']==40 and m['undetected']==[],m
          print('CTRL02_0_2_46_GATE_PASS')
          PY
      - name: Build and independently verify unique 0.2 archive
        working-directory: /tmp/ctrl02work
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip*
          uv run python scripts/build_ctrl02_preseal.py --out /tmp/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip
          uv run python scripts/verify_ctrl02_package.py /tmp/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip
          echo "$(sha256sum /tmp/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip|awk '{print $1}')" > /tmp/ctrl02_sha
          stat -c '%s' /tmp/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip > /tmp/ctrl02_size
          echo CTRL02_0_2_BUILD_PASS:$(cat /tmp/ctrl02_sha):$(cat /tmp/ctrl02_size)
      - name: Commit immutable 0.2 candidate and build evidence
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$NEW_ZIP"
          cp /tmp/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip "$NEW_ZIP"
          python3 - <<'PY'
          import json,os,pathlib
          out=pathlib.Path('handoff/CTRL/evidence/CTRL02_0.2_RECONCILED_BUILD.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          obj={'schema':'epd2.ctrl02.reconciled-build/1','module':'CTRL-02','artifact':'EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip','sha256':pathlib.Path('/tmp/ctrl02_sha').read_text().strip(),'size':int(pathlib.Path('/tmp/ctrl02_size').read_text()),'source_0_1_sha256':'daddb4dfaeb3097e22d15e3448b5d927d7c3b1d7d4dd3332230d23ccd999df1d','base_main':os.environ['BASE_MAIN'],'ctrl01_acceptance_run':int(os.environ['CTRL01_RUN']),'ctrl01_candidate_sha256':os.environ['CTRL01_SHA256'],'ctrl01_workflow_head':os.environ['CTRL01_HEAD'],'gates':'46/46 PASS','mutations':'40/40 DETECTED','status':'BUILT_NOT_SELF_ACCEPTED'}
          out.write_text(json.dumps(obj,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name epd2-ctrl02-builder
          git config user.email actions@users.noreply.github.com
          git add "$NEW_ZIP" handoff/CTRL/evidence/CTRL02_0.2_RECONCILED_BUILD.json
          git commit -m 'CTRL-02: add 0.2 predecessor-reconciled candidate'
          git push origin HEAD:handoff/ctrl
          echo CTRL02_0_2_COMMIT_PASS
