name: ctrl02-reconcile-build

on:
  push:
    branches: [handoff/ctrl]
    paths: ['.github/workflows/ctrl02-inspect.yml']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  reconcile-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_MAIN: 217559b7f21c338d6fe8d4e4676082cd3840251c
      BASE_TREE: eb8a3254c2b8a30feff71318d4377eff2435605c
      CTRL01_RUN: '33619101714'
      CTRL01_HEAD: f4c09fca58d1699bf14b46e077f2972b9cb4b92f
      CTRL01_SHA256: c9c666d01e17fe615f78c2e408169ce4b6434d3b8dec23dfda889b2ce91e3c49
      CTRL01_SIZE: '190092'
      OLD_ZIP: handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.1_PRESEAL.zip
      NEW_ZIP: handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: handoff/ctrl
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'

      - name: Verify authoritative CTRL-01 predecessor live
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['CTRL01_RUN']}"
          req = urllib.request.Request(
              url,
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
              },
          )
          with urllib.request.urlopen(req) as response:
              data = json.load(response)
          assert data['status'] == 'completed' and data['conclusion'] == 'success', data
          assert data['head_sha'] == os.environ['CTRL01_HEAD'], data['head_sha']
          assert data['path'] == '.github/workflows/ctrl01-c1-canonical.yml', data['path']
          assert data['head_branch'] == 'ctrl01/canonical-c1', data['head_branch']
          print('CTRL01_AUTHORITATIVE_RUN_PASS', data['id'], data['head_sha'])
          PY

      - name: Reconstruct exact 0.1 on pinned source baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "$OLD_ZIP" | awk '{print $1}')" = daddb4dfaeb3097e22d15e3448b5d927d7c3b1d7d4dd3332230d23ccd999df1d
          test "$(stat -c '%s' "$OLD_ZIP")" = 16718551
          rm -rf /tmp/ctrl02src /tmp/ctrl02work
          mkdir -p /tmp/ctrl02src
          python3 - <<'PY'
          import pathlib, zipfile
          source = pathlib.Path('handoff/CTRL/incoming/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.1_PRESEAL.zip')
          destination = pathlib.Path('/tmp/ctrl02src')
          with zipfile.ZipFile(source) as package:
              if bad := package.testzip():
                  raise SystemExit('CRC_FAIL=' + bad)
              names = package.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('DUPLICATE_PATHS')
              for name in names:
                  pure = pathlib.PurePosixPath(name)
                  if pure.is_absolute() or '..' in pure.parts:
                      raise SystemExit('UNSAFE_PATH=' + name)
              package.extractall(destination)
          roots = [path for path in destination.iterdir() if path.is_dir()]
          if len(roots) != 1:
              raise SystemExit('BAD_ROOT_COUNT')
          pathlib.Path('/tmp/ctrl02root').write_text(str(roots[0]))
          PY
          git worktree add --detach /tmp/ctrl02work "$BASE_MAIN"
          test "$(git -C /tmp/ctrl02work rev-parse HEAD)" = "$BASE_MAIN"
          test "$(git -C /tmp/ctrl02work rev-parse 'HEAD^{tree}')" = "$BASE_TREE"
          cp -a "$(cat /tmp/ctrl02root)/." /tmp/ctrl02work/
          echo CTRL02_BASELINE_RECONSTRUCTION_PASS

      - name: Apply deterministic governed reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python3 handoff/CTRL/tools/reconcile_ctrl02_v02.py /tmp/ctrl02work
          grep -q 'CTRL01_ACCEPTANCE_RUN = 33619101714' /tmp/ctrl02work/scripts/ctrl02_validator.py
          grep -q 'WORKING_0.2_PRESEAL' /tmp/ctrl02work/scripts/build_ctrl02_preseal.py
          echo CTRL02_G04_RECONCILIATION_PATCH_PASS

      - name: Frozen sync and explicit runnable diagnostics
        working-directory: /tmp/ctrl02work
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-groups --frozen
          export PYTHONPATH="$PWD/services/control-plane-service/src${PYTHONPATH:+:$PYTHONPATH}"
          uv run ruff format scripts/ctrl02_validator.py
          set +e
          uv run pytest services/control-plane-service/tests -q | tee /tmp/ctrl02-pytest.log
          PYTEST_RC=${PIPESTATUS[0]}
          uv run ruff check \
            services/control-plane-service/src/epd2_control_plane_service/regional_operations.py \
            services/control-plane-service/tests/_ctrl02_builders.py \
            services/control-plane-service/tests/test_ctrl02_authorization.py \
            services/control-plane-service/tests/test_ctrl02_inventory_evidence.py \
            services/control-plane-service/tests/test_ctrl02_lifecycle.py \
            services/control-plane-service/tests/test_ctrl02_privilege_and_recovery.py \
            scripts/ctrl02_mutation_suite.py \
            scripts/ctrl02_validator.py | tee /tmp/ctrl02-ruff.log
          RUFF_RC=${PIPESTATUS[0]}
          uv run mypy services/control-plane-service/src/epd2_control_plane_service/regional_operations.py | tee /tmp/ctrl02-mypy.log
          MYPY_RC=${PIPESTATUS[0]}
          set -e
          echo "CTRL02_DIAGNOSTIC_RC:pytest=$PYTEST_RC:ruff=$RUFF_RC:mypy=$MYPY_RC"
          test "$PYTEST_RC" -eq 0
          test "$RUFF_RC" -eq 0
          test "$MYPY_RC" -eq 0
          echo CTRL02_RUNNABLE_DIAGNOSTICS_PASS

      - name: Mutations freeze and full 46-gate validator
        working-directory: /tmp/ctrl02work
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/services/control-plane-service/src${PYTHONPATH:+:$PYTHONPATH}"
          uv run python scripts/ctrl02_mutation_suite.py | tee /tmp/ctrl02-mutations.log
          grep -q 'CTRL02_MUTATIONS:PASS:40/40' /tmp/ctrl02-mutations.log
          uv run python scripts/ctrl02_validator.py --record-freeze | tee /tmp/ctrl02-record.log
          grep -q 'CTRL02_RESULT:PASS:46/46_PASS' /tmp/ctrl02-record.log
          uv run python scripts/ctrl02_validator.py | tee /tmp/ctrl02-validator.log
          grep -q 'CTRL02_RESULT:PASS:46/46_PASS' /tmp/ctrl02-validator.log
          python3 - <<'PY'
          import json
          result = json.load(open('validation/ctrl02/ctrl02_preseal_result.json'))
          assert result['overall'] == 'PASS', result
          assert result['gates_passed'] == 46, result
          assert result['gates_failed'] == [], result
          assert result['gates_blocked_for_final_seal'] == [], result
          reconciliation = json.load(open('validation/ctrl02/ctrl01_reconciliation_result.json'))
          assert reconciliation['status'] == 'PASS', reconciliation
          assert reconciliation['accepted_candidate_sha256'] == 'c9c666d01e17fe615f78c2e408169ce4b6434d3b8dec23dfda889b2ce91e3c49', reconciliation
          assert reconciliation['acceptance_run_id'] == 33619101714, reconciliation
          mutations = json.load(open('validation/ctrl02/mutation_result.json'))
          assert mutations['detected'] == 40 and mutations['undetected'] == [], mutations
          print('CTRL02_0_2_46_GATE_PASS')
          PY

      - name: Build and independently verify immutable 0.2
        working-directory: /tmp/ctrl02work
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip
          rm -f "$OUT" "$OUT.identity.json"
          uv run python scripts/build_ctrl02_preseal.py --out "$OUT"
          uv run python scripts/verify_ctrl02_package.py "$OUT" | tee /tmp/ctrl02-package-verify.log
          grep -q 'CTRL02_PACKAGE_VERIFY:PASS:' /tmp/ctrl02-package-verify.log
          sha256sum "$OUT" | awk '{print $1}' > /tmp/ctrl02_sha
          stat -c '%s' "$OUT" > /tmp/ctrl02_size
          echo "CTRL02_0_2_BUILD_PASS:$(cat /tmp/ctrl02_sha):$(cat /tmp/ctrl02_size)"

      - name: Commit unique 0.2 candidate and build evidence
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$NEW_ZIP"
          cp /tmp/EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip "$NEW_ZIP"
          python3 - <<'PY'
          import json, os, pathlib
          evidence = pathlib.Path('handoff/CTRL/evidence/CTRL02_0.2_RECONCILED_BUILD.json')
          evidence.parent.mkdir(parents=True, exist_ok=True)
          payload = {
              'schema': 'epd2.ctrl02.reconciled-build/1',
              'module': 'CTRL-02',
              'artifact': 'EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip',
              'sha256': pathlib.Path('/tmp/ctrl02_sha').read_text().strip(),
              'size': int(pathlib.Path('/tmp/ctrl02_size').read_text()),
              'source_0_1_sha256': 'daddb4dfaeb3097e22d15e3448b5d927d7c3b1d7d4dd3332230d23ccd999df1d',
              'base_main': os.environ['BASE_MAIN'],
              'base_tree': os.environ['BASE_TREE'],
              'ctrl01_acceptance_run': int(os.environ['CTRL01_RUN']),
              'ctrl01_candidate_sha256': os.environ['CTRL01_SHA256'],
              'ctrl01_workflow_head': os.environ['CTRL01_HEAD'],
              'gates': '46/46 PASS',
              'mutations': '40/40 DETECTED',
              'status': 'BUILT_NOT_SELF_ACCEPTED',
          }
          evidence.write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n')
          PY
          git config user.name epd2-ctrl02-builder
          git config user.email actions@users.noreply.github.com
          git add "$NEW_ZIP" handoff/CTRL/evidence/CTRL02_0.2_RECONCILED_BUILD.json
          git commit -m 'CTRL-02: add 0.2 predecessor-reconciled candidate'
          git push origin HEAD:handoff/ctrl
          echo CTRL02_0_2_COMMIT_PASS
