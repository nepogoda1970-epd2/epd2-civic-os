name: INFRA-04 C2 Baseline Differential

on:
  push:
    branches: ["candidate/infra04-c2-canonical"]

permissions:
  contents: read
  actions: read

concurrency:
  group: infra04-c2-baseline-differential
  cancel-in-progress: false

env:
  BASE_REF: 7544f5dc3bf40304ae81b4d8ef476cc8ecb60ec5
  INFRA02_PATH: handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip
  INFRA02_SHA256: d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
  INFRA02_SIZE: "15980332"

jobs:
  differential:
    name: Exact main+INFRA02 baseline vs INFRA04 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Bind exact canonical main and predecessor bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main handoff/infra
          test "$(git rev-parse origin/main)" = "$BASE_REF"
          git show "origin/handoff/infra:$INFRA02_PATH" > /tmp/infra02.zip
          test "$(sha256sum /tmp/infra02.zip | awk '{print $1}')" = "$INFRA02_SHA256"
          test "$(stat -c %s /tmp/infra02.zip)" = "$INFRA02_SIZE"
          unzip -t /tmp/infra02.zip >/dev/null
          echo "INFRA04_DIFFERENTIAL_BINDING:PASS:$BASE_REF:$INFRA02_SHA256"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with:
          enable-cache: true

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install PostgreSQL 16 runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/postgres --version

      - name: Materialize exact baseline and exact candidate roots
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="$GITHUB_WORKSPACE"
          BASELINE_ROOT="$RUNNER_TEMP/infra04-baseline"
          CANDIDATE_ROOT="$RUNNER_TEMP/infra04-candidate"
          test ! -e "$BASELINE_ROOT"
          test ! -e "$CANDIDATE_ROOT"
          git worktree add --detach "$BASELINE_ROOT" "$BASE_REF"
          git worktree add --detach "$CANDIDATE_ROOT" "$BASE_REF"

          SOURCE_ROOT="$SOURCE_ROOT" BASELINE_ROOT="$BASELINE_ROOT" python3 - <<'PY'
          import importlib.util, os, pathlib, zipfile
          source = pathlib.Path(os.environ['SOURCE_ROOT'])
          root = pathlib.Path(os.environ['BASELINE_ROOT'])
          apply_path = source / 'handoff/INFRA/infra04-c2-transport/apply.py'
          spec = importlib.util.spec_from_file_location('infra04_apply', apply_path)
          mod = importlib.util.module_from_spec(spec)
          assert spec and spec.loader
          spec.loader.exec_module(mod)
          with zipfile.ZipFile('/tmp/infra02.zip') as z:
              files=[n for n in z.namelist() if not n.endswith('/')]
              roots={n.split('/',1)[0] for n in files if '/' in n}
              if len(roots) != 1:
                  raise SystemExit(f'predecessor root ambiguity: {roots}')
              prefix=next(iter(roots))+'/'
              for rel in mod.PREDECESSOR_PATHS:
                  member=prefix+rel
                  if member not in z.namelist():
                      raise SystemExit(f'predecessor missing: {rel}')
                  dest=mod.safe_dest(root, rel)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(member))
          print(f'INFRA04_BASELINE_PREDECESSOR_RESTORED:PASS:{len(mod.PREDECESSOR_PATHS)}')
          PY

          python3 "$SOURCE_ROOT/handoff/INFRA/infra04-c2-transport/apply.py" \
            --root "$CANDIDATE_ROOT" --predecessor /tmp/infra02.zip
          cp -a "$SOURCE_ROOT/handoff/INFRA/infra04-c2-overlay/." "$CANDIDATE_ROOT"/

          printf '%s\n' "$BASELINE_ROOT" > "$GITHUB_WORKSPACE/baseline-root.txt"
          printf '%s\n' "$CANDIDATE_ROOT" > "$GITHUB_WORKSPACE/candidate-root.txt"
          echo "INFRA04_DIFFERENTIAL_MATERIALIZATION:PASS"

      - name: Install frozen dependencies and Chromium in both roots
        shell: bash
        run: |
          set -euo pipefail
          for f in baseline-root.txt candidate-root.txt; do
            ROOT=$(cat "$GITHUB_WORKSPACE/$f")
            cd "$ROOT"
            LOCKS_BEFORE=$(sha256sum uv.lock package-lock.json)
            uv sync --all-groups --frozen
            npm ci
            LOCKS_AFTER=$(sha256sum uv.lock package-lock.json)
            test "$LOCKS_BEFORE" = "$LOCKS_AFTER"
          done
          cd "$(cat "$GITHUB_WORKSPACE/candidate-root.txt")"
          npx playwright install --with-deps chromium
          echo "INFRA04_DIFFERENTIAL_DEPS:PASS"

      - name: Prepare candidate runtime evidence exactly as authoritative path
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(cat "$GITHUB_WORKSPACE/candidate-root.txt")
          cd "$ROOT"
          git rm -f --ignore-unmatch SHA256SUMS.txt ACCEPTANCE/FREEZE-INVENTORY.json
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          uv run pytest -q tests/repository/test_infra04_units.py tests/repository/test_infra04_mutation_suite.py \
            | tee "$GITHUB_WORKSPACE/diff-candidate-targeted.txt"
          uv run python -m scripts.infra04.gates --artifact /tmp/infra02.zip \
            | tee "$GITHUB_WORKSPACE/diff-candidate-runtime.txt"
          uv run python -m scripts.infra04.build_changed_manifest
          python - <<'PY'
          import json
          from pathlib import Path
          g=json.loads(Path('validation/infra04/gate_report.json').read_text())['summary']
          m=json.loads(Path('validation/infra04/mutation_result.json').read_text())
          d=json.loads(Path('validation/infra04/e2e_drill_report.json').read_text())['summary']
          assert g.get('pass') == 53 and not g.get('fail') and not g.get('blocked') and g.get('all_runtime_passed')
          assert m.get('mutation_total') == 48 and m.get('distinct_detector_total') == 48
          assert d.get('pass') == 18
          print('INFRA04_DIFFERENTIAL_TARGETED:PASS:53/53:48/48:18/18')
          PY

      - name: Normalize both roots to clean local source commits
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_ROOT=$(cat "$GITHUB_WORKSPACE/baseline-root.txt")
          CANDIDATE_ROOT=$(cat "$GITHUB_WORKSPACE/candidate-root.txt")
          for ROOT in "$BASELINE_ROOT" "$CANDIDATE_ROOT"; do
            cd "$ROOT"
            git rm -f --ignore-unmatch SHA256SUMS.txt ACCEPTANCE/FREEZE-INVENTORY.json
            find . -type d -name __pycache__ -prune -exec rm -rf {} +
            find . -type f -name '*.pyc' -delete
            git config user.name 'EPD2 INFRA04 differential'
            git config user.email 'infra04-differential@invalid.local'
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m 'build(infra04): materialize differential source snapshot'
            fi
            test -z "$(git status --porcelain)"
          done
          echo "baseline_source_commit=$(git -C "$BASELINE_ROOT" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "candidate_source_commit=$(git -C "$CANDIDATE_ROOT" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "INFRA04_DIFFERENTIAL_CLEAN_ROOTS:PASS"

      - name: Run canonical acceptance on exact baseline and candidate
        id: harness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/differential"
          run_one() {
            LABEL="$1"
            ROOT="$2"
            OUT="$GITHUB_WORKSPACE/differential/$LABEL"
            mkdir -p "$OUT"
            set +e
            (
              cd "$ROOT"
              GITHUB_WORKSPACE="$ROOT" uv run python -m scripts.acceptance run --root . --output "$OUT"
            ) 2>&1 | tee "$GITHUB_WORKSPACE/differential/$LABEL-harness.txt"
            RC=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$RC" > "$GITHUB_WORKSPACE/differential/$LABEL-rc.txt"
            MANIFEST=$(find "$OUT" -name EXECUTION-MANIFEST.json -type f -print -quit || true)
            if [ -n "$MANIFEST" ]; then
              cp "$MANIFEST" "$GITHUB_WORKSPACE/differential/$LABEL-EXECUTION-MANIFEST.json"
            else
              printf '%s\n' 'EXECUTION-MANIFEST missing' > "$GITHUB_WORKSPACE/differential/$LABEL-manifest-missing.txt"
            fi
            git -C "$ROOT" status --porcelain > "$GITHUB_WORKSPACE/differential/$LABEL-post-status.txt" || true
            echo "INFRA04_DIFFERENTIAL_HARNESS:$LABEL:RC=$RC"
          }
          run_one baseline "$(cat "$GITHUB_WORKSPACE/baseline-root.txt")"
          run_one candidate "$(cat "$GITHUB_WORKSPACE/candidate-root.txt")"

      - name: Extract root-failure differential evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('differential')
          targets=['bootstrap.identity','backend.pytest','browser.playwright']
          def matches(obj, target, path='$'):
              out=[]
              if isinstance(obj, dict):
                  if any(v == target for v in obj.values() if isinstance(v, str)):
                      out.append({'path': path, 'record': obj})
                  for k,v in obj.items(): out.extend(matches(v,target,f'{path}.{k}'))
              elif isinstance(obj, list):
                  for i,v in enumerate(obj): out.extend(matches(v,target,f'{path}[{i}]'))
              return out
          report={
              'canonical_base':'7544f5dc3bf40304ae81b4d8ef476cc8ecb60ec5',
              'baseline_source_commit':__import__('os').environ.get('baseline_source_commit'),
              'candidate_source_commit':__import__('os').environ.get('candidate_source_commit'),
              'targets':{}
          }
          for label in ('baseline','candidate'):
              p=root/f'{label}-EXECUTION-MANIFEST.json'
              if not p.exists():
                  report[label]={'manifest':'missing'}
                  continue
              data=json.loads(p.read_text())
              report[label]={'verdict':data.get('verdict')}
              for target in targets:
                  report['targets'].setdefault(target,{})[label]=matches(data,target)
          (root/'root-failure-differential.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Upload differential evidence even when harness fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra04-c2-baseline-differential-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/differential/**
            ${{ github.workspace }}/diff-candidate-targeted.txt
            ${{ github.workspace }}/diff-candidate-runtime.txt
            ${{ github.workspace }}/baseline-root.txt
            ${{ github.workspace }}/candidate-root.txt
          if-no-files-found: warn
          retention-days: 30
