name: PILOT-05 C3 magic scan
on:
  push:
    branches: [tmp/pilot05-c3-authoritative-20260825]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 15b8f578c00233c1bf02252b3fea23c064213fcf
      - name: Scan binary signatures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          pats={'gzip':bytes.fromhex('1f8b08'),'xz':bytes.fromhex('fd377a585a00'),'zip':b'PK\x03\x04','zipend':b'PK\x05\x06','tarustar':b'ustar'}
          for p in sorted(Path('tmp/pilot05-c3-transport').glob('chunk*.txt')):
              b=p.read_bytes(); print('FILE',p.name,'LEN',len(b))
              for n,pat in pats.items():
                  offs=[]; s=0
                  while True:
                      i=b.find(pat,s)
                      if i<0: break
                      offs.append(i); s=i+1
                  print(n,offs[:50],'count',len(offs))
          PY
