name: FRONT-03 R3 immutable visual reconciliation
on:
  push:
    branches: [front03-r3-verification]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Decode exact reconciled MemberWorkspace
        shell: bash
        run: |
          base64 -d .front03-r3-mw/MemberWorkspace.visual-reconcile.tsx.gz.b64 > /tmp/MemberWorkspace.tsx.gz
          gzip -t /tmp/MemberWorkspace.tsx.gz
          gzip -dc /tmp/MemberWorkspace.tsx.gz > frontend/web-shell/member/MemberWorkspace.tsx
          test "$(sha256sum frontend/web-shell/member/MemberWorkspace.tsx | cut -d' ' -f1)" = "f353c85780c5845b6bca6f8e41e7de64f284a4edb9afa627cea378f4bcc0c7d3"
      - run: npm ci
      - name: Normalize only reconciled source
        run: npm exec --workspace web-shell prettier -- --write member/MemberWorkspace.tsx
      - name: Commit reconciled source bytes
        shell: bash
        run: |
          git config user.name "epd2-governed-ci"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/web-shell/member/MemberWorkspace.tsx
          git commit -m "fix(front03): restore immutable R2 visual composition with typed ports"
          git push origin HEAD:front03-r3-verification
