name: CTRL-03 Canonical Promotion V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ctrl03-canonical-promote-v2.yml'

permissions:
  contents: write
  actions: read

env:
  PREV_MAIN: b1f5f97d2be2eda5fe8c4ec72522fcb108761949
  ACCEPTANCE_RUN: '33696046649'
  ACCEPTANCE_ATTEMPT: '2'
  BUILD_JOB: '100465862662'
  AUTHORITATIVE_JOB: '100466175199'
  WORKFLOW_HEAD: d1702e5acf82b20c85bdd44d038df606ab7aa109
  CANDIDATE_FILE: EPD2_CTRL03_CREDENTIAL_TRUST_AND_KEY_LIFECYCLE_CONTROL_CANDIDATE_0.1_C1.zip
  CANDIDATE_SHA256: 89fca0f6c975a7c0e1eb70c2e3ad5229830e781c91d86637a81f99e39ac7b0ff
  CANDIDATE_SIZE: '16788860'
  CTRL02_RUN: '33690561259'
  CTRL02_JOB: '100448103738'
  CTRL02_HEAD: a70e2bfef7a668ee5158475712827bbc50f6d5fd
  CTRL02_SHA256: f58bafe758f19c0b40d3a525d85d0315052c01bc9ed14eae9973079a4dfb993e
  CTRL02_SIZE: '16720456'

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Pin lineage and authoritative evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PREV_MAIN"
          extras="$(git diff --name-only HEAD^..HEAD | grep -v '^\.github/workflows/ctrl03-canonical-promote-v2\.yml$' || true)"
          test -z "$extras"
          git fetch origin handoff/ctrl
          mkdir -p /tmp/c03
          git show origin/handoff/ctrl:handoff/CTRL/evidence/CTRL03_CANONICAL_ACCEPTANCE_C1.json > /tmp/c03/evidence.json
          git show origin/handoff/ctrl:handoff/CTRL/candidates/$CANDIDATE_FILE > /tmp/c03/$CANDIDATE_FILE
          test "$(sha256sum /tmp/c03/$CANDIDATE_FILE | awk '{print $1}')" = "$CANDIDATE_SHA256"
          test "$(stat -c '%s' /tmp/c03/$CANDIDATE_FILE)" = "$CANDIDATE_SIZE"
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          e=json.loads(pathlib.Path('/tmp/c03/evidence.json').read_text())
          assert e['status']=='CANON_PASS' and e['module']=='CTRL-03'
          assert e['artifact_sha256']==os.environ['CANDIDATE_SHA256'] and e['artifact_size']==int(os.environ['CANDIDATE_SIZE'])
          assert e['acceptance_run_id']==int(os.environ['ACCEPTANCE_RUN']) and e['workflow_head_sha']==os.environ['WORKFLOW_HEAD']
          assert e['gates']=='50/50 PASS' and e['mutations']=='44/44 DETECTED' and e['tests']=='290/290 PASS'
          assert e['package_pre']=='PASS' and e['package_post']=='PASS' and e['self_acceptance'] is False
          p=e['predecessor']; assert p['candidate_sha256']==os.environ['CTRL02_SHA256'] and p['run_id']==int(os.environ['CTRL02_RUN']) and p['status']=='PASS'
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'}
          repo=os.environ['GITHUB_REPOSITORY']; rid=os.environ['ACCEPTANCE_RUN']
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r:return json.load(r)
          run=get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}')
          assert run['status']=='completed' and run['conclusion']=='success' and run['run_attempt']==int(os.environ['ACCEPTANCE_ATTEMPT'])
          assert run['head_sha']==os.environ['WORKFLOW_HEAD']
          jobs={str(j['id']):j for j in get(f'https://api.github.com/repos/{repo}/actions/runs/{rid}/jobs?per_page=100')['jobs']}
          assert jobs[os.environ['BUILD_JOB']]['conclusion']=='success'
          assert jobs[os.environ['AUTHORITATIVE_JOB']]['conclusion']=='success'
          print(e['terminal_marker'])
          PY

      - name: Install accepted payload and governance records
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/c03/x && mkdir -p /tmp/c03/x
          python3 - <<'PY'
          import os,pathlib,zipfile
          z=pathlib.Path('/tmp/c03')/os.environ['CANDIDATE_FILE']; d=pathlib.Path('/tmp/c03/x')
          with zipfile.ZipFile(z) as p:
              if bad:=p.testzip(): raise SystemExit('CRC_FAIL='+bad)
              names=p.namelist(); assert len(names)==len(set(names))
              for n in names:
                  q=pathlib.PurePosixPath(n); assert not q.is_absolute() and '..' not in q.parts
              p.extractall(d)
          roots=[x for x in d.iterdir() if x.is_dir()]; assert len(roots)==1
          pathlib.Path('/tmp/c03/root').write_text(str(roots[0]))
          PY
          R="$(cat /tmp/c03/root)"
          rm -rf services/control-plane-service docs/ctrl/CTRL-03 validation/ctrl03
          cp -a "$R/services/control-plane-service" services/control-plane-service
          mkdir -p docs/ctrl contracts/control scripts validation
          cp -a "$R/docs/ctrl/CTRL-03" docs/ctrl/CTRL-03
          cp -a "$R/validation/ctrl03" validation/ctrl03
          cp "$R/contracts/control/ctrl03_control_console.json" contracts/control/ctrl03_control_console.json
          for f in ctrl03_validator.py ctrl03_mutation_suite.py build_ctrl03_preseal.py verify_ctrl03_package.py; do cp "$R/scripts/$f" scripts/$f; done
          test -f services/control-plane-service/src/epd2_control_plane_service/regional_operations.py
          grep -q "$CTRL02_SHA256" services/control-plane-service/src/epd2_control_plane_service/credential_lifecycle.py
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path('.')
          c02={'schema':'epd2.ctrl02.acceptance-record/2','stage':'CTRL-02 — Regional Intervention & Privileged Operations','decision':'ACCEPTED / CLOSED','decision_date':'2026-09-03','authority':'Project Owner','scope':'BOUNDED_CTRL02_STAGE_ONLY','overall_ctrl_layer':'OPEN / NOT CLOSED','production_readiness':'NOT_ASSERTED','legal_activation':'NOT_ASSERTED','certification':'NOT_ASSERTED','candidate':{'file':'EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip','sha256':os.environ['CTRL02_SHA256'],'size_bytes':int(os.environ['CTRL02_SIZE'])},'authoritative_review':{'run_id':int(os.environ['CTRL02_RUN']),'job_id':int(os.environ['CTRL02_JOB']),'workflow_head_sha':os.environ['CTRL02_HEAD'],'conclusion':'PASS','gates':'46/46 PASS','mutations':'40/40 DETECTED','self_acceptance':False},'open_blockers':[],'next_ctrl_stage':'CTRL-03 — Credential Trust & Key Lifecycle Control'}
          (root/'docs/ctrl/CTRL-02/CTRL02_ACCEPTANCE_RECORD.json').write_text(json.dumps(c02,indent=2,sort_keys=True)+'\n')
          c03={'schema':'epd2.ctrl03.acceptance-record/1','stage':'CTRL-03 — Credential Trust & Key Lifecycle Control','decision':'ACCEPTED / CLOSED','decision_date':'2026-09-03','authority':'Project Owner','scope':'BOUNDED_CTRL03_STAGE_ONLY','overall_ctrl_layer':'OPEN / NOT CLOSED','production_readiness':'NOT_ASSERTED','legal_activation':'NOT_ASSERTED','certification':'NOT_ASSERTED','candidate':{'file':os.environ['CANDIDATE_FILE'],'sha256':os.environ['CANDIDATE_SHA256'],'size_bytes':int(os.environ['CANDIDATE_SIZE']),'self_state_before_governance_decision':'NOT_ACCEPTED'},'authoritative_review':{'workflow':'.github/workflows/ctrl03-c1-canonical.yml','run_id':int(os.environ['ACCEPTANCE_RUN']),'run_attempt':int(os.environ['ACCEPTANCE_ATTEMPT']),'build_job_id':int(os.environ['BUILD_JOB']),'authoritative_job_id':int(os.environ['AUTHORITATIVE_JOB']),'workflow_head_sha':os.environ['WORKFLOW_HEAD'],'conclusion':'PASS','gates':'50/50 PASS','mutations':'44/44 DETECTED','tests':'290/290 PASS','package_pre':'PASS','package_post':'PASS','self_acceptance':False,'terminal_marker':f"CTRL03_AUTHORITATIVE_RESULT:PASS:{os.environ['CANDIDATE_SHA256']}:{os.environ['CANDIDATE_SIZE']}"},'predecessor':{'stage':'CTRL-02','candidate_sha256':os.environ['CTRL02_SHA256'],'candidate_size':int(os.environ['CTRL02_SIZE']),'run_id':int(os.environ['CTRL02_RUN']),'workflow_head_sha':os.environ['CTRL02_HEAD'],'decision':'ACCEPTED / CLOSED'},'open_blockers':[]}
          (root/'docs/ctrl/CTRL-03/CTRL03_C1_ACCEPTANCE_RECORD.json').write_text(json.dumps(c03,indent=2,sort_keys=True)+'\n')
          owned=[]
          for b in [root/'services/control-plane-service',root/'docs/ctrl/CTRL-03',root/'validation/ctrl03']: owned += [x for x in b.rglob('*') if x.is_file()]
          owned += [root/'contracts/control/ctrl03_control_console.json']+[root/'scripts'/n for n in ['ctrl03_validator.py','ctrl03_mutation_suite.py','build_ctrl03_preseal.py','verify_ctrl03_package.py']]
          files={str(f.as_posix()):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(set(owned))}
          m={'schema':'epd2.ctrl03.canonical-installation-manifest/1','candidate_sha256':os.environ['CANDIDATE_SHA256'],'candidate_size':int(os.environ['CANDIDATE_SIZE']),'acceptance_run_id':int(os.environ['ACCEPTANCE_RUN']),'files':files}
          (root/'docs/ctrl/CTRL-03/CTRL03_C1_CANONICAL_INSTALLATION_MANIFEST.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          p=root/'docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md'; s=p.read_text()
          s=re.sub(r'^\*\*Updated:\*\* 2026-09-02\s*$', '**Updated:** 2026-09-03', s, count=1, flags=re.M)
          replacement=f'''**CTRL-02 authoritative acceptance and bounded stage closure (reconciled 2026-09-03):** exact governed candidate `EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip`, SHA-256 `{os.environ['CTRL02_SHA256']}`, size `16,720,456` bytes, passed independent authoritative GitHub Actions review, run `{os.environ['CTRL02_RUN']}`, job `{os.environ['CTRL02_JOB']}`, workflow head `{os.environ['CTRL02_HEAD']}`, conclusion `success`; `46/46` governed gates PASS and `40/40` mutations detected. The earlier PCR CTRL-02 identity is superseded by this later exact authoritative identity. **CTRL-02 remains `ACCEPTED / CLOSED` with no open blocker.**\n\n**CTRL-03 authoritative acceptance and bounded stage closure (2026-09-03):** exact sealed candidate `{os.environ['CANDIDATE_FILE']}`, SHA-256 `{os.environ['CANDIDATE_SHA256']}`, size `16,788,860` bytes, authoritative run `{os.environ['ACCEPTANCE_RUN']}` attempt `2`, build job `{os.environ['BUILD_JOB']}`, authoritative-review job `{os.environ['AUTHORITATIVE_JOB']}`, workflow head `{os.environ['WORKFLOW_HEAD']}`, conclusion `success`; `290/290` runtime tests PASS, `44/44` mutations detected, `50/50` governed gates PASS, package verification PASS before and after independent execution. Terminal marker: `CTRL03_AUTHORITATIVE_RESULT:PASS:{os.environ['CANDIDATE_SHA256']}:{os.environ['CANDIDATE_SIZE']}`. **CTRL-03 is `ACCEPTED / CLOSED`.** The overall CTRL layer remains **OPEN / NOT CLOSED**; no production-readiness, legal-activation, BSI/CC/EAL4 or final-security claim follows.'''
          s,n=re.subn(r'\*\*CTRL-02 authoritative acceptance and bounded stage closure \(2026-09-02\):\*\*.*?(?=\n\n\*\*API-06 authoritative acceptance)',replacement,s,count=1,flags=re.S); assert n==1,n
          old='| CTRL | `CTRL-01 ACCEPTED / CLOSED; CTRL-02 ACCEPTED / CLOSED; CTRL LAYER OPEN; CTRL-03 NEXT` | Exact bounded CTRL-01 C1 and CTRL-02 Regional Intervention & Privileged Operations are accepted/closed. CTRL-02 canonical acceptance is installed by `docs/ctrl/CTRL-02/CTRL02_ACCEPTANCE_RECORD.json` on the strength of authoritative run `33633224296`. The overall CTRL layer remains open; CTRL-03 and later CTRL stages require their own governed acceptance. |'
          new='| CTRL | `CTRL-01 ACCEPTED / CLOSED; CTRL-02 ACCEPTED / CLOSED; CTRL-03 ACCEPTED / CLOSED; CTRL LAYER OPEN` | Exact bounded CTRL-01 C1, CTRL-02 and CTRL-03 are accepted/closed. CTRL-03 exact C1 is independently accepted by run `33696046649` and the cumulative control-plane payload is installed in canonical main. The overall CTRL layer remains open; later CTRL stages require their own governed acceptance. |'
          assert old in s; s=s.replace(old,new,1)
          s=s.replace('CTRL-03 = NEXT CTRL STAGE','CTRL-03 = ACCEPTED / CLOSED',1)
          s=s.replace('- CTRL-03 and later CTRL action/authority inventories, credential trust/key lifecycle work, read models and control-console specifications, with no acceptance claim until their own governed gates pass;','- later CTRL action/authority inventories, read models and control-console specifications, with no acceptance claim until their own governed gates pass;',1)
          oldp='**Parallel CTRL action:** `CTRL-01` and `CTRL-02` are both `ACCEPTED / CLOSED` as bounded stages. CTRL-02 is canonically installed at exact SHA-256 `ef3860d9b2f65f444c1c602c9efb9a32a2a07b9e8024161ba7fd6d26c8ed8a` on the strength of authoritative run `33633224296` and `docs/ctrl/CTRL-02/CTRL02_ACCEPTANCE_RECORD.json`. `CTRL-03 — Credential Trust & Key Lifecycle Control` is the next permitted CTRL stage. The overall CTRL layer remains open until its remaining governed stages are independently accepted.'
          newp=f'''**Parallel CTRL action:** `CTRL-01`, `CTRL-02` and `CTRL-03` are `ACCEPTED / CLOSED` as bounded stages. CTRL-02 is reconciled to SHA-256 `{os.environ['CTRL02_SHA256']}`, run `{os.environ['CTRL02_RUN']}`. CTRL-03 is canonically accepted at C1 SHA-256 `{os.environ['CANDIDATE_SHA256']}`, run `{os.environ['ACCEPTANCE_RUN']}`, with `50/50` gates, `44/44` mutations and `290/290` tests PASS. The cumulative control-plane payload through CTRL-03 is installed in canonical main. The overall CTRL layer remains open until remaining governed CTRL stages are independently accepted.'''
          assert oldp in s; s=s.replace(oldp,newp,1)
          transition=f'''### CTRL-03 C1 authoritative transition — 2026-09-03\n\n- **Previous state:** `CTRL-03 CANDIDATE / NOT_ACCEPTED`.\n- **New state:** `CTRL-03 ACCEPTED / CLOSED`.\n- **Governing candidate:** `{os.environ['CANDIDATE_FILE']}`.\n- **Candidate SHA-256:** `{os.environ['CANDIDATE_SHA256']}`.\n- **Candidate size:** `16,788,860` bytes.\n- **Accepted predecessor:** CTRL-02 SHA-256 `{os.environ['CTRL02_SHA256']}`, authoritative run `{os.environ['CTRL02_RUN']}`.\n- **Authoritative run:** `{os.environ['ACCEPTANCE_RUN']}`, attempt `2`; build job `{os.environ['BUILD_JOB']}`; authoritative-review job `{os.environ['AUTHORITATIVE_JOB']}`; conclusion `success`.\n- **Independent proof:** `290/290` tests PASS; `44/44` mutations detected; `50/50` governed gates PASS; package verification PASS pre/post.\n- **Terminal marker:** `CTRL03_AUTHORITATIVE_RESULT:PASS:{os.environ['CANDIDATE_SHA256']}:{os.environ['CANDIDATE_SIZE']}`.\n- **Open blockers:** none.\n- **Scope:** overall CTRL layer remains open; no production/legal/certification claim follows.\n\n'''
          anchor='### FRONT-02 C2.1 authoritative acceptance transition — 2026-08-29'; assert anchor in s; s=s.replace(anchor,transition+anchor,1)
          p.write_text(s)
          PY

      - name: Commit canonical state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/ctrl03-canonical-promote.yml .github/workflows/ctrl03-canonical-promote-v2.yml
          git config user.name epd2-governance-bot
          git config user.email epd2-governance-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          grep -q 'CTRL-03 ACCEPTED / CLOSED' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          test -f docs/ctrl/CTRL-03/CTRL03_C1_ACCEPTANCE_RECORD.json
          test -f docs/ctrl/CTRL-03/CTRL03_C1_CANONICAL_INSTALLATION_MANIFEST.json
          git commit -m 'governance(ctrl03): accept close and install canonical C1'
          git push origin HEAD:main
          echo CTRL03_CANONICAL_PROMOTION_PASS
