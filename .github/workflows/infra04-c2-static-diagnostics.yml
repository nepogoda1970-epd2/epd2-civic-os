name: INFRA-04 C2 Static Diagnostics
on:
  push:
    branches: ["diagnostic/infra04-c2-static"]
permissions:
  contents: read
env:
  INFRA02_PATH: handoff/INFRA/incoming/EPD2_INFRA02_CI_CD_AND_SOFTWARE_SUPPLY_CHAIN_CANDIDATE_0.1.zip
  INFRA02_SHA256: d91fa6db81126765c0e26bf285fff2f974464544b7fa6299b6d069a25d1ff72c
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Materialize exact C2
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin handoff/infra
          git show "origin/handoff/infra:$INFRA02_PATH" > /tmp/infra02.zip
          test "$(sha256sum /tmp/infra02.zip|awk '{print $1}')" = "$INFRA02_SHA256"
          python3 handoff/INFRA/infra04-c2-transport/apply.py --root "$GITHUB_WORKSPACE" --predecessor /tmp/infra02.zip
          cp -a handoff/INFRA/infra04-c2-overlay/. "$GITHUB_WORKSPACE"/
          rm -rf handoff/INFRA/infra04-c2-transport handoff/INFRA/infra04-c2-overlay
          git rm -f --ignore-unmatch SHA256SUMS.txt ACCEPTANCE/FREEZE-INVENTORY.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: "3.12"}
      - uses: astral-sh/setup-uv@8d55fbecc275b1c35dbe060458839f8d30439ccf
        with: {enable-cache: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: "22"}
      - name: Install frozen deps
        shell: bash
        run: |
          set -euo pipefail
          uv sync --all-groups --frozen
          npm ci
      - name: Ruff format
        shell: bash
        run: |
          set +e
          uv run ruff format --check . 2>&1 | tee /tmp/ruff-format.txt
          echo RC=${PIPESTATUS[0]}
          exit 0
      - name: Ruff lint
        shell: bash
        run: |
          set +e
          uv run ruff check . 2>&1 | tee /tmp/ruff-lint.txt
          echo RC=${PIPESTATUS[0]}
          exit 0
      - name: Mypy
        shell: bash
        run: |
          set +e
          make typecheck 2>&1 | tee /tmp/mypy.txt
          echo RC=${PIPESTATUS[0]}
          exit 0
      - name: Prettier
        shell: bash
        run: |
          set +e
          npm run format:check 2>&1 | tee /tmp/prettier.txt
          echo RC=${PIPESTATUS[0]}
          exit 0
      - name: Upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: infra04-c2-static-${{ github.run_id }}
          path: /tmp/*.txt
          if-no-files-found: error
          retention-days: 7
