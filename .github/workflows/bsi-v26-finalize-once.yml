name: BSI V26 governance finalizer

on:
  push:
    branches:
      - governance/bsi-vote-readiness-final

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: governance/bsi-vote-readiness-final
          fetch-depth: 0

      - name: Fetch canonical main
        run: git fetch origin main

      - name: Apply governed BSI V26 refinement
        run: python scripts/bsi_v26_finalize_once.py

      - name: Validate governed output
        run: |
          set -euo pipefail
          test -f docs/security/bsi/EPD2_BSI_CC_PP_0121_CERTIFICATION_READINESS_GAP_MATRIX_0.1.md
          test -f docs/security/bsi/EPD2_BSI_CC_PP_0121_P0_PRE_EVALUATION_QUESTIONNAIRE_0.1.md
          test ! -e docs/roadmap/EPD2_BSI_CC_PP_0121_CONFORMANCE_MATRIX.md
          grep -F 'FIR-VOTE-BSI-001' docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md >/dev/null
          ! grep -R -F 'FIR-BSI-001' docs/roadmap docs/security/bsi
          grep -F 'PREPARATORY PARALLEL WORK / NOT CERTIFIED' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md >/dev/null
          python -m json.tool docs/roadmap/EPD2_BSI_MASTER_UPDATE_EVIDENCE.json >/dev/null

      - name: Commit governed refinement
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap docs/security/bsi
          git commit -m 'governance(bsi): finalize V26 certification-readiness controls'
          git push origin HEAD:governance/bsi-vote-readiness-final
