name: CTRL-03 Canonical Promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ctrl03-canonical-promote.yml'

permissions:
  contents: write
  actions: read

env:
  PRE_PROMOTION_MAIN: f379520c395febb22ae3139c4edcd1595f801340
  ACCEPTANCE_RUN: '33696046649'
  ACCEPTANCE_ATTEMPT: '2'
  BUILD_JOB: '100465862662'
  AUTHORITATIVE_JOB: '100466175199'
  WORKFLOW_HEAD: d1702e5acf82b20c85bdd44d038df606ab7aa109
  CANDIDATE_FILE: EPD2_CTRL03_CREDENTIAL_TRUST_AND_KEY_LIFECYCLE_CONTROL_CANDIDATE_0.1_C1.zip
  CANDIDATE_SHA256: 89fca0f6c975a7c0e1eb70c2e3ad5229830e781c91d86637a81f99e39ac7b0ff
  CANDIDATE_SIZE: '16788860'
  CTRL02_RUN: '33690561259'
  CTRL02_JOB: '100448103738'
  CTRL02_HEAD: a70e2bfef7a668ee5158475712827bbc50f6d5fd
  CTRL02_SHA256: f58bafe758f19c0b40d3a525d85d0315052c01bc9ed14eae9973079a4dfb993e
  CTRL02_SIZE: '16720456'

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fail closed on canonical drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PRE_PROMOTION_MAIN"
          extras="$(git diff --name-only HEAD^..HEAD | grep -v '^\.github/workflows/ctrl03-canonical-promote\.yml$' || true)"
          test -z "$extras" || { echo "unexpected promotion-trigger drift: $extras" >&2; exit 1; }
          git fetch origin handoff/ctrl

      - name: Verify authoritative run, jobs, evidence and exact C1 bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ctrl03-promote
          git show origin/handoff/ctrl:handoff/CTRL/evidence/CTRL03_CANONICAL_ACCEPTANCE_C1.json > /tmp/ctrl03-promote/evidence.json
          git show origin/handoff/ctrl:handoff/CTRL/candidates/$CANDIDATE_FILE > /tmp/ctrl03-promote/$CANDIDATE_FILE
          test "$(sha256sum /tmp/ctrl03-promote/$CANDIDATE_FILE | awk '{print $1}')" = "$CANDIDATE_SHA256"
          test "$(stat -c '%s' /tmp/ctrl03-promote/$CANDIDATE_FILE)" = "$CANDIDATE_SIZE"
          python3 - <<'PY'
          import json, os, pathlib, urllib.request
          headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json'}
          repo=os.environ['GITHUB_REPOSITORY']; run_id=os.environ['ACCEPTANCE_RUN']
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req) as r: return json.load(r)
          run=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}')
          assert run['status']=='completed' and run['conclusion']=='success',run
          assert run['run_attempt']==int(os.environ['ACCEPTANCE_ATTEMPT']),run
          assert run['head_sha']==os.environ['WORKFLOW_HEAD'],run
          jobs=get(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/jobs?per_page=100')['jobs']
          by_id={str(j['id']):j for j in jobs}
          assert by_id[os.environ['BUILD_JOB']]['conclusion']=='success',by_id.get(os.environ['BUILD_JOB'])
          assert by_id[os.environ['AUTHORITATIVE_JOB']]['conclusion']=='success',by_id.get(os.environ['AUTHORITATIVE_JOB'])
          e=json.loads(pathlib.Path('/tmp/ctrl03-promote/evidence.json').read_text())
          assert e['module']=='CTRL-03' and e['status']=='CANON_PASS',e
          assert e['acceptance_run_id']==int(run_id),e
          assert e['workflow_head_sha']==os.environ['WORKFLOW_HEAD'],e
          assert e['artifact_sha256']==os.environ['CANDIDATE_SHA256'],e
          assert e['artifact_size']==int(os.environ['CANDIDATE_SIZE']),e
          assert e['gates']=='50/50 PASS' and e['mutations']=='44/44 DETECTED',e
          assert e['tests']=='290/290 PASS' and e['package_pre']=='PASS' and e['package_post']=='PASS',e
          assert e['self_acceptance'] is False,e
          p=e['predecessor']
          assert p['stage']=='CTRL-02' and p['status']=='PASS',p
          assert p['run_id']==int(os.environ['CTRL02_RUN']) and p['workflow_head_sha']==os.environ['CTRL02_HEAD'],p
          assert p['candidate_sha256']==os.environ['CTRL02_SHA256'] and p['candidate_size']==int(os.environ['CTRL02_SIZE']),p
          print(e['terminal_marker'])
          PY

      - name: Safe extract accepted candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/ctrl03-promote/extracted && mkdir -p /tmp/ctrl03-promote/extracted
          python3 - <<'PY'
          import os,pathlib,zipfile
          z=pathlib.Path('/tmp/ctrl03-promote')/os.environ['CANDIDATE_FILE']
          d=pathlib.Path('/tmp/ctrl03-promote/extracted')
          with zipfile.ZipFile(z) as p:
              if bad:=p.testzip(): raise SystemExit('CRC_FAIL='+bad)
              names=p.namelist()
              if len(names)!=len(set(names)): raise SystemExit('DUPLICATE_PATHS')
              for n in names:
                  q=pathlib.PurePosixPath(n)
                  if q.is_absolute() or '..' in q.parts: raise SystemExit('UNSAFE_PATH='+n)
              p.extractall(d)
          roots=[x for x in d.iterdir() if x.is_dir()]
          if len(roots)!=1: raise SystemExit('ROOT_COUNT')
          pathlib.Path('/tmp/ctrl03-promote/root').write_text(str(roots[0]))
          PY

      - name: Install cumulative accepted CTRL control-plane payload
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/ctrl03-promote/root)"
          rm -rf services/control-plane-service
          cp -a "$ROOT/services/control-plane-service" services/control-plane-service
          mkdir -p docs/ctrl/CTRL-03 contracts/control scripts validation
          rm -rf docs/ctrl/CTRL-03 validation/ctrl03
          cp -a "$ROOT/docs/ctrl/CTRL-03" docs/ctrl/CTRL-03
          cp -a "$ROOT/validation/ctrl03" validation/ctrl03
          cp "$ROOT/contracts/control/ctrl03_control_console.json" contracts/control/ctrl03_control_console.json
          for f in ctrl03_validator.py ctrl03_mutation_suite.py build_ctrl03_preseal.py verify_ctrl03_package.py; do cp "$ROOT/scripts/$f" "scripts/$f"; done
          grep -q "$CTRL02_SHA256" services/control-plane-service/src/epd2_control_plane_service/credential_lifecycle.py
          test -f services/control-plane-service/src/epd2_control_plane_service/regional_operations.py
          echo CTRL03_CANONICAL_PAYLOAD_INSTALL_PASS

      - name: Record governance decisions and installation manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('.')
          ctrl02={
            'schema':'epd2.ctrl02.acceptance-record/2','stage':'CTRL-02 — Regional Intervention & Privileged Operations',
            'decision':'ACCEPTED / CLOSED','decision_date':'2026-09-03','authority':'Project Owner',
            'scope':'BOUNDED_CTRL02_STAGE_ONLY','overall_ctrl_layer':'OPEN / NOT CLOSED',
            'production_readiness':'NOT_ASSERTED','legal_activation':'NOT_ASSERTED','certification':'NOT_ASSERTED',
            'candidate':{'file':'EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip','sha256':os.environ['CTRL02_SHA256'],'size_bytes':int(os.environ['CTRL02_SIZE'])},
            'authoritative_review':{'run_id':int(os.environ['CTRL02_RUN']),'job_id':int(os.environ['CTRL02_JOB']),'workflow_head_sha':os.environ['CTRL02_HEAD'],'conclusion':'PASS','gates':'46/46 PASS','mutations':'40/40 DETECTED','self_acceptance':False},
            'open_blockers':[], 'next_ctrl_stage':'CTRL-03 — Credential Trust & Key Lifecycle Control'
          }
          p=root/'docs/ctrl/CTRL-02/CTRL02_ACCEPTANCE_RECORD.json'; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(json.dumps(ctrl02,indent=2,sort_keys=True)+'\n')
          ctrl03={
            'schema':'epd2.ctrl03.acceptance-record/1','stage':'CTRL-03 — Credential Trust & Key Lifecycle Control',
            'decision':'ACCEPTED / CLOSED','decision_date':'2026-09-03','authority':'Project Owner',
            'scope':'BOUNDED_CTRL03_STAGE_ONLY','overall_ctrl_layer':'OPEN / NOT CLOSED',
            'production_readiness':'NOT_ASSERTED','legal_activation':'NOT_ASSERTED','certification':'NOT_ASSERTED',
            'candidate':{'file':os.environ['CANDIDATE_FILE'],'sha256':os.environ['CANDIDATE_SHA256'],'size_bytes':int(os.environ['CANDIDATE_SIZE']),'self_state_before_governance_decision':'NOT_ACCEPTED'},
            'authoritative_review':{'workflow':'.github/workflows/ctrl03-c1-canonical.yml','run_id':int(os.environ['ACCEPTANCE_RUN']),'run_attempt':int(os.environ['ACCEPTANCE_ATTEMPT']),'build_job_id':int(os.environ['BUILD_JOB']),'authoritative_job_id':int(os.environ['AUTHORITATIVE_JOB']),'workflow_head_sha':os.environ['WORKFLOW_HEAD'],'conclusion':'PASS','gates':'50/50 PASS','mutations':'44/44 DETECTED','tests':'290/290 PASS','package_pre':'PASS','package_post':'PASS','self_acceptance':False,'terminal_marker':f"CTRL03_AUTHORITATIVE_RESULT:PASS:{os.environ['CANDIDATE_SHA256']}:{os.environ['CANDIDATE_SIZE']}"},
            'predecessor':{'stage':'CTRL-02','candidate_sha256':os.environ['CTRL02_SHA256'],'candidate_size':int(os.environ['CTRL02_SIZE']),'run_id':int(os.environ['CTRL02_RUN']),'workflow_head_sha':os.environ['CTRL02_HEAD'],'decision':'ACCEPTED / CLOSED'},
            'open_blockers':[]
          }
          p=root/'docs/ctrl/CTRL-03/CTRL03_C1_ACCEPTANCE_RECORD.json'; p.write_text(json.dumps(ctrl03,indent=2,sort_keys=True)+'\n')
          owned=[]
          for base in [root/'services/control-plane-service',root/'docs/ctrl/CTRL-03',root/'validation/ctrl03']:
              owned += [x for x in base.rglob('*') if x.is_file()]
          owned += [root/'contracts/control/ctrl03_control_console.json']
          owned += [root/'scripts'/n for n in ['ctrl03_validator.py','ctrl03_mutation_suite.py','build_ctrl03_preseal.py','verify_ctrl03_package.py']]
          files={}
          for f in sorted(set(owned)):
              files[str(f.as_posix())]=hashlib.sha256(f.read_bytes()).hexdigest()
          manifest={'schema':'epd2.ctrl03.canonical-installation-manifest/1','candidate_sha256':os.environ['CANDIDATE_SHA256'],'candidate_size':int(os.environ['CANDIDATE_SIZE']),'acceptance_run_id':int(os.environ['ACCEPTANCE_RUN']),'files':files}
          (root/'docs/ctrl/CTRL-03/CTRL03_C1_CANONICAL_INSTALLATION_MANIFEST.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          PY

      - name: Reconcile canonical Program Control Register
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re
          p=pathlib.Path('docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md')
          s=p.read_text()
          s=s.replace('**Updated:** 2026-09-02  ','**Updated:** 2026-09-03  ',1)
          new02='''**CTRL-02 authoritative acceptance and bounded stage closure (reconciled 2026-09-03):** exact governed candidate `EPD2_CTRL02_REGIONAL_INTERVENTION_AND_PRIVILEGED_OPERATIONS_WORKING_0.2_PRESEAL.zip`, SHA-256 `f58bafe758f19c0b40d3a525d85d0315052c01bc9ed14eae9973079a4dfb993e`, size `16,720,456` bytes, passed independent authoritative GitHub Actions review, run `33690561259`, job `100448103738`, workflow head `a70e2bfef7a668ee5158475712827bbc50f6d5fd`, conclusion `success`. The independent review verified the authoritative CTRL-01 predecessor, frozen dependencies, package verification before and after execution, runtime tests, `40/40` mutations detected and all `46/46` governed gates PASS. The earlier PCR identity `ef3860d9... / run 33633224296` is superseded by this later exact authoritative accepted identity. The post-run governance decision is recorded in `docs/ctrl/CTRL-02/CTRL02_ACCEPTANCE_RECORD.json`. **CTRL-02 remains `ACCEPTED / CLOSED` with no open blocker.** The overall CTRL layer remains open.\n\n**CTRL-03 authoritative acceptance and bounded stage closure (2026-09-03):** exact sealed candidate `EPD2_CTRL03_CREDENTIAL_TRUST_AND_KEY_LIFECYCLE_CONTROL_CANDIDATE_0.1_C1.zip`, SHA-256 `89fca0f6c975a7c0e1eb70c2e3ad5229830e781c91d86637a81f99e39ac7b0ff`, size `16,788,860` bytes, passed the independent two-job GitHub Actions contour `.github/workflows/ctrl03-c1-canonical.yml`, authoritative run `33696046649` attempt `2`, build job `100465862662`, authoritative-review job `100466175199`, workflow head `d1702e5acf82b20c85bdd44d038df606ab7aa109`, conclusion `success`. The run bound the exact accepted CTRL-02 predecessor `f58bafe758f19c0b40d3a525d85d0315052c01bc9ed14eae9973079a4dfb993e`, passed locked dependencies, Ruff/mypy, `290/290` runtime regression tests, `44/44` mutation detections, all `50/50` governed gates, and package verification before and after independent execution. Terminal marker: `CTRL03_AUTHORITATIVE_RESULT:PASS:89fca0f6c975a7c0e1eb70c2e3ad5229830e781c91d86637a81f99e39ac7b0ff:16788860`. The candidate retained `NOT_ACCEPTED` as the no-self-acceptance safeguard; it is superseded only by this independent post-run Project Owner governance decision in `docs/ctrl/CTRL-03/CTRL03_C1_ACCEPTANCE_RECORD.json`. The cumulative accepted control-plane payload through CTRL-03 is installed in canonical `main` and recorded by `CTRL03_C1_CANONICAL_INSTALLATION_MANIFEST.json`. **CTRL-03 is therefore `ACCEPTED / CLOSED` as the bounded Credential Trust & Key Lifecycle Control stage.** The overall CTRL layer remains **OPEN / NOT CLOSED**; no production-readiness, legal-activation, BSI/CC/EAL4 or final-security claim follows.'''
          pattern=r'\*\*CTRL-02 authoritative acceptance and bounded stage closure \(2026-09-02\):\*\*.*?(?=\n\n\*\*API-06 authoritative acceptance)'
          s,n=re.subn(pattern,new02,s,count=1,flags=re.S)
          if n!=1: raise SystemExit(f'CTRL02_PCR_PARAGRAPH_REPLACE_COUNT={n}')
          old='| CTRL | `CTRL-01 ACCEPTED / CLOSED; CTRL-02 ACCEPTED / CLOSED; CTRL LAYER OPEN; CTRL-03 NEXT` | Exact bounded CTRL-01 C1 and CTRL-02 Regional Intervention & Privileged Operations are accepted/closed. CTRL-02 canonical acceptance is installed by `docs/ctrl/CTRL-02/CTRL02_ACCEPTANCE_RECORD.json` on the strength of authoritative run `33633224296`. The overall CTRL layer remains open; CTRL-03 and later CTRL stages require their own governed acceptance. |'
          new='| CTRL | `CTRL-01 ACCEPTED / CLOSED; CTRL-02 ACCEPTED / CLOSED; CTRL-03 ACCEPTED / CLOSED; CTRL LAYER OPEN` | Exact bounded CTRL-01 C1, CTRL-02 and CTRL-03 are accepted/closed. CTRL-03 exact C1 is independently accepted by run `33696046649`, bound to the reconciled accepted CTRL-02 predecessor, and its cumulative control-plane payload is installed in canonical main. The overall CTRL layer remains open; later CTRL stages require their own governed acceptance. |'
          if old not in s: raise SystemExit('CTRL_TABLE_ROW_NOT_FOUND')
          s=s.replace(old,new,1)
          s=s.replace('CTRL-03 = NEXT CTRL STAGE','CTRL-03 = ACCEPTED / CLOSED',1)
          s=s.replace('- CTRL-03 and later CTRL action/authority inventories, credential trust/key lifecycle work, read models and control-console specifications, with no acceptance claim until their own governed gates pass;','- later CTRL action/authority inventories, read models and control-console specifications, with no acceptance claim until their own governed gates pass;',1)
          oldp='**Parallel CTRL action:** `CTRL-01` and `CTRL-02` are both `ACCEPTED / CLOSED` as bounded stages. CTRL-02 is canonically installed at exact SHA-256 `ef3860d9b2f65f444c1c602c9efb9a32a2a07b9e8024161ba7fd6d26c8ed8a` on the strength of authoritative run `33633224296` and `docs/ctrl/CTRL-02/CTRL02_ACCEPTANCE_RECORD.json`. `CTRL-03 — Credential Trust & Key Lifecycle Control` is the next permitted CTRL stage. The overall CTRL layer remains open until its remaining governed stages are independently accepted.'
          newp='**Parallel CTRL action:** `CTRL-01`, `CTRL-02` and `CTRL-03` are `ACCEPTED / CLOSED` as bounded stages. CTRL-02 is reconciled to authoritative exact SHA-256 `f58bafe758f19c0b40d3a525d85d0315052c01bc9ed14eae9973079a4dfb993e`, run `33690561259`. CTRL-03 is canonically accepted at exact C1 SHA-256 `89fca0f6c975a7c0e1eb70c2e3ad5229830e781c91d86637a81f99e39ac7b0ff`, run `33696046649`, with `50/50` gates, `44/44` mutations and `290/290` tests PASS. The cumulative control-plane payload through CTRL-03 is installed in canonical main. The overall CTRL layer remains open until remaining governed CTRL stages are independently accepted.'
          if oldp not in s: raise SystemExit('CTRL_PARALLEL_PARAGRAPH_NOT_FOUND')
          s=s.replace(oldp,newp,1)
          transition='''### CTRL-03 C1 authoritative transition — 2026-09-03\n\n- **Previous state:** `CTRL-03 CANDIDATE / NOT_ACCEPTED`; predecessor reconciliation blocked final seal before authoritative CTRL-02 identity was available.\n- **New state:** `CTRL-03 ACCEPTED / CLOSED`.\n- **Governing candidate:** `EPD2_CTRL03_CREDENTIAL_TRUST_AND_KEY_LIFECYCLE_CONTROL_CANDIDATE_0.1_C1.zip`.\n- **Candidate SHA-256:** `89fca0f6c975a7c0e1eb70c2e3ad5229830e781c91d86637a81f99e39ac7b0ff`.\n- **Candidate size:** `16,788,860` bytes.\n- **Accepted predecessor:** CTRL-02 SHA-256 `f58bafe758f19c0b40d3a525d85d0315052c01bc9ed14eae9973079a4dfb993e`, authoritative run `33690561259`.\n- **Authoritative workflow:** `.github/workflows/ctrl03-c1-canonical.yml`.\n- **Authoritative run:** `33696046649`, attempt `2`; build job `100465862662`; authoritative-review job `100466175199`; conclusion `success`.\n- **Independent proof:** `290/290` runtime tests PASS; `44/44` mutation attacks detected; `50/50` governed gates PASS; package verification PASS before and after independent execution; exact candidate identity/CRC/seal PASS.\n- **Terminal marker:** `CTRL03_AUTHORITATIVE_RESULT:PASS:89fca0f6c975a7c0e1eb70c2e3ad5229830e781c91d86637a81f99e39ac7b0ff:16788860`.\n- **Acceptance decision:** `docs/ctrl/CTRL-03/CTRL03_C1_ACCEPTANCE_RECORD.json`.\n- **Canonical installation:** `docs/ctrl/CTRL-03/CTRL03_C1_CANONICAL_INSTALLATION_MANIFEST.json`.\n- **Open blockers for CTRL-03:** none.\n- **Scope consequence:** CTRL-03 is closed at exact C1; the overall CTRL layer remains open and later CTRL stages are not promoted. No production-readiness, legal-activation, BSI/CC/EAL4 or final-security claim follows.\n\n'''
          anchor='### FRONT-02 C2.1 authoritative acceptance transition — 2026-08-29'
          if anchor not in s: raise SystemExit('TRANSITION_ANCHOR_NOT_FOUND')
          s=s.replace(anchor,transition+anchor,1)
          p.write_text(s)
          PY

      - name: Canonical governance commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ctrl03-canonical-promote.yml
          git config user.name epd2-governance-bot
          git config user.email epd2-governance-bot@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -f docs/ctrl/CTRL-03/CTRL03_C1_ACCEPTANCE_RECORD.json
          test -f docs/ctrl/CTRL-03/CTRL03_C1_CANONICAL_INSTALLATION_MANIFEST.json
          grep -q 'CTRL-03 ACCEPTED / CLOSED' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          git commit -m 'governance(ctrl03): accept close and install canonical C1'
          git push origin HEAD:main
          echo CTRL03_CANONICAL_PROMOTION_PASS
