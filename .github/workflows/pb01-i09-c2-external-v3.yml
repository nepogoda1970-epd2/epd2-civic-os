name: PB01-I09 C2 External Acceptance v3

on:
  push:
    branches: [pilot02-verify]
    paths:
      - '.github/workflows/pb01-i09-c2-external-v3.yml'
      - 'EPD2_VCRYPTO-PB01-I09_PRODUCTION_PILOT_ROBUSTNESS_CONCURRENCY_AND_SCALE_QUALIFICATION_CANDIDATE_0.1_C2.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-i09-c2-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'

      - name: Exact Rust/Cargo 1.97.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(node --version)" = 'v24.19.0'
          test "$(rustc --version)" = 'rustc 1.97.1 (8bab26f4f 2026-07-14)'
          test "$(cargo --version)" = 'cargo 1.97.1 (c980f4866 2026-06-30)'
          go version | grep -E 'go1\.(2[3-9]|[3-9][0-9])'

      - name: Resolve PostgreSQL 16 without unnecessary apt work
        id: pg
        run: |
          set -euo pipefail
          PG_BIN='/usr/lib/postgresql/16/bin'
          if [ ! -x "$PG_BIN/postgres" ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16 postgresql-client-16
          fi
          test -x "$PG_BIN/postgres"
          "$PG_BIN/postgres" --version | grep 'PostgreSQL) 16\.'
          echo "EPD2_I09_PG_BIN=$PG_BIN" >> "$GITHUB_ENV"

      - name: Exact sealed ZIP integrity
        run: |
          set -euo pipefail
          ZIP='EPD2_VCRYPTO-PB01-I09_PRODUCTION_PILOT_ROBUSTNESS_CONCURRENCY_AND_SCALE_QUALIFICATION_CANDIDATE_0.1_C2.zip'
          EXPECTED='48fbddb686466208e4972908a3c213aa7021f4178d8bf71cc0b211f4af45ba53'
          ACTUAL="$(sha256sum "$ZIP" | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          rm -rf /tmp/pb01-i09-c2-v3 && mkdir -p /tmp/pb01-i09-c2-v3
          unzip -q "$ZIP" -d /tmp/pb01-i09-c2-v3
          mapfile -t ROOTS < <(find /tmp/pb01-i09-c2-v3 -mindepth 1 -maxdepth 1 -type d)
          test "${#ROOTS[@]}" -eq 1
          ROOT="${ROOTS[0]}"
          echo "CANDIDATE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "CANDIDATE_ZIP=$GITHUB_WORKSPACE/$ZIP" >> "$GITHUB_ENV"
          cd "$ROOT"
          sha256sum -c SHA256SUMS.txt

      - name: Locked Node dependencies
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          npm ci --ignore-scripts

      - name: Full fresh exact validate:i09
        id: validate
        run: |
          set -o pipefail
          cd "$CANDIDATE_ROOT"
          I09_CANDIDATE_ZIP="$CANDIDATE_ZIP" EPD2_I09_PG_BIN="$EPD2_I09_PG_BIN" npm run validate:i09 2>&1 | tee "$GITHUB_WORKSPACE/i09-c2-v3.log"

      - name: Materialize result even on failure
        if: always()
        run: |
          set +u
          RESULT="${CANDIDATE_ROOT:-}/evidence/results/i09/I09_FINAL_VALIDATION.json"
          {
            echo '# PB01-I09 C2 Independent External Acceptance v3'
            echo
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Source commit: $GITHUB_SHA"
            echo '- Candidate SHA256: `48fbddb686466208e4972908a3c213aa7021f4178d8bf71cc0b211f4af45ba53`'
            echo "- Node: \`$(node --version 2>/dev/null || true)\`"
            echo "- Go: \`$(go version 2>/dev/null || true)\`"
            echo "- Rust: \`$(rustc --version 2>/dev/null || true)\`"
            echo "- Cargo: \`$(cargo --version 2>/dev/null || true)\`"
            echo "- PostgreSQL: \`${EPD2_I09_PG_BIN:-}/postgres --version\`"
            if [ -f "$RESULT" ]; then
              cp "$RESULT" PB01_I09_C2_CURRENT_RUN_V3.json
              echo '- Fresh validate:i09 result: `PASS`'
              echo
              echo '```json'
              cat "$RESULT"
              echo '```'
              echo
              echo '**Verdict: PASS — PB01-I09 C2 exact external acceptance passed.**'
            else
              echo '- Fresh validate:i09 result: `NO PASS RESULT`'
              echo
              echo '**Verdict: NOT VERIFIED — external run did not produce the mandatory fresh PASS result.**'
              echo
              echo '## Log tail'
              echo '```text'
              tail -n 300 "$GITHUB_WORKSPACE/i09-c2-v3.log" 2>/dev/null || true
              echo '```'
            fi
          } > PB01_I09_C2_VERIFY_RESULT_V3.md

      - name: Publish v3 result without branch race
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PB01_I09_C2_VERIFY_RESULT_V3.md
          [ ! -f PB01_I09_C2_CURRENT_RUN_V3.json ] || git add PB01_I09_C2_CURRENT_RUN_V3.json
          git diff --cached --quiet && exit 0
          git commit -m 'record PB01-I09 C2 external acceptance v3'
          for attempt in 1 2 3 4 5; do
            git fetch origin pilot02-verify
            git rebase origin/pilot02-verify
            if git push origin HEAD:pilot02-verify; then exit 0; fi
            sleep 2
          done
          exit 1
