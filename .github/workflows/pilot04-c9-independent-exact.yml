name: PILOT-04 C9 independent exact-byte acceptance

on:
  push:
    branches:
      - tmp/pilot04-c9-independent-20260822
    paths:
      - 'artifacts/PILOT04_C8_00.part'
      - 'artifacts/PILOT04_C8_01.part'
      - 'artifacts/PILOT04_C9_00.part'
      - 'artifacts/PILOT04_C9_01.part'

permissions:
  contents: read
  actions: read

concurrency:
  group: pilot04-c9-independent-exact
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      EPD2_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      EPD2_LOCAL_CI_HOME: ${{ runner.temp }}/epd2-local-ci
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout independent verification branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up uv 0.10.0
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          enable-cache: true

      - name: Install PostgreSQL 16 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          python --version
          uv --version
          node --version
          psql --version
          PGPASSWORD=postgres psql "$EPD2_TEST_DATABASE_URL" -Atc 'SHOW server_version' | tee "$RUNNER_TEMP/postgres-server-version.txt"

      - name: Require and verify exact C8/C9 transport parts
        shell: bash
        run: |
          set -euo pipefail
          echo '5a7ac1f69dffcd5e785461fe02260664e5b9259af9857e6b9c463896a4d65bf8  artifacts/PILOT04_C8_00.part' | sha256sum -c -
          echo 'c5e5b2090fa3dd1b753264455665b5bb49ad743cd8272b697b27175ac0210845  artifacts/PILOT04_C8_01.part' | sha256sum -c -
          echo 'df56b22c7d522e10652f060d925662ce6e1b3fc47252cf2644c4175706fa1b73  artifacts/PILOT04_C9_00.part' | sha256sum -c -
          echo '27f3a7ae239ad9c3638ace3df6e3340dc263f4ea528ff10e17cbe715564b0d30  artifacts/PILOT04_C9_01.part' | sha256sum -c -

      - name: Restore exact C3-C7 and PILOT-03 archive bytes
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/pilot04-exact"
          D="$RUNNER_TEMP/pilot04-deltas"
          mkdir -p "$W" "$D"
          C3='EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C3.zip'
          C4='EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip'
          C5='EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C5.zip'
          C6='EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C6.zip'
          C7='EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C7.zip'
          P3='EPD2_PILOT03_ASSEMBLIES_MOTIONS_AND_COMMUNICATIONS_CANDIDATE_0.1_C3.zip'
          cat artifacts/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip.part00 artifacts/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip.part01 > "$W/$C4"
          echo '994f97c022e499b9847e8c36b48e04aa30b0da0b6e3b4741df13b8f1fcd083d1  '"$W/$C4" | sha256sum -c -
          unzip -q artifacts/PILOT04_C7_GITHUB_DELTA_BUNDLE.zip -d "$D"
          python scripts/tmp_apply_zip_sparse_patch.py "$W/$C4" "$D/c4_to_pilot04c3.zsp" "$W/$C3"
          python scripts/tmp_apply_zip_sparse_patch.py "$W/$C4" "$D/c4_to_pilot03c3.zsp" "$W/$P3"
          python scripts/tmp_apply_zip_sparse_patch.py "$W/$C4" "$D/c4_to_c5.zsp" "$W/$C5"
          python scripts/tmp_apply_zip_sparse_patch.py "$W/$C5" "$D/c5_to_c6.zsp" "$W/$C6"
          python scripts/tmp_apply_zip_sparse_patch.py "$W/$C6" "$D/c6_to_c7.zsp" "$W/$C7"
          cat > "$RUNNER_TEMP/predecessors.sha256" <<EOF
          7d9dc40c6b935d2ca899e9c53cc5a1cddef202bc69aa23994871dab1dfa5c1ff  $W/$C3
          994f97c022e499b9847e8c36b48e04aa30b0da0b6e3b4741df13b8f1fcd083d1  $W/$C4
          6d63b8a05e369960e4ef2f691cf4cfb44cf2eae37ffa7cab9fa95064e214b495  $W/$C5
          4899c29a004112d38a33fce51e4e637ceb0951b49a47de71bac5b850e8f31b84  $W/$C6
          812652950e996bd7c781512e4bbc03488c58eb74ca0c652c2b830056d76c1f1d  $W/$C7
          52b5bbfe312d90d65f500f0b6085d33ffe3235ce4bd90562110a26a8fae208d1  $W/$P3
          EOF
          sed -i 's/^          //' "$RUNNER_TEMP/predecessors.sha256"
          sha256sum -c "$RUNNER_TEMP/predecessors.sha256"
          echo "PILOT04_EXACT_DIR=$W" >> "$GITHUB_ENV"

      - name: Assemble and verify exact C8 and C9 bytes
        shell: bash
        run: |
          set -euo pipefail
          W="$PILOT04_EXACT_DIR"
          cat artifacts/PILOT04_C8_00.part artifacts/PILOT04_C8_01.part > "$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C8.zip"
          cat artifacts/PILOT04_C9_00.part artifacts/PILOT04_C9_01.part > "$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C9.zip"
          echo 'd3f7ab7c7fbf87591bf476f21a56b19148fdb400cd6454c12df2377f40938446  '"$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C8.zip" | sha256sum -c -
          echo '7fc4f3a5a982d11535006fcea8201ffb694546a01f5326eaed09fcf4ffc78664  '"$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C9.zip" | sha256sum -c -
          unzip -t "$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C9.zip" >/dev/null

      - name: Download frozen PB01 C6 exact candidate
        uses: actions/download-artifact@v4
        with:
          name: pb01-i10-c6-exact-candidate
          path: ${{ runner.temp }}/pb01-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: nepogoda1970-epd2/epd2-civic-os
          run-id: '32388797195'

      - name: Verify and normalize PB01 exact anchor
        shell: bash
        run: |
          set -euo pipefail
          W="$PILOT04_EXACT_DIR"
          PB='EPD2_VCRYPTO-PB01-I10_FINAL_CRYPTOGRAPHIC_PROFILE_FREEZE_AND_RELEASE_READINESS_DECISION_CANDIDATE_0.1_C6.zip'
          export PB_OUT="$W/$PB"
          python - <<'PY'
          import hashlib, os, shutil
          from pathlib import Path
          expected='442b83d9639a7398b3da767beb95976d379190229610d9b5ccb550d53d277d25'
          root=Path(os.environ['RUNNER_TEMP'])/'pb01-artifact'
          matches=[p for p in root.rglob('*') if p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest()==expected]
          if len(matches)!=1:
              raise SystemExit(f'expected exactly one PB01 exact candidate, found {matches}')
          shutil.copyfile(matches[0], Path(os.environ['PB_OUT']))
          PY
          echo '442b83d9639a7398b3da767beb95976d379190229610d9b5ccb550d53d277d25  '"$W/$PB" | sha256sum -c -

      - name: Materialize exact C9 and install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          W="$PILOT04_EXACT_DIR"
          T="$RUNNER_TEMP/c9-workspace"
          mkdir -p "$T"
          unzip -q "$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C9.zip" -d "$T"
          ROOT="$T/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C9"
          test -d "$ROOT"
          cd "$ROOT"
          uv sync --all-groups --frozen
          echo "C9_WORKSPACE=$ROOT" >> "$GITHUB_ENV"

      - name: Prepare independent verifier runtime
        shell: bash
        run: |
          set -euo pipefail
          cd "$C9_WORKSPACE"
          uv run python scripts/verifier_runtime.py --force --json | tee "$RUNNER_TEMP/verifier-runtime.json"
          VERIFIER="$EPD2_LOCAL_CI_HOME/verifier-runtime/bin/epd2-verify"
          test -x "$VERIFIER"
          echo "EPD2_INDEPENDENT_VERIFIER_EXECUTABLE=$VERIFIER" >> "$GITHUB_ENV"

      - name: Run authoritative C9 gate over exact bytes
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          W="$PILOT04_EXACT_DIR"
          cd "$C9_WORKSPACE"
          EVIDENCE="$RUNNER_TEMP/PILOT04_C9_GITHUB_AUTHORITATIVE_ACCEPTANCE.json"
          uv run python scripts/validate_pilot04_c9.py \
            --candidate "$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C9.zip" \
            --predecessor "$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C8.zip" \
            --base "$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C3.zip" \
            --historical "$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C4.zip" \
            --historical "$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C5.zip" \
            --historical "$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C6.zip" \
            --historical "$W/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C7.zip" \
            --anchor "$W/EPD2_PILOT03_ASSEMBLIES_MOTIONS_AND_COMMUNICATIONS_CANDIDATE_0.1_C3.zip" \
            --anchor "$W/EPD2_VCRYPTO-PB01-I10_FINAL_CRYPTOGRAPHIC_PROFILE_FREEZE_AND_RELEASE_READINESS_DECISION_CANDIDATE_0.1_C6.zip" \
            --run-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}" \
            --json "$EVIDENCE" 2>&1 | tee "$RUNNER_TEMP/PILOT04_C9_AUTHORITATIVE.log"
          echo "C9_EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"

      - name: Re-verify fresh current-run evidence
        shell: bash
        run: |
          set -euo pipefail
          cd "$C9_WORKSPACE"
          readarray -t V < <(python - "$C9_EVIDENCE" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          if d.get('status')!='PASS' or d.get('exit_code')!=0 or d.get('all_passed') is not True:
              raise SystemExit('evidence is not complete PASS')
          print(d['freshness']['nonce']); print(d['result_digest'])
          PY
          )
          uv run python scripts/validate_pilot04_c9.py --verify "$C9_EVIDENCE" --expect-nonce "${V[0]}" --expect-digest "${V[1]}" --require-github-authoritative --max-age 21600

      - name: Upload authoritative evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot04-c9-independent-authoritative-evidence
          path: |
            ${{ runner.temp }}/PILOT04_C9_GITHUB_AUTHORITATIVE_ACCEPTANCE.json
            ${{ runner.temp }}/PILOT04_C9_AUTHORITATIVE.log
            ${{ runner.temp }}/verifier-runtime.json
            ${{ runner.temp }}/postgres-server-version.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Upload exact C9 candidate on success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pilot04-c9-independent-exact-candidate
          path: ${{ env.PILOT04_EXACT_DIR }}/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C9.zip
          if-no-files-found: error
          retention-days: 90
