name: PB01-I09 C2 Validator Diagnostic v2

on:
  push:
    branches: [pilot02-verify]
    paths: ['.github/workflows/pb01-i09-c2-diagnostic-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose-i09-c2-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Exact Rust/Cargo 1.97.1
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          test "$(node --version)" = 'v24.19.0'
          test "$(rustc --version)" = 'rustc 1.97.1 (8bab26f4f 2026-07-14)'
          test "$(cargo --version)" = 'cargo 1.97.1 (c980f4866 2026-06-30)'
      - name: PostgreSQL 16
        run: |
          set -euo pipefail
          PG_BIN='/usr/lib/postgresql/16/bin'
          if [ ! -x "$PG_BIN/postgres" ]; then sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-client-16; fi
          "$PG_BIN/postgres" --version | grep 'PostgreSQL) 16\.'
          echo "EPD2_I09_PG_BIN=$PG_BIN" >> "$GITHUB_ENV"
      - name: Verify exact sealed C2 and unpack
        run: |
          set -euo pipefail
          ZIP='EPD2_VCRYPTO-PB01-I09_PRODUCTION_PILOT_ROBUSTNESS_CONCURRENCY_AND_SCALE_QUALIFICATION_CANDIDATE_0.1_C2.zip'
          EXPECTED='48fbddb686466208e4972908a3c213aa7021f4178d8bf71cc0b211f4af45ba53'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = "$EXPECTED"
          rm -rf /tmp/pb01-i09-c2-diag-v2 && mkdir -p /tmp/pb01-i09-c2-diag-v2
          unzip -q "$ZIP" -d /tmp/pb01-i09-c2-diag-v2
          mapfile -t ROOTS < <(find /tmp/pb01-i09-c2-diag-v2 -mindepth 1 -maxdepth 1 -type d)
          test "${#ROOTS[@]}" -eq 1
          ROOT="${ROOTS[0]}"
          echo "CANDIDATE_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "CANDIDATE_ZIP=$GITHUB_WORKSPACE/$ZIP" >> "$GITHUB_ENV"
          cd "$ROOT"
          sha256sum -c SHA256SUMS.txt
      - name: Diagnostic-only validator hotpatches
        run: |
          set -euo pipefail
          cd "$CANDIDATE_ROOT"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/i09_check_predecessor.mjs')
          s=p.read_text()
          old="'tests/security.test.mjs','SHA256SUMS.txt'"
          new="'tests/security.test.mjs','tests/i05_postgres_helpers.mjs','SHA256SUMS.txt'"
          if old not in s: raise SystemExit('CHECKER_PATTERN_NOT_FOUND')
          p.write_text(s.replace(old,new,1))

          p=Path('scripts/i09_verify_agreement.mjs')
          s=p.read_text()
          old="const ok=fields.every(k=>node[k]===go[k]&&node[k]===rust[k]);"
          new="const goRes=go.vector_results?.[0]??go;const rustRes=rust.vector_results?.[0]??rust;const ok=fields.every(k=>node[k]===goRes[k]&&node[k]===rustRes[k]);"
          if old not in s: raise SystemExit('AGREEMENT_PATTERN_NOT_FOUND')
          p.write_text(s.replace(old,new,1))
          PY
          node scripts/i09_check_predecessor.mjs
      - name: Locked Node dependencies
        run: |
          cd "$CANDIDATE_ROOT"
          npm ci --ignore-scripts
      - name: Full diagnostic validate:i09 after two harness-only hotpatches
        run: |
          set -o pipefail
          cd "$CANDIDATE_ROOT"
          I09_CANDIDATE_ZIP="$CANDIDATE_ZIP" EPD2_I09_PG_BIN="$EPD2_I09_PG_BIN" npm run validate:i09 2>&1 | tee "$GITHUB_WORKSPACE/i09-c2-diag-v2.log"
      - name: Materialize diagnostic v2 result
        if: always()
        run: |
          set +u
          RESULT="${CANDIDATE_ROOT:-}/evidence/results/i09/I09_FINAL_VALIDATION.json"
          {
            echo '# PB01-I09 C2 Diagnostic v2 After Two Harness-Only Hotpatches'
            echo
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- Source commit: $GITHUB_SHA"
            echo '- Exact sealed C2 SHA256: `48fbddb686466208e4972908a3c213aa7021f4178d8bf71cc0b211f4af45ba53`'
            echo '- Diagnostic hotpatch 1: add declared `tests/i05_postgres_helpers.mjs` to predecessor allow-list.'
            echo '- Diagnostic hotpatch 2: normalize Go/Rust single-result wrappers via `vector_results[0]` before governed-field agreement comparison.'
            echo '- This run cannot authorize Outcome A for C2.'
            if [ -f "$RESULT" ]; then
              cp "$RESULT" PB01_I09_C2_DIAGNOSTIC_V2_CURRENT_RUN.json
              echo
              echo '**Downstream diagnostic result: PASS — no further validate:i09 blocker after the two harness corrections.**'
              echo
              echo '```json'
              cat "$RESULT"
              echo '```'
            else
              echo
              echo '**Downstream diagnostic result: FAIL — an additional blocker remains.**'
              echo
              echo '```text'
              tail -n 500 "$GITHUB_WORKSPACE/i09-c2-diag-v2.log" 2>/dev/null || true
              echo '```'
            fi
          } > PB01_I09_C2_DIAGNOSTIC_V2_RESULT.md
      - name: Publish diagnostic v2 result
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PB01_I09_C2_DIAGNOSTIC_V2_RESULT.md
          [ ! -f PB01_I09_C2_DIAGNOSTIC_V2_CURRENT_RUN.json ] || git add PB01_I09_C2_DIAGNOSTIC_V2_CURRENT_RUN.json
          git diff --cached --quiet && exit 0
          git commit -m 'record PB01-I09 C2 validator diagnostic v2'
          for n in 1 2 3 4 5; do git fetch origin pilot02-verify; git rebase origin/pilot02-verify; git push origin HEAD:pilot02-verify && exit 0; sleep 2; done
          exit 1
