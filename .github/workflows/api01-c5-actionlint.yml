name: api01-c5-actionlint

on:
  push:
    branches: [main]
    paths: [.github/workflows/api01-c5-actionlint.yml]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/api01-c5-authoritative-run-20260826
      - name: Verify exact packaged workflow identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/api01-accept.yml)" = "123be8088812d772cb3c2ee138a56873934924cc"
          sha256sum .github/workflows/api01-accept.yml
      - name: actionlint packaged API-01 C5 workflow
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- 1.7.12
          ./actionlint -version
          ./actionlint -verbose .github/workflows/api01-accept.yml
