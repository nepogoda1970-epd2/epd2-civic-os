name: tmp-oss-open-core-v24

on:
  push:
    branches:
      - tmp/oss-open-core-v24

permissions:
  contents: write

jobs:
  apply-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/oss-open-core-v24
          fetch-depth: 0
      - name: Apply V24 governance
        run: python .github/tmp/apply_oss_v24.py
      - name: Verify intended scope
        shell: bash
        run: |
          test -f docs/governance/EPD2_OPEN_TRUST_CORE_COMMERCIAL_OPERATIONS_BOUNDARY_0.1.md
          grep -q 'FIR-OSS-007 — Open Trust Core & Commercial Operations Boundary' docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md
          grep -q 'Current Master maintenance level established by project governance work: \*\*V24\*\*' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          grep -q 'Documentation-only V24 governance update' docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md
          git diff --check
      - name: Commit governed files
        shell: bash
        run: |
          if git diff --quiet -- docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md docs/governance/EPD2_OPEN_TRUST_CORE_COMMERCIAL_OPERATIONS_BOUNDARY_0.1.md; then
            echo 'No governed changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md docs/roadmap/EPD2_PROGRAM_CONTROL_REGISTER.md docs/governance/EPD2_OPEN_TRUST_CORE_COMMERCIAL_OPERATIONS_BOUNDARY_0.1.md
          git commit -m 'governance: add open trust core commercial boundary'
          git push origin HEAD:tmp/oss-open-core-v24
