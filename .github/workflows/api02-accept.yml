# EPD² API-02 — authoritative acceptance workflow (C12).
#
# IR-C7-01. Every identity below is asserted equal to the governed lineage record by
# step 06a before any substantive validation begins, and the same assertion runs
# locally as gate 29, so this file and `scripts/api02/lineage_gates.py` cannot drift
# apart the way they did before this round, when C7 shipped a header, an `env:` block
# and an input description that had all still named C4.
#
# The run that judges a candidate is never the run that built it. This workflow
# verifies ONE sealed cumulative archive against THREE external anchors, all four
# obtained by exact filename and SHA-256 and verified BEFORE anything is read or
# extracted:
#
#   candidate                   EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C12.zip
#                               (expected digest = workflow input; must differ from every anchor)
#   API02_ACCEPTED_API01_ZIP    …API01…CANDIDATE_0.1_C5.zip  cea2fb0e…  (the sole acceptance
#                               predecessor: ACCEPTED / CLOSED by authoritative run 32967210855)
#   API02_ACCEPTED_DATA06_ZIP   EPD2_DATA_SERIES_CANONICAL_BASELINE_0.1_FINAL.zip  8cba0199…
#                               (the data-series baseline — API-01's predecessor, kept so the
#                               chain DATA-06 → API-01 → API-02 stays measurable end to end)
#   API02_ENTERING_CANDIDATE_ZIP       …API02…CANDIDATE_0.1_C11.zip  62da62bb…
#                               (the entering baseline of this correction round — NOT an
#                               acceptance predecessor: no API-02 candidate was ever accepted,
#                               and a correction round does not create one. It is here because
#                               this candidate claims to be a correction of exactly these bytes,
#                               and gate 3 verifies the correction record against them. API-01 C5
#                               carried its own entering anchor for the same reason.)
#
# What this workflow inherits from the API-01 C5 correction, and why. Authoritative
# run 32948753708 on the API-01 C4 bytes reached the complete validator and failed
# only on `no gate environment-blocked — 13`: browser provisioning was fail-open
# (`playwright install chromium >/dev/null 2>&1 || true`) and the executable was
# guessed from a `chromium-*/chrome-linux/chrome` layout Playwright 1.62.0 does not
# produce. Step 17 below carries that inherited API-01 C5 correction forward in full: the frozen
# Playwright version is read from the governed `package-lock.json`, that exact
# version is installed OUTSIDE the candidate tree, `playwright install chromium`
# runs with its failure NOT suppressed and its output NOT discarded, the executable
# is resolved mechanically by `chromium.executablePath()`, it is proven to exist, to
# be a regular file and to be executable, the canonical path is established and
# proven executable, the browser is actually RUN, and a machine-readable
# provisioning record is written into this run's evidence. Any of that failing
# fails the job immediately. Gate 18 is NOT weakened: a browser that is genuinely
# absent makes the gate NOT_RUN_ENVIRONMENT_BLOCKED, and an environment-blocked
# mandatory gate is not a PASS.
#
# There is no "overlay" mode and no "repository" mode: the candidate is the complete
# tree; the checked-out repository contributes only GITHUB_SHA as provenance and may
# never substitute a candidate file. Every gate (0-24) runs inside the freshly
# extracted candidate. The sealed-candidate accounting (Layer A exact C5 → this candidate
# transition inventory + Layer B sealed file manifest + SHA256SUMS.txt, evidence
# included) is verified against the tree AS EXTRACTED, before any evidence is
# regenerated. The evidence this run publishes is this run's own; the
# candidate-supplied evidence is set aside and labelled non-authoritative precheck
# material, never this run's result.
#
# Toolchain phases are separate and exact:
#   validator / suites   CPython 3.12.12 from the universal root uv.lock, frozen-synced
#                        into an environment OUTSIDE the tree (the accepted hygiene
#                        contract forbids a nested `.venv`)
#   gateway              CPython 3.13.7 from the same lock, separate environment
#   inherited regression uv 0.12.5, Node 22.16.0, npm 10.9.2, and PostgreSQL 16.15
#                        built from the upstream source tarball (server_version
#                        "16.15" exactly — distribution and container builds append a
#                        vendor suffix and are refused)
# A missing exact toolchain makes the corresponding gate NOT_RUN_ENVIRONMENT_BLOCKED
# and the workflow then fails. Nothing is substituted.
#
# A local validator run is evidence; only this workflow's PASS on the exact bytes is
# acceptance, and even then the candidate remains CANDIDATE_NOT_ACCEPTED until the
# register maintainer records the run.
#
# NOT PRODUCTION READY. NOT LEGALLY ACTIVATED. NOT SECURITY CERTIFIED.

name: api02-accept

on:
  push:
    branches:
      - tmp/api02-c12-canonical-accept
    paths:
      - 'handoff/API-02/C12_ACCEPTANCE_INPUTS.env'
  workflow_dispatch:
    inputs:
      candidate_sha256:
        description: expected SHA-256 of EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C12.zip
        required: true
      candidate_run_id:
        description: run id whose artifact `api02-candidate` carries the candidate ZIP (empty = candidates/ in the checkout)
        required: false
        default: ""
      anchors_run_id:
        description: run id whose artifact `api02-anchors` carries the three anchor ZIPs (empty = anchors/ in the checkout)
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: api02-accept-${{ github.ref }}
  cancel-in-progress: false

env:
  # IR-C7-01. These four lines are the acceptance path's statement of which bytes it is
  # judging. They are not the source of that fact — `scripts/api02/lineage_gates.py` is —
  # and step 06a refuses to continue if they disagree with it.
  CANDIDATE_ROLE: C12
  CANDIDATE_NAME: EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C12
  ENTERING_CANDIDATE_NAME: EPD2_API02_AUTHENTICATION_AND_AUTHORIZATION_RUNTIME_CANDIDATE_0.1_C11.zip
  ENTERING_CANDIDATE_SHA256: 62da62bbf3ea8a1d8352e5c39d6f2abcd5d8d8b1abc7d15d022e3e76232c0732
  API01_NAME: EPD2_API01_PRODUCTION_API_GATEWAY_AND_BFF_BOUNDARIES_CANDIDATE_0.1_C5.zip
  API01_SHA256: cea2fb0e23ee174e802ec1899cf62e570e5c8659a0f31c7e6c3c3955bffa3d27
  DATA06_NAME: EPD2_DATA_SERIES_CANONICAL_BASELINE_0.1_FINAL.zip
  DATA06_SHA256: 8cba01997e4943f6d3c2b3fc1fe11e2c3527cd6c39123171a827fb8e3669cbf1
  # the frozen browser contract of the governed root package-lock.json
  PLAYWRIGHT_VERSION: "1.62.0"
  CANONICAL_CHROMIUM: /opt/pw-browsers/chromium

jobs:
  accept:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      UV_FROZEN: "1"
      UV_NO_SYNC_PROGRESS: "1"
    steps:
      # ---------------------------------------------------------------- inputs --
      - name: "01 Check out repository (provenance only — GITHUB_SHA is recorded, nothing is read from it)"
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: "01a Resolve externally pinned exact-byte acceptance inputs"
        id: control
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            CANDIDATE_SHA='${{ inputs.candidate_sha256 }}'
            CANDIDATE_RUN='${{ inputs.candidate_run_id }}'
            ANCHORS_RUN='${{ inputs.anchors_run_id }}'
          else
            CONTROL='handoff/API-02/C12_ACCEPTANCE_INPUTS.env'
            test -f "$CONTROL" || { echo "::error::missing $CONTROL"; exit 1; }
            CANDIDATE_SHA="$(grep '^candidate_sha256=' "$CONTROL" | cut -d= -f2-)"
            CANDIDATE_RUN="$(grep '^candidate_run_id=' "$CONTROL" | cut -d= -f2-)"
            ANCHORS_RUN="$(grep '^anchors_run_id=' "$CONTROL" | cut -d= -f2-)"
          fi
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::invalid candidate_sha256"; exit 1; }
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ ]] || { echo "::error::invalid candidate_run_id"; exit 1; }
          [[ "$ANCHORS_RUN" =~ ^[0-9]+$ ]] || { echo "::error::invalid anchors_run_id"; exit 1; }
          echo "candidate_sha256=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "candidate_run_id=$CANDIDATE_RUN" >> "$GITHUB_OUTPUT"
          echo "anchors_run_id=$ANCHORS_RUN" >> "$GITHUB_OUTPUT"

      - name: "02 Obtain the exact API-02 candidate archive"
        if: ${{ steps.control.outputs.candidate_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: api02-candidate
          path: incoming/candidate
          run-id: ${{ steps.control.outputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: "03 Obtain the exact API-01 C5, DATA-06 and entering API-02 candidate anchor archives"
        if: ${{ steps.control.outputs.anchors_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: api02-anchors
          path: incoming/anchors
          run-id: ${{ steps.control.outputs.anchors_run_id }}
          github-token: ${{ github.token }}

      - name: "04 Locate inputs by exact filename and verify every digest BEFORE anything is read or extracted"
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          find_one() {  # $1 = filename, $2 = search roots
            local found; found="$(find $2 -type f -name "$1" 2>/dev/null | head -n 2)"
            [ "$(printf '%s\n' "$found" | grep -c .)" -eq 1 ] || { echo "::error::$1: expected exactly one file, found: $found"; exit 1; }
            printf '%s' "$found"
          }
          CAN