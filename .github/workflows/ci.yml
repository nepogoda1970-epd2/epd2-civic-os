name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  verify:
    name: Verify repository skeleton
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python dependencies (frozen — must match uv.lock exactly)
        run: uv sync --all-groups --frozen

      - name: Install Node dependencies (reproducible — must match package-lock.json exactly)
        run: npm ci

      - name: Fail if lock files were modified by install
        run: git diff --exit-code -- uv.lock package-lock.json

      - name: Repository structure check
        run: |
          uv run python scripts/check_repository.py
          uv run python scripts/check_forbidden_files.py
          uv run python scripts/verify_versions.py

      - name: Formatting check (Python)
        run: uv run ruff format --check .

      - name: Formatting check (Prettier)
        run: npm run format:check

      - name: Lint (Python)
        run: uv run ruff check .

      - name: Type check (collision-safe repository command)
        run: make typecheck

      - name: Python tests
        run: uv run pytest

      - name: Type check (TypeScript — epd2-types)
        run: npm run typecheck --workspace=packages/typescript/epd2-types

      - name: Type check (TypeScript — web-shell)
        run: npm run typecheck --workspace=frontend/web-shell

      - name: Lint (frontend)
        run: npm run lint --workspace=frontend/web-shell

      - name: TypeScript tests
        run: npm run test --workspace=packages/typescript/epd2-types

      - name: Frontend tests
        run: npm run test --workspace=frontend/web-shell

      - name: Frontend build
        run: npm run build --workspace=frontend/web-shell

      - name: Browser, accessibility, and visual regression tests
        run: npm run test:browser --workspace=frontend/web-shell

  pilot04-c9-exact:
    name: PILOT-04 C9 exact-byte authoritative acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      EPD2_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      EPD2_LOCAL_CI_HOME: ${{ runner.temp }}/epd2-local-ci
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node 24.19.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Set up uv 0.10.0
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.0'
          enable-cache: true
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
      - name: Download frozen PB01 I10 C6
        uses: actions/download-artifact@v4
        with:
          name: pb01-i10-c6-exact-candidate
          path: pb01
          github-token: ${{ github.token }}
          repository: nepogoda1970-epd2/epd2-civic-os
          run-id: '32388797195'
      - name: Run C9 exact-byte acceptance
        run: bash scripts/tmp_pilot04_c9_exact_accept.sh
      - name: Upload C9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot04-c9-ci-authoritative-evidence
          path: |
            PILOT04_C9_ACCEPTANCE_EVIDENCE.json
            PILOT04_C9_AUTHORITATIVE.log
          if-no-files-found: warn
          retention-days: 90
      - name: Upload exact accepted C9 candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pilot04-c9-ci-exact-accepted-candidate
          path: inputs/EPD2_PILOT04_NON_BINDING_DIGITAL_VOTE_PILOT_CANDIDATE_0.1_C9.zip
          if-no-files-found: error
          retention-days: 90

# This workflow does not deploy anything or publish packages.
