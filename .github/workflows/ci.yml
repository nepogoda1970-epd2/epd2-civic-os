name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository skeleton
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python dependencies (frozen — must match uv.lock exactly)
        run: uv sync --all-groups --frozen

      - name: Install Node dependencies (reproducible — must match package-lock.json exactly)
        run: npm ci

      - name: Fail if lock files were modified by install
        run: git diff --exit-code -- uv.lock package-lock.json

      - name: Repository structure check
        run: |
          uv run python scripts/check_repository.py
          uv run python scripts/check_forbidden_files.py
          uv run python scripts/verify_versions.py

      - name: Formatting check (Python)
        run: uv run ruff format --check .

      - name: Formatting check (Prettier)
        run: npm run format:check

      - name: Lint (Python)
        run: uv run ruff check .

      - name: Type check (collision-safe repository command)
        run: make typecheck

      - name: Python tests
        run: uv run pytest

      - name: Type check (TypeScript — epd2-types)
        run: npm run typecheck --workspace=packages/typescript/epd2-types

      - name: Type check (TypeScript — web-shell)
        run: npm run typecheck --workspace=frontend/web-shell

      - name: Lint (frontend)
        run: npm run lint --workspace=frontend/web-shell

      - name: TypeScript tests
        run: npm run test --workspace=packages/typescript/epd2-types

      - name: Frontend tests
        run: npm run test --workspace=frontend/web-shell

      - name: Frontend build
        run: npm run build --workspace=frontend/web-shell

      - name: Browser, accessibility, and visual regression tests
        run: npm run test:browser --workspace=frontend/web-shell

  i08-rust-bootstrap:
    name: PB01 I08 Rust locked offline bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize verifier source
        run: |
          mkdir -p i08-bootstrap/src
          base64 -d i08-bootstrap/main.rs.gz.b64 | gzip -d > i08-bootstrap/src/main.rs
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Generate exact lock and build
        working-directory: i08-bootstrap
        run: |
          rustc --version | tee rustc-version.txt
          cargo --version | tee cargo-version.txt
          cargo generate-lockfile
          cargo build --locked --release
          cargo test --locked
          cargo tree --locked > dependency-tree.txt
          cargo metadata --locked --format-version 1 > cargo-metadata.json
          sha256sum Cargo.lock target/release/epd2-i08-verifier-c > bootstrap-sha256.txt
      - name: Vendor closure and prove offline locked build
        working-directory: i08-bootstrap
        run: |
          mkdir -p .cargo
          cargo vendor --locked vendor > .cargo/config.toml
          rm -rf target
          cargo build --locked --release --offline
          cargo test --locked --offline
          sha256sum target/release/epd2-i08-verifier-c >> bootstrap-sha256.txt
      - name: Package evidence
        run: tar -C i08-bootstrap -czf i08-rust-bootstrap.tgz Cargo.lock rustc-version.txt cargo-version.txt dependency-tree.txt cargo-metadata.json bootstrap-sha256.txt .cargo vendor target/release/epd2-i08-verifier-c
      - uses: actions/upload-artifact@v4
        with:
          name: pb01-i08-rust-bootstrap
          path: i08-rust-bootstrap.tgz
          if-no-files-found: error

# This workflow does not use any repository secrets and does not deploy or publish.
