name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bsi-register:
    if: github.event_name == 'pull_request' && github.head_ref == 'governance/bsi-voting-readiness'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact BSI governance head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Append FIR-BSI-001 to exact current canonical Master
        shell: bash
        run: |
          set -euo pipefail
          python scripts/register_bsi_fir_once.py

      - name: Restore temporary workflows and validate final governed diff
        shell: bash
        run: |
          set -euo pipefail
          git show 9e86543c0c199cf1c56acb02f42fd348cf14200e:.github/workflows/ci.yml > .github/workflows/ci.yml
          git show 9e86543c0c199cf1c56acb02f42fd348cf14200e:.github/workflows/pilot04-c9-smoke.yml > .github/workflows/pilot04-c9-smoke.yml
          git diff --check
          test -f docs/roadmap/EPD2_BSI_MASTER_UPDATE_EVIDENCE.json
          test ! -e scripts/register_bsi_fir_once.py
          test ! -e .github/workflows/bsi-register-once.yml
          test "$(grep -c '^## FIR-BSI-001 — BSI CC PP-0121 Certification Readiness$' docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md)" = "1"
          grep -q 'FIR-OSS-007' docs/roadmap/EPD2_MASTER_FUTURE_IMPLEMENTATION_REGISTER.md
          git diff --quiet 9e86543c0c199cf1c56acb02f42fd348cf14200e -- .github/workflows/ci.yml
          git diff --quiet 9e86543c0c199cf1c56acb02f42fd348cf14200e -- .github/workflows/pilot04-c9-smoke.yml

      - name: Commit canonical BSI governance registration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "governance(bsi): register FIR-BSI-001 in canonical Master"
          git push origin HEAD:governance/bsi-voting-readiness

  verify:
    if: github.head_ref != 'governance/bsi-voting-readiness'
    name: Verify repository skeleton
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python dependencies (frozen — must match uv.lock exactly)
        run: uv sync --all-groups --frozen

      - name: Install Node dependencies (reproducible — must match package-lock.json exactly)
        run: npm ci

      - name: Fail if lock files were modified by install
        run: git diff --exit-code -- uv.lock package-lock.json

      - name: Repository structure check
        run: |
          uv run python scripts/check_repository.py
          uv run python scripts/check_forbidden_files.py
          uv run python scripts/verify_versions.py

      - name: Formatting check (Python)
        run: uv run ruff format --check .

      - name: Formatting check (Prettier)
        run: npm run format:check

      - name: Lint (Python)
        run: uv run ruff check .

      - name: Type check (collision-safe repository command)
        run: make typecheck

      - name: Python tests
        run: uv run pytest

      - name: Type check (TypeScript — epd2-types)
        run: npm run typecheck --workspace=packages/typescript/epd2-types

      - name: Type check (TypeScript — web-shell)
        run: npm run typecheck --workspace=frontend/web-shell

      - name: Lint (frontend)
        run: npm run lint --workspace=frontend/web-shell

      - name: TypeScript tests
        run: npm run test --workspace=packages/typescript/epd2-types

      - name: Frontend tests
        run: npm run test --workspace=frontend/web-shell

      - name: Frontend build
        run: npm run build --workspace=frontend/web-shell

      - name: Browser, accessibility, and visual regression tests
        run: npm run test:browser --workspace=frontend/web-shell

# This workflow does not use repository secrets or deploy anything.
# The BSI job above is a one-shot governance maintenance step on the dedicated branch;
# it restores this workflow and the temporary pilot workflow before committing.