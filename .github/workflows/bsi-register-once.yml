name: BSI register one-shot

on:
  push:

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register FIR-BSI-001
        run: python scripts/register_bsi_fir_once.py
      - name: Validate and commit
        run: |
          set -euo pipefail
          git diff --check
          test -f docs/roadmap/EPD2_BSI_MASTER_UPDATE_EVIDENCE.json
          test ! -e .github/workflows/bsi-register-once.yml
          test ! -e scripts/register_bsi_fir_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "governance(bsi): register FIR-BSI-001 in canonical Master"
          git push origin HEAD:governance/bsi-voting-readiness
