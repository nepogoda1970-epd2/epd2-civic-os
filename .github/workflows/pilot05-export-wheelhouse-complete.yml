name: PILOT-05 Export Complete Frozen Wheelhouse

on:
  push:
    branches:
      - tmp/pilot05-c3-authoritative-20260825
    paths:
      - '.github/workflows/pilot05-export-wheelhouse-complete.yml'

jobs:
  export-wheelhouse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact C3 locked third-party wheels
        run: |
          cat > /tmp/requirements.txt <<'REQ'
          annotated-doc==0.0.5
          annotated-types==0.7.0
          anyio==4.14.2
          argon2-cffi==25.1.0
          argon2-cffi-bindings==25.1.0
          attrs==26.1.0
          cffi==2.1.0
          cfgv==3.5.0
          click==8.4.2
          coverage==7.15.2
          cryptography==46.0.7
          distlib==0.4.3
          fastapi==0.141.1
          filelock==3.32.0
          h11==0.16.0
          hypothesis==6.160.0
          identify==2.6.19
          idna==3.18
          iniconfig==2.3.0
          jsonschema==4.26.0
          jsonschema-specifications==2025.9.1
          librt==0.13.0
          mypy==1.20.2
          mypy-extensions==1.1.0
          nodeenv==1.10.0
          packaging==26.2
          pathspec==1.1.1
          platformdirs==4.11.0
          pluggy==1.6.0
          pre-commit==3.8.0
          psycopg==3.3.4
          psycopg-binary==3.3.4
          psycopg-pool==3.3.1
          pycparser==3.0
          pydantic==2.13.4
          pydantic-core==2.46.4
          pygments==2.20.0
          pytest==8.4.2
          pytest-cov==5.0.0
          python-discovery==1.5.0
          pyyaml==6.0.3
          referencing==0.37.0
          rpds-py==2026.6.3
          ruff==0.15.22
          sortedcontainers==2.4.0
          starlette==1.6.0
          types-pyyaml==6.0.12.20260518
          typing-extensions==4.16.0
          typing-inspection==0.4.2
          uvicorn==0.52.3
          virtualenv==21.7.0
          REQ
          mkdir -p /tmp/wheelhouse
          python -m pip download --only-binary=:all: --dest /tmp/wheelhouse -r /tmp/requirements.txt
          (cd /tmp/wheelhouse && sha256sum *.whl > SHA256SUMS.txt)
          wc -l /tmp/wheelhouse/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pilot05-frozen-wheelhouse-complete
          path: /tmp/wheelhouse/
          if-no-files-found: error
          retention-days: 1
