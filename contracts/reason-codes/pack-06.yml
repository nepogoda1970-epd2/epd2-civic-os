# Centralized PACK-06 reason-code registry (ADR-024).
#
# This is the single source of truth for every `reason_code` string
# literal used in the one PACK-06 service's (ai-processing-service)
# `src/`. No PACK-06 service may use a free-text string in place of a
# registered code (canon section 24: "reason code не заменяется свободным
# текстом").
#
# This is a SEPARATE registry file from contracts/reason-codes/pack-02.yml
# through pack-05.yml (ADR-006 Option B precedent, extended by ADR-014,
# ADR-019, and now ADR-024, Option A): each pack's services have their
# own reason-code registry; codes that multiple packs need (e.g.
# PERMISSION_DENIED, VALIDATION_UNKNOWN_STATUS) are independently
# redeclared here rather than imported from an earlier pack's file.
#
# `source: canon` entries are the shared/generic canon section-24 codes
# this pack reuses verbatim. `source: pack-06-spec` entries are the
# fifteen codes docs/handover/PACK-06-SPEC.md section 14 originally
# proposed, carried forward unchanged by ADR-024. `source: pack-06-adr-024`
# entries are the seven additive codes ADR-024 introduced per the
# project owner's explicit instruction (ADR-022's reviewer-verification
# boundary, ADR-025's redaction/consequential-use/disclosure rules).
# `source: pack-06-service` entries are this service's own additive
# duplicate-conflict code, not named by ADR-024 itself but following the
# same additive pattern ADR-006/ADR-014/ADR-019/ADR-024 already
# established for every other pack's own services.
#
# Note on cross-pack reason-code interaction (ADR-022's own amendment):
# AI_REVIEWER_ROLE_INVALID and AI_REVIEWER_SCOPE_MISMATCH are the only
# codes ai-processing-service itself ever *raises* upon receiving
# authorized: false from governance-service's verify_role_assignment_for_
# action read - this pack never raises governance-service's own pack-05
# codes. review_ai_output does, however, read (never raise)
# verification.reason_code == "ROLE_ASSIGNMENT_SCOPE_MISMATCH" as a
# control-flow discriminator (choosing AIReviewerScopeMismatchError over
# the more generic AIReviewerRoleInvalidError), so that literal is
# registered below too - purely for this file's own completeness/
# documentation purpose (ADR-004), duplicated from governance-service's
# own pack-05.yml entry exactly as PERMISSION_DENIED already is.
#
# Loaded at runtime by `epd2_core.reason_codes.ReasonCodeRegistry`.
# Validated structurally and scanned for every `reason_code` literal used
# in ai-processing-service by `tests/contract/test_reason_codes_registry.py`.

- code: VALIDATION_UNKNOWN_STATUS
  meaning: An entity's status (or an equivalent closed-value field) does not match any known enum value.
  severity: error
  description: This value is not a recognized status.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: canon
- code: VALIDATION_FORBIDDEN_TRANSITION
  meaning: An attempted status transition is not permitted from the entity's current status.
  severity: error
  description: This status change is not allowed.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: canon
- code: VALIDATION_RECORD_NOT_FOUND
  meaning: No record exists for the given identifier.
  severity: error
  description: No record was found for the given identifier.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: canon
- code: PERMISSION_DENIED
  meaning: The acting party is not authorized to perform the requested action.
  severity: error
  description: You are not authorized to perform this action.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: canon
- code: AI_MODEL_UNAVAILABLE
  meaning: The configured model/provider could not be reached to process this request.
  severity: error
  description: The AI model is currently unavailable.
  retryable: true
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_PROCESSING_TIMEOUT
  meaning: The model call did not return a result within the configured timeout.
  severity: error
  description: AI processing timed out.
  retryable: true
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_OUTPUT_MALFORMED
  meaning: The model returned output that could not be parsed or validated into a usable structured result.
  severity: error
  description: The AI model returned malformed output.
  retryable: true
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_MODEL_VERSION_UNSUPPORTED
  meaning: The requested model_provider/model_name/model_version combination is not a supported deployment.
  severity: error
  description: This model version is not supported.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_CONFIDENCE_BELOW_THRESHOLD
  meaning: The provider's returned confidence_score is below the configured minimum threshold for this use class.
  severity: error
  description: The AI output's confidence score is too low to use.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_POLICY_CONFLICT
  meaning: The requested processing conflicts with a fixed policy rule (e.g. an external provider used for a self-hosted-only use class, or an unknown processing_region/data_retention_mode).
  severity: error
  description: This AI processing request conflicts with a policy rule.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_REDACTION_FAILURE
  meaning: The redaction/provenance validation step (RedactionManifest) reported result = fail.
  severity: error
  description: Redaction validation failed for this input.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_PROMPT_INJECTION_SUSPECTED
  meaning: The input or model output triggered a prompt-injection detection signal.
  severity: error
  description: A prompt-injection signal was detected.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_PROHIBITED_INPUT_DETECTED
  meaning: Input containing a category on the strict data boundary's forbidden list (identity, credential, vote content/linkability, unrestricted audit export, hidden reasoning) was detected.
  severity: error
  description: Prohibited input data was detected.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_HUMAN_REVIEWER_MISSING
  meaning: A consequential output is pending an outcome but no human reviewer has ever been assigned to it.
  severity: error
  description: No human reviewer has been assigned yet.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_HUMAN_REVIEW_REQUIRED
  meaning: A consequential action was attempted before human_review_status reached a terminal, human-driven outcome.
  severity: error
  description: Human review is required before this action.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_OUTPUT_REJECTED_BY_HUMAN
  meaning: An action was attempted against an AIProcessingRecord whose human_review_status is rejected.
  severity: error
  description: This AI output was rejected by human review.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_PROCESSING_RECORD_SUPERSEDED
  meaning: An action was attempted against an AIProcessingRecord that has already been superseded by a newer record.
  severity: error
  description: This AI processing record has already been superseded.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_AUTONOMOUS_ACTION_PROHIBITED
  meaning: A model provider or AI processing attempt implied autonomous mutation authority over a Civic OS entity - always rejected (defense-in-depth; the provider abstraction structurally cannot be given such authority).
  severity: error
  description: AI processing may never autonomously mutate another entity.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_TARGET_REFERENCE_MALFORMED
  meaning: purpose_code/target_type is not a recognized use class/target type, or their combination is not on the permitted allow-list.
  severity: error
  description: This purpose_code/target_type combination is not recognized.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-spec
- code: AI_REVIEWER_ROLE_INVALID
  meaning: governance-service's verify_role_assignment_for_action confirmed a RoleAssignment exists, but its role_code is not one of this pack's reviewer taxonomy, or not the specific role this purpose_code requires.
  severity: error
  description: This reviewer's role does not authorize this review.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-adr-024
- code: AI_REVIEWER_SCOPE_MISMATCH
  meaning: The reviewer's RoleAssignment.scope_id does not cover the review's subject_scope_id, or the RoleAssignment is not active at the time of review.
  severity: error
  description: This reviewer's role assignment does not cover this scope.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-adr-024
- code: AI_REVIEW_SELF_APPROVAL_PROHIBITED
  meaning: The reviewer is the same actor who submitted the underlying AI processing request, for a use requiring reviewer separation.
  severity: error
  description: A reviewer may not review their own submitted AI processing request.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-adr-024
- code: AI_REDACTION_MANIFEST_INVALID
  meaning: The RedactionManifest produced during input preparation fails its own structural validation.
  severity: error
  description: The redaction manifest for this input is invalid.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-adr-024
- code: AI_INPUT_PROVENANCE_UNVERIFIED
  meaning: Input classification or provenance cannot be established with sufficient confidence for the redaction step to run correctly.
  severity: error
  description: This input's provenance could not be verified.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-adr-024
- code: AI_PUBLIC_DISCLOSURE_REQUIRED
  meaning: An official or public artifact incorporating AI output is about to be marked complete, but the mandatory AI disclosure record has not yet been successfully recorded.
  severity: error
  description: A published AI disclosure record is required before this artifact can be finalized.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-adr-024
- code: AI_CONSEQUENTIAL_OUTPUT_NOT_REVIEWED
  meaning: A consequential AI output is about to be incorporated, published, or acted upon while human_review_status has not reached approved/approved_with_changes.
  severity: error
  description: This AI output has not completed the required human review.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-adr-024
- code: AI_PROCESSING_RECORD_DUPLICATE_CONFLICT
  meaning: A create call for an ai_processing_record_id that already exists with different content.
  severity: error
  description: This AI processing record already exists with different content.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-service
- code: AI_PROCESSING_RECORD_STATUS_CHANGED
  meaning: AuditEvent.reason_code classification for an AIProcessingRecord status transition (processing_status or human_review_status) that reaches a canonical event, or an audited-but-eventless transition (e.g. begin_processing).
  severity: info
  description: An AI processing record's status was changed.
  retryable: false
  owner: AI Processing Context (ai-processing-service)
  introduced_in_version: 0.6.0
  source: pack-06-service
- code: ROLE_ASSIGNMENT_SCOPE_MISMATCH
  meaning: An active RoleAssignment's scope_id does not cover the subject scope the requested action targets (and is not the GLOBAL_SCOPE_ID sentinel).
  severity: error
  description: This role assignment is not scoped to cover this action.
  retryable: false
  owner: Governance Context (governance-service)
  introduced_in_version: 0.5.0
  source: pack-05-governance-passthrough
