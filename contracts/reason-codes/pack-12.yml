    The hold state relevant to this record could not be established. The
    operation is refused rather than assumed unheld (required invariant
    15).
  severity: error
  description: Legal Hold state could not be determined; the operation was refused.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0

- code: OPTIMISTIC_CONCURRENCY_CONFLICT
  meaning: >-
    The caller-supplied expected_version does not match the stored
    record's current version; the record changed since it was read.
  severity: error
  description: This record changed since you read it; re-read and retry.
  retryable: true
  owner: compliance-service
  introduced_in_version: 0.9.0

- code: ORGANIZATION_SCOPE_MISMATCH
  meaning: >-
    The supplied OrganizationalScope does not match the scope actually
    required for the requested operation (scope_type and/or
    scope_reference differ).
  severity: error
  description: The organizational scope provided does not match what is required for this action.
  retryable: false
  owner: organization-service
  introduced_in_version: 0.8.0

- code: ORGANIZATION_SCOPE_UNDETERMINED
  meaning: >-
    The requesting context carried no resolvable organizational scope,
    or an entity was submitted without one. The operation is refused
    rather than defaulted to any organization (required invariant 15).
  severity: error
  description: The organizational scope of this request could not be determined.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0

- code: PERMISSION_DENIED
  meaning: >-
    The requesting actor is not authorized to perform the requested
    command, in any bounded context.
  severity: error
  description: You do not have permission to perform this action.
  retryable: false
  owner: shared (all bounded contexts)
  introduced_in_version: 0.1.0

- code: PRIVILEGE_ACCESS_ACTIVATION_RECORDED
  meaning: >-
    An approved grant was activated after re-checking every dimension
    approval established: separation of duties, effective authority,
    organization scope, purpose, requested operation, validity period,
    revocation state and policy version.
  severity: info
  description: A privileged access grant was activated.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_ACCESS_APPROVAL_RECORDED
  meaning: >-
    A privileged access request was approved and the grant it authorises
    was minted. The approver set excludes the requester, the acting
    approver is not the requester, and the approver's real role set was
    re-checked against the incompatibility matrix at the moment of the
    act.
  severity: info
  description: A privileged access request was approved.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_ACCESS_DENIAL_RECORDED
  meaning: >-
    A privileged access request was refused as a governed decision. The
    grant aggregate is created in the denied state so the refusal has a
    durable, reviewable subject: a request refused with no record is a
    request nobody can show was considered.
  severity: info
  description: A privileged access request was denied.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_ACCESS_EXPIRY_RECORDED
  meaning: >-
    A grant was expired as a recorded act rather than by the mere
    absence of a renewal. A grant that simply stops working leaves
    nothing to review.
  severity: info
  description: A privileged access grant expired.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_ACCESS_REQUEST_RECORDED
  meaning: >-
    A request for privileged access was recorded with its nine mandatory
    attributes. A request is not access: it is the governed act of
    asking, and it is audited so that a request nobody granted is still
    a request somebody made.
  severity: info
  description: A privileged access request was recorded.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_ACCESS_REVIEW_RECORDED
  meaning: >-
    The outcome of a grant review was recorded by a reviewer who is
    neither the grant's subject nor one of its approvers. A review by a
    party to the decision under review is not a review.
  severity: info
  description: A privileged access review was completed.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_ACCESS_REVIEW_REQUEST_RECORDED
  meaning: >-
    A periodic or post-access review of a grant was opened. A post-
    access review moves the grant under review; a periodic review does
    not, because a grant under periodic review is still a live grant.
  severity: info
  description: A privileged access review was requested.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_ACCESS_REVOCATION_RECORDED
  meaning: >-
    A grant was revoked with immediate effect. Revocation is not
    deletion: the grant, its history and every session it authorised
    remain, and what stops is the authority to act.
  severity: info
  description: A privileged access grant was revoked.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_APPROVER_COUNT_INSUFFICIENT
  meaning: >-
    Fewer approvers than the risk class requires.
  severity: error
  description: Fewer approvers than the risk class requires.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_ASSIGNMENT_NOT_EFFECTIVE_DATED
  meaning: >-
    An operational assignment lacks scope, purpose or effective dating
    (`P12-ROLE-018`).
  severity: error
  description: An operational assignment lacks scope, purpose or effective dating (`P12-ROLE-018`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_ASSIGNMENT_NOT_GOVERNED
  meaning: >-
    An operational assignment was asserted without governed authority
    (`P12-ROLE-017`).
  severity: error
  description: An operational assignment was asserted without governed authority (`P12-ROLE-017`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_AUDIT_MUTATION_PROHIBITED
  meaning: >-
    An attempt to modify or delete an audit record under custody
    (`P12-ROLE-006`).
  severity: error
  description: An attempt to modify or delete an audit record under custody (`P12-ROLE-006`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_AUTHORITY_MISSING
  meaning: >-
    No active, scope-matching privileged authority exists for this
    operation (`P12-PAM-002`).
  severity: error
  description: No active, scope-matching privileged authority exists for this operation (`P12-PAM-002`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_ACTIVATION_RECORDED
  meaning: >-
    Approved emergency access was activated. Activation and notification
    are one act: an activation whose notification failed is escalated
    rather than completed.
  severity: info
  description: Break-glass access was activated.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_APPROVAL_RECORDED
  meaning: >-
    The second control on emergency access was exercised by an approver
    who is not the activator, and who holds a role structurally
    incompatible with the most likely activator's.
  severity: info
  description: Break-glass access was approved.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_CONDITION_ABSENT
  meaning: >-
    No documented emergency condition (`P12-BG-002`).
  severity: error
  description: No documented emergency condition (`P12-BG-002`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_DUAL_CONTROL_MISSING
  meaning: >-
    Activator and approver are the same, or the approver is absent
    (`P12-BG-003`).
  severity: error
  description: Activator and approver are the same, or the approver is absent (`P12-BG-003`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_EXPIRY_RECORDED
  meaning: >-
    Emergency access expired. There is no renewal path from here: a
    continued emergency needs a new activation, a new approval and a new
    notification.
  severity: info
  description: Break-glass access expired.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_NOTIFICATION_RECORDED
  meaning: >-
    An out-of-band notification of a break-glass activation was
    dispatched. The event is emitted whether the dispatch succeeded or
    failed, and carries the failure reason when it failed, because a
    failed notification is a governed fact rather than an absence.
  severity: info
  description: A break-glass notification was dispatched.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_NOTIFICATION_UNDELIVERED
  meaning: >-
    Out-of-band notification could not be dispatched. The activation
    escalates and never silently completes (`P12-BG-008`).
  severity: error
  description: Out-of-band notification could not be dispatched.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_RENEWAL_REQUIRES_DECISION
  meaning: >-
    Extension was attempted in place of a new dual-controlled decision
    (`P12-BG-013`).
  severity: error
  description: Extension was attempted in place of a new dual-controlled decision (`P12-BG-013`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_REQUEST_RECORDED
  meaning: >-
    Emergency access was requested against a documented emergency
    condition. Without a condition reference there is nothing to review
    afterwards, which is why the condition is mandatory.
  severity: info
  description: Break-glass access was requested.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_REVIEW_RECORDED
  meaning: >-
    The independent post-hoc review of an emergency activation was
    completed by a reviewer who is neither the activator nor the
    approver.
  severity: info
  description: A break-glass independent review was completed.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_REVOCATION_RECORDED
  meaning: >-
    Emergency access was withdrawn before its window closed.
  severity: info
  description: Break-glass access was revoked.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_BREAK_GLASS_SCOPE_TOO_BROAD
  meaning: >-
    The requested emergency scope exceeds the narrow-scope requirement
    (`P12-BG-004`).
  severity: error
  description: The requested emergency scope exceeds the narrow-scope requirement (`P12-BG-004`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_GRANT_DORMANT
  meaning: >-
    The grant is unused past the dormancy interval and requires review
    before further use (`P12-PAM-009`).
  severity: error
  description: The grant is unused past the dormancy interval and requires review before further use (`P12-PAM-009`).
  retryable: true
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_GRANT_EXPIRED
  meaning: >-
    The grant's end instant has passed (`P12-PAM-006`).
  severity: error
  description: "The grant's end instant has passed (`P12-PAM-006`)."
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_GRANT_NOT_ACTIVATED
  meaning: >-
    The grant is approved but not yet activated.
  severity: error
  description: The grant is approved but not yet activated.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_GRANT_REVOKED
  meaning: >-
    The grant was withdrawn before expiry (`P12-PAM-007`).
  severity: error
  description: The grant was withdrawn before expiry (`P12-PAM-007`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_IDEMPOTENCY_CONFLICT
  meaning: >-
    The same `event_id` was presented for a different request.
  severity: error
  description: The same `event_id` was presented for a different request.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_INSTITUTIONAL_AUTHORITY_NOT_EXTENDABLE
  meaning: >-
    An operational assignment was used to claim institutional authority
    (`P12-ROLE-019`).
  severity: error
  description: An operational assignment was used to claim institutional authority (`P12-ROLE-019`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_INSUFFICIENT_APPROVER
  meaning: >-
    The presented approver lacks the role the risk class requires.
  severity: error
  description: The presented approver lacks the role the risk class requires.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_JUSTIFICATION_MISSING
  meaning: >-
    No written justification was supplied (`P12-PAM-001`).
  severity: error
  description: No written justification was supplied (`P12-PAM-001`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_OPERATION_NOT_GRANTED
  meaning: >-
    The operation is outside the grant's operation set.
  severity: error
  description: "The operation is outside the grant's operation set."
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_ORGANIZATION_MISMATCH
  meaning: >-
    The grant belongs to a different organization (`P12-ORG-004`).
  severity: error
  description: The grant belongs to a different organization (`P12-ORG-004`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_PURPOSE_MISMATCH
  meaning: >-
    The operation does not serve the grant's declared purpose.
  severity: error
  description: "The operation does not serve the grant's declared purpose."
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_RISK_CLASSIFICATION_UNDETERMINED
  meaning: >-
    The risk class could not be determined; fail closed.
  severity: error
  description: The risk class could not be determined; fail closed.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_ROLE_COMBINATION_PROHIBITED
  meaning: >-
    The subject holds a pair the incompatibility matrix forbids, or a
    composition of assignments would yield an institutional authority
    the subject does not hold (`P12-ROLE-012`, `P12-ROLE-021`).
  severity: error
  description: The subject holds a pair the incompatibility matrix forbids, or a composition of assignments would yield an institutional authority the subject does not hold (`P12-ROLE-012`, `P12-ROLE-021`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_SCOPE_MISMATCH
  meaning: >-
    The requested resource lies outside the grant's resource scope.
  severity: error
  description: "The requested resource lies outside the grant's resource scope."
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_SELF_APPROVAL_PROHIBITED
  meaning: >-
    Requester and approver are the same subject (`P12-PAM-004`).
  severity: error
  description: Requester and approver are the same subject (`P12-PAM-004`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_SEPARATION_OF_DUTIES_CONFLICT
  meaning: >-
    The act would place two separated duties with one subject.
  severity: error
  description: The act would place two separated duties with one subject.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_SESSION_END_RECORDED
  meaning: >-
    A privileged session was closed. The record stops accumulating;
    nothing is removed.
  severity: info
  description: A privileged session ended.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_SESSION_EVIDENCE_INCOMPLETE
  meaning: >-
    A session cannot be sealed because required evidence fields are
    missing (`P12-SES-001`).
  severity: error
  description: A session cannot be sealed because required evidence fields are missing (`P12-SES-001`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_SESSION_EVIDENCE_SEALED_RECORDED
  meaning: >-
    An ended session was sealed into the tamper-evident chain and linked
    to a PACK-11 evidence bundle. Tamper *evident*, precisely: the hash
    chain makes alteration detectable and nothing here prevents it.
  severity: info
  description: Privileged session evidence was sealed.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_SESSION_SECRET_FORBIDDEN
  meaning: >-
    Session evidence, or an event payload, carried a secret, a
    credential or a full sensitive payload (`P12-SES-002`).
  severity: error
  description: Session evidence, or an event payload, carried a secret, a credential or a full sensitive payload (`P12-SES-002`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_SESSION_START_RECORDED
  meaning: >-
    A privileged session was opened under an activated grant, after the
    grant was re-checked in full at the moment of the act. A grant
    activated an hour ago is not a grant that is usable now.
  severity: info
  description: A privileged session was started.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PRIVILEGE_STANDING_ACCESS_PROHIBITED
  meaning: >-
    A permanent, unbounded grant was requested (`P12-PAM-003`).
  severity: error
  description: A permanent, unbounded grant was requested (`P12-PAM-003`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: PUBLICATION_NOT_ALLOWED
  meaning: >-
    No active DisclosurePolicy exists for the relevant subject type at
    the moment a publish command is attempted (fail-closed, INV-10).
  severity: error
  description: Publication is not currently allowed for this content.
  retryable: true
  owner: Transparency Context (transparency-service)
  introduced_in_version: 0.3.0

- code: RECORD_UNDER_LEGAL_HOLD
  meaning: >-
    At least one active Legal Hold applies to this record, so every
    destructive disposition is refused regardless of retention state
    (required invariant 3).
  severity: error
  description: An active Legal Hold protects this record.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0

- code: SEARCH_BALLOT_CONTENT_PROHIBITED
  meaning: >-
    Ballot-level material may never be indexed or searched
    (`P12-VOTE-001`, `P12-HCD-003`). An occurrence is an incident, not a
    routine denial.
  severity: error
  description: Ballot-level material may never be indexed or searched (`P12-VOTE-001`, `P12-HCD-003`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_CACHE_CONTEXT_MISMATCH
  meaning: >-
    A cache entry did not match the effective authorization context
    (`P12-SRCH-009`).
  severity: error
  description: A cache entry did not match the effective authorization context (`P12-SRCH-009`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_HIGHLY_CONFIDENTIAL_DOMAIN_EXCLUDED
  meaning: >-
    The target domain is excluded from the index by policy
    (`P12-HCD-001`).
  severity: error
  description: The target domain is excluded from the index by policy (`P12-HCD-001`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_INDEX_AUTHORIZATION_STALE
  meaning: >-
    The index view could not be reconciled with current source
    authorization (`P12-SRCH-005`).
  severity: error
  description: The index view could not be reconciled with current source authorization (`P12-SRCH-005`).
  retryable: true
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_INDEX_POLICY_CHANGE_RECORDED
  meaning: >-
    The index policy changed. Index policy is security policy: what
    enters the index decides what a query can ever reach, so the
    previous version is recorded and a widening is visible as a diff
    rather than as a state.
  severity: info
  description: The search index policy was changed.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_INDEX_POLICY_VIOLATION
  meaning: >-
    An indexing attempt violates `IndexPolicy` or `IndexFieldPolicy`.
  severity: error
  description: An indexing attempt violates `IndexPolicy` or `IndexFieldPolicy`.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_INDEX_REINDEX_REQUEST_RECORDED
  meaning: >-
    An index rebuild under the current policy was requested. A reindex
    can only narrow what a stale index exposes; the widening decision
    belongs to the policy change and is audited there.
  severity: info
  description: A search index rebuild was requested.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_INDEX_REMOVAL_RECORDED
  meaning: >-
    A record left the index, with evidence naming the source decision it
    followed. Removal from the index is not deletion of the record:
    retention and erasure remain PACK-09's and document disposition
    remains PACK-11's.
  severity: info
  description: "A record's removal from the index was evidenced."
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_MODE_NOT_PERMITTED
  meaning: >-
    The requested search mode is not available to this subject.
  severity: error
  description: The requested search mode is not available to this subject.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_ORGANIZATION_MISMATCH
  meaning: >-
    The query reaches outside the requester's organizational scope.
  severity: error
  description: "The query reaches outside the requester's organizational scope."
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_PURPOSE_MISMATCH
  meaning: >-
    The declared purpose does not admit this query (`P12-SRCH-011`).
  severity: error
  description: The declared purpose does not admit this query (`P12-SRCH-011`).
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_QUERY_AUTHORIZATION_RECORDED
  meaning: >-
    A query passed admission: scope, mode, purpose, the grant its
    purpose required where one is required, and the excluded-domain
    check.
  severity: info
  description: A search query was authorized.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_QUERY_DENIAL_RECORDED
  meaning: >-
    A query was refused at admission and the refusal was recorded before
    being re-raised. The command does not swallow a refusal to keep the
    audit tidy.
  severity: info
  description: A search query was denied.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_QUERY_EXECUTION_RECORDED
  meaning: >-
    A query was executed and its result set recorded as an authorized
    count plus a suppression band. A band rather than an exact count,
    because an exact suppression count is itself a disclosure of how
    many restricted records matched.
  severity: info
  description: A search query was executed.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_QUERY_SUBMISSION_RECORDED
  meaning: >-
    A query was submitted. The record carries a digest of the query,
    never the query string: a query can itself contain personal data.
  severity: info
  description: A search query was submitted.
  retryable: false
  owner: privileged-access-service
  introduced_in_version: 0.12.0

- code: SEARCH_RESULT_SUPPRESSED
  meaning: >-
    A query returned fewer results than it matched. Recorded as a band
    with no reference to what was withheld: the identity of a suppressed
    result is the thing suppression exists to protect.
  severity: info
  description: A search result was suppressed.
  retryable: false
  owner: privileged-access-service
