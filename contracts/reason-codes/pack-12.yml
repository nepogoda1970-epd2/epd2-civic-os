# Centralized PACK-12 reason-code registry (Privileged Administration,
# Authorization-Aware Search & Governed Data Export; FIR-ROADMAP-002;
# ADR-061 through ADR-068).
#
# This is the single source of truth for every `reason_code` string
# literal introduced or used by the PACK-12 implementation candidate: the
# codes `privileged-access-service` raises for the privileged-access grant
# lifecycle, the governed break-glass workflow, tamper-evident privileged
# sessions, authorization-aware search, index policy, governed data export,
# DLP assessment and transforms, and statistical disclosure control - plus
# the additive codes it uses for its own audit bookkeeping, following the
# same pattern ADR-004/ADR-014/ADR-019/ADR-024/ADR-055 and PACK-07's
# through PACK-11's own registries already established. No PACK-12 code
# path may use a free-text string in place of a registered code, and no
# PACK-12 code path uses a generic `FORBIDDEN`.
#
# This is a SEPARATE registry file from contracts/reason-codes/pack-02.yml
# through pack-11.yml (ADR-006 Option B precedent): codes several packs
# need (PERMISSION_DENIED, VALIDATION_RECORD_NOT_FOUND,
# ORGANIZATION_SCOPE_MISMATCH) are independently redeclared here rather
# than imported from an earlier pack's file, so this file stays a
# complete, standalone source of truth for `privileged-access-service`'s
# own scan (`tests/contract/test_reason_codes_registry.py`'s
# PACK12_SERVICE_DIRS). `privileged-access-service` is a single, wholly new
# service - no existing PACK-02-through-PACK-11 service is extended in
# place this round - so, like PACK-08's through PACK-11's files, there is
# no "shared with an earlier pack's service directory" union needed.
#
# **There are no `source: canon-0.8.0` entries in this file.** Canon
# section 24 registers no privileged-administration, search or export code
# at all: canon 19e assigns the privileged-access context but the canon
# round that would give it its own section never happened. `CANON_VERSION`
# stays `0.8.0` here - this round amends no canon, it implements a context
# canon already assigned - so every PRIVILEGE_*, SEARCH_*, EXPORT_* and
# DISCLOSURE_* code below is an additive `source: pack-12-service` code
# justified in ADR-061, and each one says in its own `meaning` what it
# refuses and why no existing code expresses it.
#
# The 141 entries fall into three groups. Ninety-eight are refusals raised
# by `epd2_privileged_access_service.exceptions`. Forty-three are
# `AuditEvent.reason_code` classifications for successfully-audited acts -
# canon's section-24 list is refusal-only and contains no code that means
# "this succeeded", which is the same gap ADR-004 recorded for PACK-02.
# Thirteen of the ninety-eight are pre-existing generic codes reused
# verbatim from an earlier pack (marked in their `owner`), because PACK-12
# deliberately reuses rather than shadowing: retention and legal hold
# remain PACK-09's, organizational scope and authority remain PACK-08's,
# and publication and disclosure control remain PACK-04's. A
# PRIVILEGE_-prefixed duplicate of any of them would create two codes for
# one fact and let the two drift apart.
#
# Every entry carries the seven fields
# `epd2_core.reason_codes.ReasonCodeRegistry.load_from_yaml` requires
# (code, meaning, severity, description, retryable, owner,
# introduced_in_version); a missing field makes the whole registry fail to
# load.

- code: AUTHORITY_ROLE_INCOMPATIBLE
  meaning: >-
    The candidate role_code conflicts with an existing active role_code
    already held by the same assigned_subject_reference in the same
    OrganizationalScope, per the role incompatibility baseline (canon
    19e.16, PAIRWISE_INCOMPATIBLE_ROLES).
  severity: error
  description: This role cannot be combined with a role you already hold in this scope.
  retryable: false
  owner: organization-service
  introduced_in_version: 0.8.0

- code: CROSS_SCOPE_ACCESS_DENIED
  meaning: >-
    A regional-scope-authorization check (canon 19e.12) evaluated all
    six access modes (exact/ancestor/descendant/delegated-cross-scope/
    temporary-supervision/institutional-oversight-without-data-access)
    and found no grant covering the requested (actor_scope,
    target_scope, action_code) triple - the engine's default is deny.
  severity: error
  description: You are not authorized to access this organizational scope.
  retryable: false
  owner: organization-service
  introduced_in_version: 0.8.0

