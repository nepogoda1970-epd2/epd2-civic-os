- code: COMPLIANCE_GOVERNED_RECORD_STATUS_CHANGED
  meaning: >-
    AuditEvent classification for a successful governed-record action:
    retention start recorded, disposal authorized, or destruction
    executed.
  severity: info
  description: Governed record status changed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: COMPLIANCE_LEGAL_HOLD_STATUS_CHANGED
  meaning: >-
    AuditEvent classification for a successful Legal Hold action: issued
    or released.
  severity: info
  description: Legal Hold status changed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: COMPLIANCE_PROCESSING_REGISTRY_STATUS_CHANGED
  meaning: >-
    AuditEvent classification for a successful Data Catalog or
    Processing Registry action.
  severity: info
  description: Processing registry entry status changed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: COMPLIANCE_PROCEDURAL_CASE_STATUS_CHANGED
  meaning: >-
    AuditEvent classification for a successful governed-case action:
    opened, role assigned, decision recorded, or status transitioned.
  severity: info
  description: Procedural case status changed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: COMPLIANCE_PROCEDURAL_DEADLINE_STATE_CHANGED
  meaning: >-
    AuditEvent classification for a successful deadline action: started,
    suspended, resumed, extended, completed, escalated, expired or
    superseded.
  severity: info
  description: Procedural deadline state changed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: COMPLIANCE_DATA_SUBJECT_REQUEST_STATUS_CHANGED
  meaning: >-
    AuditEvent classification for a successful data-subject or legal
    request action.
  severity: info
  description: Data-subject request status changed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

# --- Generic PACK-02 codes reused verbatim by compliance-service -------

- code: PERMISSION_DENIED
  meaning: >-
    The actor is not authorized to perform this operation. Reused
    verbatim from pack-02.yml rather than given a PACK-09 synonym.
  severity: error
  description: You are not authorized to perform this action.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-02-reused

- code: VALIDATION_RECORD_NOT_FOUND
  meaning: >-
    The referenced record does not exist for this caller. Deliberately
    identical for "no such record anywhere" and "the record exists but
    belongs to another organization and no cross-scope authority was
    presented", so a foreign resource id discloses nothing beyond this
    safe error.
  severity: error
  description: The referenced record was not found.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-02-reused

# ---------------------------------------------------------------------------
# Architecture & Domain Framework 0.8.1 additions (same 0.9.0 round).
#
# The refusal codes below make the Framework's own hard invariants
# answerable at runtime: each one names a specific structural refusal
# rather than a generic validation failure, so a denial can be audited,
# reported to a party, and distinguished from every neighbouring denial.
# ---------------------------------------------------------------------------

- code: JURISDICTION_MISSING
  meaning: >-
    A case was asked to enter a substantive status - substantive
    review, hearing or decided - while no jurisdiction determination is
    bound to it. Framework hard invariant 52: no consequential outcome
    without a competent authority. Refused rather than defaulted.
  severity: error
  description: This case has no confirmed jurisdiction.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: JURISDICTION_NOT_COMPETENT
  meaning: >-
    The bound jurisdiction determination exists but does not permit a
    substantive decision at this instant: it is challenged, declined,
    transferred, or outside its own validity window. A contested
    competence does not keep producing binding outcomes while the
    challenge is pending.
  severity: error
  description: The determined authority is not competent to decide this matter now.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: JURISDICTION_TRANSFER_REQUIRED
  meaning: >-
    A transfer was attempted without a successor determination that
    names the determination it supersedes. Competence is never left
    dangling: the outgoing determination must point at a specific
    successor.
  severity: error
  description: A jurisdiction transfer requires a successor determination.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: JURISDICTION_SCOPE_MISMATCH
  meaning: >-
    A jurisdiction determination was submitted for a different case, a
    different organization or a different case kind than the case it
    was to be bound to. Scope is compared, never coerced.
  severity: error
  description: The jurisdiction determination does not match this case.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: REPRESENTATION_INVALID
  meaning: >-
    A representative acted without a mandate linking them to the
    represented party on this case, or the mandate does not grant the
    specific authority the act requires. Framework hard invariant 15: a
    role name is not proof of authority.
  severity: error
  description: No valid representation mandate covers this act.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: REPRESENTATION_EXPIRED
  meaning: >-
    The mandate exists but the act falls outside its validity window.
    Acts inside the window stay valid; only this act is refused.
  severity: error
  description: The representation mandate was not in force at that time.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: REPRESENTATION_REVOKED
  meaning: >-
    The mandate was revoked before the act. Revocation is
    forward-looking: filings already accepted under the mandate remain
    valid and are not rewritten.
  severity: error
  description: The representation mandate has been revoked.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: FILING_INADMISSIBLE
  meaning: >-
    A filing was refused at intake. It stays on the docket at its
    original sequence in rejected state with this code; it is never
    removed, because 'this was filed and refused' is itself part of the
    record.
  severity: error
  description: This filing is not admissible.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: FILING_SEQUENCE_CONFLICT
  meaning: >-
    A filing claimed a docket position that is not the next one, tried
    to supersede itself, or tried to be superseded by a filing at an
    earlier position. The docket is append-only and strictly ordered; a
    conflicting sequence is refused rather than silently corrected.
  severity: error
  description: The docket position for this filing is not available.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: HEARING_TRANSITION_INVALID
  meaning: >-
    A hearing transition was requested that its current status does not
    permit - for example completing a cancelled hearing. Hearing status
    is derived from an append-only history, so an invalid transition
    cannot be written and then re-derived away.
  severity: error
  description: This hearing cannot make that transition.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: INTERIM_MEASURE_AUTHORITY_DENIED
  meaning: >-
    A granted interim measure was constructed without a human deciding
    authority, without an end or review date, or without a reasons
    reference. Framework hard invariant 69: AI decides no consequential
    legal outcomes; an indefinite unreasoned measure is not
    expressible.
  severity: error
  description: This interim measure cannot be granted as specified.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DECISION_NOT_EFFECTIVE
  meaning: >-
    An operation required the decision to be in legal effect and it is
    not - it has not commenced, or its effect is suspended. Effect,
    finality and enforceability are three separate facts and none is
    derived from another.
  severity: error
  description: This decision is not in effect.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DECISION_NOT_FINAL
  meaning: >-
    An operation required the decision to be final - the remedy window
    closed or exhausted - and it is not. Finality is not implied by
    effect and is not implied by enforceability.
  severity: error
  description: This decision is not final.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DECISION_NOT_ENFORCEABLE
  meaning: >-
    Enforceability was requested while the decision is not in effect,
    or was requested twice. A final decision whose effect is suspended
    is not enforceable, and that combination is inexpressible rather
    than merely discouraged.
  severity: error
  description: This decision is not enforceable.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: REMEDY_UNAVAILABLE
  meaning: >-
    A remedy was exercised outside its availability window - before it
    opened or after it expired. Framework hard invariant 52 requires a
    remedy route to exist; it does not make that route permanently
    open.
  severity: error
  description: This remedy is not available now.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DUE_PROCESS_PREREQUISITE_MISSING
  meaning: >-
    A consequential decision was attempted with at least one of the six
    named prerequisites absent: jurisdiction, legally effective notice,
    an opportunity to respond, a human deciding actor, reasons, or an
    available remedy. Framework hard invariant 52 in executable form;
    the missing prerequisite is named in the message.
  severity: error
  description: A prerequisite for this decision is missing.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: RECUSAL_REQUIRED
  meaning: >-
    A conflict assessment concluded that the actor must not exercise
    decision capability on this matter, and no replacement has been
    assigned. The case cannot proceed through this actor.
  severity: error
  description: A recusal is required before this can proceed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: RECUSED_ACTOR_DENIED
  meaning: >-
    The acting party is recused from this case with effect at or before
    this act. Framework hard invariant 53: recusal blocks capability
    without erasing history - the actor's earlier acts stay on the
    record and are not invalidated.
  severity: error
  description: This actor is recused from this matter.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: NOTICE_METHOD_INVALID
  meaning: >-
    A service attempt used a method the notice does not authorize.
    Refused at recording time rather than at determination time, so an
    unauthorized channel never accumulates as evidence that later
    resembles proof of service. Framework hard invariant 40.
  severity: error
  description: That service method is not authorized for this notice.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: SERVICE_NOT_PROVEN
  meaning: >-
    No reconciled attempt supports the deemed-service rule invoked, or
    there were no attempts at all. This is the code that makes
    'delivered' provider telemetry insufficient on its own: issuing a
    notice is not serving it, and unreconciled telemetry is not proof.
    Framework hard invariants 39 and 57.
  severity: error
  description: Service of this notice is not proven.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: NOTICE_EFFECT_UNDETERMINED
  meaning: >-
    Legal effect could not be established or refused on the evidence
    available - every attempt's telemetry is unknown. Fail-closed: an
    undetermined effect starts no deadline. Framework hard invariant
    39.
  severity: error
  description: The legal effect of this notice is undetermined.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: NOTICE_EFFECT_ALREADY_ESTABLISHED
  meaning: >-
    A second effect determination was attempted for a notice that
    already has one establishing legal effect. Legal effect is created
    exactly once; an identical replay is handled idempotently above
    this check and never reaches it. Framework hard invariant 59.
  severity: error
  description: The legal effect of this notice is already established.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DUPLICATE_LEGAL_EFFECT_PREVENTED
  meaning: >-
    A retry or replay tried to start a second deadline from a notice
    effect that has already triggered one. Framework hard invariant 59:
    retry and replay do not repeat a consequential legal effect.
  severity: error
  description: That legal effect has already been applied.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DEADLINE_TRIGGER_INVALID
  meaning: >-
    A deadline was asked to start from a source that is not a governed
    trigger - delivery telemetry or read telemetry - or from a notice
    effect that establishes no legal effect. Those telemetry sources
    exist in the enum by name precisely so this refusal is explicit
    rather than an omission. Framework hard invariant 39.
  severity: error
  description: That trigger cannot start a procedural deadline.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DPIA_REQUIRED
  meaning: >-
    A processing activity in a risk class that requires a data
    protection impact assessment has none, or no requirement
    determination has ever been recorded for it. Absence of the
    determination is itself blocking: 'nobody asked' and 'we asked and
    the answer was no' are different states.
  severity: error
  description: A data protection impact assessment is required first.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DPIA_NOT_APPROVED
  meaning: >-
    The assessment exists but is not in an activating state at this
    instant - it is in draft, under review, rejected, expired, or past
    its own validity date. An approved assessment past validity
    activates nothing.
  severity: error
  description: The data protection impact assessment is not approved.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: PROCESSING_ACTIVATION_BLOCKED
  meaning: >-
    Activation of a processing activity was refused by the governance
    gate. Nothing is written: the caller does not receive a
    half-activated activity.
  severity: error
  description: This processing activity cannot be activated.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DPO_INDEPENDENCE_REQUIRED
  meaning: >-
    The assessment's reviewer is the controller or the process owner.
    An assessment signed off by the party that wants the processing is
    not a review.
  severity: error
  description: The reviewer must be independent of the controller and process owner.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: LEGAL_HOLD_PROPAGATION_UNRESOLVED
  meaning: >-
    At least one known derivative of a hold - a replica, index, export
    or backup - is in an unknown, pending or failed propagation state.
    A hold that has not reached its derivatives is not an effective
    hold, and PACK-09 refuses on the derivatives it has been told
    about.
  severity: error
  description: Legal hold propagation is not resolved.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DESTRUCTION_BLOCKED_BY_HOLD
  meaning: >-
    Destruction was refused because a hold covering this record -
    including one already released whose derivatives are still
    outstanding - has not been fully resolved.
  severity: error
  description: Destruction is blocked by a legal hold.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service


