# Centralized PACK-09 reason-code registry (Compliance, Records
# Governance & Legal Workflows; ADR-038 through ADR-042).
#
# This is the single source of truth for every `reason_code` string
# literal introduced by the PACK-09 implementation round: the codes
# `compliance-service` raises for records governance, Legal Hold,
# controlled disposal, the Data Catalog & Processing Registry, governed
# procedural cases, deadlines, data-subject/legal requests and party
# arbitration - plus the additive codes it uses for its own audit
# bookkeeping, following the same pattern ADR-004/ADR-014/ADR-019/
# ADR-024 and PACK-07's and PACK-08's own registries already established.
# No PACK-09 code path may use a free-text string in place of a
# registered code (canon section 24; PACK-09 required invariant 14,
# "reason-coded denial").
#
# This is a SEPARATE registry file from contracts/reason-codes/pack-02.yml
# through pack-08.yml (ADR-006 Option B precedent): codes multiple packs
# need (PERMISSION_DENIED, VALIDATION_RECORD_NOT_FOUND) are independently
# redeclared here rather than imported from an earlier pack's file, so
# this file stays a complete, standalone source of truth for
# `compliance-service`'s own scan
# (`tests/contract/test_reason_codes_registry.py`'s PACK09_SERVICE_DIRS).
# `compliance-service` is a single, wholly new service - no existing
# PACK-02-through-PACK-08 service is extended in place this round - so
# unlike PACK-07's file there is no "shared with an earlier pack's service
# directory" union needed for the literal-usage check.
#
# `source: pack-09-service` entries are the codes this round introduced.
# `source: pack-02-reused` entries are generic, pre-existing PACK-02 codes
# reused verbatim by compliance-service (already registered in
# pack-02.yml; independently redeclared here so this file stays complete).
#
# Every entry carries the seven fields
# `epd2_core.reason_codes.ReasonCodeRegistry.load_from_yaml` requires
# (code, meaning, severity, description, retryable, owner,
# introduced_in_version); a missing field makes the whole registry fail to
# load, which is why the pre-review draft of this file - which omitted
# `description` and `retryable` - could not be loaded at all.

# --- Records governance, retention and controlled destruction (ADR-039)

- code: RETENTION_DISPOSITION_NOT_DUE
  meaning: >-
    The calculated retention due time has not been reached for this
    governed record, so no disposition may be authorized or executed.
  severity: error
  description: This record's retention period has not expired yet.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: RETENTION_START_UNDETERMINED
  meaning: >-
    No retention start event has been recorded for this record, so its
    due time cannot be calculated. The operation fails closed rather
    than treating "no start" as "started at creation" (required
    invariant 15).
  severity: error
  description: Retention has not been started for this record.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: RETENTION_POLICY_VERSION_CONFLICT
  meaning: >-
    A retention policy id/version pair is already registered with
    different content, or a supersession skipped the required version
    increment. Policy versions are append-only and are never rewritten
    in place.
  severity: error
  description: This retention policy version already exists with different content.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: RETENTION_POLICY_REBIND_REQUIRES_REEVALUATION
  meaning: >-
    A governed record's effective retention policy version changed and
    disposal eligibility has not been re-evaluated and re-authorized
    under the new version. Rewriting a retention schedule never, by
    itself, authorizes destruction of already-governed records (required
    invariant 5).
  severity: error
  description: Re-evaluate and re-authorize disposal under the new policy version.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DESTRUCTION_AUTHORIZATION_REQUIRED
  meaning: >-
    Execution of a disposal or destruction was requested without a
    valid, matching DestructionAuthorization. Governed records are never
    removed by an ordinary delete; a separate, explicit authorization
    step is mandatory (required invariant 4).
  severity: error
  description: This destruction has not been authorized.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DESTRUCTION_AUTHORIZATION_STALE
  meaning: >-
    The supplied DestructionAuthorization was issued against a different
    retention policy version or a different record version than the
    record now carries, so it no longer applies.
  severity: error
  description: This destruction authorization is no longer current.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DESTRUCTION_ALREADY_EXECUTED
  meaning: >-
    Destruction evidence already exists for this record and a second,
    different execution was attempted. An identical replay is idempotent
    and never produces this code.
  severity: error
  description: This record has already been destroyed with different evidence.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: GOVERNED_RECORD_DELETION_FORBIDDEN
  meaning: >-
    A caller attempted to remove a governed record through an ordinary
    delete path instead of the controlled disposal workflow (required
    invariant 4).
  severity: error
  description: Governed records cannot be deleted directly.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

# --- Legal Hold (ADR-039) ----------------------------------------------

- code: RECORD_UNDER_LEGAL_HOLD
  meaning: >-
    At least one active Legal Hold applies to this record, so every
    destructive disposition is refused regardless of retention state
    (required invariant 3).
  severity: error
  description: An active Legal Hold protects this record.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: LEGAL_HOLD_SCOPE_MISMATCH
  meaning: >-
    A Legal Hold, or a retention start event, was applied to or
    evaluated against a record in a different organizational scope.
  severity: error
  description: This Legal Hold does not cover that organization's records.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: LEGAL_HOLD_TRANSITION_INVALID
  meaning: >-
    A Legal Hold lifecycle transition is not permitted - for example
    releasing an already-released hold, or marking a released hold
    indeterminate.
  severity: error
  description: This Legal Hold transition is not allowed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: LEGAL_HOLD_STATE_UNKNOWN
  meaning: >-
    The hold state relevant to this record could not be established. The
    operation is refused rather than assumed unheld (required invariant
    15).
  severity: error
  description: Legal Hold state could not be determined; the operation was refused.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

# --- Data Catalog and Processing Registry (ADR-040) --------------------

- code: PROCESSING_REGISTRY_INCOMPLETE
  meaning: >-
    A processing activity or data asset is missing a field the registry
    requires - including its mandatory retention reference.
  severity: error
  description: This registry entry is incomplete.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: PROCESSING_ACTIVITY_TRANSITION_INVALID
  meaning: >-
    The requested processing-activity or data-asset lifecycle transition
    is not permitted by the registry state machine.
  severity: error
  description: This registry lifecycle transition is not allowed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: PROCESSING_REGISTRY_IDENTITY_PAYLOAD_REJECTED
  meaning: >-
    A registry write carried a field this service refuses to store
    because it would amount to holding identity data. compliance-service
    never acquires or stores eID/KYC identity (required invariant 11).
  severity: error
  description: Identity attributes cannot be stored in the processing registry.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

# --- Governed procedural cases, deadlines and requests (ADR-041) -------

- code: PROCEDURAL_CASE_TRANSITION_INVALID
  meaning: >-
    The requested procedural case, or governed record, state transition
    is not permitted by its state machine.
  severity: error
  description: This case transition is not allowed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: PROCEDURAL_CASE_CLOSED
  meaning: >-
    A closed case cannot be modified by an ordinary command. Challenging
    a decision is its own governed transition producing a separate
    appeal case.
  severity: error
  description: This case is closed and cannot be modified.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DEADLINE_TRANSITION_INVALID
  meaning: >-
    The requested procedural deadline state transition is not permitted
    - for example resuming a running deadline or expiring one before its
    due time.
  severity: error
  description: This deadline transition is not allowed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DEADLINE_SILENT_REPLACEMENT_REJECTED
  meaning: >-
    A command would have created a second, competing deadline instance
    for a (case, deadline_code) pair that already has a live one,
    without an explicit supersession. A deadline is never silently
    replaced or reset (required invariant 7).
  severity: error
  description: Name the deadline being replaced to supersede it explicitly.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DEADLINE_TIMEZONE_UNDETERMINED
  meaning: >-
    A deadline was supplied without an explicit IANA timezone, with an
    unknown zone name, or with a naive datetime. Due-date arithmetic is
    refused rather than silently assuming UTC (required invariant 15).
  severity: error
  description: An explicit, known IANA timezone is required for deadlines.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DATA_SUBJECT_REQUEST_TRANSITION_INVALID
  meaning: >-
    The requested data-subject or legal request state transition is not
    permitted by its state machine.
  severity: error
  description: This request transition is not allowed.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: IDENTITY_VERIFICATION_INSUFFICIENT
  meaning: >-
    A data-subject request cannot be answered because its identity
    verification status is not verified. No identity payload is
    requested or stored by this service to change that (required
    invariant 11).
  severity: error
  description: Identity verification must complete before this request can be answered.
  retryable: true
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

# --- Party arbitration, disputes and procedural independence (ADR-042) -

- code: PROCEDURAL_INDEPENDENCE_VIOLATION
  meaning: >-
    The requested role assignment would breach independence: a party to
    the dispute, or the current case handler, cannot become the
    independent decision-maker, and nobody may appoint themselves
    (required invariants 8 and 9).
  severity: error
  description: This appointment would breach procedural independence.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: PROCEDURAL_ROLE_CONFLICT
  meaning: >-
    One party reference would hold two procedural roles that must stay
    separate: procedural authority, case handler and independent
    decision-maker are three distinguishable roles (required invariant
    8).
  severity: error
  description: These procedural roles must be held by different parties.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: CONFLICT_OF_INTEREST_BLOCKING
  meaning: >-
    A declared or confirmed conflict of interest makes this party
    ineligible for the requested procedural role or decision. A conflict
    is an explicit state that changes what the workflow permits, never
    free text (required invariant 10).
  severity: error
  description: A declared conflict of interest blocks this party.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: CONFLICT_OF_INTEREST_UNDECLARED
  meaning: >-
    An independent decision-maker appointment was attempted before the
    required conflict-of-interest declaration existed. The operation
    fails closed (required invariants 10 and 15).
  severity: error
  description: A conflict-of-interest declaration is required first.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: DECISION_AUTHORITY_DENIED
  meaning: >-
    The acting party holds no procedural role permitted to record this
    decision. For arbitration and internal disputes only the assigned
    independent decision-maker may decide.
  severity: error
  description: This party may not decide this case.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

# --- Organizational scope isolation and fail-closed guards -------------

- code: CROSS_SCOPE_ACCESS_DENIED
  meaning: >-
    A write crossed its target's owning organizational scope without a
    valid, explicitly-presented cross-scope authority grant. There is no
    hierarchy-derived inheritance: a parent organization holds nothing
    over a child's records automatically (required invariant 2).
  severity: error
  description: This operation crosses an organizational boundary without authority.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: ORGANIZATION_SCOPE_UNDETERMINED
  meaning: >-
    The requesting context carried no resolvable organizational scope,
    or an entity was submitted without one. The operation is refused
    rather than defaulted to any organization (required invariant 15).
  severity: error
  description: The organizational scope of this request could not be determined.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: CROSS_SCOPE_AUTHORITY_INVALID
  meaning: >-
    A cross-scope authority grant was presented but is unknown, expired,
    revoked, issued by the wrong organization, or does not carry the
    capability this operation needs.
  severity: error
  description: The presented cross-scope authority does not permit this operation.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: OPTIMISTIC_CONCURRENCY_CONFLICT
  meaning: >-
    The caller-supplied expected_version does not match the stored
    record's current version; the record changed since it was read.
  severity: error
  description: This record changed since you read it; re-read and retry.
  retryable: true
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

- code: COMPLIANCE_COMMAND_CONFLICT
  meaning: >-
    A command was replayed with the same event_id but different content,
    or an idempotent replay found inconsistent stored state (the
    CT-00-04 idempotency contract's conflict half).
  severity: error
  description: This event_id was already used for a different command.
  retryable: false
  owner: compliance-service
  introduced_in_version: 0.9.0
  source: pack-09-service

