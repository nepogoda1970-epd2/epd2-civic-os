      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.decide_data_subject_request.
        Refused unless identity verification reached verified — a request
        is never answered on the strength of an unverified claim, and this
        service still never sees the identity data behind that status. A
