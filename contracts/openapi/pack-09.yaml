openapi: 3.1.0
info:
  title: EPD² Civic OS — CLAUDE-PACK-09 service contracts
  version: "0.1.0"
  description: >
    Transport-neutral API contract for the one PACK-09 service
    (compliance-service; ADR-038 through ADR-042). No production HTTP
    server ships in this pack — these paths document, one-to-one, a
    deliberately minimal subset of real command/query functions in
    epd2_compliance_service.application, and are exercised in tests via
    those application-layer functions directly, not over HTTP. Every path
    maps to exactly one real function; none of this file's paths invent an
    HTTP surface a function does not already provide. This mirrors the
    convention every earlier pack's own OpenAPI contract follows.

    Request bodies list only genuine business fields — actor identity,
    the caller's organizational scope, presented cross-scope authority
    references, correlation/causation ids, the clock, and the idempotency
    event_id are transport/session concerns carried outside the body, the
    same convention pack-02.yaml through pack-08.yaml already use.

    Scope rules this contract makes explicit, because they are the
    difference between an ordinary CRUD API and a governed one:

    * Every path is evaluated against the CALLER'S OWN organizational
      scope, resolved server-side and never trusted from the request body.
    * A resource id belonging to another organization returns 404 with
      VALIDATION_RECORD_NOT_FOUND — deliberately identical to a resource
      that does not exist, so a foreign id cannot be used to probe for
      existence. The specific 403 CROSS_ORGANIZATION_CASE_ACCESS_DENIED /
      CROSS_SCOPE_AUTHORITY_INVALID responses are reachable only by a
      caller that already presented cross-scope authority.
    * There is NO hierarchy-derived inheritance. A Bund-level caller
      holds nothing over a Landesverband's cases, and a Kreisverband
      nothing over its parent Land's, without a CrossScopeAuthorityGrant
      issued by the organization being reached into.
    * There is NO delete path for any governed record anywhere in this
      file. Destruction is a three-step governed workflow
      (evaluate → authorize → execute) that produces immutable evidence
      and leaves the record's metadata row in place.
    * Every timestamp in every request and response is a timezone-aware
      RFC 3339 / ISO-8601 string with an explicit offset, and every
      deadline additionally carries an explicit IANA timezone name.
    * No path accepts or returns an identity attribute, an eID/KYC
      payload, an authentication secret, a document or its bytes, or any
      ballot/vote/tally/delegation reference.

    This contract makes no claim of automatic legal compliance with the
    GDPR, the BDSG or the Parteiengesetz. It documents a governed
    workflow, evidence references and auditability; every legal
    determination stays a human judgement made outside this system.
externalDocs:
  description: Canonical domain model
  url: ../../docs/canonical/TZ-00-domain-event-canon.md

servers:
  - url: https://compliance.epd2.example
    description: compliance-service (not deployed in PACK-09 — contract only)

paths:
  /retention-policies:
    post:
      operationId: registerRetentionPolicy
      summary: Register a retention policy version
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.register_retention_policy.
        Registers one (policy_id, policy_version) pair inside the caller's
        own organization. Versions are append-only: re-registering the
        same pair with different content is refused with
        RETENTION_POLICY_VERSION_CONFLICT, and an identical
        re-registration is an idempotent no-op.
      tags: [compliance-service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  policy_id,
                  record_class,
                  trigger,
                  retention_days,
                  disposition_action,
                  policy_version,
                  valid_from,
                ]
              properties:
                policy_id: { type: string, format: uuid }
                record_class: { type: string, minLength: 1 }
                trigger:
                  type: string
                  enum:
                    [
                      created_at,
                      case_closed_at,
                      membership_ended_at,
                      contract_ended_at,
                      processing_ended_at,
                    ]
                retention_days: { type: integer, minimum: 0 }
                disposition_action:
                  type: string
                  enum: [delete, anonymize, archive, review]
                policy_version: { type: integer, minimum: 1 }
                valid_from: { type: string, format: date-time }
                valid_until: { type: [string, null], format: date-time }
                authorizing_decision_reference:
                  { type: [string, null], format: uuid }
      responses:
        "201":
          description: Retention policy version registered
          content:
            application/json:
              schema:
                $ref: "../schemas/retention-policy.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "409":
          description: RETENTION_POLICY_VERSION_CONFLICT — this version already exists with different content

  /retention-policies/{policy_id}/versions:
    post:
      operationId: supersedeRetentionPolicy
      summary: Supersede a retention policy with a newer version
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.supersede_retention_policy.
        Registers a newer version AND rebinds every affected governed
        record to it, resetting each record's state to active and dropping
        any standing destruction authorization. This is the executable
        half of the no-policy-rewrite-bypasses-retention rule: changing a
        retention schedule never, by itself, authorizes destruction of
        already-governed records — a fresh eligibility evaluation and a
        fresh authorization are always required afterwards, and any active
        Legal Hold keeps blocking regardless.
      tags: [compliance-service]
      parameters:
        - name: policy_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The policy being superseded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  policy_version,
                  supersedes_policy_version,
                  record_class,
                  trigger,
                  retention_days,
                  disposition_action,
                  valid_from,
                ]
              properties:
                policy_version: { type: integer, minimum: 2 }
                supersedes_policy_version: { type: integer, minimum: 1 }
                record_class: { type: string, minLength: 1 }
                trigger:
                  type: string
                  enum:
                    [
                      created_at,
                      case_closed_at,
                      membership_ended_at,
                      contract_ended_at,
                      processing_ended_at,
                    ]
                retention_days: { type: integer, minimum: 0 }
                disposition_action:
                  type: string
                  enum: [delete, anonymize, archive, review]
                valid_from: { type: string, format: date-time }
                valid_until: { type: [string, null], format: date-time }
                authorizing_decision_reference:
                  { type: [string, null], format: uuid }
      responses:
        "201":
          description: >-
            New policy version registered; every rebound governed record is
            returned so the caller can see exactly which authorizations were
            invalidated.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [policy, rebound_records]
                properties:
                  policy:
                    $ref: "../schemas/retention-policy.schema.json"
                  rebound_records:
                    type: array
                    items:
                      $ref: "../schemas/governed-record.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.

  /governed-records:
    post:
      operationId: registerGovernedRecord
      summary: Register compliance metadata about a record another service owns
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.register_governed_record.
        source_reference is an opaque pointer back to the owning service's
        own object; no record content is ever accepted or stored here. The
        referenced retention policy version must exist and belong to the
        same organization.
      tags: [compliance-service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  record_id,
                  record_class,
                  sensitivity,
                  created_at,
                  retention_policy_id,
                  retention_policy_version,
                  source_reference,
                ]
              properties:
                record_id: { type: string, format: uuid }
                record_class: { type: string, minLength: 1 }
                sensitivity:
                  type: string
                  enum: [public, internal, confidential, restricted]
                created_at: { type: string, format: date-time }
                retention_policy_id: { type: string, format: uuid }
                retention_policy_version: { type: integer, minimum: 1 }
                source_reference: { type: string, minLength: 1 }
      responses:
        "201":
          description: Governed record registered
          content:
            application/json:
              schema:
                $ref: "../schemas/governed-record.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.

  /governed-records/{record_id}/retention-start:
    post:
      operationId: recordRetentionStart
      summary: Record the explicit fact that retention has started
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.record_retention_start.
        Retention never starts implicitly: until this is recorded,
        eligibility evaluation returns RETENTION_START_UNDETERMINED and no
        destruction can be authorized. Idempotent on the caller-supplied
        event_id.
      tags: [compliance-service]
      parameters:
        - name: record_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The governed record whose retention period starts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [trigger_occurred_at, source_reference]
              properties:
                trigger_occurred_at: { type: string, format: date-time }
                source_reference: { type: string, minLength: 1 }
      responses:
        "200":
          description: Retention start recorded
          content:
            application/json:
              schema:
                $ref: "../schemas/governed-record.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.
        "409":
          description: >-
            COMPLIANCE_COMMAND_CONFLICT (the same event_id was replayed with
            different content) or OPTIMISTIC_CONCURRENCY_CONFLICT (the
            caller-supplied expected version no longer matches).

  /governed-records/{record_id}/disposal-eligibility:
    get:
      operationId: evaluateDisposalEligibility
      summary: Deterministically evaluate whether a record may be disposed of
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.evaluate_disposal_eligibility.
        A read-only evaluation whose refusal order is fixed and
        observable: unresolved scope, unknown record, unknown policy
        version, indeterminate hold state, unknown retention start, active
        Legal Hold, then the due-time check. An indeterminate hold state
        is a 409 LEGAL_HOLD_STATE_UNKNOWN rather than an ineligible
        verdict, because 'we could not determine the hold state' is a
        different fact from 'this record is not yet eligible'.
      tags: [compliance-service]
      parameters:
        - name: record_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The governed record being evaluated.
      responses:
        "200":
          description: >-
            Deterministic eligibility verdict. An ineligible verdict always
            carries the reason code that produced it
            (RETENTION_DISPOSITION_NOT_DUE, RETENTION_START_UNDETERMINED or
            RECORD_UNDER_LEGAL_HOLD) plus, for a hold, the blocking hold ids.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  [
                    record_id,
                    organization_id,
                    evaluated_at,
                    retention_policy_id,
                    retention_policy_version,
                    due_at,
                    eligible,
                    reason_code,
                    blocking_hold_ids,
                  ]
                properties:
                  record_id: { type: string, format: uuid }
                  organization_id: { type: string, format: uuid }
                  evaluated_at: { type: string, format: date-time }
                  retention_policy_id: { type: string, format: uuid }
                  retention_policy_version: { type: integer, minimum: 1 }
                  due_at: { type: [string, null], format: date-time }
                  eligible: { type: boolean }
                  reason_code: { type: [string, null] }
                  blocking_hold_ids:
                    type: array
                    items: { type: string, format: uuid }
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.
        "409":
          description: >-
            LEGAL_HOLD_STATE_UNKNOWN — at least one applicable hold is in the
            indeterminate state, so eligibility cannot be assessed and the
            operation fails closed.

  /governed-records/{record_id}/destruction-authorizations:
    post:
      operationId: authorizeDestruction
      summary: Issue the separate authorization a destruction requires
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.authorize_destruction. Re-runs
        the full eligibility evaluation itself rather than trusting a
        caller-supplied verdict, so a hold placed between evaluation and
        authorization still blocks. The resulting authorization is bound
        to the exact policy version and record version it was issued
        against.
      tags: [compliance-service]
      parameters:
        - name: record_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The governed record being authorized for disposal.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [authorized_by_authority_reference]
              properties:
                authorized_by_authority_reference:
                  { type: string, format: uuid }
                expected_record_version: { type: [integer, null], minimum: 1 }
      responses:
        "201":
          description: Destruction authorized
          content:
            application/json:
              schema:
                $ref: "../schemas/governed-record.schema.json"
        "403":
          description: >-
            RECORD_UNDER_LEGAL_HOLD (an active hold applies — this always wins
            over retention state), LEGAL_HOLD_STATE_UNKNOWN (fail closed), or
            one of the scope codes listed on the other paths.
        "409":
          description: >-
            RETENTION_DISPOSITION_NOT_DUE, RETENTION_START_UNDETERMINED,
            OPTIMISTIC_CONCURRENCY_CONFLICT or COMPLIANCE_COMMAND_CONFLICT.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.

  /governed-records/{record_id}/destruction:
    post:
      operationId: executeDestruction
      summary: Execute an authorized destruction and produce immutable evidence
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.execute_destruction. This is
        the ONLY way a governed record reaches the destroyed state; there
        is deliberately no DELETE method on any governed-record path in
        this contract, and the service's storage layer exposes no delete
        operation at all. Legal Hold is re-checked here, at execution
        time, so a hold placed after authorization still blocks. Evidence
        is created exactly once per record; a retried call with the same
        event_id returns the existing evidence untouched. The record's
        metadata row survives with state=destroyed and its evidence
        reference attached.
      tags: [compliance-service]
      parameters:
        - name: record_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The governed record being destroyed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [executed_by_authority_reference, evidence_digest]
              properties:
                executed_by_authority_reference: { type: string, format: uuid }
                evidence_digest: { type: string, minLength: 1 }
      responses:
        "201":
          description: Destruction executed; immutable evidence recorded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [record, evidence]
                properties:
                  record:
                    $ref: "../schemas/governed-record.schema.json"
                  evidence:
                    $ref: "../schemas/destruction-evidence.schema.json"
        "403":
          description: >-
            RECORD_UNDER_LEGAL_HOLD, LEGAL_HOLD_STATE_UNKNOWN, or a scope code.
        "409":
          description: >-
            DESTRUCTION_AUTHORIZATION_REQUIRED (no authorization exists — a
            governed record is never removed by an ordinary delete),
            DESTRUCTION_AUTHORIZATION_STALE (the authorization predates a policy
            supersession or record change) or DESTRUCTION_ALREADY_EXECUTED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.

  /legal-holds:
    post:
      operationId: placeLegalHold
      summary: Place a Legal Hold over governed records in the caller's organization
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.place_legal_hold. A hold's
        scope names record ids, record classes and/or case ids, and is
        only ever evaluated inside the hold's own organization — a hold
        can never reach another organization's record even if its id were
        guessed. Idempotent on event_id.
      tags: [compliance-service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  hold_id,
                  matter_reference,
                  scope,
                  issued_by_authority_reference,
                ]
              properties:
                hold_id: { type: string, format: uuid }
                matter_reference: { type: string, minLength: 1 }
                scope:
                  type: object
                  additionalProperties: false
                  properties:
                    record_ids:
                      type: array
                      items: { type: string, format: uuid }
                    record_classes:
                      type: array
                      items: { type: string, minLength: 1 }
                    case_ids:
                      type: array
                      items: { type: string, format: uuid }
                issued_by_authority_reference: { type: string, format: uuid }
      responses:
        "201":
          description: Legal Hold placed
          content:
            application/json:
              schema:
                $ref: "../schemas/legal-hold.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "409":
          description: >-
            COMPLIANCE_COMMAND_CONFLICT (the same event_id was replayed with
            different content) or OPTIMISTIC_CONCURRENCY_CONFLICT (the
            caller-supplied expected version no longer matches).

  /legal-holds/{hold_id}/release:
    post:
      operationId: releaseLegalHold
      summary: Release a Legal Hold
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.release_legal_hold. Release is
        explicit, timestamped and appended to the hold's own append-only
        history; the issue entry is never rewritten and the hold record is
        never deleted. A hold never expires implicitly. Releasing an
        already-released hold is refused with
        LEGAL_HOLD_TRANSITION_INVALID.
      tags: [compliance-service]
      parameters:
        - name: hold_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The hold being released.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [released_by_authority_reference]
              properties:
                released_by_authority_reference: { type: string, format: uuid }
      responses:
        "200":
          description: Legal Hold released
          content:
            application/json:
              schema:
                $ref: "../schemas/legal-hold.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.
        "409":
          description: LEGAL_HOLD_TRANSITION_INVALID or COMPLIANCE_COMMAND_CONFLICT.

  /legal-holds/{hold_id}/indeterminate:
    post:
      operationId: markLegalHoldIndeterminate
      summary: Record that a hold's state can no longer be established
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.mark_legal_hold_indeterminate.
        Makes 'unknown' a real, auditable state rather than an absence
        that silently reads as 'unheld': every record the hold covers then
        fails closed on eligibility assessment and destruction with
        LEGAL_HOLD_STATE_UNKNOWN.
      tags: [compliance-service]
      parameters:
        - name: hold_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The hold whose state could not be confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [actor_authority_reference]
              properties:
                actor_authority_reference: { type: string, format: uuid }
      responses:
        "200":
          description: Legal Hold marked indeterminate
          content:
            application/json:
              schema:
                $ref: "../schemas/legal-hold.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.
        "409":
          description: LEGAL_HOLD_TRANSITION_INVALID or COMPLIANCE_COMMAND_CONFLICT.

  /data-assets:
    post:
      operationId: registerDataAsset
      summary: Register a Data Catalog entry
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.register_data_asset. The
        retention reference is resolved against the retention-policy store
        rather than merely type-checked, so a catalog entry can never
        point at a policy that does not exist.
      tags: [compliance-service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  asset_id,
                  name,
                  asset_class,
                  system_reference,
                  record_class,
                  retention_policy_reference,
                  status,
                  valid_from,
                  owner_authority_reference,
                ]
              properties:
                asset_id: { type: string, format: uuid }
                name: { type: string, minLength: 1 }
                asset_class: { type: string, minLength: 1 }
                system_reference: { type: string, minLength: 1 }
                record_class: { type: string, minLength: 1 }
                retention_policy_reference: { type: string, format: uuid }
                status:
                  type: string
                  enum: [draft, active, suspended, deprecated]
                valid_from: { type: string, format: date-time }
                owner_authority_reference: { type: string, format: uuid }
      responses:
        "201":
          description: Data asset registered
          content:
            application/json:
              schema:
