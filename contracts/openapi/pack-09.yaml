  /procedural-cases:
    post:
      operationId: openProceduralCase
      summary: Open a governed procedural case
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.open_procedural_case. A case
        may only ever be opened inside the caller's own organization —
        creating obligations inside a scope one does not own is not a
        capability any cross-scope grant confers. The procedural
        authority, case handler and independent decision-maker are three
        distinct references and can never coincide.
      tags: [compliance-service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  case_id,
                  case_type,
                  opened_at,
                  subject_reference,
                  procedural_authority_reference,
                  workflow_type,
                ]
              properties:
                case_id: { type: string, format: uuid }
                case_type:
                  type: string
                  enum:
                    [
                      data_subject_request,
                      compliance_review,
                      party_arbitration,
                      internal_dispute,
                      legal_request,
                    ]
                opened_at: { type: string, format: date-time }
                subject_reference: { type: string, minLength: 1 }
                procedural_authority_reference: { type: string, format: uuid }
                workflow_type: { type: string, minLength: 1 }
                required_steps:
                  type: array
                  items:
                    type: object
                    additionalProperties: false
                    required: [step_code, required]
                    properties:
                      step_code: { type: string, minLength: 1 }
                      required: { type: boolean }
      responses:
        "201":
          description: Procedural case opened
          content:
            application/json:
              schema:
                $ref: "../schemas/procedural-case.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "409":
          description: >-
            COMPLIANCE_COMMAND_CONFLICT (the same event_id was replayed with
            different content) or OPTIMISTIC_CONCURRENCY_CONFLICT (the
            caller-supplied expected version no longer matches).

  /procedural-cases/{case_id}:
    get:
      operationId: getProceduralCase
      summary: Read one governed procedural case
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.read_procedural_case. A case
        belonging to another organization returns the same 404 as a case
        that does not exist, unless the caller presents a grant carrying
        read_case issued by that organization.
      tags: [compliance-service]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The case being read.
      responses:
        "200":
          description: Procedural case
          content:
            application/json:
              schema:
                $ref: "../schemas/procedural-case.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.

  /procedural-cases/{case_id}/case-handler:
    post:
      operationId: assignCaseHandler
      summary: Assign the case handler
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.assign_case_handler. The case
        handler is a role distinct from both the procedural authority and
        the independent decision-maker; assigning a party that already
        holds either is refused with PROCEDURAL_ROLE_CONFLICT.
      tags: [compliance-service]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The case being staffed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [handler_party_reference, assigned_by_party_reference]
              properties:
                handler_party_reference: { type: string, format: uuid }
                assigned_by_party_reference: { type: string, format: uuid }
      responses:
        "200":
          description: Case handler assigned
          content:
            application/json:
              schema:
                $ref: "../schemas/procedural-case.schema.json"
        "403":
          description: >-
            PROCEDURAL_ROLE_CONFLICT (this party already holds a separated role
            on the case) or one of the scope codes.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.
        "409":
          description: PROCEDURAL_CASE_CLOSED or COMPLIANCE_COMMAND_CONFLICT.

  /procedural-cases/{case_id}/conflict-declarations:
    post:
      operationId: declareConflictOfInterest
      summary: File an explicit conflict-of-interest declaration
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.declare_conflict_of_interest.
        A conflict is an explicit state that changes what the workflow
        permits, never free text: declared and confirmed both make the
        party ineligible to become the independent decision-maker or to
        record a decision. basis_code is a closed-vocabulary marker; any
        narrative lives in a referenced document under PACK-11.
      tags: [compliance-service]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The case the declaration belongs to.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [party_reference, state, basis_code]
              properties:
                party_reference: { type: string, format: uuid }
                state:
                  type: string
                  enum: [none_declared, declared, confirmed, waived]
                basis_code: { type: string, minLength: 1 }
                decided_by_party_reference:
                  { type: [string, null], format: uuid }
      responses:
        "201":
          description: Conflict declaration recorded
          content:
            application/json:
              schema:
                $ref: "../schemas/conflict-of-interest-declaration.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.
        "409":
          description: PROCEDURAL_CASE_CLOSED.

  /procedural-cases/{case_id}/independent-decision-maker:
    post:
      operationId: assignIndependentDecisionMaker
      summary: Assign the independent decision-maker
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.assign_independent_decision_maker.
        Refuses when the candidate appoints themselves, when the appointer
        is a party to the dispute or the current case handler, when the
        candidate holds any party role or is the procedural authority or
        case handler, when no conflict declaration exists for the
        candidate, or when that declaration is in a blocking state.
      tags: [compliance-service]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The case being assigned a decision-maker.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate_party_reference, appointing_party_reference]
              properties:
                candidate_party_reference: { type: string, format: uuid }
                appointing_party_reference: { type: string, format: uuid }
      responses:
        "200":
          description: Independent decision-maker assigned
          content:
            application/json:
              schema:
                $ref: "../schemas/procedural-case.schema.json"
        "403":
          description: >-
            PROCEDURAL_INDEPENDENCE_VIOLATION (self-appointment, a party or the
            case handler appointing, or a candidate who is a party / the
            authority / the handler), CONFLICT_OF_INTEREST_BLOCKING, or a scope
            code.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.
        "409":
          description: >-
            CONFLICT_OF_INTEREST_UNDECLARED (no declaration exists yet — fail
            closed), PROCEDURAL_CASE_CLOSED or COMPLIANCE_COMMAND_CONFLICT.

  /procedural-cases/{case_id}/decision:
    post:
      operationId: recordCaseDecision
      summary: Record the decision of a governed case
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.record_case_decision. For
        party_arbitration and internal_dispute cases only the assigned
        independent decision-maker may decide; for the remaining case
        types the procedural authority may. Anyone carrying a blocking
        conflict declaration is refused. Evidence is referenced, never
        embedded. A decision is created exactly once per case.
      tags: [compliance-service]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The case being decided.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [outcome, decision_reason_code, decided_by_party_reference]
              properties:
                outcome:
                  type: string
                  enum:
                    [
                      upheld,
                      partially_upheld,
                      dismissed,
                      inadmissible,
                      settled,
                      withdrawn,
                    ]
                decision_reason_code: { type: string, minLength: 1 }
                decided_by_party_reference: { type: string, format: uuid }
                evidence_references:
                  type: array
                  items: { type: string, minLength: 1 }
      responses:
        "201":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "../schemas/case-decision.schema.json"
        "403":
          description: >-
            DECISION_AUTHORITY_MISSING (the acting party holds no role permitted
            to decide this case), CONFLICT_OF_INTEREST_BLOCKING, or a scope code.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.
        "409":
          description: PROCEDURAL_CASE_CLOSED or COMPLIANCE_COMMAND_CONFLICT.

  /procedural-cases/{case_id}/status:
    post:
      operationId: transitionProceduralCase
      summary: Move a governed case through its status lifecycle
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.transition_procedural_case.
        Closing requires an explicit closure reason code, and a case can
        never reach decided before its decision is recorded. A closed case
        is not modifiable by any ordinary command afterwards.
      tags: [compliance-service]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The case being transitioned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_status]
              properties:
                target_status:
                  type: string
                  enum:
                    [
                      open,
                      admissibility_review,
                      active,
                      stayed,
                      decided,
                      closed,
                    ]
                closure_reason_code: { type: [string, null] }
                expected_case_version: { type: [integer, null], minimum: 1 }
      responses:
        "200":
          description: Case transitioned
          content:
            application/json:
              schema:
                $ref: "../schemas/procedural-case.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.
        "409":
          description: >-
            PROCEDURAL_CASE_TRANSITION_INVALID, OPTIMISTIC_CONCURRENCY_CONFLICT
            or COMPLIANCE_COMMAND_CONFLICT.

  /procedural-cases/{case_id}/appeals:
    post:
      operationId: fileAppeal
      summary: File an appeal against a decided or closed case
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.file_appeal. An appeal is a
        SEPARATE governed case plus an AppealReference linking the two;
        the original case is never reopened or edited, which is what keeps
        'a closed case is not modifiable by an ordinary command' true.
      tags: [compliance-service]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The original, decided or closed case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [appeal_case, filed_by_party_reference]
              properties:
                appeal_case:
                  type: object
                  description: >-
                    The new case to open for the review, in the same shape
                    openProceduralCase accepts.
                filed_by_party_reference: { type: string, format: uuid }
      responses:
        "201":
          description: Appeal case opened and linked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  [
                    appeal_id,
                    organization_id,
                    original_case_id,
                    appeal_case_id,
                    filed_at,
                    filed_by_party_reference,
                  ]
                properties:
                  appeal_id: { type: string, format: uuid }
                  organization_id: { type: string, format: uuid }
                  original_case_id: { type: string, format: uuid }
                  appeal_case_id: { type: string, format: uuid }
                  filed_at: { type: string, format: date-time }
                  filed_by_party_reference: { type: string, format: uuid }
        "403":
          description: >-
            PROCEDURAL_INDEPENDENCE_VIOLATION (only a decided or closed case can
            be appealed) or a scope code.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.

  /deadline-definitions:
    post:
      operationId: defineDeadline
      summary: Create a reusable deadline definition
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.define_deadline. timezone is a
        REQUIRED explicit IANA name; due dates are computed on that civil
        clock, so a period spanning a DST change lands on the same
        wall-clock time rather than drifting. An empty or unknown zone is
        refused with DEADLINE_TIMEZONE_UNDETERMINED.
      tags: [compliance-service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [definition_id, deadline_code, duration_days, timezone]
              properties:
                definition_id: { type: string, format: uuid }
                deadline_code: { type: string, minLength: 1 }
                duration_days: { type: integer, minimum: 0 }
                timezone:
                  type: string
                  minLength: 1
                  description: An IANA timezone name, e.g. Europe/Berlin.
                escalation_after_days: { type: [integer, null], minimum: 0 }
                description: { type: string }
      responses:
        "201":
          description: Deadline definition created
          content:
            application/json:
              schema:
                $ref: "../schemas/deadline-definition.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "422":
          description: DEADLINE_TIMEZONE_UNDETERMINED — an explicit, known IANA zone is required.

  /procedural-cases/{case_id}/deadlines:
    post:
      operationId: startProceduralDeadline
      summary: Start a deadline on a case
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.start_deadline. If a live
        (running, suspended or escalated) deadline already exists for this
        (case, deadline_code) pair, the command is refused with
        DEADLINE_SILENT_REPLACEMENT_REJECTED unless the caller explicitly
        names it in supersedes_deadline_id. When it does, the old instance
        is superseded — it keeps its whole history and gains a link to its
        successor — rather than being silently replaced or reset.
      tags: [compliance-service]
      parameters:
        - name: case_id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: The case the deadline runs on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [definition_id, deadline_id, reason_code, actor_party_reference]
              properties:
                definition_id: { type: string, format: uuid }
                deadline_id: { type: string, format: uuid }
