  # =========================================================================
  # Architecture & Domain Framework 0.8.1 additions (same 0.9.0 round)
  #
  # The legal-case substrate, the official-notice trust boundary, records
  # classification and the data-protection activation gate. Three contract
  # rules are worth stating once here rather than repeating in every block:
  #
  # * Issuance, service telemetry and legal effect are THREE separate
  #   paths on purpose. `issueOfficialNotice` and `recordServiceAttempt`
  #   establish nothing; only `determineServiceEffect` can, and only it
  #   can start a deadline.
  # * A decision's effect, finality and enforceability are THREE separate
  #   paths for the same reason - a single "status" field would let a
  #   caller collapse facts the Framework requires to stay apart.
  # * Still NO delete path anywhere: not for a governed record, not for a
  #   legal case, not for a filing and not for a procedural decision. A
  #   rejected filing keeps its docket position; a closed case is reopened
  #   by a successor case, never by rewriting the closed one.
  # =========================================================================

  /legal-cases:
    post:
      operationId: openLegalCase
      summary: Open a legal case on the common legal-case substrate
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.open_legal_case. A case may only ever be opened
        inside the caller's own organization. Opening a case grants no substantive
        capability: the case cannot enter substantive_review, hearing or decided until a
        jurisdiction determination is bound to it (Framework 0.8.1 hard invariant 52), and
        this path does not accept one.
      tags: [compliance-service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/legal-case.schema.json"
      responses:
        "201":
          description: Legal case opened
          content:
            application/json:
              schema:
                $ref: "../schemas/legal-case.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_SCOPE_ACCESS_DENIED (the write crossed
            an organizational boundary without authority), CROSS_SCOPE_AUTHORITY_INVALID (a
            grant was presented but does not permit this capability here),
            ORGANIZATION_SCOPE_UNDETERMINED (the caller has no resolvable scope - fail
            closed) or PERMISSION_DENIED.
        "409":
          description: >-
            COMPLIANCE_COMMAND_CONFLICT (the same event_id was replayed with different
            content) or OPTIMISTIC_CONCURRENCY_CONFLICT (the caller-supplied expected
            version no longer matches).

  /legal-cases/{legal_case_id}/transitions:
    post:
      operationId: transitionLegalCase
      summary: Move a legal case to a new status
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.transition_legal_case. Three refusals stack,
        each with its own code: the closed transition table, the jurisdiction requirement
        for substantive statuses, and recusal of the acting authority. Closing a case
        requires an explicit closure reason code.
      tags: [compliance-service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target, reason_code, acting_authority_reference]
              properties:
                target:
                  {
                    type: string,
                    enum:
                      [
                        intake,
                        jurisdiction_review,
                        admissibility_review,
                        substantive_review,
                        hearing,
                        decided,
                        closed,
                        reopened,
                      ],
                  }
                reason_code: { type: string, minLength: 1 }
                acting_authority_reference: { type: string, format: uuid }
                closure_reason_code: { type: [string, "null"] }
                expected_case_version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Legal case transitioned
          content:
            application/json:
              schema:
                $ref: "../schemas/legal-case.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_SCOPE_ACCESS_DENIED (the write crossed
            an organizational boundary without authority), CROSS_SCOPE_AUTHORITY_INVALID (a
            grant was presented but does not permit this capability here),
            ORGANIZATION_SCOPE_UNDETERMINED (the caller has no resolvable scope - fail
            closed) or PERMISSION_DENIED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the resource does not
            exist or exists in another organization and no cross-scope authority was
            presented, so a foreign id discloses nothing.
        "409":
          description: >-
            COMPLIANCE_COMMAND_CONFLICT (the same event_id was replayed with different
            content) or OPTIMISTIC_CONCURRENCY_CONFLICT (the caller-supplied expected
            version no longer matches). PROCEDURAL_CASE_TRANSITION_INVALID (the transition
