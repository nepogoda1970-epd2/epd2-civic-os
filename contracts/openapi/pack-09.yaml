  /processing-activities:
    post:
      operationId: registerProcessingActivity
      summary: Register a Processing Registry entry
      description: >
        Owned by compliance-service. Maps to
        epd2_compliance_service.application.register_processing_activity.
        Everything recorded is categorical — categories of data, of data
        subjects, of recipients — and no individual data subject is ever
        named. legal_basis is a managed classification drawn from a closed
        list; recording it asserts nothing about legal sufficiency. The
        retention reference is mandatory and must resolve to a policy in
        the same organization.
      tags: [compliance-service]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                [
                  activity_id,
                  name,
                  purpose,
                  legal_basis,
                  data_subject_categories,
                  personal_data_categories,
                  recipient_categories,
                  retention_policy_reference,
                  technical_organizational_measures,
                  controller_reference,
                  process_owner_authority_reference,
                  system_references,
                  status,
                  valid_from,
                ]
              properties:
                activity_id: { type: string, format: uuid }
                name: { type: string, minLength: 1 }
                purpose: { type: string, minLength: 1 }
                legal_basis:
                  type: string
                  enum:
                    [
                      consent,
                      contract,
                      legal_obligation,
                      vital_interests,
                      public_task,
                      legitimate_interests,
                      party_statute,
                      other_documented,
                    ]
                data_subject_categories:
                  type: array
                  minItems: 1
                  items: { type: string, minLength: 1 }
                personal_data_categories:
                  type: array
                  minItems: 1
                  items: { type: string, minLength: 1 }
                recipient_categories:
                  type: array
                  items: { type: string, minLength: 1 }
                retention_policy_reference: { type: string, format: uuid }
                technical_organizational_measures:
                  type: array
                  minItems: 1
                  items: { type: string, minLength: 1 }
                controller_reference: { type: string, format: uuid }
                process_owner_authority_reference:
                  { type: string, format: uuid }
                system_references:
                  type: array
                  minItems: 1
                  items: { type: string, minLength: 1 }
                data_asset_references:
                  type: array
                  items: { type: string, format: uuid }
                status:
                  type: string
                  enum: [draft, active, suspended, deprecated]
                valid_from: { type: string, format: date-time }
                dpo_review_reference: { type: [string, null], format: uuid }
      responses:
        "201":
          description: Processing activity registered
          content:
            application/json:
              schema:
                $ref: "../schemas/processing-activity.schema.json"
        "403":
          description: >-
            Denied with a stable reason code: CROSS_ORGANIZATION_CASE_ACCESS_DENIED
            (the write crossed an organizational boundary without authority),
            CROSS_SCOPE_AUTHORITY_INVALID (a grant was presented but does not
            permit this capability here), ORGANIZATION_SCOPE_UNDETERMINED (the
            caller has no resolvable scope — fail closed) or PERMISSION_DENIED.
        "404":
          description: >-
            VALIDATION_RECORD_NOT_FOUND. Returned identically whether the
            resource does not exist or exists in another organization and no
            cross-scope authority was presented, so a foreign id discloses
            nothing.
        "422":
          description: >-
            PROCESSING_REGISTRY_INCOMPLETE (a mandatory field or category list
            is missing) or PROCESSING_REGISTRY_IDENTITY_PAYLOAD_REJECTED (the
            write carried an identity attribute this service refuses to store).

  /processing-activities/{activity_id}/status:
