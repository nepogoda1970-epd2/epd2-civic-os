[project]
name = "epd2-control-plane-service"
version = "0.1.0"
description = "EPD2 CTRL-01 governed control plane and authority operations foundation (preseal, not accepted)"
requires-python = ">=3.12"
dependencies = ["epd2-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epd2_control_plane_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/epd2_control_plane_service/py.typed" = "epd2_control_plane_service/py.typed"
