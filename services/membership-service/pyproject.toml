[project]
name = "epd2-membership-service"
version = "0.1.0"
description = "EPD2 Civic OS Membership Service — owns PartyMembershipEligibilityPolicy/Membership (8.3)/MembershipApplication/AffiliationDeclaration/ConflictAssessment (canon section 19d, PACK-07)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "epd2-core",
    "epd2-audit-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epd2_membership_service"]
