[project]
name = "epd2-document-service"
version = "0.1.0"
description = "EPD2 Civic OS Governed Documents & Evidence (PACK-11, FIR-ROADMAP-001, FIR-INV-010)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["epd2-core", "epd2-audit-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epd2_document_service"]
