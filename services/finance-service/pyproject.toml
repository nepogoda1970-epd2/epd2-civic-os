[project]
name = "epd2-finance-service"
version = "0.1.0"
description = "EPD2 Civic OS Party Finance, Accounting & Rechenschaftsbericht (PACK-10, canon 0.8.0 section 19f)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["epd2-core", "epd2-audit-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epd2_finance_service"]
