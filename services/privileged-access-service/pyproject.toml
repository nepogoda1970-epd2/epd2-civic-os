[project]
name = "epd2-privileged-access-service"
version = "0.1.0"
description = "EPD2 Civic OS Privileged Administration, Authorized Search & Governed Export (PACK-12, ADR-061 through ADR-068)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["epd2-core", "epd2-audit-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epd2_privileged_access_service"]
