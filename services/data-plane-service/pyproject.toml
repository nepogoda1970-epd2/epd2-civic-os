[project]
name = "epd2-data-plane-service"
version = "0.1.0"
description = "EPD2 Civic OS Production Data Plane & Contract Evolution reference implementation (PACK-13, ADR-069 through ADR-078)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["epd2-core", "epd2-audit-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epd2_data_plane_service"]
