[project]
name = "epd2-ai-processing-service"
version = "0.1.0"
description = "EPD2 Civic OS AI Processing Service — owns AIProcessingRecord (canon section 17.1, extended by 19c; ADR-021 through ADR-025)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "epd2-core",
    "epd2-audit-core",
    "epd2-governance-service",
    "epd2-transparency-service",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epd2_ai_processing_service"]
