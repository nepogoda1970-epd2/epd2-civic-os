[project]
name = "epd2-compliance-service"
version = "0.1.0"
description = "EPD2 Civic OS Compliance, Records Governance & Legal Workflows (PACK-09)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["epd2-core", "epd2-audit-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epd2_compliance_service"]
